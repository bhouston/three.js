<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - light probe volume</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgl - light probe volume">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgl_lightprobes.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_lightprobes.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - light probe volume<br/>
			Position-dependent diffuse global illumination via L2 SH probe grid
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
			import { LightProbeGridWebGL } from 'three/addons/lighting/LightProbeGridWebGL.js';
			import { LightProbeGridHelperWebGL } from 'three/addons/helpers/LightProbeGridHelperWebGL.js';

			let camera, scene, renderer, controls;
			let probes, probesHelper;

			init();

			async function init() {

				// Camera

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 2.5, 8 );

				// Scene

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x111111 );

				const gltf = await new GLTFLoader().loadAsync( 'models/gltf/lightprobes_cornell_box.glb' );

				gltf.scene.traverse( ( object ) => {

					if ( object.isMesh ) {

						object.castShadow = true;
						object.receiveShadow = true;

					} else if ( object.isPointLight ) {

						object.castShadow = true;
						object.shadow.mapSize.setScalar( 256 );
						object.shadow.radius = 10;

					}

				} );

				scene.add( gltf.scene );

				// Renderer

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.shadowMap.enabled = true;
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 1.0;
				document.body.appendChild( renderer.domElement );

				// Controls

				controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 2.5, 0 );
				controls.update();

				// Bake light probe volume

				async function bake( resolution ) {

					if ( probes ) {

						scene.remove( probes );
						probes.dispose();

					}

					probes = new LightProbeGridWebGL( 5.6, 4.7, 5.6, resolution, resolution, resolution );
					probes.position.set( 0, 2.45, 0 );
					probes.bake( renderer, scene, { cubemapSize: 32, near: 0.05, far: 20 } );
					probes.visible = params.enabled;
					scene.add( probes );

					// Update debug visualization

					if ( ! probesHelper ) {

						probesHelper = new LightProbeGridHelperWebGL( probes );
						probesHelper.visible = params.showProbes;
						scene.add( probesHelper );

					} else {

						probesHelper.probes = probes;
						probesHelper.update();

					}

				}

				const params = {
					enabled: true,
					showProbes: false,
					resolution: 6
				};

				await bake( params.resolution );

				// GUI

				const gui = new GUI();
				gui.add( params, 'enabled' ).name( 'GI' ).onChange( ( value ) => {

					probes.visible = value;

				} );
				gui.add( params, 'resolution', 2, 12, 1 ).name( 'Resolution' ).onFinishChange( ( value ) => {

					bake( value );

				} );
				gui.add( params, 'showProbes' ).name( 'Show Probes' ).onChange( ( value ) => {

					probesHelper.visible = value;

				} );

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
