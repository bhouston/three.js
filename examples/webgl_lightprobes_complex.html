<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - light probe volume (multi-room)</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgl - light probe volume (multi-room)">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgl_lightprobes_complex.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_lightprobes_complex.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - light probe volume (multi-room)<br/>
			Two rooms with independent probe volumes showcasing multi-volume scene.add() API
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
			import { LightProbeGridWebGL } from 'three/addons/lighting/LightProbeGridWebGL.js';
			import { LightProbeGridHelperWebGL } from 'three/addons/helpers/LightProbeGridHelperWebGL.js';

			let camera, scene, renderer, controls;
			let probesLeft, probesRight;
			let probesHelperLeft, probesHelperRight;

			init();

			async function init() {

				// Camera

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 2.5, 16 );

				// Scene

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x111111 );

				const gltf = await new GLTFLoader().loadAsync( 'models/gltf/lightprobes_rooms.glb' );

				gltf.scene.traverse( ( object ) => {

					if ( object.isMesh ) {

						object.castShadow = true;
						object.receiveShadow = true;

					} else if ( object.isPointLight ) {

						object.castShadow = true;
						object.shadow.mapSize.setScalar( 256 );
						object.shadow.radius = 12;

					}

				} );

				scene.add( gltf.scene );

				// Renderer

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.shadowMap.enabled = true;
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 1.0;
				document.body.appendChild( renderer.domElement );

				// Controls

				controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 2.5, 0 );
				controls.update();

				// Probe volumes

				const params = {
					enabled: true,
					showProbes: false,
					resolution: 6
				};

				async function bake( resolution ) {

					// Remove both volumes before baking to prevent feedback

					if ( probesLeft ) {

						scene.remove( probesLeft );
						probesLeft.dispose();

					}

					if ( probesRight ) {

						scene.remove( probesRight );
						probesRight.dispose();

					}

					// Bake both volumes

					probesLeft = new LightProbeGridWebGL( 7.8, 4.7, 7.6, resolution, resolution, resolution );
					probesLeft.position.set( - 3.9, 2.45, 0 );
					probesLeft.bake( renderer, scene, { cubemapSize: 32, near: 0.05, far: 20 } );
					probesLeft.visible = params.enabled;

					probesRight = new LightProbeGridWebGL( 7.8, 4.7, 7.6, resolution, resolution, resolution );
					probesRight.position.set( 3.9, 2.45, 0 );
					probesRight.bake( renderer, scene, { cubemapSize: 32, near: 0.05, far: 20 } );
					probesRight.visible = params.enabled;

					// Add both after baking

					scene.add( probesLeft );
					scene.add( probesRight );

					// Update debug visualization

					if ( ! probesHelperLeft ) {

						probesHelperLeft = new LightProbeGridHelperWebGL( probesLeft );
						probesHelperLeft.visible = params.showProbes;
						scene.add( probesHelperLeft );

						probesHelperRight = new LightProbeGridHelperWebGL( probesRight );
						probesHelperRight.visible = params.showProbes;
						scene.add( probesHelperRight );

					} else {

						probesHelperLeft.probes = probesLeft;
						probesHelperLeft.update();

						probesHelperRight.probes = probesRight;
						probesHelperRight.update();

					}

				}

				await bake( params.resolution );

				// GUI

				const gui = new GUI();
				gui.add( params, 'enabled' ).name( 'GI' ).onChange( ( value ) => {

					probesLeft.visible = value;
					probesRight.visible = value;

				} );
				gui.add( params, 'resolution', 2, 12, 1 ).name( 'Resolution' ).onFinishChange( ( value ) => {

					bake( value );

				} );
				gui.add( params, 'showProbes' ).name( 'Show Probes' ).onChange( ( value ) => {

					probesHelperLeft.visible = value;
					probesHelperRight.visible = value;

				} );

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
