<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - postprocessing manual taa and ssaa</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - Temporal Reproduction Anti-Aliasing (TAA) pass by <a href="https://threekit.com" target="_blank" rel="noopener">Ben Houston</a><br/><br/>
			TRAA accumulates across dynamic frames using a velocity buffer to<br/>
			look back at where things were on the past frame.<br/>
		</div>

		<div id="container"></div>

		<!-- Import maps polyfill -->
		<!-- Remove this when import maps will be widely supported -->
		<script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import Stats from './jsm/libs/stats.module.js';
			import { GUI } from './jsm/libs/lil-gui.module.min.js';

			import { EffectComposer } from './jsm/postprocessing/EffectComposer.js';
			import { RenderPass } from './jsm/postprocessing/RenderPass.js';
			import { ShaderPass } from './jsm/postprocessing/ShaderPass.js';
			//import { TRAAShader } from './jsm/shaders/TRAAShader.js';
			import { TRAARenderPass } from './jsm/postprocessing/TRAARenderPass.js';
			import { CopyShader } from './jsm/shaders/CopyShader.js';

			let camera, scene, renderer, composer, copyPass, traaRenderPass, renderPass, depthTexture;
			let gui, stats;
			let index = 0;

			const param = { TRAA: true, Samples: 0, Output: 0 };

			init();
			animate();

			clearGui();

			function clearGui() {

				if ( gui ) gui.destroy();

				gui = new GUI();

				gui.add( param, 'TRAA' ).onFinishChange( function () {

					if ( traaRenderPass ) {

						traaRenderPass.enabled = param.TRAA;
						renderPass.enabled = ! param.TRAA;

					}

				} );

				gui.add( param, 'Samples', 1, 32, 1 ).onFinishChange( function () {

					if ( traaRenderPass ) {

						traaRenderPass.numSamplesPerAccumulation = param.Samples;

					}

				} );

				gui.add( param, 'Output', {
					'Final': 0,
					'Raw': 1,
					'Velocity': 2,
					'Depth': 3
				} ).onFinishChange( function () {

					if ( traaRenderPass ) {

						traaRenderPass.output = param.Output;

					}

				} );

				gui.open();

			}

			function init() {

				const container = document.getElementById( 'container' );

				renderer = new THREE.WebGLRenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				document.body.appendChild( renderer.domElement );

				stats = new Stats();
				container.appendChild( stats.dom );

				//

				camera = new THREE.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 1, 1000 );
				camera.position.z = 300;

				scene = new THREE.Scene();

				const geometry = new THREE.BoxGeometry( 120, 120, 120 );
				const material1 = new THREE.MeshBasicMaterial( { color: 0xffffff, wireframe: true } );

				const mesh1 = new THREE.Mesh( geometry, material1 );
				mesh1.position.x = - 100;
				scene.add( mesh1 );

				const texture = new THREE.TextureLoader().load( 'textures/brick_diffuse.jpg' );
				texture.minFilter = THREE.NearestFilter;
				texture.magFilter = THREE.NearestFilter;
				texture.anisotropy = 1;
				texture.generateMipmaps = false;

				const material2 = new THREE.MeshBasicMaterial( { map: texture } );

				const mesh2 = new THREE.Mesh( geometry, material2 );
				mesh2.position.x = 100;
				scene.add( mesh2 );

				// render targets

				depthTexture = new THREE.DepthTexture();
				depthTexture.format = THREE.DepthFormat;
				depthTexture.type = THREE.UnsignedIntType;

				// postprocessing

				composer = new EffectComposer( renderer );

				traaRenderPass = new TRAARenderPass( scene, camera );
				traaRenderPass.depthTexture = depthTexture;
				composer.addPass( traaRenderPass );

				renderPass = new RenderPass( scene, camera );
				renderPass.enabled = false;
				composer.addPass( renderPass );

				copyPass = new ShaderPass( CopyShader );
				composer.addPass( copyPass );

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				const width = window.innerWidth;
				const height = window.innerHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize( width, height );
				composer.setSize( width, height );

			}

			function animate() {

				requestAnimationFrame( animate );

				index ++;

				if ( Math.round( index / 200 ) % 2 === 0 ) {

					for ( let i = 0; i < scene.children.length; i ++ ) {

						const child = scene.children[ i ];

						child.rotation.x += 0.005;
						child.rotation.y += 0.01;

					}

				}

				composer.render();

				stats.update();

			}

		</script>
	</body>
</html>
