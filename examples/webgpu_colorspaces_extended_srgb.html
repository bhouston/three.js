<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - extended sRGB color space</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - extended sRGB color space">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_colorspaces_extended_srgb.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_colorspaces_extended_srgb.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
		<style>
			.label {
				position: absolute;
				transform: translateY( -50% );
				color: #fff;
				font: 13px monospace;
				text-shadow: 0 0 4px #000, 0 0 2px #000;
				pointer-events: none;
			}
		</style>
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Extended sRGB Color Space</span>
			</div>

			<small>
				<a href="https://www.w3.org/TR/css-color-4/#color-conversion-code" target="_blank" rel="noopener">Extended sRGB</a> color conversions preserve negative components during Display-P3 interpolation.<br />
				<span id="output">Display-P3 unavailable: final colors are clipped to sRGB.</span>
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../src/Three.WebGPU.js",
					"three/webgpu": "../src/Three.WebGPU.js",
					"three/tsl": "../src/Three.TSL.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>
		<script type="module">

			import * as THREE from 'three/webgpu';
			import { Fn, mix, uniform, uv, sRGBTransferEOTF, sRGBTransferOETF } from 'three/tsl';

			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { DisplayP3ColorSpace, DisplayP3ColorSpaceImpl, LinearDisplayP3ColorSpace, LinearDisplayP3ColorSpaceImpl } from 'three/addons/math/ColorSpaces.js';

			THREE.ColorManagement.define( {
				[ DisplayP3ColorSpace ]: DisplayP3ColorSpaceImpl,
				[ LinearDisplayP3ColorSpace ]: LinearDisplayP3ColorSpaceImpl
			} );

			let renderer, scene, camera;
			const stripes = [];

			const pairs = [
				{ name: 'Red → green', start: [ 1, 0, 0 ], end: [ 0, 1, 0 ] },
				{ name: 'Orange → cyan', start: [ 1, 0.5, 0 ], end: [ 0, 1, 1 ] },
				{ name: 'Magenta → green', start: [ 1, 0, 1 ], end: [ 0, 1, 0 ] }
			];

			// Linear Display-P3 to linear sRGB, with a D65 white point.
			const p3ToSRGB = new THREE.Matrix3().set(
				1.2249401763, - 0.2249401763, 0,
				- 0.0420569547, 1.0420569547, 0,
				- 0.0196375546, - 0.0786360456, 1.0982736001
			);

			// Former transfer functions, retained for comparison.
			const oldEncode = Fn( ( [ value ] ) => mix(
				value.max( 0 ).pow( 1 / 2.4 ).mul( 1.055 ).sub( 0.055 ),
				value.mul( 12.92 ), value.lessThanEqual( 0.0031308 )
			) );
			const oldDecode = Fn( ( [ value ] ) => mix(
				value.add( 0.055 ).div( 1.055 ).max( 0 ).pow( 2.4 ),
				value.div( 12.92 ), value.lessThanEqual( 0.04045 )
			) );

			const modes = [
				{ name: 'extended sRGB transfer', interpolate: ( a, b ) => sRGBTransferEOTF( mix( sRGBTransferOETF( a ), sRGBTransferOETF( b ), uv().x ) ) },
				{ name: 'clamped sRGB transfer', interpolate: ( a, b ) => oldDecode( mix( oldEncode( a ), oldEncode( b ), uv().x ) ) }
			];

			init();

			function init() {

				// Pixel-space camera, y pointing down.
				camera = new THREE.OrthographicCamera( 0, 1, 0, - 1, - 1, 1 );
				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x000000 );

				const geometry = new THREE.PlaneGeometry( 1, 1 );

				for ( const pair of pairs ) {

					const start = uniform( new THREE.Color().fromArray( pair.start ).convertSRGBToLinear().applyMatrix3( p3ToSRGB ) );
					const end = uniform( new THREE.Color().fromArray( pair.end ).convertSRGBToLinear().applyMatrix3( p3ToSRGB ) );

					for ( const mode of modes ) {

						const material = new THREE.MeshBasicNodeMaterial();
						material.colorNode = mode.interpolate( start, end );

						const mesh = new THREE.Mesh( geometry, material );
						scene.add( mesh );

						const label = document.createElement( 'div' );
						label.className = 'label';
						label.textContent = `${ pair.name }: ${ mode.name }`;
						document.body.appendChild( label );

						stripes.push( { mesh, label } );

					}

				}

				renderer = new THREE.WebGPURenderer();

				if ( window.matchMedia( '( color-gamut: p3 )' ).matches ) {

					renderer.outputColorSpace = DisplayP3ColorSpace;
					document.getElementById( 'output' ).remove();

				}

				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				window.addEventListener( 'resize', onWindowResize );
				onWindowResize();

			}

			function onWindowResize() {

				const w = window.innerWidth;
				const h = window.innerHeight;

				renderer.setSize( w, h );

				camera.right = w;
				camera.bottom = - h;
				camera.updateProjectionMatrix();

				// Centered panel that clears the info header above and below.
				const margin = document.getElementById( 'info' ).getBoundingClientRect().bottom + 24;
				const width = Math.min( w - 48, 960 );
				const height = Math.min( h - margin * 2, 480 );
				const left = ( w - width ) / 2;
				const top = ( h - height ) / 2;
				const stripeHeight = height / stripes.length;

				stripes.forEach( ( { mesh, label }, i ) => {

					const y = top + stripeHeight * ( i + 0.5 );

					mesh.scale.set( width, stripeHeight, 1 );
					mesh.position.set( left + width / 2, - y, 0 );

					label.style.left = `${ left + 16 }px`;
					label.style.top = `${ y }px`;

				} );

			}

			function animate() {

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
