<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - extended sRGB color space</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - extended sRGB color space">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_colorspaces_extended_srgb.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_colorspaces_extended_srgb.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Extended sRGB Color Space</span>
			</div>

			<small>
				<a href="https://www.w3.org/TR/css-color-4/#color-conversion-code" target="_blank" rel="noopener">Extended sRGB</a> color conversions preserve negative components during Display-P3 interpolation.<br />
				Top: extended sRGB. Middle: former transfer curve. Bottom: linear light.<br />
				Transfer plots: teal = extended sRGB, orange = former curve. Final colors are clipped to sRGB.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../src/Three.WebGPU.js",
					"three/webgpu": "../src/Three.WebGPU.js",
					"three/tsl": "../src/Three.TSL.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>
		<script type="module">

			import * as THREE from 'three/webgpu';
			import { Fn, If, mix, uniform, uv, vec3, min, sRGBTransferEOTF, sRGBTransferOETF } from 'three/tsl';

			import { Inspector } from 'three/addons/inspector/Inspector.js';

			let renderer, scene, camera;
			const params = { view: 0, pair: 0 };
			const start = uniform( new THREE.Color() );
			const end = uniform( new THREE.Color() );
			const view = uniform( 0, 'int' );
			const lineWidth = uniform( 0.01 );
			const pairs = [[[ 1, 0, 0 ], [ 0, 1, 0 ]], [[ 1, 0.5, 0 ], [ 0, 1, 1 ]], [[ 1, 0, 1 ], [ 0, 1, 0 ]]];

			// Linear Display-P3 to linear sRGB, with a D65 white point.
			const p3ToSRGB = new THREE.Matrix3().set(
				1.2249401763, - 0.2249401763, 0,
				- 0.0420569547, 1.0420569547, 0,
				- 0.0196375546, - 0.0786360456, 1.0982736001
			);

			// Former transfer functions, retained for comparison.
			const oldEncode = Fn( ( [ value ] ) => mix(
				value.max( 0 ).pow( 1 / 2.4 ).mul( 1.055 ).sub( 0.055 ),
				value.mul( 12.92 ), value.lessThanEqual( 0.0031308 )
			) );
			const oldDecode = Fn( ( [ value ] ) => mix(
				value.add( 0.055 ).div( 1.055 ).max( 0 ).pow( 2.4 ),
				value.div( 12.92 ), value.lessThanEqual( 0.04045 )
			) );

			init();

			function init() {

				camera = new THREE.OrthographicCamera( - 1, 1, 1, - 1, 0, 2 );
				camera.position.z = 1;
				scene = new THREE.Scene();

				const material = new THREE.MeshBasicNodeMaterial();
				material.colorNode = Fn( () => {

					const color = vec3( 0 ).toVar();

					If( view.equal( 0 ), () => {

						If( uv().y.greaterThan( 2 / 3 ), () => {

							color.assign( sRGBTransferEOTF( mix( sRGBTransferOETF( start ), sRGBTransferOETF( end ), uv().x ) ) );

						} ).ElseIf( uv().y.greaterThan( 1 / 3 ), () => {

							color.assign( oldDecode( mix( oldEncode( start ), oldEncode( end ), uv().x ) ) );

						} ).Else( () => {

							color.assign( mix( start, end, uv().x ) );

						} );

					} ).Else( () => {

						const p = uv().sub( 0.5 ).mul( 3 );
						const grid = p.mul( 2 ).add( 0.5 ).fract().sub( 0.5 ).abs();
						const input = vec3( p.x );
						const extended = view.equal( 1 ).select( sRGBTransferOETF( input ).r, sRGBTransferEOTF( input ).r );
						const former = view.equal( 1 ).select( oldEncode( input ).r, oldDecode( input ).r );

						color.assign( vec3( 0.012, 0.016, 0.024 ) );
						If( min( grid.x, grid.y ).lessThan( 0.006 ), () => {

							color.assign( vec3( 0.035 ) );

						} );
						If( min( p.x.abs(), p.y.abs() ).lessThan( 0.008 ), () => {

							color.assign( vec3( 0.15 ) );

						} );
						If( p.y.sub( former ).abs().lessThan( lineWidth ), () => {

							color.assign( vec3( 1, 0.42, 0.12 ) );

						} );
						If( p.y.sub( extended ).abs().lessThan( lineWidth ), () => {

							color.assign( vec3( 0.11, 0.81, 0.72 ) );

						} );

					} );

					return color;

				} )();
				scene.add( new THREE.Mesh( new THREE.PlaneGeometry( 2, 2 ), material ) );

				renderer = new THREE.WebGPURenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				const gui = renderer.inspector.createParameters( 'Settings' );
				gui.add( params, 'view', { 'Interpolation': 0, 'Linear → sRGB': 1, 'sRGB → linear': 2 } ).name( 'View' ).onChange( update ).info( 'Interpolation compares three transfer methods. Plots show input and output from -1.5 to +1.5, with a 0.5 grid.' );
				gui.add( params, 'pair', { 'Red → green': 0, 'Orange → cyan': 1, 'Magenta → green': 2 } ).name( 'Colors' ).onChange( update ).info( 'Display-P3 endpoints for the interpolation comparison.' );

				window.addEventListener( 'resize', onWindowResize );
				onWindowResize();
				update();

			}

			function update() {

				const endpoints = pairs[ params.pair ];
				start.value.fromArray( endpoints[ 0 ] ).convertSRGBToLinear().applyMatrix3( p3ToSRGB );
				end.value.fromArray( endpoints[ 1 ] ).convertSRGBToLinear().applyMatrix3( p3ToSRGB );
				view.value = params.view;

			}

			function onWindowResize() {

				renderer.setSize( window.innerWidth, window.innerHeight );
				lineWidth.value = 5 / window.innerHeight;

			}

			function animate() {

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
