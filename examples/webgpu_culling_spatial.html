<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - scene spatial index</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="example.css">
		<style>
			#readout { position: absolute; z-index: 1; bottom: 20px; left: 20px; background: #10202ee8; padding: 16px; color: white; font: 13px/1.7 monospace; pointer-events: none; }
			#readout strong { color: #78f0bb; }
		</style>
	</head>
	<body>
		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>
			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Scene spatial index</span>
			</div>
			<small>Independent Mesh spheres. Drag to orbit. The spatial BVH preserves the authored scene graph.</small>
		</div>
		<div id="readout" class="lbl">Building static spatial index…</div>
		<script type="importmap">
			{
				"imports": {
					"three": "../src/Three.WebGPU.js",
					"three/webgpu": "../src/Three.WebGPU.js",
					"three/tsl": "../src/Three.TSL.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>
		<script type="module">
			import * as THREE from 'three/webgpu';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { SceneSpatialIndex } from 'three/addons/utils/SceneSpatialIndex.js';

			const search = new URLSearchParams( window.location.search );
			const settings = {
				mode: search.get( 'mode' ) || 'bvh',
				scene: search.get( 'scene' ) || 'uniform',
				count: Number( search.get( 'count' ) ) || 100000
			};
			const readout = document.getElementById( 'readout' );
			const scene = new THREE.Scene();
			scene.background = new THREE.Color( 0xa9c7db );
			const root = new THREE.Group();
			scene.add( root );
			const camera = new THREE.PerspectiveCamera( 65, window.innerWidth / window.innerHeight, 1, 320 );
			camera.position.set( 0, 12, 70 );
			const renderer = new THREE.WebGPURenderer();
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.inspector = new Inspector();
			document.body.appendChild( renderer.domElement );
			const controls = new OrbitControls( camera, renderer.domElement );
			controls.target.set( 0, 3, - 100 );
			controls.update();
			const geometry = new THREE.SphereGeometry( 2, 8, 6 );
			const material = new THREE.MeshNormalMaterial();
			const groups = [];

			if ( settings.scene === 'clustered' ) {

				for ( let i = 0; i < 100; i ++ ) {

					const group = new THREE.Group();
					root.add( group );
					groups.push( group );

				}

			}

			THREE.MathUtils.seededRandom( 150 );
			for ( let i = 0; i < settings.count; i ++ ) {

				const sphere = new THREE.Mesh( geometry, material );
				let x = THREE.MathUtils.seededRandom() * 4000 - 2000;
				let z = THREE.MathUtils.seededRandom() * 4000 - 2000;
				if ( settings.scene === 'clustered' ) {

					const cluster = i % 25;
					x = ( cluster % 5 - 2 ) * 750 + x * 0.12;
					z = ( Math.floor( cluster / 5 ) - 2 ) * 750 + z * 0.12;

				}

				sphere.position.set( x, 2, z );
				sphere.matrixAutoUpdate = false;
				sphere.updateMatrix();
				const parent = groups.length > 0 ? groups[ Math.floor( i / 25 ) % groups.length ] : root;
				parent.add( sphere );

			}

			if ( settings.scene === 'all-visible' ) {

				camera.position.set( 0, 5000, 0 );
				camera.far = 10000;
				controls.target.set( 0, 0, 0 );
				controls.update();

			}

			const ground = new THREE.Mesh( new THREE.PlaneGeometry( 4100, 4100 ), new THREE.MeshBasicMaterial( { color: 0x283d3b } ) );
			ground.rotation.x = Math.PI * - 0.5;
			scene.add( ground );
			const start = performance.now();
			const index = new SceneSpatialIndex( root );
			const buildMs = performance.now() - start;
			scene.updateMatrixWorld( true );
			scene.matrixWorldAutoUpdate = false;

			const gui = renderer.inspector.createParameters( 'Settings' );
			gui.add( settings, 'mode', [ 'stock', 'flat', 'bvh' ] );
			gui.add( settings, 'scene', [ 'uniform', 'clustered', 'all-visible' ] ).onChange( reload );
			gui.add( settings, 'count', [ 1000, 10000, 100000 ] ).onChange( reload );
			window.addEventListener( 'resize', onWindowResize );
			await renderer.init();
			camera.coordinateSystem = renderer.coordinateSystem;
			camera.updateProjectionMatrix();
			renderer.setAnimationLoop( animate );

			function reload() {

				window.location.search = new URLSearchParams( settings ).toString();

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				controls.update();
				index.enabled = settings.mode !== 'stock';
				index.hierarchical = settings.mode === 'bvh';
				renderer.render( scene, camera );
				const counts = settings.mode === 'stock' ? 'Stock renderer tests scene objects' : `${ index.stats.nodes } BVH nodes / ${ index.stats.spheres } sphere tests`;
				const description = `<strong>${ settings.mode.toUpperCase() } · ${ settings.scene.toUpperCase() }</strong><br>${ settings.count.toLocaleString() } independent Mesh spheres<br>${ counts }<br>Draw calls: ${ renderer.info.render.drawCalls }<br>Index build: ${ buildMs.toFixed( 1 ) } ms (startup)<br>Static bounds. CPU index; WebGPU rendering.<br>Parent/child ownership is unchanged.`;
				if ( readout.innerHTML !== description ) readout.innerHTML = description;

			}
		</script>
	</body>
</html>
