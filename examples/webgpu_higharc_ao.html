<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - HighArc SSGI / SSR</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>HighArc SSGI / SSR</span>
			</div>

			<small>SSGI and SSR applied to the indirect lighting of an architectural model, with temporal denoising and TRAA.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { pass, mrt, normalView, velocity, float, vec2, vec3, vec4, mix, smoothstep, reference, perspectiveDepthToViewZ, packNormalToRGB, unpackRGBToNormal, sample, texture, screenUV, uniform, materialMetalness, materialRoughness, builtinGIContext, builtinRadianceContext } from 'three/tsl';
			import { ssgi } from 'three/addons/tsl/display/SSGINode.js';
			import { ssr } from 'three/addons/tsl/display/SSRNode.js';
			import { traa } from 'three/addons/tsl/display/TRAANode.js';
			import { temporalReproject } from 'three/addons/tsl/display/TemporalReprojectNode.js';
			import { recurrentDenoise } from 'three/addons/tsl/display/RecurrentDenoiseNode.js';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';

			import { Inspector } from 'three/addons/inspector/Inspector.js';

			// The model is in meters; the original viewer works in inches, so its distances are scaled by this.
			const INCH = 0.0254;

			// SSGINode's presets for temporal filtering
			const SSGI_SAMPLES = {
				low: { slices: 1, steps: 12 },
				medium: { slices: 2, steps: 8 },
				high: { slices: 3, steps: 16 }
			};

			const params = {
				output: 'beauty', // beauty, ao, gi, reflections
				ssgi: true,
				ssr: false,
				ssgiQuality: 'medium',
				ssgiIntensity: 1, // relative to physically based irradiance
				ssgiRadius: 120 * INCH,
				resolutionScale: 2 // divides the SSGI/SSR working resolution: 1, 2, 3 or 4
			};

			// fade out the screen-space effects in the distance to avoid terrain and horizon halos
			const FADE_START = 6000 * INCH;
			const FADE_END = 14000 * INCH;

			let camera, scene, renderer, renderPipeline, controls;
			let scenePass, traaPass, ssgiNode, ssrNode, signals, channel;

			const target = new THREE.Vector3();
			let span = 1;

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 0.1, 1000 );

				scene = new THREE.Scene();

				renderer = new THREE.WebGPURenderer();
				renderer.setPixelRatio( Math.min( window.devicePixelRatio, 2 ) );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.shadowMap.enabled = true;
				renderer.shadowMap.type = THREE.PCFShadowMap;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;

				// environment

				const hdr = await new HDRLoader().loadAsync( 'textures/equirectangular/blouberg_sunrise_2_1k.hdr' );
				hdr.mapping = THREE.EquirectangularReflectionMapping;
				scene.environment = hdr;
				scene.background = hdr;
				scene.environmentIntensity = 0.6;
				scene.backgroundIntensity = 0.6;

				// model

				const gltf = await new GLTFLoader().loadAsync( 'models/gltf/Dogwood.glb' );
				const model = gltf.scene;
				model.traverse( ( child ) => {

					if ( child.isMesh ) {

						child.castShadow = true;
						child.receiveShadow = true;

					}

				} );
				scene.add( model );

				const box = new THREE.Box3().setFromObject( model );
				const size = box.getSize( new THREE.Vector3() );
				box.getCenter( target );
				span = size.length();

				controls.target.copy( target );
				camera.position.copy( target ).add( new THREE.Vector3( 0.8, 0.5, 1 ).normalize().multiplyScalar( span * 1.2 ) );

				// ground

				const ground = new THREE.Mesh( new THREE.PlaneGeometry( span * 20, span * 20 ), new THREE.MeshStandardMaterial( { color: 0xb0b0a8, roughness: 1 } ) );
				ground.rotation.x = - Math.PI / 2;
				ground.position.y = box.min.y;
				ground.receiveShadow = true;
				scene.add( ground );

				// sun, with the shadow camera fitted to the model

				const sun = new THREE.DirectionalLight( 0xfff4e5, 3 );
				sun.position.copy( target ).add( new THREE.Vector3( - 0.5, 1, 0.6 ).normalize().multiplyScalar( span ) );
				sun.target.position.copy( target );
				sun.castShadow = true;
				sun.shadow.mapSize.set( 2048, 2048 );
				sun.shadow.camera.left = sun.shadow.camera.bottom = - span * 0.6;
				sun.shadow.camera.right = sun.shadow.camera.top = span * 0.6;
				sun.shadow.camera.near = 0.1;
				sun.shadow.camera.far = span * 2;
				sun.shadow.normalBias = 0.02;
				scene.add( sun, sun.target );

				// post-processing

				renderPipeline = new THREE.RenderPipeline( renderer );

				// pre-pass: the ambient effects run before the scene pass so they can light the materials instead of
				// being composited on top, which means depth, normals, velocity and material data come from a separate
				// pass. The normals stay half float, 8 bits quantize the reflection directions into bands.

				const prePass = pass( scene, camera );
				prePass.name = 'Pre-Pass';
				prePass.transparent = false;
				prePass.setMRT( mrt( {
					output: packNormalToRGB( normalView ),
					velocity: velocity,
					metalRoughness: vec2( materialMetalness, materialRoughness )
				} ) );

				prePass.getTexture( 'metalRoughness' ).type = THREE.UnsignedByteType;

				const prePassNormal = prePass.getTextureNode();
				const prePassDepth = prePass.getTextureNode( 'depth' );
				const prePassVelocity = prePass.getTextureNode( 'velocity' );
				const prePassMetalRoughness = prePass.getTextureNode( 'metalRoughness' ).sample( screenUV );

				const sceneNormal = sample( ( uv ) => unpackRGBToNormal( prePassNormal.sample( uv ) ) );

				// scene pass, anti-aliased with TRAA

				scenePass = pass( scene, camera );
				traaPass = traa( scenePass, prePassDepth, prePassVelocity, camera );

				// the bounced and reflected light comes from the previous frame's final image reprojected to the current
				// frame, which also accumulates multiple bounces over successive frames

				const previousFrame = texture( traaPass.getTextureNode().value );
				const previousRadiance = sample( ( uv ) => previousFrame.sample( uv.sub( prePassVelocity.sample( uv ).xy.mul( vec2( 0.5, - 0.5 ) ) ) ) );

				// ssgi with a world space radius, at a fraction of the render resolution (see params.resolutionScale)

				ssgiNode = ssgi( previousRadiance, prePassDepth, sceneNormal, camera );
				ssgiNode.useScreenSpaceSampling.value = false;
				ssgiNode.thickness.value = 8 * INCH;
				ssgiNode.aoIntensity.value = 1.5;

				// ssr: the complete reflected radiance, falling back to the environment map, which replaces the
				// environment reflections of the materials so they apply their own Fresnel, metalness and roughness

				ssrNode = ssr( previousRadiance, prePassDepth, sceneNormal, {
					metalnessNode: prePassMetalRoughness.r,
					roughnessNode: prePassMetalRoughness.g,
					environmentNode: hdr,
					outputRadiance: true,
					camera
				} );
				ssrNode.maxDistance.value = span * 0.5;
				ssrNode.environmentIntensity.value = scene.environmentIntensity;

				// temporal denoising: AO and GI each get their own chain since the temporal nodes only filter RGB.
				// Reflections are reprojected with their hit points (specular mode) since they move differently than
				// the surfaces showing them.

				const temporalDenoise = ( signal ) => {

					const reprojected = temporalReproject( signal, prePassDepth, prePassNormal, prePassVelocity, camera );
					const denoised = recurrentDenoise( reprojected, camera, { depth: prePassDepth, normal: prePassNormal, raw: signal } );
					denoised.alphaSource = 'none';
					reprojected.setHistoryTexture( denoised );
					return denoised.getTextureNode();

				};

				const ssrReprojected = temporalReproject( ssrNode, prePassDepth, prePassNormal, prePassVelocity, camera, { mode: 'specular' } );
				ssrReprojected.maxFrames.value = 16;
				ssrReprojected.clampIntensity.value = 0.25;

				const ssrDenoised = recurrentDenoise( ssrReprojected, camera, { depth: prePassDepth, normal: prePassNormal, raw: ssrNode, metalRoughness: prePassMetalRoughness, mode: 'specular' } );
				ssrDenoised.alphaSource = 'raylength'; // the SSR alpha channel holds the ray length
				ssrDenoised.lumaPhi.value = 0.75;
				ssrDenoised.depthPhi.value = 20;
				ssrDenoised.normalPhi.value = 0.3;
				ssrDenoised.radius.value = 1.5;
				ssrDenoised.alphaPhi.value = 5;
				ssrDenoised.strength.value = 0.725;
				ssrDenoised.adaptiveTrust.value = 1;
				ssrReprojected.setHistoryTexture( ssrDenoised );

				const viewDistance = perspectiveDepthToViewZ( prePassDepth.sample( screenUV ).r, reference( 'near', 'float', camera ), reference( 'far', 'float', camera ) ).negate();
				const fade = smoothstep( FADE_START, FADE_END, viewDistance );

				// the signals are sampled in screen space since they are applied in the materials of the scene pass

				signals = {
					ao: mix( temporalDenoise( ssgiNode.getAONode() ).sample( screenUV ).r, float( 1 ), fade ),
					gi: temporalDenoise( ssgiNode.getGINode() ).sample( screenUV ).rgb.mul( fade.oneMinus() ),
					reflections: ssrDenoised.getTextureNode().sample( screenUV ).rgb
				};

				// the data outputs are selected with a uniform so the scene pass and TRAA keep running, since the
				// effects sample their previous frame

				channel = uniform( 0 );

				buildPipeline();
				updateParameters();

				window.addEventListener( 'resize', onWindowResize );

				renderer.setAnimationLoop( animate );

				// GUI

				const gui = renderer.inspector.createParameters( 'Settings' );
				gui.add( params, 'output', [ 'beauty', 'ao', 'gi', 'reflections' ] ).onChange( buildPipeline );
				gui.add( params, 'ssgi' ).name( 'SSGI' ).onChange( buildPipeline );
				gui.add( params, 'ssr' ).name( 'SSR' ).onChange( buildPipeline );
				gui.add( params, 'ssgiQuality', [ 'low', 'medium', 'high' ] ).name( 'SSGI quality' ).onChange( updateParameters );
				gui.add( params, 'ssgiIntensity', 0, 4 ).name( 'SSGI intensity' ).onChange( updateParameters );
				gui.add( params, 'ssgiRadius', 0.1, 10 ).name( 'SSGI radius (m)' ).onChange( updateParameters );
				gui.add( params, 'resolutionScale', [ 1, 2, 3, 4 ] ).name( 'SSGI/SSR resolution scale' ).onChange( updateParameters );

			}

			function buildPipeline() {

				// ao and gi feed the indirect diffuse lighting, reflections replace the environment reflections

				let occlusion = float( 1 );
				let bounce = vec3( 0 );
				let reflections = vec3( 0 );
				let context = null;

				if ( params.ssgi ) {

					occlusion = signals.ao;
					bounce = signals.gi;
					context = builtinGIContext( occlusion, bounce );

				}

				if ( params.ssr ) {

					reflections = signals.reflections;
					context = builtinRadianceContext( reflections, context );

				}

				scenePass.contextNode = context;
				scenePass.needsUpdate = true;

				// data outputs skip tone mapping and the output color transform

				const dataOutputs = [ 'ao', 'gi', 'reflections' ];
				const isData = dataOutputs.includes( params.output );

				channel.value = dataOutputs.indexOf( params.output ) + 1;

				const data = channel.equal( 1 ).select( vec4( vec3( occlusion ), 1 ), channel.equal( 2 ).select( vec4( bounce, 1 ), vec4( reflections, 1 ) ) );

				renderPipeline.outputNode = channel.equal( 0 ).select( traaPass, data );
				renderPipeline.outputColorTransform = ! isData;
				renderer.toneMapping = isData ? THREE.NoToneMapping : THREE.ACESFilmicToneMapping;
				renderPipeline.needsUpdate = true;

			}

			function updateParameters() {

				const samples = SSGI_SAMPLES[ params.ssgiQuality ];
				ssgiNode.sliceCount.value = samples.slices;
				ssgiNode.stepCount.value = samples.steps;
				ssgiNode.radius.value = params.ssgiRadius;

				// the materials expect irradiance: for uniform radiance L, SSGI integrates 2L/π while the irradiance is πL

				ssgiNode.giIntensity.value = params.ssgiIntensity * Math.PI * Math.PI / 2;

				ssgiNode.resolutionScale = 1 / params.resolutionScale;
				ssrNode.resolutionScale = 1 / params.resolutionScale;

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				controls.update();

				// like the original viewer, near/far track the orbit distance

				const distance = camera.position.distanceTo( controls.target );
				camera.near = Math.max( INCH, distance * 0.01 );
				camera.far = Math.max( span * 4, distance + span * 4 );
				camera.updateProjectionMatrix();

				renderPipeline.render();

			}

		</script>
	</body>
</html>
