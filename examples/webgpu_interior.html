<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - interior</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>
		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>
			<div class="title-wrapper"><a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Interior</span></div>
			<small>Light Probe / VXGI diffuse lighting, box-projected reflections and GTAO / GTSO with selectable scenes.<br />Scene by <a href="https://ben3d.ca" target="_blank" rel="noopener">Ben Houston</a></small>
		</div>
		<script type="importmap">
			{
				"imports": {
					"three": "../src/Three.WebGPU.js",
					"three/webgpu": "../src/Three.WebGPU.js",
					"three/tsl": "../src/Three.TSL.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>
		<script type="module">

			import * as THREE from 'three/webgpu';
			import { sample, pass, mrt, screenUV, normalView, velocity, vec3, vec4, packNormalToRGB, unpackRGBToNormal, colorSpaceToWorking, builtinAOContext, context, uniform, indirectDiffuse, indirectSpecular, environmentDiffuse, environmentSpecular, pmremTexture } from 'three/tsl';
			import { ao } from 'three/addons/tsl/display/GTAONode.js';
			import { traa } from 'three/addons/tsl/display/TRAANode.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { LightProbeGrid } from 'three/addons/lighting/LightProbeGrid.js';
			import { VXGIVolume } from 'three/addons/lighting/vxgi/VXGIVolume.js';
			import { vxgiDiffuse } from 'three/addons/lighting/vxgi/VXGIIrradiance.js';
			import { ReflectionProbe, ReflectionProbes } from 'three/addons/lighting/ReflectionProbes.js';
			import { reflectionProbesSpecular } from 'three/addons/tsl/lighting/ReflectionProbesNode.js';
			import { lightProbeGridDiffuse } from 'three/addons/tsl/lighting/LightProbeGridNode.js';

			const models = {
				'Museum': 'museum.glb',
				'Dual Rooms': 'dual-rooms.glb',
				'Cornell Box': 'cornell-box.glb',
				'Cornell Box (Oblique)': 'cornell-box-oblique.glb',
				'Cornell Box (Metallic Sphere)': 'cornell-box-metallic-sphere.glb',
				'Cornell Box (Mirror Wall)': 'cornell-box-mirror-wall.glb'
			};

			const params = {
				model: 'Dual Rooms',
				environment: true,
				environmentSource: 'HDR',
				directLights: true,
				diffuseGI: true,
				reflectionProbes: true,
				algorithm: 'Light Probes',
				bounces: 2,
				voxelResolution: 128,
				probeResolution: 32,
				coneCount: 8,
				coneAngle: 40,
				bounceConeAngle: 60,
				directionalVoxels: false,
				resolution: 256,
				reflectionBounces: 3,
				boxProjection: true,
				capture: () => capture(),
				aoType: 'GTAO + GTSO',
				samples: 16,
				radius: 0.4,
				resolutionScale: 0.5,
				scale: 0.3,
				thickness: 1,
				temporalFiltering: true,
				aoOnly: false
			};
			let camera, scene, renderer, controls, lightProbes, probes, model;
			let renderPipeline, scenePass, aoPass, traaPass, voxelVolume;
			const giFrame = uniform( 0 );
			let loadId = 0;
			let currentModel = params.model;
			let captureFar = 30;

			init();

			async function init() {

				// Camera

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 2.5, 16 );

				// Scene

				scene = new THREE.Scene();
				const background = new THREE.Color( 0x111111 );
				const environment = await new HDRLoader().loadAsync( 'textures/equirectangular/pedestrian_overpass_1k.hdr' );
				environment.mapping = THREE.EquirectangularReflectionMapping;
				scene.environment = environment;
				scene.background = environment;

				// Renderer

				renderer = new THREE.WebGPURenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );
				await renderer.init();
				if ( renderer.backend.isWebGPUBackend !== true ) throw new Error( 'This example requires WebGPU.' );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.target.set( 0, 2.5, 0 );
				controls.update();

				await loadModel();

				// Occlusion is evaluated from the main camera, after baking the probes.
				// Feed it into indirect lighting so direct lights retain their contribution.

				renderPipeline = new THREE.RenderPipeline( renderer );

				const prePass = pass( scene, camera ).toInspector( 'Normal', ( inspectNode ) => colorSpaceToWorking( inspectNode, THREE.SRGBColorSpace ) );
				prePass.name = 'Pre-Pass';
				prePass.transparent = false;
				prePass.setMRT( mrt( {
					output: packNormalToRGB( normalView ),
					velocity: velocity
				} ) );
				prePass.getTexture( 'output' ).type = THREE.UnsignedByteType;

				const prePassNormal = sample( ( uv ) => unpackRGBToNormal( prePass.getTextureNode().sample( uv ) ) );
				const prePassDepth = prePass.getTextureNode( 'depth' ).toInspector( 'Depth', () => prePass.getLinearDepthNode() );
				const prePassVelocity = prePass.getTextureNode( 'velocity' ).toInspector( 'Velocity' );

				scenePass = pass( scene, camera ).toInspector( 'Color' );
				aoPass = ao( prePassDepth, prePassNormal, camera ).toInspector( 'GTAO', ( inspectNode ) => inspectNode.r );
				traaPass = traa( scenePass, prePassDepth, prePassVelocity, camera );
				traaPass.useSubpixelCorrection = false;
				updateAOParameters();
				updateAO();

				const settings = renderer.inspector.createParameters( 'Interior' );
				settings.add( params, 'model', Object.keys( models ) ).name( 'Model' ).listen().onChange( loadModel );
				settings.add( params, 'directLights' ).name( 'Direct Lights' ).onChange( updateDirectLights );
				settings.add( params, 'diffuseGI' ).name( 'Diffuse GI' ).onChange( updateIndirectLighting );
				settings.add( params, 'reflectionProbes' ).name( 'Reflection Probes' ).onChange( updateIndirectLighting );
				const whiteEnvironment = new THREE.DataTexture( new Float32Array( [ 1, 1, 1, 1 ] ), 1, 1, THREE.RGBAFormat, THREE.FloatType );
				whiteEnvironment.mapping = THREE.EquirectangularReflectionMapping;
				whiteEnvironment.needsUpdate = true;
				const updateEnvironment = () => {

					const selected = params.environmentSource === 'HDR' ? environment : whiteEnvironment;
					scene.environment = params.environment ? selected : null;
					scene.background = params.environment ? selected : background;
					capture();

				};

				settings.add( params, 'environment' ).name( 'Environment Map' ).onChange( updateEnvironment );
				settings.add( params, 'environmentSource', [ 'HDR', 'Unit White' ] ).name( 'Environment Source' ).onChange( updateEnvironment );

				const occlusion = settings.addFolder( 'Ambient Occlusion' );
				occlusion.add( params, 'aoType', [ 'None', 'GTAO', 'GTAO + GTSO' ] ).name( 'AO type' ).onChange( updateAO );
				occlusion.add( params, 'resolutionScale', 0.25, 1, 0.25 ).name( 'Resolution' ).onChange( updateAOParameters );
				occlusion.add( params, 'samples', 4, 32, 1 ).name( 'Samples' ).onChange( updateAOParameters ).debounce( 250 );
				occlusion.add( params, 'radius', 0.1, 2 ).name( 'Radius' ).onChange( updateAOParameters );
				occlusion.add( params, 'scale', 0.01, 1 ).name( 'Scale' ).onChange( updateAOParameters );
				occlusion.add( params, 'thickness', 0.01, 2 ).name( 'Thickness' ).onChange( updateAOParameters );
				occlusion.add( params, 'temporalFiltering' ).name( 'Temporal filtering' ).onChange( updateAOParameters );
				occlusion.add( params, 'aoOnly' ).name( 'AO only' ).onChange( updateAO );

				const baking = settings.addFolder( 'Diffuse Baking' );
				baking.add( params, 'algorithm', [ 'Light Probes', 'VXGI' ] ).name( 'GI Method' ).onChange( () => capture() );
				// VXGI supports up to two cached indirect bounces.
				baking.add( params, 'bounces', 0, 2, 1 ).name( 'Additional Bounces' ).onChange( () => capture() ).debounce( 250 );
				baking.add( params, 'probeResolution', [ 16, 32, 64, 128 ] ).name( 'Probe Capture Size' ).onChange( () => capture() );
				baking.add( params, 'coneCount', [ 3, 8, 16, 32 ] ).name( 'Voxel Cones' ).onChange( () => capture( false ) );
				baking.add( params, 'coneAngle', 5, 60, 1 ).name( 'Voxel Cone Angle' ).onChange( () => capture( false ) ).debounce( 250 );
				baking.add( params, 'bounceConeAngle', 5, 60, 1 ).name( 'Voxel Bake Cone Angle' ).onChange( () => capture() ).debounce( 250 );
				baking.add( params, 'directionalVoxels' ).name( 'Directional Voxels' ).onChange( () => capture() );
				baking.add( params, 'voxelResolution', [ 64, 128, 256 ] ).name( 'Voxel Resolution' ).onChange( () => capture() );
				baking.add( params, 'capture' ).name( 'Re-Bake' );

				const gui = settings.addFolder( 'Reflection Probes' );
				gui.add( params, 'resolution', [ 256, 512, 1024 ] ).name( 'Capture Resolution' ).onChange( () => capture( false ) );
				gui.add( params, 'reflectionBounces', 0, 10, 1 ).name( 'Additional Bounces' ).onChange( () => capture( false ) ).debounce( 250 );
				gui.add( { capture: () => capture( false ) }, 'capture' ).name( 'Capture' );
				gui.add( params, 'boxProjection' ).name( 'Box Projection' ).onChange( ( value ) => probes.boxProjection = value );

				window.addEventListener( 'resize', () => {

					camera.aspect = window.innerWidth / window.innerHeight;
					camera.updateProjectionMatrix();
					renderer.setSize( window.innerWidth, window.innerHeight );

				} );
				renderer.setAnimationLoop( animate );

			}

			function animate() {

				controls.update();
				giFrame.value = ( giFrame.value + 1 ) % 64;

				renderPipeline.render();

			}

			function updateAO() {

				scenePass.contextNode = params.aoType === 'None' ? null : params.aoType === 'GTAO + GTSO'
					? aoPass.getLightingContext()
					: builtinAOContext( aoPass.getTextureNode().sample( screenUV ).r );
				scenePass.needsUpdate = true;

				renderPipeline.outputNode = params.aoOnly ? vec4( vec3( aoPass.getTextureNode().sample( screenUV ).r ), 1 ) : traaPass;
				renderer.toneMapping = params.aoOnly ? THREE.NoToneMapping : THREE.ACESFilmicToneMapping;
				renderPipeline.needsUpdate = true;
				traaPass.setSize( 1, 1 );

			}

			function updateAOParameters() {

				aoPass.samples.value = params.samples;
				aoPass.radius.value = params.radius;
				aoPass.resolutionScale = params.resolutionScale;
				aoPass.scale.value = params.scale;
				aoPass.thickness.value = params.thickness;
				aoPass.useTemporalFiltering = params.temporalFiltering;
				traaPass.setSize( 1, 1 );

			}

			async function loadModel() {

				const id = ++ loadId;
				const name = params.model;
				let gltf;

				try {

					gltf = await new GLTFLoader().loadAsync( 'models/gltf/' + models[ name ] );

				} catch ( error ) {

					if ( id !== loadId ) return;
					params.model = currentModel;
					console.error( 'Unable to load model:', error );
					return;

				}

				if ( id !== loadId ) {

					disposeModel( gltf.scene );
					return;

				}

				scene.environmentNode = null;
				renderer.contextNode = context( { ...renderer.contextNode.value } );
				delete renderer.contextNode.value.getGI;
				renderer.contextNode.value.indirectDiffuseNode = null;
				renderer.contextNode.value.indirectSpecularNode = null;

				for ( const source of [ lightProbes, probes ] ) {

					if ( source ) {

						source.removeFromParent();
						source.dispose();

					}

				}

				voxelVolume?.dispose();
				voxelVolume = null;

				if ( model ) {

					model.removeFromParent();
					disposeModel( model );

				}

				model = gltf.scene;
				model.traverse( ( object ) => {

					if ( object.isMesh ) {

						object.castShadow = true;
						object.receiveShadow = true;

					}

					if ( object.isLight && object.shadow ) {

						object.castShadow = true;
						object.shadow.mapSize.setScalar( 256 );
						object.shadow.radius = 12;
						object.shadow.bias = - 0.002;

					}

				} );
				scene.add( model );
				updateDirectLights();
				model.updateMatrixWorld( true );
				setModelCamera( gltf );

				const bounds = new THREE.Box3().setFromObject( model );
				const fullSize = bounds.getSize( new THREE.Vector3() ).max( new THREE.Vector3( 0.1, 0.1, 0.1 ) );
				const size = fullSize.clone().multiplyScalar( 0.95 );
				const center = bounds.getCenter( new THREE.Vector3() );
				captureFar = Math.max( 30, fullSize.length() * 2 );

				// Fit the diffuse probe grid to the selected scene.

				lightProbes = new LightProbeGrid( size.x, size.y, size.z, 12, 6, 6 );
				lightProbes.position.copy( center );
				lightProbes.visibility = true;
				lightProbes.multiBounce = true;
				scene.add( lightProbes );

				// Keep room-local reflections for Dual Rooms; fit other scenes to their bounds.

				probes = new ReflectionProbes();
				probes.boxProjection = params.boxProjection;

				const probeSetup = params.model === 'Dual Rooms' ? [
					{ position: [ - 4, 2.5, 0 ], influenceSize: [ 8.4, 5.4, 8.4 ], projectionSize: [ 8, 5, 8 ] },
					{ position: [ 4, 2.5, 0 ], influenceSize: [ 8.4, 5.4, 8.4 ], projectionSize: [ 8, 5, 8 ] },
					// captured at doorway height, projected onto both rooms
					{ position: [ 0, 1.9, 0 ], influenceSize: [ 2.4, 3.8, 2.5 ], projectionSize: [ 16, 5, 8 ], projectionOffset: [ 0, 0.6, 0 ] }
				] : [ { position: center.toArray(), influenceSize: size.clone().multiplyScalar( 1.1 ).toArray(), projectionSize: fullSize.toArray() } ];

				for ( const setup of probeSetup ) {

					const probe = new ReflectionProbe( ...setup.influenceSize );
					probe.position.set( ...setup.position );
					probe.projectionSize = new THREE.Vector3( ...setup.projectionSize );
					if ( setup.projectionOffset ) probe.projectionOffset.set( ...setup.projectionOffset );
					probes.add( probe );

				}

				scene.add( probes );

				capture();
				currentModel = name;

			}

			function disposeModel( model ) {

				const resources = new Set();
				model.traverse( ( object ) => {

					if ( object.geometry ) resources.add( object.geometry );
					if ( object.shadow ) resources.add( object.shadow );
					const materials = Array.isArray( object.material ) ? object.material : [ object.material ];
					for ( const material of materials ) {

						if ( ! material ) continue;
						resources.add( material );
						for ( const value of Object.values( material ) ) {

							if ( value && value.isTexture ) resources.add( value );

						}

					}

				} );
				for ( const resource of resources ) resource.dispose();

			}

			function setModelCamera( gltf ) {

				const source = gltf.cameras[ 0 ];
				const bounds = new THREE.Box3().setFromObject( model );
				const center = bounds.getCenter( new THREE.Vector3() );

				// Clear any orbit damping left over from the previous scene.
				const damping = controls.enableDamping;
				controls.enableDamping = false;
				controls.update();

				if ( source ) {

					source.getWorldPosition( camera.position );
					source.getWorldQuaternion( camera.quaternion );
					camera.fov = source.fov;
					camera.near = source.near;
					camera.far = source.far;
					controls.target.copy( camera.position ).addScaledVector( camera.getWorldDirection( new THREE.Vector3() ), camera.position.distanceTo( center ) );

				} else {

					controls.target.copy( center );
					camera.position.copy( center ).add( new THREE.Vector3( 1, 0.6, 1 ).multiplyScalar( bounds.getSize( new THREE.Vector3() ).length() ) );

				}

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				controls.update();
				controls.saveState();
				controls.enableDamping = damping;

			}

			function updateDirectLights() {

				model.traverse( object => {

					if ( object.isLight ) object.visible = params.directLights;

				} );
				if ( traaPass ) traaPass.setSize( 1, 1 );

			}

			function updateIndirectLighting() {

				configureIndirectLighting();
				traaPass.setSize( 1, 1 );

			}

			function configureIndirectLighting( reflections = true, baking = false ) {

				const diffuseProviders = [];
				const specularProviders = reflections && params.reflectionProbes ? [ reflectionProbesSpecular( probes ) ] : [];
				const diffuseEnabled = baking || params.diffuseGI;

				if ( diffuseEnabled && params.algorithm === 'Light Probes' ) {

					diffuseProviders.push( lightProbeGridDiffuse( lightProbes ) );

				} else if ( diffuseEnabled ) {

					const provider = vxgiDiffuse( voxelVolume, { coneCount: Number( params.coneCount ), coneAngle: params.coneAngle } );
					diffuseProviders.push( query => provider( { ...query, sampleIndex: giFrame } ) );

				}

				if ( scene.environment ) {

					const environment = pmremTexture( scene.environment );
					if ( diffuseEnabled ) diffuseProviders.push( environmentDiffuse( environment ) );
					specularProviders.push( environmentSpecular( environment ) );

				}

				renderer.contextNode = context( {
					...renderer.contextNode.value,
					indirectDiffuseNode: indirectDiffuse( diffuseProviders ),
					indirectSpecularNode: indirectSpecular( specularProviders )
				} );

			}

			function capture( bakeDiffuse = true ) {

				if ( ! model || ! lightProbes || ! probes ) return;

				const environmentNode = scene.environmentNode;
				const rendererContext = renderer.contextNode;
				const lightProbesVisible = lightProbes.visible;
				// Display toggles isolate contributions without changing the bake inputs.
				const lightStates = [];
				model.traverse( object => {

					if ( object.isLight ) {

						lightStates.push( [ object, object.visible ] );
						object.visible = true;

					}

				} );
				scene.environmentNode = null;
				let baked = false;

				try {

					// Clear the previous diffuse source before preparing the new one.

					if ( bakeDiffuse ) {

						renderer.contextNode = context( { ...rendererContext.value } );
						delete renderer.contextNode.value.getGI;
						renderer.contextNode.value.indirectDiffuseNode = null;
						renderer.contextNode.value.indirectSpecularNode = null;
						lightProbes.visible = params.algorithm === 'Light Probes';

						if ( params.algorithm === 'Light Probes' ) {

							lightProbes.bake( renderer, scene, { cubemapSize: Number( params.probeResolution ), near: 0.05, far: captureFar, bounces: params.bounces } );

						} else {

							if ( voxelVolume && voxelVolume.resolution !== Number( params.voxelResolution ) ) {

								voxelVolume.dispose();
								voxelVolume = null;

							}

							voxelVolume ??= new VXGIVolume( Number( params.voxelResolution ) );
							voxelVolume.bounces = params.bounces;
							voxelVolume.bounceConeAngle.value = params.bounceConeAngle;
							voxelVolume.directionalRadiance = params.directionalVoxels;
							voxelVolume.update( renderer, scene );

						}

					}

					// Record the resolved diffuse solution in the local reflections too.

					configureIndirectLighting( false, true );

					probes.bake( renderer, scene, { resolution: Number( params.resolution ), near: 0.05, far: captureFar, bounces: params.reflectionBounces } );
					configureIndirectLighting();
					baked = true;

				} finally {

					scene.environmentNode = environmentNode;
					for ( const [ light, visible ] of lightStates ) light.visible = visible;
					if ( ! baked ) {

						renderer.contextNode = rendererContext;
						lightProbes.visible = lightProbesVisible;

					}

					if ( traaPass ) traaPass.setSize( 1, 1 );

				}

			}

		</script>
	</body>
</html>
