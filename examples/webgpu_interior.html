		<script type="module">

			import * as THREE from 'three/webgpu';
			import { Fn, If, output, sample, pass, mrt, screenUV, normalView, velocity, vec3, vec4, packNormalToRGB, unpackRGBToNormal, colorSpaceToWorking, builtinAOContext, context, texture, uv, lightMapDiffuse, indirectDiffuse, indirectSpecular, environmentDiffuse, environmentSpecular, pmremTexture, metalness, roughness, diffuseColor, EnvironmentBRDF, getViewPosition, cameraWorldMatrix, convertToTexture, uniform, float, vec2, mix, property, emissive } from 'three/tsl';

			const models = {

				'Dual Rooms': 'dual-rooms.glb',
				'Cornell Box': 'cornell-box.glb',

				'Tennyson Bust': 'tennyson-bust.glb',
				'Steampunk Camera': 'steampunk_camera.glb',

				'Shader Ball 2': 'ShaderBall2.glb',
				'Shader Ball': 'ShaderBall.glb',
				'Rolex': 'rolex.glb',
				'Primitives Floor (Metallic Mirror)': 'primitives-floor-metallic-mirror.glb',

				'Primitives Floor (Color Dielectric)': 'primitives-floor-color-dielectric.glb',
				'Littlest Tokyo': 'LittlestTokyo.glb',

				'Damaged Helmet': 'DamagedHelmet/glTF/DamagedHelmet.gltf',
				'Anisotropy Barn Lamp': 'AnisotropyBarnLamp.glb',
				'Bath Day': 'bath_day.glb',
				'Carbon Frame Bike': 'CarbonFrameBike.glb',

			};

			// Capture points checked against each asset's floor plan. These scenes
			// are open/cutaway, so local coverage is useful but box projection is not.
			// Entries contain position, influence size, and blend distance.
			const reflectionLayouts = {
				'Dungeon Warkarma': {
					scale: 0.1,
					probes: [
						[[ - 7.5, 3, 3 ], [ 17, 7, 9 ], 1 ],
						[[ - 2.5, 1.7, - 4.5 ], [ 7, 4, 9 ], 0.7 ],
						[[ - 2.5, 1.7, - 10 ], [ 7, 4, 9 ], 0.7 ],
						[[ 2, 1.7, - 10 ], [ 7, 4, 9 ], 0.7 ],
						[[ 10, 2.8, - 12 ], [ 15, 7, 12 ], 1.5 ],
						[[ 11, 2.8, - 2 ], [ 8, 6, 10 ], 1 ],
						[[ 11, 2.8, 8 ], [ 8, 6, 10 ], 1 ],
						[[ 11, 1.7, 16 ], [ 8, 5, 8 ], 0.8 ]
					]
				},

				},

						[[ 0, 35, 0 ], [ 160, 150, 280 ], 40 ],
						[[ - 90, 35, - 90 ], [ 180, 150, 180 ], 40 ],
						[[ 90, 35, - 90 ], [ 180, 150, 180 ], 40 ],

					]
				},

						[[ 2.2, 0.8, 1.5 ], [ 7, 5, 8 ], 1.5 ]
					]
				}
			};

			const environments = {
				'Pedestrian Overpass (1K HDR)': 'equirectangular/pedestrian_overpass_1k.hdr',
				'752 HDRI Skies (1K HDR)': 'equirectangular/752-hdri-skies-com_1k.hdr',
				'Blouberg Sunrise (1K HDR)': 'equirectangular/blouberg_sunrise_2_1k.hdr',
				'Ferndale Studio (1K HDR)': 'equirectangular/ferndale_studio_04_1k.hdr',
				'Monochrome Studio (1K HDR)': 'equirectangular/monochrome_studio_02_1k.hdr',
				'Moonless Golf (2K Ultra HDR)': 'equirectangular/moonless_golf_2k.hdr.jpg',
				'Quarry (1K HDR)': 'equirectangular/quarry_01_1k.hdr',
				'Royal Esplanade (2K Ultra HDR)': 'equirectangular/royal_esplanade_2k.hdr.jpg',
				'San Giuseppe Bridge (2K HDR)': 'equirectangular/san_giuseppe_bridge_2k.hdr',
				'Spruit Sunrise (4K Ultra HDR)': 'equirectangular/spruit_sunrise_4k.hdr.jpg',
				'Venice Sunset (1K HDR)': 'equirectangular/venice_sunset_1k.hdr',
				'Ice Planet (Ultra HDR)': 'equirectangular/ice_planet_close.jpg',
				'Lobe (HDR)': 'equirectangular/lobe.hdr',
				'Spot 1 Lux (HDR)': 'equirectangular/spot1Lux.hdr',
				'PIZ Environment (1K EXR)': 'piz_compressed.exr',
				'Unit White': null
			};

			const loader = new GLTFLoader().setDRACOLoader( new DRACOLoader().setDecoderPath( DRACO_GLTF_CONFIG ) );

			const params = {
				output: 'Beauty',
				model: 'Dual Rooms',
				environmentSource: 'Pedestrian Overpass (1K HDR)',
				directLights: true,
				lightProbeDiffuse: false,
				diffuseBaking: true,
				environmentDiffuse: true,
				environmentSpecular: true,
				reflectionDiffuse: false,
				reflectionSpecular: true,
				aoType: 'GTAO + GTSO',
				samples: 16,
				radius: 0.4,
				resolutionScale: 0.5,
				scale: 0.3,
				thickness: 1,
				temporalFiltering: true
			};
			const samplingModes = [ 'Original', 'FAST Product', 'FAST Separate' ];
			const ssrSampling = uniform( 0, 'uint' );
			const ssgiSampling = uniform( 0, 'uint' );
			const diffuseSourceWeight = uniform( 1 );
			let noiseAtlases;
			const ssrParams = {
				sampling: 'FAST Separate',
				enabled: true,
				denoise: true,
				resolveOrder: 'Before filtering',
				resolutionScale: 1,
				quality: 1,
				maxDistance: 0.5,
				thickness: 0.01,
				intensity: 1,
				mirrorBias: 0.5,
				stepExponent: 3,
				binaryRefine: true,
				maxLuminance: 35,
				screenEdgeFade: 0.1,
				maxRoughness: 0.8,
				maxFrames: 16,
				radius: 1.5
			};
			// Candidate relative distances for these authored scenes, kept separate from
			// work-budget presets. Measurements can select different values later.
			const ssgiSceneCandidates = {
				'Dual Rooms': { radius: 0.25, thickness: 0.005 },
				'Cornell Box': { radius: 0.25, thickness: 0.005 }
			};
			const ssgiParams = {
				quality: 'Balanced',
				scenePreset: 'Baseline',
				sampling: 'Original',
				viewSpaceAzimuth: true,
				source: 'Diffuse + emission',
				enabled: true,
				denoise: true,
				resolutionScale: 0.5,
				sliceCount: 2,
				stepCount: 8,
				radius: 0.25,
				thickness: 0.01,
				intensity: 1,
				backfaceLighting: 0,
				maxLuminance: 35,
				maxFrames: 16,
				denoiseRadius: 1.5
			};
			const bakeSettings = {
				style: 'interleaved',
				bounces: 2,
				probeResolution: 40,
				lightMapResolution: 4096,
				resolution: 256,
				boxProjection: true
			};
			let camera, scene, renderer, controls, lightProbes, probes, model;
			let renderPipeline, scenePass, aoPass, traaPass;
			let prePass, ssrPass, ssrTemporal, ssrDenoise, ssrRadiance, ssrModulation;
			let ssrCoverage, ssrProvider, lightingHistory, diffuseHistory;
			let indirectSpecularRaw, indirectSpecularCoverage, indirectSpecularFiltered, ssrCoverageDenoise;
			let ssgiPass, ssgiDenoise, ssgiProvider;
			let diffuseProviders = [];
			let sceneScale = 1;
			let ssgiSceneMetadata = {};
			let ssgiModelScale = 1;
			let specularProviders = [];
			const currentView = new THREE.Matrix4();
			const currentProjection = new THREE.Matrix4();
			const currentProjectionInverse = new THREE.Matrix4();
			const historyValid = uniform( false );
			const previousView = uniform( new THREE.Matrix4() );
			const previousProjection = uniform( new THREE.Matrix4() );
			const previousProjectionInverse = uniform( new THREE.Matrix4() );
			const ssrMaxRoughness = uniform( ssrParams.maxRoughness );
			const debugWeight = uniform( 1 );
			const drawingSize = new THREE.Vector2();
			let lightMapper, atlas;
			let uvPass, uvTexture;
			let meshes = [];
			let bakingLightMap = false;
			let bakePhase = 'diffuse';
			let bakeIteration = 0;
			const bakeIterations = 16;
			const bakeSamples = 16;
			const status = document.getElementById( 'status' );
			let loadId = 0;
			let currentModel = params.model;
			let environmentLoadId = 0;
			let currentEnvironment = params.environmentSource;
			let captureNear = 0.05;
			let captureFar = 30;

			init();

			async function init() {

				// Camera

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 2.5, 16 );

				// Scene

				scene = new THREE.Scene();
				await updateEnvironment();

				// Renderer

				renderer = new THREE.WebGPURenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );
				await renderer.init();
				if ( renderer.backend.isWebGPUBackend !== true ) throw new Error( 'This example requires WebGPU.' );
				loader.setKTX2Loader( await new KTX2Loader().detectSupport( renderer ) );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.target.set( 0, 2.5, 0 );
				controls.update();

				uvTexture = await new THREE.TextureLoader().loadAsync( 'textures/uv_grid_opengl.jpg' );
				uvTexture.colorSpace = THREE.SRGBColorSpace;
				uvTexture.channel = 1;

				noiseAtlases = await Promise.all( [ 'product', 'separate05' ].map( async variant => {

					const atlas = await new THREE.TextureLoader().loadAsync( `textures/noises/fast/gauss1-ema01-${ variant }.png` );
					atlas.flipY = false;
					atlas.colorSpace = THREE.NoColorSpace;
					atlas.generateMipmaps = false;
					atlas.minFilter = atlas.magFilter = THREE.NearestFilter;
					return atlas;

				} ) );

				await loadModel();

				// Occlusion is evaluated from the main camera, after baking the probes.
				// Feed it into indirect lighting so direct lights retain their contribution.

				renderPipeline = new THREE.RenderPipeline( renderer );

				prePass = pass( scene, camera ).toInspector( 'Normal', ( inspectNode ) => colorSpaceToWorking( inspectNode, THREE.SRGBColorSpace ) );
				prePass.name = 'Pre-Pass';
				prePass.transparent = false;
				prePass.setMRT( mrt( {
					output: vec4( packNormalToRGB( normalView ), roughness ),
					albedo: vec4( diffuseColor.rgb, metalness ),
					velocity: velocity,
					fallback: Fn( builder => builder.context.indirectSpecularNode.sample() )()
				} ) );
				prePass.getTexture( 'output' ).type = THREE.UnsignedByteType;
				prePass.getTexture( 'albedo' ).type = THREE.UnsignedByteType;

				const prePassNormal = sample( ( uv ) => unpackRGBToNormal( prePass.getTextureNode().sample( uv ) ) );
				const prePassDepth = prePass.getTextureNode( 'depth' ).toInspector( 'Depth', () => prePass.getLinearDepthNode() );
				const prePassVelocity = prePass.getTextureNode( 'velocity' ).toInspector( 'Velocity' );

				scenePass = pass( scene, camera ).toInspector( 'Color' );
				setupSSR( prePassDepth, prePassNormal, prePassVelocity );
				setupSSGI( prePassDepth, prePassNormal, prePassVelocity );
				const onAfterRender = scene.onAfterRender;
				scene.onAfterRender = function ( render, sourceScene, sourceCamera, ...args ) {

					onAfterRender.call( this, render, sourceScene, sourceCamera, ...args );
					if ( sourceCamera === camera ) {

						currentView.copy( camera.matrixWorldInverse );
						currentProjection.copy( camera.projectionMatrix );
						currentProjectionInverse.copy( camera.projectionMatrixInverse );

					}

				};

				// Resolve the same ordered chains used by the beauty materials. Alpha
				// measures validity, independent of brightness and AO.
				const coverage = Fn( ( builder ) => {

					if ( ! builder.geometry.hasAttribute( 'uv1' ) ) return vec4( 0 );
					return vec4( builder.context.indirectDiffuseNode.sample().a, builder.context.indirectSpecularNode.sample().a, 0, 1 );

				} );
				// This source excludes camera-dependent specular. totalDiffuse is the
				// lighting model's direct + indirect diffuse outgoing radiance.
				const diffuseSource = Fn( builder => supportsUnlayeredDiffuse( builder.material )
					? vec4( property( 'vec3', 'totalDiffuse' ).add( emissive ).max( 0 ), 1 )
					: output );
				scenePass.setMRT( mrt( { output, coverage: coverage(), diffuseSource: diffuseSource() } ) );
				const uvMaterial = new THREE.MeshBasicNodeMaterial( { map: uvTexture } );
				uvPass = pass( scene, camera );
				uvPass.overrideMaterial = uvMaterial;
				uvPass.contextNode = context( { getAO: null, getSpecularOcclusion: null } );
				aoPass = ao( prePassDepth, prePassNormal, camera ).toInspector( 'GTAO', ( inspectNode ) => inspectNode.r );
				traaPass = traa( scenePass, prePassDepth, prePassVelocity, camera );
				traaPass.useSubpixelCorrection = false;
				updateAOParameters();
				updateSSRParameters();
				updateSSGIParameters();
				configureIndirectLighting();
				updateAO();

				const settings = renderer.inspector.createParameters( 'Interior' );
				settings.add( params, 'output', [ 'Beauty', 'Diffuse Coverage', 'Spec Coverage', 'SSGI Raw', 'SSGI Filtered', 'SSGI Coverage', 'SSGI Filtered Coverage', 'SSR Raw', 'SSR Filtered', 'SSR Coverage', 'SSR Filtered Coverage', 'Indirect Specular Raw', 'Indirect Specular Filtered', 'AO', 'UV Unwrap' ] ).name( 'Output' ).info( 'SSR Raw and Filtered show incoming radiance times coverage, before material BRDF weighting.' ).onChange( updateOutput );
				settings.add( params, 'model', Object.keys( models ) ).name( 'Model' ).listen().onChange( loadModel );
				settings.add( params, 'environmentSource', Object.keys( environments ) ).name( 'Environment Source' ).listen().onChange( updateEnvironment );
				settings.add( params, 'directLights' ).name( 'Direct Lights' ).onChange( updateDirectLights );
				const indirectDiffuseSettings = settings.addFolder( 'Indirect Diffuse' );
				indirectDiffuseSettings.add( ssgiParams, 'enabled' ).name( 'SSGI' ).onChange( updateIndirectLighting );
				indirectDiffuseSettings.add( params, 'lightProbeDiffuse' ).name( 'Light Probes' ).onChange( updateIndirectLighting );
				indirectDiffuseSettings.add( params, 'diffuseBaking' ).name( 'Diffuse Lightmaps' ).onChange( updateIndirectLighting );
				indirectDiffuseSettings.add( params, 'reflectionDiffuse' ).name( 'Reflection Probes' ).onChange( updateIndirectLighting );
				indirectDiffuseSettings.add( params, 'environmentDiffuse' ).name( 'Environment Map' ).onChange( updateIndirectLighting );
				const indirectSpecularSettings = settings.addFolder( 'Indirect Specular' );
				indirectSpecularSettings.add( ssrParams, 'enabled' ).name( 'SSR' ).onChange( updateIndirectLighting );
				indirectSpecularSettings.add( params, 'reflectionSpecular' ).name( 'Reflection Probes' ).onChange( updateIndirectLighting );
				indirectSpecularSettings.add( params, 'environmentSpecular' ).name( 'Environment Map' ).onChange( updateIndirectLighting );
				const ssgiSettings = settings.addFolder( 'SSGI Settings' ).close();
				ssgiSettings.add( ssgiParams, 'viewSpaceAzimuth' ).name( 'View Azimuth' ).onChange( updateSSGIParameters );
				ssgiSettings.add( ssgiParams, 'quality', Object.keys( SSGI_QUALITY_PRESETS ) ).name( 'Quality Preset' ).onChange( value => {

					updateSSGIParameters();

				} );
				ssgiSettings.add( ssgiParams, 'scenePreset', [ 'Baseline', 'Thinner Candidate' ] ).name( 'Scene Preset' ).onChange( () => {

					applySSGIScenePreset( params.model );
					updateSSGIParameters();

				} );
				ssgiSettings.add( ssgiParams, 'source', [ 'Beauty', 'Diffuse + emission' ] ).name( 'Source radiance' ).onChange( updateSSGIParameters );
				ssgiSettings.add( ssgiParams, 'sampling', samplingModes ).name( 'Sampling' ).onChange( updateSSGIParameters );
				ssgiSettings.add( ssgiParams, 'denoise' ).name( 'Denoise' ).onChange( updateIndirectLighting );
				ssgiSettings.add( ssgiParams, 'resolutionScale', 0.25, 1, 0.25 ).name( 'Resolution' ).onChange( updateSSGIParameters );
				ssgiSettings.add( ssgiParams, 'sliceCount', 1, 8, 1 ).name( 'Slices' ).onChange( updateSSGIParameters );
				ssgiSettings.add( ssgiParams, 'stepCount', 2, 32, 1 ).name( 'Steps' ).onChange( updateSSGIParameters );
				ssgiSettings.add( ssgiParams, 'radius', 0.01, 1 ).listen().name( 'Relative Radius' ).info( 'Fraction of the scene bounding-box diagonal.' ).onChange( updateSSGIParameters );
				ssgiSettings.add( ssgiParams, 'thickness', 0.0001, 0.05 ).listen().name( 'Relative Thickness' ).info( 'Fraction of the scene bounding-box diagonal.' ).onChange( updateSSGIParameters );
				ssgiSettings.add( ssgiParams, 'intensity', 0, 2 ).name( 'Intensity' ).onChange( updateSSGIParameters );
				ssgiSettings.add( ssgiParams, 'backfaceLighting', 0, 1 ).name( 'Backface Lighting' ).onChange( updateSSGIParameters );
				ssgiSettings.add( ssgiParams, 'maxLuminance', 1, 100 ).name( 'Max Luminance' ).onChange( updateSSGIParameters );
				ssgiSettings.add( ssgiParams, 'maxFrames', 1, 32, 1 ).name( 'History Frames' ).onChange( updateSSGIParameters );
				ssgiSettings.add( ssgiParams, 'denoiseRadius', 0, 3 ).name( 'Denoise Radius' ).onChange( updateSSGIParameters );
				const ssrSettings = settings.addFolder( 'SSR Settings' ).close();
				ssrSettings.add( ssrParams, 'resolveOrder', [ 'Before filtering', 'After filtering (coverage-aware)' ] ).name( 'Resolve Fallback' ).info( 'Before: filter combined reflections. After: filter SSR radiance and coverage, then resolve probes/environment.' ).onChange( updateIndirectLighting );
				ssrSettings.add( ssrParams, 'sampling', samplingModes ).name( 'Sampling' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'denoise' ).name( 'Denoise' ).onChange( updateIndirectLighting );
				ssrSettings.add( ssrParams, 'resolutionScale', 0.25, 1, 0.25 ).name( 'Resolution' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'quality', 0.05, 1 ).name( 'Quality' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'maxDistance', 0.01, 2 ).name( 'Relative Max Distance' ).info( 'Fraction of the scene bounding-box diagonal.' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'thickness', 0.0001, 0.02 ).name( 'Relative Thickness' ).info( 'Fraction of the scene bounding-box diagonal.' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'intensity', 0, 2 ).name( 'Intensity' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'mirrorBias', 0, 1 ).name( 'Mirror Bias' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'stepExponent', 1, 4, 1 ).name( 'Step Exponent' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'binaryRefine' ).name( 'Binary Refine' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'maxLuminance', 1, 100 ).name( 'Max Luminance' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'screenEdgeFade', 0, 0.5 ).name( 'Edge Fade' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'maxRoughness', 0.1, 0.95 ).name( 'Max Roughness' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'maxFrames', 1, 32, 1 ).name( 'History Frames' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'radius', 0, 3 ).name( 'Denoise Radius' ).onChange( updateSSRParameters );

				settings.add( bakeSettings, 'style', [ 'interleaved', 'sequential' ] ).name( 'Bake Style' ).onChange( capture );
				settings.add( bakeSettings, 'boxProjection' ).name( 'Box Projection' ).listen().onChange( () => {

					probes.boxProjection = bakeSettings.boxProjection;
					capture();

				lightProbes.position.copy( center );
				lightProbes.visibility = true;
				lightProbes.multiBounce = true;
				scene.add( lightProbes );

				// Capture the surrounding space: an object bounding box is not a room.

				probes = new ReflectionProbes();
				probes.boxProjection = bakeSettings.boxProjection;

				let probeSetup = [ { position: center.toArray(), influenceSize: fullSize.toArray(), projectionSize: fullSize.toArray() } ];

				if ( params.model === 'Dual Rooms' ) {

					const roomBounds = new THREE.Box3().setFromObject( model.getObjectByName( 'room' ) );
					const dividerBounds = new THREE.Box3().setFromObject( model.getObjectByName( 'dividerLeft' ) );
					const blendDistance = dividerBounds.max.x - dividerBounds.min.x;
					const leftBounds = roomBounds.clone();
					const rightBounds = roomBounds.clone();
					leftBounds.max.x = dividerBounds.min.x;
					rightBounds.min.x = dividerBounds.max.x;

					probeSetup = [ leftBounds, rightBounds ].map( ( room ) => {

						const roomSize = room.getSize( new THREE.Vector3() ).toArray();
						return { position: room.getCenter( new THREE.Vector3() ).toArray(), influenceSize: roomSize, projectionSize: roomSize, blendDistance };

					} );
					// Extend the doorway into the floor, lintel and jambs, keeping its depth.
					probeSetup.push( { position: [ 0, 1.9, 0 ], influenceSize: [ 2.4, 3.8, 2.5 ], projectionSize: [ 16, 5, 8 ], projectionOffset: [ 0, 0.6, 0 ], influenceExpansion: [ 0, 1, 1 ] } );

				}

				const environmentOnly = [ 'Tennyson Bust', 'Shader Ball', 'Shader Ball 2', 'Rolex', 'Littlest Tokyo', 'Damaged Helmet', 'Anisotropy Barn Lamp', 'Carbon Frame Bike' ];
				const localLayout = reflectionLayouts[ name ];
				const openFloor = name.startsWith( 'Primitives Floor' ) || name === 'Stripped Emissive Mirror Floor';
				bakeSettings.boxProjection = ! environmentOnly.includes( name ) && name !== 'Steampunk Camera' && ! openFloor && name !== 'Museum' && ! localLayout;
				probes.boxProjection = bakeSettings.boxProjection;

				if ( environmentOnly.includes( name ) ) {

					probeSetup = [];

				} else if ( localLayout ) {

					const scale = localLayout.scale ?? 1;
					probeSetup = localLayout.probes.map( ( [ position, influenceSize, blendDistance ] ) => ( {
						position: position.map( value => value * scale ),
						influenceSize: influenceSize.map( value => value * scale ),
						projectionSize: influenceSize.map( value => value * scale ),
						blendDistance: blendDistance * scale,
						// Layout sizes already include overlap; preserve room-local coverage.
						influenceExpansion: [ 0, 0, 0 ]
					} ) );

				} else if ( name === 'Steampunk Camera' || openFloor ) {

					// Capture outside the camera body, or above the floor near its corners.
					const offsets = openFloor ? [[ - 0.35, - 0.35 ], [ 0.35, - 0.35 ], [ - 0.35, 0.35 ], [ 0.35, 0.35 ]] : [[ - 0.65, 0 ], [ 0.65, 0 ], [ 0, - 0.65 ], [ 0, 0.65 ]];
					probeSetup = offsets.map( ( [ x, z ] ) => {

						const position = center.clone().add( new THREE.Vector3( x * fullSize.x, 0, z * fullSize.z ) );
						if ( openFloor ) position.y = bounds.min.y + fullSize.y * 0.65;
						const influenceSize = fullSize.clone().multiplyScalar( 1.5 );
						return { position: position.toArray(), influenceSize: influenceSize.toArray(), projectionSize: fullSize.toArray(), blendDistance: Math.max( fullSize.x, fullSize.z ) * 0.75 };

					} );

				} else if ( name === 'Space Ship Hallway' || name === 'Museum' ) {

					// The hallway runs along Z. The museum is an open gallery with two walls.
					const axis = name === 'Space Ship Hallway' || fullSize.z > fullSize.x ? 'z' : 'x';
					probeSetup = [ - 1 / 3, 0, 1 / 3 ].map( offset => {

						const position = center.clone();
						position[ axis ] += fullSize[ axis ] * offset;
						const influenceSize = fullSize.clone();
						influenceSize[ axis ] *= 0.5;
						return { position: position.toArray(), influenceSize: influenceSize.toArray(), projectionSize: fullSize.toArray(), projectionOffset: center.clone().sub( position ).toArray(), blendDistance: fullSize[ axis ] / 12 };

					} );

				}

				for ( const setup of probeSetup ) {

					const probe = new ReflectionProbe( ...setup.influenceSize );
					if ( setup.blendDistance !== undefined ) probe.blendDistance = setup.blendDistance;
					// Extend the selected faces by the fade distance for full influence at walls.
					probe.influenceSize.addScaledVector( new THREE.Vector3( ... ( setup.influenceExpansion ?? [ 1, 1, 1 ] ) ), 2 * probe.blendDistance );
					probe.position.set( ...setup.position );
					probe.projectionSize = new THREE.Vector3( ...setup.projectionSize );
					if ( setup.projectionOffset ) probe.projectionOffset.set( ...setup.projectionOffset );
					probes.add( probe );

				}

				scene.add( probes );

				capture();
				currentModel = name;

			}

			function expandInstances( root ) {

				// The atlas baker needs one static mesh per instance, with its own UVs.
				const instances = [];
				root.traverse( object => {

					if ( object.isInstancedMesh ) instances.push( object );

				} );
				for ( const object of instances ) {

					if ( object.matrixAutoUpdate ) object.updateMatrix();
					const group = new THREE.Group();
					group.name = object.name;
					group.matrix.copy( object.matrix );
					group.matrixAutoUpdate = false;
					group.visible = object.visible;
					group.layers.mask = object.layers.mask;
					for ( let i = 0; i < object.count; i ++ ) {

						const mesh = new THREE.Mesh( object.geometry, object.material );
						mesh.name = `${ object.name }_${ i }`;
						object.getMatrixAt( i, mesh.matrix );
						mesh.matrixAutoUpdate = false;
						if ( object.instanceColor !== null ) {

							const color = new THREE.Color();
							object.getColorAt( i, color );
							const tint = material => {

								const result = material.clone();
								result.color.multiply( color );
								return result;

							};

							mesh.material = Array.isArray( object.material ) ? object.material.map( tint ) : tint( object.material );

						}

						if ( object.morphTexture !== null ) object.getMorphAt( i, mesh );
						group.add( mesh );

					}

					if ( object.children.length > 0 ) group.add( ...object.children );
					object.parent.add( group );
					object.removeFromParent();
					object.dispose();

				}

			}

			function disposeModel( model ) {

				const resources = new Set();
				model.traverse( ( object ) => {

					if ( object.geometry ) resources.add( object.geometry );
					if ( object.shadow ) resources.add( object.shadow );
					const materials = Array.isArray( object.material ) ? object.material : [ object.material ];
					for ( const material of materials ) {

						if ( ! material ) continue;
						resources.add( material );
						for ( const value of Object.values( material ) ) {

							if ( value && value.isTexture ) resources.add( value );

						}

					}

				} );
				for ( const resource of resources ) resource.dispose();

			}

			function setModelCamera( gltf ) {

				const source = gltf.cameras[ 0 ];
				const bounds = new THREE.Box3().setFromObject( model );
				const center = bounds.getCenter( new THREE.Vector3() );

				// Clear any orbit damping left over from the previous scene.
				const damping = controls.enableDamping;
				controls.enableDamping = false;
				controls.update();

				if ( source ) {

					source.getWorldPosition( camera.position );
					source.getWorldQuaternion( camera.quaternion );
					camera.fov = source.fov;
					camera.near = source.near;
					camera.far = source.far;
					controls.target.copy( camera.position ).addScaledVector( camera.getWorldDirection( new THREE.Vector3() ), camera.position.distanceTo( center ) );

				} else {

					controls.target.copy( center );
					camera.position.copy( center ).add( new THREE.Vector3( 1, 0.6, 1 ).multiplyScalar( bounds.getSize( new THREE.Vector3() ).length() ) );

				}

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				controls.update();
				controls.saveState();
				controls.enableDamping = damping;

			}

			function updateDirectLights() {

				model.traverse( object => {

					if ( object.isLight ) object.visible = params.directLights;

				} );
				if ( traaPass ) traaPass.setSize( 1, 1 );
				resetScreenSpaceLighting();

			}

			function updateIndirectLighting() {

				updateSSRProvider();
				updateSSGIProvider();
				configureIndirectLighting();
				resetScreenSpaceLighting();
				traaPass.setSize( 1, 1 );

			}

			function configureIndirectLighting() {

				lightProbes.visible = params.lightProbeDiffuse;
				diffuseProviders = [];
				if ( params.lightProbeDiffuse ) {

					diffuseProviders.push( lightProbeGridDiffuse( lightProbes ) );

				}

				specularProviders = params.reflectionSpecular && probes.texture ? [ reflectionProbesSpecular( probes ) ] : [];
				if ( lightMapper && params.diffuseBaking ) {

					// Keep material.lightMap independent: this atlas is supplied exactly once.
					diffuseProviders.push( lightMapDiffuse( texture( lightMapper.texture, uv( 1 ) ) ) );

				}

				if ( params.reflectionDiffuse && probes.texture ) {

					diffuseProviders.push( reflectionProbesDiffuse( probes ) );

				}

				if ( scene.environment ) {

					const environment = pmremTexture( scene.environment );
					// Environment illumination is already baked into the atlas. Optional
					// fallback is an alternative for uncovered surfaces, not another sum.
					if ( params.environmentDiffuse ) diffuseProviders.push( environmentDiffuse( environment ) );
					if ( params.environmentSpecular ) specularProviders.push( environmentSpecular( environment ) );

				}

				renderer.contextNode = context( {
					...renderer.contextNode.value,
					indirectDiffuseNode: indirectDiffuse( diffuseProviders ),
					indirectSpecularNode: indirectSpecular( specularProviders )
				} );
				if ( prePass ) {

					// Nested pass updates can run while the beauty context is active.
					// Explicitly pin the pre-pass to the camera-independent fallback chain.
					prePass.contextNode = context( { ...renderer.contextNode.value, getAO: null, getSpecularOcclusion: null } );
					prePass.needsUpdate = true;
					updateAO();

				}

			}

			function prepareAtlas() {

				if ( atlas && atlas.resolution === Number( bakeSettings.lightMapResolution ) ) return;
				const geometries = new Set();
				model.traverse( object => {

					if ( object.isMesh ) geometries.add( object.geometry );

				} );
				let nextAtlas = null;
				// Preserve chart gutters when a selected model needs a larger atlas.
				for ( let resolution = Number( bakeSettings.lightMapResolution ); resolution <= 4096 && ! nextAtlas; resolution *= 2 ) {

					nextAtlas = unwrapUVs( model, { resolution, padding: 3 } );

				}

				if ( ! nextAtlas ) throw new Error( 'The scene does not fit in the light-map atlas.' );
				bakeSettings.lightMapResolution = nextAtlas.resolution;
				atlas = nextAtlas;
				meshes = atlas.meshes.map( record => record.mesh );
				for ( const geometry of geometries ) geometry.dispose();

			}

			function getBakeDiffuse() {

				const providers = [ lightProbeGridDiffuse( lightProbes ) ];
				if ( scene.environment ) providers.push( environmentDiffuse( pmremTexture( scene.environment ) ) );
				return indirectDiffuse( providers );

			}

			function capture() {

				if ( ! model || ! lightProbes || ! probes ) return;

				prepareAtlas();
				// A fresh bake must not inherit lighting from a previous scene or environment.
				probes.dispose();
				lightMapper?.dispose();
				lightMapper = null;
				bakeIteration = 0;
				bakePhase = 'diffuse';
				bakingLightMap = true;
				configureIndirectLighting();
				status.textContent = `Baking (${ bakeSettings.style }): starting`;
				resetScreenSpaceLighting();

			}

			function advanceBake() {

				const interleaved = bakeSettings.style === 'interleaved';
				const environmentNode = scene.environmentNode;
				const rendererContext = renderer.contextNode;
				const lightProbesVisible = lightProbes.visible;
				const lightStates = [];
				model.traverse( object => {

					if ( object.isLight ) {

						lightStates.push( [ object, object.visible ] );
						object.visible = true;

					}

				} );
				scene.environmentNode = null;
				let providersChanged = false;

				try {

					// Captures use world-space transport only, independent of display toggles.
					const hasReflectionProbes = probes.children.length > 0;
					const specularProviders = interleaved && probes.texture ? [ reflectionProbesSpecular( probes ) ] : [];
					if ( ! hasReflectionProbes && scene.environment ) specularProviders.push( environmentSpecular( pmremTexture( scene.environment ) ) );
					const specular = indirectSpecular( specularProviders );
					renderer.contextNode = context( {
						...rendererContext.value,
						getGI: null, getAO: null, getSpecularOcclusion: null,
						indirectDiffuseNode: indirectDiffuse( [] ),
						indirectSpecularNode: specular
					} );

					if ( bakePhase === 'diffuse' ) {

						lightProbes.bake( renderer, scene, {
							cubemapSize: Number( bakeSettings.probeResolution ), near: captureNear, far: captureFar,
							bounces: interleaved ? 0 : bakeSettings.bounces,
							pass: interleaved ? bakeIteration : 0,
							indirectSpecularNode: specular
						} );

						if ( lightMapper === null ) {

							lightMapper = new LightMapper( renderer, atlas.resolution, getBakeDiffuse() );
							lightMapper.addObjects( meshes );
							providersChanged = true;

						}

						// Each grid pass replaces the previous transport solution. Do not average
						// older, darker bounce solutions into the new irradiance atlas.
						lightProbes.visible = true;
						lightMapper.reset();
						lightMapper.update( interleaved && bakeIteration === bakeIterations - 1 ? bakeSamples : 1 );
						status.textContent = interleaved ? `Interleaved: diffuse ${ bakeIteration + 1 } / ${ bakeIterations }` : `Sequential: diffuse light map ${ lightMapper.samples } / ${ bakeSamples }`;
						bakePhase = interleaved ? 'reflection' : 'lightmap';
						if ( interleaved && ! hasReflectionProbes ) {

							bakeIteration ++;
							bakePhase = 'diffuse';
							bakingLightMap = bakeIteration < bakeIterations;
							if ( ! bakingLightMap ) status.textContent += ' — complete (HDR reflections)';

						}

					} else if ( bakePhase === 'lightmap' ) {

						lightProbes.visible = true;
						lightMapper.update();
						status.textContent = `Sequential: diffuse light map ${ lightMapper.samples } / ${ bakeSamples }`;
						if ( lightMapper.samples >= bakeSamples ) {

							bakePhase = 'reflection';
							if ( ! hasReflectionProbes ) {

								bakingLightMap = false;
								status.textContent = 'Sequential bake complete (HDR reflections)';

							}

						}

					} else {

						// Diffuse and specular are separate lobes. Reflections shade captured
						// surfaces; they are never added a second time as diffuse irradiance.
						const diffuse = [ lightMapDiffuse( texture( lightMapper.texture, uv( 1 ) ) ) ];
						if ( interleaved ) {

							diffuse.push( lightProbeGridDiffuse( lightProbes ) );

						} else if ( scene.environment ) {

							diffuse.push( environmentDiffuse( pmremTexture( scene.environment ) ) );

						}

						lightProbes.visible = interleaved;
						renderer.contextNode = context( { ...renderer.contextNode.value, indirectDiffuseNode: indirectDiffuse( diffuse ) } );
						providersChanged = probes.texture === null;
						probes.bake( renderer, scene, {
							resolution: Number( bakeSettings.resolution ), near: captureNear, far: captureFar,
							usePrevious: interleaved
						} );
						bakeIteration ++;
						bakingLightMap = interleaved && bakeIteration < bakeIterations;
						bakePhase = 'diffuse';
						status.textContent = interleaved ? `Interleaved: reflection ${ bakeIteration } / ${ bakeIterations }${ bakingLightMap ? '' : ' — complete' }` : 'Sequential bake complete';

					}

				} catch ( error ) {

					bakingLightMap = false;
					status.textContent = 'Bake failed (see console)';
					throw error;

				} finally {

					scene.environmentNode = environmentNode;
					for ( const [ light, visible ] of lightStates ) light.visible = visible;
					lightProbes.visible = lightProbesVisible;
					renderer.contextNode = rendererContext;
					if ( providersChanged ) configureIndirectLighting();
					if ( traaPass ) traaPass.setSize( 1, 1 );
					resetScreenSpaceLighting();

				}

			}

		</script>
	</body>
