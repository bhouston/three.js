<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - interior</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>
		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>
			<div class="title-wrapper"><a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Interior</span></div>
			<small>Baked Light Probe light maps, SSR, box-projected reflections and GTAO / GTSO with selectable scenes.<br />Scene by <a href="https://ben3d.ca" target="_blank" rel="noopener">Ben Houston</a><br /><span id="status"></span></small>
		</div>
		<script type="importmap">
			{
				"imports": {
					"three": "../src/Three.WebGPU.js",
					"three/webgpu": "../src/Three.WebGPU.js",
					"three/tsl": "../src/Three.TSL.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>
		<script type="module">

			import * as THREE from 'three/webgpu';
			import { Fn, output, sample, pass, mrt, screenUV, normalView, velocity, vec3, vec4, packNormalToRGB, unpackRGBToNormal, colorSpaceToWorking, builtinAOContext, context, texture, uv, lightMapDiffuse, indirectDiffuse, indirectSpecular, environmentDiffuse, environmentSpecular, pmremTexture, metalness, roughness, diffuseColor, EnvironmentBRDF, getViewPosition, cameraWorldMatrix, convertToTexture, uniform, float, vec2, mix } from 'three/tsl';
			import { ao } from 'three/addons/tsl/display/GTAONode.js';
			import { ssr } from 'three/addons/tsl/display/SSRNode.js';
			import { temporalReproject } from 'three/addons/tsl/display/TemporalReprojectNode.js';
			import { coverageDenoise } from 'three/addons/tsl/display/CoverageDenoiseNode.js';
			import { recurrentDenoise, demodulate } from 'three/addons/tsl/display/RecurrentDenoiseNode.js';
			import { traa } from 'three/addons/tsl/display/TRAANode.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { LightMapper } from 'three/addons/lighting/LightMapper.js';
			import { unwrapUVs } from 'three/addons/utils/unwrapUVs.js';
			import { LightProbeGrid } from 'three/addons/lighting/LightProbeGrid.js';
			import { ReflectionProbe, ReflectionProbes } from 'three/addons/lighting/ReflectionProbes.js';
			import { reflectionProbesDiffuse, reflectionProbesSpecular } from 'three/addons/tsl/lighting/ReflectionProbesNode.js';
			import { lightProbeGridDiffuse } from 'three/addons/tsl/lighting/LightProbeGridNode.js';

			const models = {
				'Museum': 'museum.glb',
				'Dual Rooms': 'dual-rooms.glb',
				'Cornell Box': 'cornell-box.glb',
				'Cornell Box (Oblique)': 'cornell-box-oblique.glb',
				'Cornell Box (Metallic Sphere)': 'cornell-box-metallic-sphere.glb',
				'Cornell Box (Mirror Wall)': 'cornell-box-mirror-wall.glb'
			};

			const params = {
				output: 'Beauty',
				model: 'Dual Rooms',
				environmentSource: 'HDR',
				directLights: true,
				lightProbeDiffuse: false,
				diffuseBaking: true,
				environmentDiffuse: true,
				environmentSpecular: true,
				reflectionDiffuse: false,
				reflectionSpecular: true,
				aoType: 'GTAO + GTSO',
				samples: 16,
				radius: 0.4,
				resolutionScale: 0.5,
				scale: 0.3,
				thickness: 1,
				temporalFiltering: true
			};
			const ssrParams = {
				enabled: true,
				denoise: true,
				resolveOrder: 'Before filtering',
				resolutionScale: 1,
				quality: 1,
				maxDistance: 0.5,
				thickness: 0.0035,
				intensity: 1,
				mirrorBias: 0.5,
				stepExponent: 3,
				binaryRefine: true,
				maxLuminance: 35,
				screenEdgeFade: 0.1,
				maxRoughness: 0.8,
				maxFrames: 16,
				radius: 1.5
			};
			const bakeSettings = {
				bounces: 2,
				probeResolution: 32,
				lightMapResolution: 4096,
				resolution: 256,
				boxProjection: true
			};
			let camera, scene, renderer, controls, lightProbes, probes, model;
			let renderPipeline, scenePass, aoPass, traaPass;
			let prePass, ssrPass, ssrTemporal, ssrDenoise, ssrRadiance, ssrModulation;
			let ssrCoverage, ssrProvider, ssrHistory;
			let indirectSpecularRaw, indirectSpecularCoverage, indirectSpecularFiltered, ssrCoverageDenoise;
			let sceneScale = 1;
			let specularProviders = [];
			const currentView = new THREE.Matrix4();
			const currentProjection = new THREE.Matrix4();
			const currentProjectionInverse = new THREE.Matrix4();
			const historyValid = uniform( false );
			const previousView = uniform( new THREE.Matrix4() );
			const previousProjection = uniform( new THREE.Matrix4() );
			const previousProjectionInverse = uniform( new THREE.Matrix4() );
			const ssrMaxRoughness = uniform( ssrParams.maxRoughness );
			const debugWeight = uniform( 1 );
			const drawingSize = new THREE.Vector2();
			let lightMapper, atlas;
			let uvPass, uvTexture;
			let meshes = [];
			let bakingLightMap = false;
			const bakeSamples = 16;
			const status = document.getElementById( 'status' );
			let loadId = 0;
			let currentModel = params.model;
			let captureFar = 30;

			init();

			async function init() {

				// Camera

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 2.5, 16 );

				// Scene

				scene = new THREE.Scene();
				const environment = await new HDRLoader().loadAsync( 'textures/equirectangular/pedestrian_overpass_1k.hdr' );
				environment.mapping = THREE.EquirectangularReflectionMapping;
				scene.environment = environment;
				scene.background = environment;

				// Renderer

				renderer = new THREE.WebGPURenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );
				await renderer.init();
				if ( renderer.backend.isWebGPUBackend !== true ) throw new Error( 'This example requires WebGPU.' );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.target.set( 0, 2.5, 0 );
				controls.update();

				uvTexture = await new THREE.TextureLoader().loadAsync( 'textures/uv_grid_opengl.jpg' );
				uvTexture.colorSpace = THREE.SRGBColorSpace;
				uvTexture.channel = 1;

				await loadModel();

				// Occlusion is evaluated from the main camera, after baking the probes.
				// Feed it into indirect lighting so direct lights retain their contribution.

				renderPipeline = new THREE.RenderPipeline( renderer );

				prePass = pass( scene, camera ).toInspector( 'Normal', ( inspectNode ) => colorSpaceToWorking( inspectNode, THREE.SRGBColorSpace ) );
				prePass.name = 'Pre-Pass';
				prePass.transparent = false;
				prePass.setMRT( mrt( {
					output: vec4( packNormalToRGB( normalView ), roughness ),
					albedo: vec4( diffuseColor.rgb, metalness ),
					velocity: velocity,
					fallback: Fn( builder => builder.context.indirectSpecularNode.sample() )()
				} ) );
				prePass.getTexture( 'output' ).type = THREE.UnsignedByteType;
				prePass.getTexture( 'albedo' ).type = THREE.UnsignedByteType;

				const prePassNormal = sample( ( uv ) => unpackRGBToNormal( prePass.getTextureNode().sample( uv ) ) );
				const prePassDepth = prePass.getTextureNode( 'depth' ).toInspector( 'Depth', () => prePass.getLinearDepthNode() );
				const prePassVelocity = prePass.getTextureNode( 'velocity' ).toInspector( 'Velocity' );

				scenePass = pass( scene, camera ).toInspector( 'Color' );
				setupSSR( prePassDepth, prePassNormal, prePassVelocity );
				const onAfterRender = scene.onAfterRender;
				scene.onAfterRender = function ( render, sourceScene, sourceCamera, ...args ) {

					onAfterRender.call( this, render, sourceScene, sourceCamera, ...args );
					if ( sourceCamera === camera ) {

						currentView.copy( camera.matrixWorldInverse );
						currentProjection.copy( camera.projectionMatrix );
						currentProjectionInverse.copy( camera.projectionMatrixInverse );

					}

				};

				// Resolve the same ordered chains used by the beauty materials. Alpha
				// measures validity, independent of brightness and AO.
				const coverage = Fn( ( builder ) => {

					if ( ! builder.geometry.hasAttribute( 'uv1' ) ) return vec4( 0 );
					return vec4( builder.context.indirectDiffuseNode.sample().a, builder.context.indirectSpecularNode.sample().a, 0, 1 );

				} );
				scenePass.setMRT( mrt( { output, coverage: coverage() } ) );
				const uvMaterial = new THREE.MeshBasicNodeMaterial( { map: uvTexture } );
				uvPass = pass( scene, camera );
				uvPass.overrideMaterial = uvMaterial;
				uvPass.contextNode = context( { getAO: null, getSpecularOcclusion: null } );
				aoPass = ao( prePassDepth, prePassNormal, camera ).toInspector( 'GTAO', ( inspectNode ) => inspectNode.r );
				traaPass = traa( scenePass, prePassDepth, prePassVelocity, camera );
				traaPass.useSubpixelCorrection = false;
				updateAOParameters();
				updateSSRParameters();
				configureIndirectLighting();
				updateAO();

				const settings = renderer.inspector.createParameters( 'Interior' );
				settings.add( params, 'output', [ 'Beauty', 'Diffuse Coverage', 'Spec Coverage', 'SSR Raw', 'SSR Filtered', 'SSR Coverage', 'SSR Filtered Coverage', 'Indirect Specular Raw', 'Indirect Specular Filtered', 'AO', 'UV Unwrap' ] ).name( 'Output' ).onChange( updateOutput );
				settings.add( params, 'model', Object.keys( models ) ).name( 'Model' ).listen().onChange( loadModel );
				settings.add( params, 'directLights' ).name( 'Direct Lights' ).onChange( updateDirectLights );
				const indirectDiffuseSettings = settings.addFolder( 'Indirect Diffuse' );
				indirectDiffuseSettings.add( params, 'lightProbeDiffuse' ).name( 'Light Probes' ).onChange( updateIndirectLighting );
				indirectDiffuseSettings.add( params, 'diffuseBaking' ).name( 'Diffuse Lightmaps' ).onChange( updateIndirectLighting );
				indirectDiffuseSettings.add( params, 'reflectionDiffuse' ).name( 'Reflection Probes' ).onChange( updateIndirectLighting );
				indirectDiffuseSettings.add( params, 'environmentDiffuse' ).name( 'Environment Map' ).onChange( updateIndirectLighting );
				const indirectSpecularSettings = settings.addFolder( 'Indirect Specular' );
				indirectSpecularSettings.add( ssrParams, 'enabled' ).name( 'SSR' ).onChange( updateIndirectLighting );
				indirectSpecularSettings.add( params, 'reflectionSpecular' ).name( 'Reflection Probes' ).onChange( updateIndirectLighting );
				indirectSpecularSettings.add( params, 'environmentSpecular' ).name( 'Environment Map' ).onChange( updateIndirectLighting );
				const ssrSettings = settings.addFolder( 'SSR Settings' ).close();
				ssrSettings.add( ssrParams, 'resolveOrder', [ 'Before filtering', 'After filtering (coverage-aware)' ] ).name( 'Resolve Fallback' ).info( 'Before: filter combined reflections. After: filter SSR radiance and coverage, then resolve probes/environment.' ).onChange( updateIndirectLighting );
				ssrSettings.add( ssrParams, 'denoise' ).name( 'Denoise' ).onChange( updateIndirectLighting );
				ssrSettings.add( ssrParams, 'resolutionScale', 0.25, 1, 0.25 ).name( 'Resolution' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'quality', 0.05, 1 ).name( 'Quality' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'maxDistance', 0.01, 2 ).name( 'Relative Max Distance' ).info( 'Fraction of the scene bounding-box diagonal.' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'thickness', 0.0001, 0.02 ).name( 'Relative Thickness' ).info( 'Fraction of the scene bounding-box diagonal.' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'intensity', 0, 2 ).name( 'Intensity' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'mirrorBias', 0, 1 ).name( 'Mirror Bias' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'stepExponent', 1, 4, 1 ).name( 'Step Exponent' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'binaryRefine' ).name( 'Binary Refine' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'maxLuminance', 1, 100 ).name( 'Max Luminance' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'screenEdgeFade', 0, 0.5 ).name( 'Edge Fade' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'maxRoughness', 0.1, 0.95 ).name( 'Max Roughness' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'maxFrames', 1, 32, 1 ).name( 'History Frames' ).onChange( updateSSRParameters );
				ssrSettings.add( ssrParams, 'radius', 0, 3 ).name( 'Denoise Radius' ).onChange( updateSSRParameters );
				const whiteEnvironment = new THREE.DataTexture( new Float32Array( [ 1, 1, 1, 1 ] ), 1, 1, THREE.RGBAFormat, THREE.FloatType );
				whiteEnvironment.mapping = THREE.EquirectangularReflectionMapping;
				whiteEnvironment.needsUpdate = true;
				const updateEnvironment = () => {

					const selected = params.environmentSource === 'HDR' ? environment : whiteEnvironment;
					scene.environment = selected;
					scene.background = selected;
					capture();

				};

				settings.add( params, 'environmentSource', [ 'HDR', 'Unit White' ] ).name( 'Environment Source' ).onChange( updateEnvironment );

				const occlusion = settings.addFolder( 'Ambient Occlusion' );
				occlusion.add( params, 'aoType', [ 'None', 'GTAO', 'GTAO + GTSO' ] ).name( 'AO type' ).onChange( updateAO );
				occlusion.add( params, 'resolutionScale', 0.25, 1, 0.25 ).name( 'Resolution' ).onChange( updateAOParameters );
				occlusion.add( params, 'samples', 4, 32, 1 ).name( 'Samples' ).onChange( updateAOParameters ).debounce( 250 );
				occlusion.add( params, 'radius', 0.1, 2 ).name( 'Radius' ).onChange( updateAOParameters );
				occlusion.add( params, 'scale', 0.01, 1 ).name( 'Scale' ).onChange( updateAOParameters );
				occlusion.add( params, 'thickness', 0.01, 2 ).name( 'Thickness' ).onChange( updateAOParameters );
				occlusion.add( params, 'temporalFiltering' ).name( 'Temporal filtering' ).onChange( updateAOParameters );

				window.addEventListener( 'resize', () => {

					camera.aspect = window.innerWidth / window.innerHeight;
					camera.updateProjectionMatrix();
					renderer.setSize( window.innerWidth, window.innerHeight );
					resetSSR();

				} );
				renderer.setAnimationLoop( animate );

			}

			function animate() {

				controls.update();
				if ( bakingLightMap ) {

					// The UV bake always samples the probes, independently of the display toggle.
					lightProbes.visible = true;
					try {

						lightMapper.update();

					} finally {

						lightProbes.visible = params.lightProbeDiffuse;

					}

					status.textContent = `Baking Light Probes light map: ${ lightMapper.samples } / ${ bakeSamples } samples`;
					traaPass.setSize( 1, 1 );
					if ( lightMapper.samples >= bakeSamples ) {

						bakingLightMap = false;
						capture( false );

					}

				}

				const size = renderer.getDrawingBufferSize( drawingSize );
				if ( ssrHistory.width !== size.x || ssrHistory.height !== size.y ) {

					ssrHistory.setSize( size.x, size.y );
					historyValid.value = false;

				}

				renderer.initRenderTarget( ssrHistory );
				renderPipeline.render();

				// Only beauty and SSR diagnostic views render the source color. Copy after
				// resolve so tracing never depends on this frame's indirect specular chain.
				if ( params.output === 'Beauty' || ( params.output.startsWith( 'SSR' ) || params.output.startsWith( 'Indirect Specular' ) ) ) {

					renderer.copyTextureToTexture( scenePass.getTexture( 'output' ), ssrHistory.texture );
					renderer.copyTextureToTexture( prePass.getTexture( 'depth' ), ssrHistory.depthTexture );
					previousView.value.copy( currentView );
					previousProjection.value.copy( currentProjection );
					previousProjectionInverse.value.copy( currentProjectionInverse );
					historyValid.value = true;

				} else {

					historyValid.value = false;

				}

			}

			function setupSSR( depth, normal, motion ) {

				const ssrProjectionInverse = uniform( camera.projectionMatrixInverse );
				const ssrWorldMatrix = uniform( camera.matrixWorld );
				ssrHistory = new THREE.RenderTarget( 1, 1, { type: THREE.HalfFloatType, depthTexture: new THREE.DepthTexture( 1, 1 ) } );
				ssrHistory.depthTexture.format = depth.value.format;
				ssrHistory.depthTexture.type = depth.value.type;
				ssrHistory.depthTexture.minFilter = THREE.NearestFilter;
				ssrHistory.depthTexture.magFilter = THREE.NearestFilter;

				// Trace current geometry, then project each hit into the previous resolved
				// color. Depth rejection prevents newly visible surfaces reading stale color.
				const source = sample( ( uv ) => {

					const viewPosition = getViewPosition( uv, depth.sample( uv ).r, ssrProjectionInverse );
					const worldPosition = ssrWorldMatrix.mul( vec4( viewPosition, 1 ) );
					const previousPosition = previousView.mul( worldPosition );
					const clip = previousProjection.mul( previousPosition );
					const previousUV = clip.xy.div( clip.w.max( 1e-6 ) ).mul( vec2( 0.5, - 0.5 ) ).add( 0.5 );
					const oldDepth = texture( ssrHistory.depthTexture ).sample( previousUV ).r;
					const oldPosition = getViewPosition( previousUV, oldDepth, previousProjectionInverse );
					const valid = historyValid.and( clip.w.greaterThan( 0 ) )
						.and( previousUV.x.greaterThanEqual( 0 ).and( previousUV.x.lessThanEqual( 1 ) ) )
						.and( previousUV.y.greaterThanEqual( 0 ).and( previousUV.y.lessThanEqual( 1 ) ) )
						.and( oldPosition.z.sub( previousPosition.z ).abs().lessThan( ssrPass.thickness.max( 0.001 ) ) );

					return vec4( texture( ssrHistory.texture ).sample( previousUV ).rgb, valid );

				} );

				const normalRoughness = prePass.getTextureNode();
				const albedoMetalness = prePass.getTextureNode( 'albedo' );
				ssrPass = ssr( source, depth, normal, {
					camera,
					stochastic: true,
					outputCoverage: true,
					diffuseNode: albedoMetalness,
					metalnessNode: albedoMetalness.a,
					roughnessNode: normalRoughness.a,
					binaryRefine: ssrParams.binaryRefine
				} ).toInspector( 'SSR Raw' );

				ssrCoverage = sample( ( uv ) => {

					const roughness = normalRoughness.sample( uv ).a;
					const roughnessFade = roughness.smoothstep( ssrMaxRoughness.sub( 0.1 ), ssrMaxRoughness ).oneMinus();
					return ssrPass.getCoverageNode().sample( uv ).r.mul( roughnessFade ).mul( historyValid );

				} ).toInspector( 'SSR Coverage' );

				// Match the integrated GGX BRDF used in the demodulation example. The
				// chain consumes incoming radiance: the beauty material remodulates it.
				ssrModulation = sample( ( uv ) => {

					const base = albedoMetalness.sample( uv );
					const surface = normalRoughness.sample( uv );
					const viewPosition = getViewPosition( uv, depth.sample( uv ).r, ssrProjectionInverse );
					return EnvironmentBRDF( {
						dotNV: unpackRGBToNormal( surface.rgb ).dot( viewPosition.negate().normalize() ).clamp( 0, 1 ),
						specularColor: mix( vec3( 0.04 ), base.rgb, base.a ),
						specularF90: float( 1 ),
						roughness: surface.a
					} );

				} );
				const unweighted = sample( ( uv ) => {

					const raw = ssrPass.getTextureNode().sample( uv );
					const coverage = ssrPass.getCoverageNode().sample( uv ).r;
					return vec4( raw.rgb.div( coverage.max( 1e-4 ) ), raw.a );

				} );
				ssrRadiance = sample( uv => demodulate( unweighted.sample( uv ), ssrModulation.sample( uv ) ) );
				// Resolve alternative estimates once, before denoising. Both inputs are
				// incoming radiance; the fallback chain already weights its own coverage.
				indirectSpecularRaw = sample( ( uv ) => {

					const coverage = ssrCoverage.sample( uv );
					const radiance = ssrRadiance.sample( uv );
					const fallback = prePass.getTextureNode( 'fallback' ).sample( uv );
					return vec4( radiance.rgb.mul( coverage ).add( fallback.rgb.mul( coverage.oneMinus() ) ), radiance.a );

				} ).toInspector( 'Indirect Specular Raw' );
				indirectSpecularCoverage = sample( uv => {

					const coverage = ssrCoverage.sample( uv );
					return coverage.add( prePass.getTextureNode( 'fallback' ).sample( uv ).a.mul( coverage.oneMinus() ) );

				} );
				const resolvedTexture = convertToTexture( indirectSpecularRaw.sample( uv() ) );
				ssrTemporal = temporalReproject( resolvedTexture, depth, normalRoughness, motion, camera, { mode: 'specular', accumulate: false } );
				ssrDenoise = recurrentDenoise( ssrTemporal, camera, {
					depth,
					normal: normalRoughness,
					raw: resolvedTexture,
					metalRoughness: sample( uv => vec2( albedoMetalness.sample( uv ).a, normalRoughness.sample( uv ).a ) ),
					mode: 'specular',
					accumulate: true
				} );
				ssrDenoise.alphaSource = 'raylength';
				// Inverse-luminance firefly weighting biases demodulated radiance toward
				// black at hit/miss boundaries, especially without a probe fallback.
				ssrTemporal.flickerSuppression.value = 0;
				ssrDenoise.flickerSuppression.value = 0;
				ssrDenoise.lumaPhi.value = 0.75;
				ssrDenoise.normalPhi.value = 0.3;
				ssrDenoise.strength.value = 0.725;
				ssrTemporal.setHistoryTexture( ssrDenoise );

				// The alternative pipeline never sees fallback lighting. Confidence is
				// filtered with the same spatial and temporal weights as SSR radiance.
				const sparseSSR = convertToTexture( vec4( ssrRadiance.sample( uv() ).rgb, ssrCoverage.sample( uv() ) ) );
				ssrCoverageDenoise = coverageDenoise( sparseSSR, camera, {
					depth,
					normal: normalRoughness,
					velocity: motion,
					hitDistance: sample( uv => ssrPass.getTextureNode().sample( uv ).a )
				} ).toInspector( 'SSR Filtered', node => vec4( node.rgb.mul( node.a ), 1 ) );
				updateSSRProvider();

			}

			function updateSSRProvider() {

				indirectSpecularFiltered = sample( uv => {

					if ( ssrParams.resolveOrder === 'Before filtering' ) return ssrDenoise.getTextureNode().sample( uv );
					const filtered = ssrCoverageDenoise.getTextureNode().sample( uv );
					const fallback = prePass.getTextureNode( 'fallback' ).sample( uv );
					return vec4( filtered.rgb.mul( filtered.a ).add( fallback.rgb.mul( filtered.a.oneMinus() ) ), filtered.a.add( fallback.a.mul( filtered.a.oneMinus() ) ) );

				} ).toInspector( 'Indirect Specular Filtered' );

				ssrProvider = ssrParams.enabled && ssrPass ? ( { direction, roughness, normal, viewDirection } ) => {

					const matches = matchesSSRQuery( { direction, roughness, normal, viewDirection } );
					if ( ssrParams.resolveOrder !== 'Before filtering' && ssrParams.denoise ) {

						const filtered = ssrCoverageDenoise.getTextureNode().sample( screenUV );
						return vec4( filtered.rgb, filtered.a.mul( matches ) );

					}

					const radiance = ssrParams.denoise ? ssrDenoise.getTextureNode().sample( screenUV ) : indirectSpecularRaw.sample( screenUV );
					const coverage = indirectSpecularCoverage.sample( screenUV );
					// The buffer is already resolved. Unweight only to adapt to the
					// provider contract; the outer chain must not add fallback a second time.
					return vec4( radiance.rgb.div( coverage.max( 1e-4 ) ), coverage.mul( matches ) );

				} : null;

			}

			function matchesSSRQuery( { direction, roughness, normal, viewDirection } ) {

				// SSR describes this camera's base specular lobe. Broad irradiance,
				// clearcoat and other directional queries must retain probe fallback.
				const baseRoughness = prePass.getTextureNode().sample( screenUV ).a;
				const baseNormal = unpackRGBToNormal( prePass.getTextureNode().sample( screenUV ).rgb ).transformDirection( cameraWorldMatrix );
				const mirrorDirection = viewDirection.negate().reflect( baseNormal );
				const baseDirection = baseRoughness.pow4().mix( mirrorDirection, baseNormal ).normalize();
				return roughness.sub( baseRoughness ).abs().lessThan( 0.01 )
					.and( normal.dot( baseNormal ).greaterThan( 0.999 ) )
					.and( direction.dot( baseDirection ).greaterThan( 0.999 ) );

			}

			function resetSSR() {

				historyValid.value = false;
				ssrTemporal?.setSize( 1, 1 );
				ssrDenoise?.setSize( 1, 1 );
				ssrCoverageDenoise?.reset();

			}

			function updateSSRParameters() {

				ssrPass.resolutionScale = ssrParams.resolutionScale;
				ssrPass.quality.value = ssrParams.quality;
				ssrPass.maxDistance.value = ssrParams.maxDistance * sceneScale;
				ssrPass.thickness.value = ssrParams.thickness * sceneScale;
				ssrPass.intensity.value = ssrParams.intensity;
				ssrPass.mirrorBias.value = ssrParams.mirrorBias;
				ssrPass.binaryRefine = ssrParams.binaryRefine;
				ssrPass.stepExponent = ssrParams.stepExponent;
				ssrPass.maxLuminance.value = ssrParams.maxLuminance;
				ssrPass.screenEdgeFade.value = ssrParams.screenEdgeFade;
				ssrMaxRoughness.value = ssrParams.maxRoughness;
				ssrTemporal.maxFrames.value = ssrParams.maxFrames;
				ssrDenoise.maxFrames.value = ssrParams.maxFrames;
				ssrDenoise.radius.value = ssrParams.radius;
				ssrCoverageDenoise.radius.value = ssrParams.radius;
				ssrCoverageDenoise.maxFrames.value = ssrParams.maxFrames;
				resetSSR();
				traaPass?.setSize( 1, 1 );

			}

			function updateAO() {

				const aoContext = params.aoType === 'None' ? context( {} ) : params.aoType === 'GTAO + GTSO'
					? aoPass.getLightingContext()
					: builtinAOContext( aoPass.getTextureNode().sample( screenUV ).r );
				// In the combined mode, fallback has already been resolved for the base
				// lobe. Only other lobes may query it again (including partial probes).
				const combined = ssrParams.resolveOrder === 'Before filtering' || ! ssrParams.denoise;
				const fallback = ssrProvider && combined ? specularProviders.map( provider => query => {

					const value = provider( query );
					return vec4( value.rgb, value.a.mul( matchesSSRQuery( query ).not() ) );

				} ) : specularProviders;
				scenePass.contextNode = context( { ...aoContext.value, indirectSpecularNode: indirectSpecular( ssrProvider ? [ ssrProvider, ...fallback ] : fallback ) } );
				scenePass.needsUpdate = true;

				updateOutput();

			}

			function updateOutput() {

				switch ( params.output ) {

					case 'Diffuse Coverage':
						renderPipeline.outputNode = vec4( vec3( scenePass.getTextureNode( 'coverage' ).r ), 1 );
						break;
					case 'Spec Coverage':
						renderPipeline.outputNode = vec4( vec3( scenePass.getTextureNode( 'coverage' ).g ), 1 );
						break;
					case 'SSR Raw':
						renderPipeline.outputNode = mix( scenePass, vec4( ssrPass.rgb, 1 ), debugWeight );
						break;
					case 'SSR Filtered':
						renderPipeline.outputNode = mix( scenePass, vec4( ssrCoverageDenoise.rgb.mul( ssrCoverageDenoise.a ), 1 ), debugWeight );
						break;
					case 'SSR Filtered Coverage':
						renderPipeline.outputNode = mix( scenePass, vec4( vec3( ssrCoverageDenoise.a ), 1 ), debugWeight );
						break;
					case 'Indirect Specular Raw':
						renderPipeline.outputNode = mix( scenePass, vec4( indirectSpecularRaw.rgb, 1 ), debugWeight );
						break;
					case 'Indirect Specular Filtered':
						renderPipeline.outputNode = mix( scenePass, vec4( indirectSpecularFiltered.rgb, 1 ), debugWeight );
						break;
					case 'SSR Coverage':
						renderPipeline.outputNode = mix( scenePass, vec4( vec3( ssrCoverage ), 1 ), debugWeight );
						break;
					case 'AO':
						renderPipeline.outputNode = vec4( vec3( aoPass.getTextureNode().sample( screenUV ).r ), 1 );
						break;
					case 'UV Unwrap':
						renderPipeline.outputNode = uvPass;
						break;
					default:
						renderPipeline.outputNode = traaPass;

				}

				renderer.toneMapping = [ 'Beauty', 'SSR Raw', 'SSR Filtered', 'Indirect Specular Raw', 'Indirect Specular Filtered' ].includes( params.output ) ? THREE.ACESFilmicToneMapping : THREE.NoToneMapping;
				renderPipeline.needsUpdate = true;
				traaPass.setSize( 1, 1 );

			}

			function updateAOParameters() {

				aoPass.samples.value = params.samples;
				aoPass.radius.value = params.radius;
				aoPass.resolutionScale = params.resolutionScale;
				aoPass.scale.value = params.scale;
				aoPass.thickness.value = params.thickness;
				aoPass.useTemporalFiltering = params.temporalFiltering;
				traaPass.setSize( 1, 1 );

			}

			async function loadModel() {

				const id = ++ loadId;
				const name = params.model;
				let gltf;

				try {

					gltf = await new GLTFLoader().loadAsync( 'models/gltf/' + models[ name ] );

				} catch ( error ) {

					if ( id !== loadId ) return;
					params.model = currentModel;
					console.error( 'Unable to load model:', error );
					return;

				}

				if ( id !== loadId ) {

					disposeModel( gltf.scene );
					return;

				}

				scene.environmentNode = null;
				renderer.contextNode = context( { ...renderer.contextNode.value } );
				delete renderer.contextNode.value.getGI;
				renderer.contextNode.value.indirectDiffuseNode = null;
				renderer.contextNode.value.indirectSpecularNode = null;

				for ( const source of [ lightProbes, probes ] ) {

					if ( source ) {

						source.removeFromParent();
						source.dispose();

					}

				}

				lightMapper?.dispose();
				lightMapper = null;
				atlas = null;
				meshes = [];
				bakingLightMap = false;

				if ( model ) {

					model.removeFromParent();
					disposeModel( model );

				}

				model = gltf.scene;
				model.traverse( ( object ) => {

					if ( object.isMesh ) {

						object.castShadow = true;
						object.receiveShadow = true;

					}

					if ( object.isLight && object.shadow ) {

						object.castShadow = true;
						object.shadow.mapSize.setScalar( 256 );
						object.shadow.radius = 12;
						object.shadow.bias = - 0.002;
						// The model and lights are static; reuse the captured shadow maps.
						object.shadow.autoUpdate = false;
						object.shadow.needsUpdate = true;

					}

				} );
				scene.add( model );
				updateDirectLights();
				model.updateMatrixWorld( true );
				setModelCamera( gltf );

				const bounds = new THREE.Box3().setFromObject( model );
				const fullSize = bounds.getSize( new THREE.Vector3() ).max( new THREE.Vector3( 0.1, 0.1, 0.1 ) );
				const size = fullSize.clone().multiplyScalar( 0.95 );
				const center = bounds.getCenter( new THREE.Vector3() );
				captureFar = Math.max( 30, fullSize.length() * 2 );
				sceneScale = Math.max( fullSize.length(), 0.001 );
				if ( ssrPass ) updateSSRParameters();

				// Fit the diffuse probe grid to the selected scene.

				lightProbes = new LightProbeGrid( size.x, size.y, size.z, 12, 6, 6 );
				lightProbes.position.copy( center );
				lightProbes.visibility = true;
				lightProbes.multiBounce = true;
				scene.add( lightProbes );

				// Keep room-local reflections for Dual Rooms; fit other scenes to their bounds.

				probes = new ReflectionProbes();
				probes.boxProjection = bakeSettings.boxProjection;

				let probeSetup = [ { position: center.toArray(), influenceSize: fullSize.toArray(), projectionSize: fullSize.toArray() } ];

				if ( params.model === 'Dual Rooms' ) {

					const roomBounds = new THREE.Box3().setFromObject( model.getObjectByName( 'room' ) );
					const dividerBounds = new THREE.Box3().setFromObject( model.getObjectByName( 'dividerLeft' ) );
					const blendDistance = dividerBounds.max.x - dividerBounds.min.x;
					const leftBounds = roomBounds.clone();
					const rightBounds = roomBounds.clone();
					leftBounds.max.x = dividerBounds.min.x;
					rightBounds.min.x = dividerBounds.max.x;

					probeSetup = [ leftBounds, rightBounds ].map( ( room ) => {

						const roomSize = room.getSize( new THREE.Vector3() ).toArray();
						return { position: room.getCenter( new THREE.Vector3() ).toArray(), influenceSize: roomSize, projectionSize: roomSize, blendDistance };

					} );
					// Extend the doorway into the floor, lintel and jambs, keeping its depth.
					probeSetup.push( { position: [ 0, 1.9, 0 ], influenceSize: [ 2.4, 3.8, 2.5 ], projectionSize: [ 16, 5, 8 ], projectionOffset: [ 0, 0.6, 0 ], influenceExpansion: [ 0, 1, 1 ] } );

				}

				for ( const setup of probeSetup ) {

					const probe = new ReflectionProbe( ...setup.influenceSize );
					if ( setup.blendDistance !== undefined ) probe.blendDistance = setup.blendDistance;
					// Extend the selected faces by the fade distance for full influence at walls.
					probe.influenceSize.addScaledVector( new THREE.Vector3( ... ( setup.influenceExpansion ?? [ 1, 1, 1 ] ) ), 2 * probe.blendDistance );
					probe.position.set( ...setup.position );
					probe.projectionSize = new THREE.Vector3( ...setup.projectionSize );
					if ( setup.projectionOffset ) probe.projectionOffset.set( ...setup.projectionOffset );
					probes.add( probe );

				}

				scene.add( probes );

				capture();
				currentModel = name;

			}

			function disposeModel( model ) {

				const resources = new Set();
				model.traverse( ( object ) => {

					if ( object.geometry ) resources.add( object.geometry );
					if ( object.shadow ) resources.add( object.shadow );
					const materials = Array.isArray( object.material ) ? object.material : [ object.material ];
					for ( const material of materials ) {

						if ( ! material ) continue;
						resources.add( material );
						for ( const value of Object.values( material ) ) {

							if ( value && value.isTexture ) resources.add( value );

						}

					}

				} );
				for ( const resource of resources ) resource.dispose();

			}

			function setModelCamera( gltf ) {

				const source = gltf.cameras[ 0 ];
				const bounds = new THREE.Box3().setFromObject( model );
				const center = bounds.getCenter( new THREE.Vector3() );

				// Clear any orbit damping left over from the previous scene.
				const damping = controls.enableDamping;
				controls.enableDamping = false;
				controls.update();

				if ( source ) {

					source.getWorldPosition( camera.position );
					source.getWorldQuaternion( camera.quaternion );
					camera.fov = source.fov;
					camera.near = source.near;
					camera.far = source.far;
					controls.target.copy( camera.position ).addScaledVector( camera.getWorldDirection( new THREE.Vector3() ), camera.position.distanceTo( center ) );

				} else {

					controls.target.copy( center );
					camera.position.copy( center ).add( new THREE.Vector3( 1, 0.6, 1 ).multiplyScalar( bounds.getSize( new THREE.Vector3() ).length() ) );

				}

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				controls.update();
				controls.saveState();
				controls.enableDamping = damping;

			}

			function updateDirectLights() {

				model.traverse( object => {

					if ( object.isLight ) object.visible = params.directLights;

				} );
				if ( traaPass ) traaPass.setSize( 1, 1 );
				resetSSR();

			}

			function updateIndirectLighting() {

				updateSSRProvider();
				configureIndirectLighting();
				resetSSR();
				traaPass.setSize( 1, 1 );

			}

			function configureIndirectLighting( reflections = true, baking = false ) {

				lightProbes.visible = ! baking && params.lightProbeDiffuse;
				const diffuseProviders = [];
				if ( ! baking && params.lightProbeDiffuse ) {

					diffuseProviders.push( lightProbeGridDiffuse( lightProbes ) );

				}

				specularProviders = ! baking && reflections && params.reflectionSpecular && probes.texture ? [ reflectionProbesSpecular( probes ) ] : [];
				if ( lightMapper && ( baking || params.diffuseBaking ) ) {

					// Keep material.lightMap independent: this atlas is supplied exactly once.
					diffuseProviders.push( lightMapDiffuse( texture( lightMapper.texture, uv( 1 ) ) ) );

				}

				if ( ! baking && params.reflectionDiffuse && probes.texture ) {

					diffuseProviders.push( reflectionProbesDiffuse( probes ) );

				}

				if ( scene.environment ) {

					const environment = pmremTexture( scene.environment );
					// Environment illumination is already baked into the atlas. Optional
					// fallback is an alternative for uncovered surfaces, not another sum.
					if ( baking || params.environmentDiffuse ) diffuseProviders.push( environmentDiffuse( environment ) );
					if ( ! baking && params.environmentSpecular ) specularProviders.push( environmentSpecular( environment ) );

				}

				renderer.contextNode = context( {
					...renderer.contextNode.value,
					indirectDiffuseNode: indirectDiffuse( diffuseProviders ),
					indirectSpecularNode: indirectSpecular( specularProviders )
				} );
				if ( prePass && ! baking ) {

					// Nested pass updates can run while the beauty context is active.
					// Explicitly pin the pre-pass to the camera-independent fallback chain.
					prePass.contextNode = context( { ...renderer.contextNode.value, getAO: null, getSpecularOcclusion: null } );
					prePass.needsUpdate = true;
					updateAO();

				}

			}

			function prepareAtlas() {

				if ( atlas && atlas.resolution === Number( bakeSettings.lightMapResolution ) ) return;
				const geometries = new Set();
				model.traverse( object => {

					if ( object.isMesh ) geometries.add( object.geometry );

				} );
				let nextAtlas = null;
				// Preserve chart gutters when a selected model needs a larger atlas.
				for ( let resolution = Number( bakeSettings.lightMapResolution ); resolution <= 4096 && ! nextAtlas; resolution *= 2 ) {

					nextAtlas = unwrapUVs( model, { resolution, padding: 3 } );

				}

				if ( ! nextAtlas ) throw new Error( 'The scene does not fit in the light-map atlas.' );
				bakeSettings.lightMapResolution = nextAtlas.resolution;
				atlas = nextAtlas;
				meshes = atlas.meshes.map( record => record.mesh );
				for ( const geometry of geometries ) geometry.dispose();

			}

			function getBakeDiffuse() {

				const providers = [ lightProbeGridDiffuse( lightProbes ) ];
				if ( scene.environment ) providers.push( environmentDiffuse( pmremTexture( scene.environment ) ) );
				return indirectDiffuse( providers );

			}

			function capture( bakeDiffuse = true ) {

				if ( ! model || ! lightProbes || ! probes ) return;
				// Reflection-only requests wait for the current atlas to finish.
				if ( ! bakeDiffuse && ( bakingLightMap || ! lightMapper || lightMapper.samples < bakeSamples ) ) return;

				const environmentNode = scene.environmentNode;
				const rendererContext = renderer.contextNode;
				const lightProbesVisible = lightProbes.visible;
				const lightStates = [];
				model.traverse( object => {

					if ( object.isLight ) {

						lightStates.push( [ object, object.visible ] );
						object.visible = true;

					}

				} );
				scene.environmentNode = null;
				let prepared = false;
				let nextMapper = null;

				try {

					// Neither previous runtime GI nor camera occlusion enters source preparation.
					renderer.contextNode = context( {
						...rendererContext.value,
						getGI: null, getAO: null, getSpecularOcclusion: null,
						indirectDiffuseNode: indirectDiffuse( [] ),
						indirectSpecularNode: indirectSpecular( [] )
					} );

					if ( bakeDiffuse ) {

						prepareAtlas();
						lightProbes.visible = true;

						lightProbes.bake( renderer, scene, { cubemapSize: Number( bakeSettings.probeResolution ), near: 0.05, far: captureFar, bounces: bakeSettings.bounces } );

						nextMapper = new LightMapper( renderer, atlas.resolution, getBakeDiffuse() );
						nextMapper.addObjects( meshes );
						lightMapper?.dispose();
						lightMapper = nextMapper;
						nextMapper = null;
						bakingLightMap = true;
						status.textContent = `Baking Light Probes light map: 0 / ${ bakeSamples } samples`;

					} else {

						// Capture direct light and the finished diffuse atlas, with environment
						// diffuse fallback and no indirect specular or reflection feedback.
						configureIndirectLighting( false, true );
						probes.bake( renderer, scene, { resolution: Number( bakeSettings.resolution ), near: 0.05, far: captureFar } );
						status.textContent = `Light Probes light map baked: ${ lightMapper.samples } samples`;

					}

					// Restore display AO hooks and the selected runtime lighting providers.
					renderer.contextNode = rendererContext;
					configureIndirectLighting();
					prepared = true;

				} finally {

					scene.environmentNode = environmentNode;
					for ( const [ light, visible ] of lightStates ) light.visible = visible;
					lightProbes.visible = prepared ? params.lightProbeDiffuse : lightProbesVisible;
					if ( ! prepared ) renderer.contextNode = rendererContext;
					nextMapper?.dispose();
					if ( traaPass ) traaPass.setSize( 1, 1 );
					resetSSR();

				}

			}

		</script>
	</body>
</html>
