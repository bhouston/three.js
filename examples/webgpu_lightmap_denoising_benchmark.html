<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Lightmap denoising experiment</title>
	<style>body { margin: 16px; background: #202124; color: #eee; font: 14px monospace; } canvas { max-width: 100%; } pre { white-space: pre-wrap; } button { padding: 8px; }</style>
</head>
<body>
	<h1>Lightmap denoising experiment</h1>
	<p>Linear irradiance, covered texels only. The reference is a high sample estimate, not ground truth. Runtime options: ?resolution=128&amp;samples=16&amp;reference=1024&amp;seconds=5&amp;oidn=1</p>
	<button id="run">Run comparison</button> <button id="save" disabled>Save JSON</button>
	<pre id="status">Ready. Use a physical WebGPU adapter.</pre>
	<div id="images"></div>
	<script type="importmap">
		{ "imports": {
			"three": "../build/three.webgpu.js", "three/webgpu": "../build/three.webgpu.js", "three/tsl": "../build/three.tsl.js",
			"three/addons/": "./jsm/", "oidn-webgpu": "https://esm.sh/oidn-webgpu@0.6.0?bundle", "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.15/src/index.js",
			"three-mesh-bvh/webgpu": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.15/src/webgpu/index.js"
		} }
	</script>
	<script type="module">
		import * as THREE from 'three/webgpu';
		import { texture } from 'three/tsl';
		import { LightBaker } from 'three/addons/lighting/LightBaker.js';

		const params = new URLSearchParams( location.search );
		const integer = ( key, fallback, min, max ) => Math.min( max, Math.max( min, Number( params.get( key ) ) || fallback ) ) | 0;
		const config = { resolution: integer( 'resolution', 128, 32, 1024 ), samples: integer( 'samples', 16, 1, 4096 ), reference: integer( 'reference', 1024, 32, 65536 ), seconds: integer( 'seconds', 5, 5, 60 ) };
		config.reference = Math.max( config.reference, config.samples * 4 );
		const status = document.getElementById( 'status' );
		const runButton = document.getElementById( 'run' );
		const saveButton = document.getElementById( 'save' );
		const images = document.getElementById( 'images' );

		function makeScene() {

			const scene = new THREE.Scene();
			const white = new THREE.MeshStandardMaterial( { color: 0xcccccc } );
			function wall( width, height, x, y, z, rx, ry, color ) {

				const mesh = new THREE.Mesh( new THREE.PlaneGeometry( width, height ), color ? new THREE.MeshStandardMaterial( { color } ) : white );
				mesh.position.set( x, y, z );
				mesh.rotation.set( rx, ry, 0 );
				scene.add( mesh );
				return mesh;

			}

			wall( 6, 6, 0, 0, 0, - Math.PI / 2, 0 );
			wall( 6, 6, 0, 5, 0, Math.PI / 2, 0 );
			wall( 6, 5, 0, 2.5, - 3, 0, 0 );
			wall( 6, 5, - 3, 2.5, 0, 0, Math.PI / 2, 0xcc2222 );
			wall( 6, 5, 3, 2.5, 0, 0, - Math.PI / 2, 0x22cc22 );
			for ( const [ x, y, z, height, angle ] of [[ - 0.9, 1.25, - 0.7, 2.5, 0.3 ], [ 1, 0.6, 0.6, 1.2, - 0.4 ]] ) {

				const box = new THREE.Mesh( new THREE.BoxGeometry( 1.3, height, 1.3 ), white );
				box.position.set( x, y, z );
				box.rotation.y = angle;
				scene.add( box );

			}

			const panel = wall( 2, 2, 0, 4.99, 0, Math.PI / 2, 0 );
			panel.material = new THREE.MeshStandardMaterial( { color: 0, emissive: 0xffffff, emissiveIntensity: 20 } );
			scene.updateMatrixWorld( true );
			return scene;

		}

		function metrics( value, reference, mask ) {

			let squared = 0, absolute = 0, energy = 0, count = 0;
			for ( let i = 0; i < mask.length; i += 4 ) {

				if ( mask[ i + 3 ] <= 0 ) continue;
				count ++;
				for ( let c = 0; c < 3; c ++ ) {

					const delta = value[ i + c ] - reference[ i + c ];
					if ( ! Number.isFinite( delta ) ) throw new Error( 'Non-finite irradiance in covered texel.' );
					squared += delta * delta;
					absolute += Math.abs( delta );
					energy += reference[ i + c ] * reference[ i + c ];

				}

			}

			if ( count === 0 ) throw new Error( 'No covered texels.' );
			return { coveredTexels: count, rmse: Math.sqrt( squared / ( 3 * count ) ), relativeRMSE: Math.sqrt( squared / Math.max( energy, 1e-20 ) ), mae: absolute / ( 3 * count ) };

		}

		function preview( label, data, size ) {

			const canvas = document.createElement( 'canvas' );
			canvas.width = canvas.height = size;
			const context = canvas.getContext( '2d' );
			const pixels = context.createImageData( size, size );
			for ( let i = 0; i < data.length; i += 4 ) {

				for ( let c = 0; c < 3; c ++ ) pixels.data[ i + c ] = Math.round( 255 * Math.pow( Math.max( 0, data[ i + c ] ) / ( 1 + Math.max( 0, data[ i + c ] ) ), 1 / 2.2 ) );
				pixels.data[ i + 3 ] = 255;

			}

			context.putImageData( pixels, 0, 0 );
			const figure = document.createElement( 'figure' );
			const caption = document.createElement( 'figcaption' );
			caption.textContent = label + ' (Reinhard + gamma preview; metrics use linear values)';
			figure.append( caption, canvas );
			images.append( figure );

		}

		async function run() {

			runButton.disabled = true;
			images.replaceChildren();
			let renderer, baker, readTarget, readMaterial;
			try {

				const adapter = await navigator.gpu?.requestAdapter( { powerPreference: 'high-performance' } );
				if ( ! adapter ) throw new Error( 'Rendering verification blocked: no WebGPU adapter.' );
				const info = adapter.info;
				const adapterName = [ info.vendor, info.architecture, info.device, info.description ].filter( Boolean ).join( ' ' );
				if ( info.isFallbackAdapter || adapter.isFallbackAdapter || /swiftshader|llvmpipe|lavapipe|software|microsoft basic/i.test( adapterName ) || ! /nvidia|amd|intel|apple|qualcomm|arm/i.test( adapterName ) ) throw new Error( 'Rendering verification blocked: physical GPU not confirmed: ' + adapterName );
				const device = await adapter.requestDevice( { requiredFeatures: [ ...adapter.features ], requiredLimits: { maxStorageBuffersPerShaderStage: adapter.limits.maxStorageBuffersPerShaderStage } } );
				renderer = new THREE.WebGPURenderer( { device } );
				await renderer.init();
				const drain = () => device.queue.onSubmittedWorkDone();
				const scene = makeScene();
				baker = new LightBaker( renderer, { algorithm: 'ray', resolution: config.resolution, cacheSize: 64, directional: false, denoiser: 'none', denoise: false, stitchSeams: false } );
				status.textContent = 'Preparing ' + adapterName;
				await baker.prepare( scene );
				const mapper = baker.lightMapper;
				if ( mapper.pages.length !== 1 ) throw new Error( 'This experiment requires a single atlas page.' );
				const size = mapper.texture.image.width;
				readTarget = new THREE.RenderTarget( size, size, { type: THREE.FloatType, depthBuffer: false } );
				readMaterial = new THREE.NodeMaterial();
				const quad = new THREE.QuadMesh( readMaterial );
				async function read( source ) {

					readMaterial.fragmentNode = texture( source );
					readMaterial.needsUpdate = true;
					renderer.setRenderTarget( readTarget );
					quad.render( renderer );
					renderer.setRenderTarget( null );
					return new Float32Array( await renderer.readRenderTargetPixelsAsync( readTarget, 0, 0, size, size ) );

				}

				async function process( mode ) {

					baker.denoiser = mode;
					baker.denoise = mode !== 'none';
					const maps = baker.processAsync ? await baker.processAsync() : baker.process();
					return maps[ 0 ];

				}

				const modes = params.get( 'oidn' ) === '1' ? [ 'none', 'variance', 'oidn' ] : [ 'none', 'variance' ];
				const rows = [];
				for ( const mode of modes ) {

					status.textContent = 'Warming ' + mode;
					baker.reset();
					mapper.update( config.samples );
					await process( mode );
					await drain();
					status.textContent = 'Measuring completed ' + mode + ' bakes for ' + config.seconds + ' seconds';
					let completed = 0;
					const start = performance.now();
					do {

						baker.reset();
						mapper.update( config.samples );
						await process( mode );
						await drain();
						completed ++;

					} while ( performance.now() - start < config.seconds * 1000 );

					const seconds = ( performance.now() - start ) / 1000;
					const output = await read( await process( mode ) );
					rows.push( { mode, samples: config.samples, completedBakes: completed, measurementSeconds: seconds, bakesPerSecond: completed / seconds, meanCompletedBakeSeconds: seconds / completed, output } );

				}

				status.textContent = 'Building high sample reference';
				baker.reset();
				// Fixed batches keep the browser responsive; only whole completed runs are timed.
				while ( baker.samples < config.reference ) {

					mapper.update( Math.min( 32, config.reference - baker.samples ) );
					await drain();

				}

				const reference = await read( mapper.texture );
				const mask = await read( mapper.pages[ 0 ].sampleTexture );
				preview( 'Reference: ' + config.reference + ' samples', reference, size );
				const baseline = rows[ 0 ];
				for ( const row of rows ) {

					row.error = metrics( row.output, reference, mask );
					preview( row.mode + ': ' + config.samples + ' samples', row.output, size );
					delete row.output;
					// More raw rays at the denoiser's measured end-to-end time budget.
					const samples = Math.max( config.samples, Math.min( config.reference - 1, Math.round( config.samples * row.meanCompletedBakeSeconds / baseline.meanCompletedBakeSeconds ) ) );
					baker.reset();
					await drain();
					const start = performance.now();
					mapper.update( samples );
					await process( 'none' );
					await drain();
					const actualSeconds = ( performance.now() - start ) / 1000;
					const output = await read( mapper.texture );
					row.moreSamples = { samples, targetSeconds: row.meanCompletedBakeSeconds, actualSeconds, error: metrics( output, reference, mask ) };
					preview( 'Raw time-matched to ' + row.mode + ': ' + samples + ' samples', output, size );

				}

				const result = { config, adapter: { vendor: info.vendor, architecture: info.architecture, device: info.device, description: info.description }, userAgent: navigator.userAgent, atlasSize: size, rows, notes: [ 'Single Cornell-like scene; nondirectional linear RGB irradiance; seam stitching disabled to isolate denoisers.', 'All modes share the same reset sample sequence. Reference contains that prefix and is not ground truth.', 'Readback and preview excluded from timings; GPU completion included. Setup, shader/model warmup excluded.', 'Equal-time sample count estimated from warmed throughput, rounded and capped below reference. Actual elapsed time reported; CPU/browser variance can cause budget mismatch.', 'Each mode measured sequentially for at least five seconds, counting complete GPU-fenced bakes. No requestAnimationFrame or per-frame timers.' ] };
				window.benchmarkResult = result;
				status.textContent = JSON.stringify( result, null, 2 );
				saveButton.disabled = false;
				return result;

			} catch ( error ) {

				window.benchmarkError = error.stack || String( error );
				status.textContent = window.benchmarkError;
				throw error;

			} finally {

				baker?.dispose();
				readTarget?.dispose();
				readMaterial?.dispose();
				renderer?.dispose();
				runButton.disabled = false;

			}

		}

		window.runDenoisingBenchmark = run;
		runButton.onclick = () => run().catch( console.error );
		saveButton.onclick = () => {

			const url = URL.createObjectURL( new Blob( [ JSON.stringify( window.benchmarkResult, null, 2 ) ], { type: 'application/json' } ) );
			const link = document.createElement( 'a' );
			link.href = url;
			link.download = 'lightmap-denoising-results.json';
			link.click();
			setTimeout( () => URL.revokeObjectURL( url ), 1000 );

		};
	</script>
</body>
</html>
