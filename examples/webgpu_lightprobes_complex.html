<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - light probe volume (multi-room)</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - light probe volume (multi-room)">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_lightprobes_complex.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_lightprobes_complex.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Light Probe Volume (Multi-Room)</span>
			</div>

			<small>Two rooms connected by a doorway, lit by a single light probe volume.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';

			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { LightProbeGrid } from 'three/addons/lighting/LightProbeGrid.js';
			import { LightProbeGridHelper } from 'three/addons/helpers/LightProbeGridHelper.js';

			let camera, scene, renderer, controls;
			let pendingBake = null;
			let probes, probesHelper;

			init();

			async function init() {

				// Scene

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x111111 );

				// Model

				const gltf = await new GLTFLoader().loadAsync( 'models/gltf/dual-rooms.glb' );
				scene.add( gltf.scene );

				camera = gltf.cameras[ 0 ];
				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				// glTF does not store shadow settings. Keep the room's existing setup.

				gltf.scene.traverse( ( object ) => {

					if ( object.isMesh ) {

						object.castShadow = ! [ 'room', 'redWall', 'blueWall' ].includes( object.name );
						object.receiveShadow = object.name === 'room' || ( object.castShadow && ! object.name.startsWith( 'leg' ) );

					} else if ( object.isPointLight ) {

						object.castShadow = true;
						object.shadow.mapSize.setScalar( 256 );
						object.shadow.radius = 12;
						object.shadow.bias = - 0.002;

					}

				} );

				// Renderer

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.shadowMap.enabled = true;
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 1.0;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				// Controls

				controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 2.5, 0 );
				controls.update();

				// Probe volume

				const params = {
					enabled: true,
					visibility: true,
					showProbes: false,
					resolution: 7,
					bounces: 3,
					lightIntensity: 30
				};

				async function bake( resolution ) {

					gltf.scene.traverse( ( object ) => {

						if ( object.isPointLight ) object.intensity = params.lightIntensity;

					} );

					// Remove the volume before baking to prevent feedback

					if ( probes ) {

						scene.remove( probes );
						probes.dispose();

					}

					// One volume covers both rooms. Double the X resolution to keep
					// probes clear of the divider at x=0.

					probes = new LightProbeGrid( 15.6, 4.7, 7.6, resolution * 2, resolution, resolution );
					probes.position.set( 0, 2.45, 0 );
					probes.visibility = params.visibility;
					probes.multiBounce = params.bounces > 0;

					// Keep the helper spheres out of the cubemap captures.

					if ( probesHelper ) probesHelper.visible = false;

					probes.bake( renderer, scene, { cubemapSize: 32, near: 0.05, far: 20, bounces: params.bounces } );

					scene.add( probes );
					probes.visible = params.enabled;

					// Update debug visualization

					if ( ! probesHelper ) {

						probesHelper = new LightProbeGridHelper( probes );
						probesHelper.visible = params.showProbes;
						scene.add( probesHelper );

					} else {

						probesHelper.probes = probes;
						probesHelper.update();

					}

					probesHelper.visible = params.showProbes;

				}

				await bake( params.resolution );

				function requestBake() {

					// Bake before rendering the next frame, so light uniforms use the new intensity.
					pendingBake = () => bake( params.resolution );

				}

				// GUI

				const gui = renderer.inspector.createParameters( 'Light Probes' );
				gui.add( params, 'enabled' ).name( 'GI' ).onChange( ( value ) => {

					probes.visible = value;

				} );

				gui.add( params, 'visibility' ).name( 'Visibility' ).onChange( ( value ) => {

					probes.visibility = value;

				} );

				gui.add( params, 'resolution', 2, 12, 1 ).name( 'Resolution' ).onChange( requestBake ).debounce( 250 );
				gui.add( params, 'bounces', 0, 10, 1 ).name( 'Additional Bounces' ).onChange( requestBake ).debounce( 250 );
				gui.add( params, 'lightIntensity', 1, 100, 1 ).name( 'Light Intensity' ).onChange( requestBake ).debounce( 250 );
				gui.add( params, 'showProbes' ).name( 'Show Probes' ).onChange( ( value ) => {

					probesHelper.visible = value;

				} );

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				if ( pendingBake !== null ) {

					const bake = pendingBake;
					pendingBake = null;
					bake();

				}

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
