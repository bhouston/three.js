<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - light probe capture comparison</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - light probe capture comparison">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_lightprobes_regressions.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_lightprobes_regressions.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Light Probe Capture</span>
			</div>

			<small>Baked lighting: batched capture (left), single-face reference (right).</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../src/Three.WebGPU.js",
					"three/webgpu": "../src/Three.WebGPU.js",
					"three/tsl": "../src/Three.TSL.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { LightProbeGrid } from 'three/addons/lighting/LightProbeGrid.js';
			import { RectAreaLightTexturesLib } from 'three/addons/lights/RectAreaLightTexturesLib.js';

			let camera, scene, renderer, controls, target;
			let sceneControl, rebakeControl, differenceControl;
			let grids = [], resources = [];
			const origin = new THREE.Vector3( 3, 2, - 4 );
			const scenes = [ 'Baseline', 'RectAreaLight', 'Clipping union', 'Clipping fragment union', 'Clipping intersection', 'Clipping alphaToCoverage' ];
			const params = {
				scene: new URLSearchParams( location.search ).get( 'scene' ) || 'RectAreaLight',
				difference: '',
				rebake: bake
			};

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / 2 / window.innerHeight, 0.1, 100 );
				camera.position.copy( origin ).add( new THREE.Vector3( 5, 3.8, 7 ) );

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );
				await renderer.init();

				controls = new OrbitControls( camera, renderer.domElement );
				controls.target.copy( origin );
				controls.update();

				target = new THREE.RenderTarget( 640, 480, { samples: 4 } );
				target.texture.colorSpace = THREE.SRGBColorSpace;
				THREE.RectAreaLightNode.setLTC( RectAreaLightTexturesLib.init() );

				const gui = renderer.inspector.createParameters( 'Light Probes' );
				sceneControl = gui.add( params, 'scene', scenes ).name( 'Scene' ).onChange( bake );
				rebakeControl = gui.add( params, 'rebake' ).name( 'Rebake' );
				differenceControl = gui.add( params, 'difference' ).name( 'RGB error' ).info( 'Mean / maximum error on a scale of 0–255. Readbacks complete before the next bake.' );
				differenceControl.input.readOnly = true;
				sceneControl.info( 'Union uses hardware clipping when available; fragment union uses nine planes. Alpha-to-coverage applies to the final views, not the single-sample probe atlas.' );

				window.addEventListener( 'resize', onWindowResize );
				await bake();

			}

			function createScene() {

				const scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x080808 );
				const room = new THREE.Group();
				room.position.copy( origin );
				scene.add( room );
				const addMesh = ( geometry, color, parent = room ) => {

					const material = new THREE.MeshStandardMaterial( { color, roughness: 0.8, side: THREE.DoubleSide } );
					resources.push( geometry, material );
					const mesh = new THREE.Mesh( geometry, material );
					parent.add( mesh );
					return mesh;

				};

				const floor = addMesh( new THREE.PlaneGeometry( 8, 8 ), 0xcccccc );
				floor.rotation.x = - Math.PI / 2;
				floor.position.y = - 1.5;
				const back = addMesh( new THREE.PlaneGeometry( 8, 5 ), 0xdddddd );
				back.position.set( 0, 1, - 3 );
				const wall = addMesh( new THREE.PlaneGeometry( 6, 5 ), 0xff6633 );
				wall.rotation.y = Math.PI / 2;
				wall.position.set( - 3, 1, 0 );

				const group = new THREE.ClippingGroup();
				room.add( group );
				if ( params.scene.startsWith( 'Clipping' ) ) {

					group.clippingPlanes = [
						new THREE.Plane( new THREE.Vector3( 1, 0, 0 ), - origin.x ),
						new THREE.Plane( new THREE.Vector3( 0, 1, 0 ), - origin.y - 0.2 )
					];
					group.clipIntersection = params.scene === 'Clipping intersection';
					if ( params.scene === 'Clipping fragment union' ) {

						// Use the fragment clipping fallback.
						while ( group.clippingPlanes.length < 9 ) group.clippingPlanes.push( group.clippingPlanes[ 0 ].clone() );

					}

				}

				const sphere = addMesh( new THREE.SphereGeometry( 1.3, 48, 32 ), 0x33bbff, group );
				sphere.material.alphaToCoverage = params.scene === 'Clipping alphaToCoverage';
				sphere.position.set( 0, 0, - 0.5 );
				const box = addMesh( new THREE.BoxGeometry( 1.1, 1.6, 1.1 ), 0xffdd55 );
				box.position.set( 1.8, - 0.7, 0.6 );

				let light;
				if ( params.scene === 'RectAreaLight' ) {

					light = new THREE.RectAreaLight( 0xffffff, 12, 3, 2 );
					light.position.copy( origin ).add( new THREE.Vector3( 1, 3, 2 ) );
					light.lookAt( origin );

				} else {

					light = new THREE.PointLight( 0xffffff, 60 );
					light.position.copy( origin ).add( new THREE.Vector3( 1, 2.5, 1.5 ) );

				}

				scene.add( light );
				return { scene, light };

			}

			async function bakeReference( grid, scene ) {

				// Keep the production SH projection/repack path. Only replace the
				// ArrayCamera capture dispatch with CubeCamera-style face renders.
				const render = renderer.render;
				renderer.render = function ( captureScene, captureCamera ) {

					if ( ! captureCamera.isArrayCamera ) return render.call( this, captureScene, captureCamera );
					const captureTarget = this.getRenderTarget();
					const viewport = captureTarget.viewport.clone();
					const autoClear = this.autoClear;
					const background = captureScene.background;
					const clearColor = this.getClearColor( new THREE.Color() ).clone();
					const clearAlpha = this.getClearAlpha();
					try {

						// Clear the background once for the entire atlas.

						this.setClearColor( background, 1 );
						captureScene.background = null;
						this.clear();
						this.autoClear = false;
						for ( const face of captureCamera.cameras ) {

							if ( face.layers.mask === 0 ) continue;
							captureTarget.viewport.copy( face.viewport );
							this.setRenderTarget( captureTarget );
							render.call( this, captureScene, face );

						}

					} finally {

						captureTarget.viewport.copy( viewport );
						this.autoClear = autoClear;
						captureScene.background = background;
						this.setClearColor( clearColor, clearAlpha );

					}

				};

				try {

					await grid.bake( renderer, scene, { cubemapSize: 32, near: 0.05, far: 30 } );

				} finally {

					renderer.render = render;

				}

			}

			async function readPixels( grid ) {

				scene.add( grid );
				renderer.setRenderTarget( target );
				renderer.render( scene, camera );
				const pixels = await renderer.readRenderTargetPixelsAsync( target, 0, 0, 640, 480 );
				scene.remove( grid );
				renderer.setRenderTarget( null );
				return pixels;

			}

			async function bake() {

				renderer.setAnimationLoop( null );
				controls.enabled = false;
				sceneControl.select.disabled = true;
				rebakeControl.domElement.querySelector( 'button' ).disabled = true;
				differenceControl.setValue( 'Baking…' );

				try {

					for ( const resource of resources ) resource.dispose();
					resources = [];
					const result = createScene();
					scene = result.scene;
					grids = [ 0, 1 ].map( () => {

						const grid = new LightProbeGrid( 3.5, 2, 3.5, 2, 2, 2 );
						grid.position.copy( origin );
						resources.push( grid );
						return grid;

					} );

					await grids[ 0 ].bake( renderer, scene, { cubemapSize: 32, near: 0.05, far: 30 } );
					scene.remove( result.light );
					const a = await readPixels( grids[ 0 ] );

					scene.add( result.light );
					await bakeReference( grids[ 1 ], scene );
					scene.remove( result.light );
					const b = await readPixels( grids[ 1 ] );

					let difference = 0, maximum = 0;
					for ( let i = 0; i < a.length; i ++ ) {

						if ( i % 4 === 3 ) continue;
						const delta = Math.abs( a[ i ] - b[ i ] );
						difference += delta;
						maximum = Math.max( maximum, delta );

					}

					differenceControl.setValue( ( difference / ( 640 * 480 * 3 ) ).toFixed( 4 ) + ' / ' + maximum );

				} finally {

					controls.enabled = true;
					sceneControl.select.disabled = false;
					rebakeControl.domElement.querySelector( 'button' ).disabled = false;

				}

				renderer.setAnimationLoop( animate );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / 2 / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				const width = window.innerWidth / 2;
				const height = window.innerHeight;
				renderer.setScissorTest( true );

				for ( let i = 0; i < grids.length; i ++ ) {

					scene.add( grids[ i ] );
					renderer.setViewport( i * width, 0, width, height );
					renderer.setScissor( i * width, 0, width, height );
					renderer.render( scene, camera );
					scene.remove( grids[ i ] );

				}

				renderer.setScissorTest( false );
				renderer.setViewport( 0, 0, width * 2, height );

			}

		</script>
	</body>
</html>
