<html lang="en">
	<head>
		<title>three.js webgpu - llm</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - llm">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_llm.html">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>WebGPU LLM</span>
			</div>

			<small>Browser TSL decode for GPT-2, Llama-style (SmolLM2), Gemma, Qwen3.5, and Phi. Pick a model that fits in GPU memory.</small>
		</div>

		<div id="panel">
			<label for="model">Model</label>
			<select id="model"></select>
			<p id="model-note"></p>
			<label for="prompt">Prompt</label>
			<textarea id="prompt" rows="4">Once upon a time,</textarea>
			<div class="row">
				<label for="tokens">New tokens</label>
				<input id="tokens" type="number" min="1" max="2048" value="128">
				<label for="temperature">Temperature</label>
				<input id="temperature" type="number" min="0" max="2" step="0.1" value="0.7">
				<label for="topK">Top K</label>
				<input id="topK" type="number" min="1" max="100" value="10">
				<label for="repetition">Repetition</label>
				<input id="repetition" type="number" min="1" max="2" step="0.05" value="1.1" title="Penalty for tokens that already appeared. 1 disables it.">
				<label for="ngram">N-gram</label>
				<input id="ngram" type="number" min="0" max="8" value="3" title="Block repeating n-grams. 0 disables it.">
				<button id="generate" disabled>Loading model...</button>
				<button id="stop" disabled>Stop</button>
			</div>
			<pre id="output"></pre>
			<div id="status">Initializing WebGPU...</div>
		</div>

		<style>
			#panel {
				position: absolute;
				left: 50%;
				top: 52%;
				width: min(720px, calc(100% - 32px));
				max-height: calc(100vh - 96px);
				transform: translate(-50%, -50%);
				display: flex;
				flex-direction: column;
				padding: 18px;
				box-sizing: border-box;
				border-radius: 8px;
				background: rgba(0, 0, 0, 0.72);
				color: #fff;
				font-family: system-ui, sans-serif;
				overflow: hidden;
			}

			#panel > * {
				flex-shrink: 0;
			}

			#panel label {
				display: block;
				margin-bottom: 6px;
				font-size: 13px;
				color: #bbb;
			}

			#model,
			#prompt,
			#output {
				width: 100%;
				box-sizing: border-box;
				border: 1px solid #333;
				border-radius: 4px;
				background: #111;
				color: #fff;
				font: 14px/1.4 monospace;
			}

			#model {
				width: 100%;
				height: 32px;
				margin-bottom: 8px;
				padding: 4px 8px;
				background: #111;
				color: #fff;
				border: 1px solid #333;
				border-radius: 4px;
			}

			#model-note {
				margin: 0 0 12px;
				font-size: 12px;
				color: #888;
			}

			#prompt {
				max-height: 30vh;
				min-height: 4.5em;
				padding: 10px;
				overflow-y: auto;
				resize: vertical;
				flex: 0 1 auto;
			}

			#output {
				min-height: 120px;
				max-height: 40vh;
				margin: 14px 0 8px;
				padding: 12px;
				overflow: auto;
				white-space: pre-wrap;
				overflow-wrap: anywhere;
				flex: 1 1 auto;
			}

			.row {
				display: flex;
				flex-wrap: wrap;
				align-items: end;
				gap: 10px;
				margin-top: 12px;
			}

			.row label {
				margin-bottom: 4px;
			}

			input,
			button {
				height: 32px;
			}

			input {
				width: 76px;
				background: #111;
				color: #fff;
				border: 1px solid #333;
				border-radius: 4px;
				padding: 4px 8px;
			}

			button {
				padding: 0 14px;
			}

			#generate {
				margin-left: auto;
			}

			#status {
				color: #aaa;
				font-size: 13px;
			}
		</style>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import WebGPU from 'three/addons/capabilities/WebGPU.js';
			import { MODEL_CATALOG, createTSLRunner } from 'three/addons/gpgpu/llm/LLMFactory.js';

			const modelSelect = document.getElementById( 'model' );
			const modelNote = document.getElementById( 'model-note' );
			const promptInput = document.getElementById( 'prompt' );
			const tokenInput = document.getElementById( 'tokens' );
			const temperatureInput = document.getElementById( 'temperature' );
			const topKInput = document.getElementById( 'topK' );
			const repetitionInput = document.getElementById( 'repetition' );
			const ngramInput = document.getElementById( 'ngram' );
			const generateButton = document.getElementById( 'generate' );
			const stopButton = document.getElementById( 'stop' );
			const output = document.getElementById( 'output' );
			const status = document.getElementById( 'status' );

			let renderer, runner, abortController;
			const model = selectedModel();

			for ( const entry of MODEL_CATALOG ) {

				const option = document.createElement( 'option' );
				option.value = entry.id;
				option.textContent = entry.name;
				modelSelect.appendChild( option );

			}

			if ( MODEL_CATALOG.some( ( entry ) => entry.id === model.id ) ) {

				modelSelect.value = model.id;

			} else {

				const option = document.createElement( 'option' );
				option.value = model.id;
				option.textContent = `Custom: ${ model.url }`;
				modelSelect.appendChild( option );
				modelSelect.value = model.id;

			}

			modelNote.textContent = model.note || '';
			promptInput.value = model.prompt || promptInput.value;

			modelSelect.addEventListener( 'change', () => {

				const url = new URL( window.location.href );
				url.searchParams.set( 'model', modelSelect.value );
				window.location.href = url.toString();

			} );

			init();

			async function init() {

				if ( WebGPU.isAvailable() === false ) {

					document.body.appendChild( WebGPU.getErrorMessage() );
					throw new Error( 'No WebGPU support' );

				}

				const scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x111111 );

				const camera = new THREE.OrthographicCamera( - 1, 1, 1, - 1, 0, 1 );
				const material = new THREE.MeshBasicMaterial( { color: 0x222244 } );
				const mesh = new THREE.Mesh( new THREE.PlaneGeometry( 2, 2 ), material );
				scene.add( mesh );

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( () => {

					renderer.render( scene, camera );

				} );
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				try {

					status.textContent = `Resolving ${ model.name }...`;
					const modelURL = await resolveModelURL( model );
					status.textContent = `Loading ${ model.name } from ${ modelURL }...`;
					runner = await createTSLRunner( modelURL, {
						onProgress: ( message ) => {

							status.textContent = message;

						}
					} );

					const maxNewTokens = Math.max( 1, runner.maxTokens - 1 );
					tokenInput.max = String( maxNewTokens );
					tokenInput.value = String( maxNewTokens );
					status.textContent = `Ready. Context ${ runner.maxTokens } tokens.`;
					generateButton.textContent = 'Generate';
					generateButton.disabled = false;

				} catch ( error ) {

					status.textContent = `Load failed: ${ error.message }`;
					generateButton.textContent = 'Load failed';
					generateButton.disabled = true;

				}

				window.addEventListener( 'resize', onWindowResize );

			}

			stopButton.addEventListener( 'click', () => {

				if ( abortController !== undefined ) abortController.abort();

			} );

			generateButton.addEventListener( 'click', async () => {

				abortController = new AbortController();
				generateButton.disabled = true;
				stopButton.disabled = false;
				output.textContent = promptInput.value;
				status.textContent = 'Generating...';

				let generatedCount = 0;
				const generationStart = performance.now();

				function tokenRateText() {

					const elapsed = ( performance.now() - generationStart ) / 1000;
					if ( generatedCount === 0 || elapsed <= 0 ) return '';
					return ` ${( generatedCount / elapsed ).toFixed( 1 )} tok/s`;

				}

				try {

					const maxNewTokens = Math.min(
						Math.max( 1, Number( tokenInput.value ) || 1 ),
						Math.max( 1, runner.maxTokens - 1 )
					);
					tokenInput.value = String( maxNewTokens );

					const result = await runner.generate( renderer, promptInput.value, {
						maxNewTokens,
						temperature: Number( temperatureInput.value ),
						topK: Number( topKInput.value ),
						repetitionPenalty: Number( repetitionInput.value ) || 1,
						noRepeatNgramSize: Math.max( 0, Number( ngramInput.value ) || 0 ),
						signal: abortController.signal,
						onToken: ( text ) => {

							output.textContent = text;
							generatedCount ++;
							status.textContent = `Generating...${ tokenRateText() }`;

						}
					} );

					output.textContent = result.text;
					generatedCount = result.generatedTokens.length;

					if ( result.aborted ) {

						status.textContent = `Stopped after ${ result.generatedTokens.length } token(s).${ tokenRateText() }`;

					} else {

						status.textContent = `Generated ${ result.generatedTokens.length } token(s).${ tokenRateText() }`;

					}

				} catch ( error ) {

					status.textContent = error.message;

				} finally {

					abortController = undefined;
					generateButton.disabled = false;
					stopButton.disabled = true;

				}

			} );

			function selectedModel() {

				const param = new URLSearchParams( window.location.search ).get( 'model' );

				if ( param === null ) return MODEL_CATALOG[ 0 ];

				const listed = MODEL_CATALOG.find( ( entry ) => entry.id === param );
				if ( listed ) return listed;

				return { id: 'custom', name: param, url: param, prompt: 'Once upon a time,' };

			}

			async function resolveModelURL( entry ) {

				if ( entry.localUrl ) {

					try {

						const response = await fetch( `${ entry.localUrl }config.json` );
						if ( response.ok ) return entry.localUrl;

					} catch ( error ) {

						// Fall through to the remote Hugging Face URL.

					}

				}

				return entry.url;

			}

			function onWindowResize() {

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

		</script>
	</body>
</html>
