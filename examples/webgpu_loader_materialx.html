<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - materialx loader</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="example.css">
		<style>
			.dg .property-name {
				width: 20% !important;
			}

			#materialxControls {
				position: absolute;
				top: 90px;
				left: 20px;
				z-index: 5;
				background: rgba( 255, 255, 255, 0.9 );
				padding: 8px;
				border-radius: 4px;
				font: 12px sans-serif;
			}

			#materialxControls label {
				display: block;
				margin: 6px 0 2px;
			}

			#materialxControls select, #materialxControls button {
				width: 320px;
				margin-bottom: 4px;
			}
		</style>
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>MaterialX Loader</span>
			</div>

			<small>
				MaterialX surface loader.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';

			import { Fn, abs, fract, fwidth, length, max, saturate, smoothstep, vec4, positionWorld, float } from 'three/tsl';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

			import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

			import { MaterialXLoader } from 'three/addons/loaders/MaterialXLoader.js';

			import { Inspector } from 'three/addons/inspector/Inspector.js';

			const SAMPLE_PATH = 'https://raw.githubusercontent.com/materialx/MaterialX/main/resources/Materials/Examples/StandardSurface/';
			const LOCAL_SAMPLE_PATH = 'materialx/';
			const samples = [
				'standard_surface_brass_tiled.mtlx',
				'standard_surface_brick_procedural.mtlx',
				'standard_surface_carpaint.mtlx',
				//'standard_surface_chess_set.mtlx',
				'standard_surface_chrome.mtlx',
				'standard_surface_copper.mtlx',
				//'standard_surface_default.mtlx',
				//'standard_surface_glass.mtlx',
				//'standard_surface_glass_tinted.mtlx',
				'standard_surface_gold.mtlx',
				//'standard_surface_greysphere.mtlx',
				//'standard_surface_greysphere_calibration.mtlx',
				'standard_surface_jade.mtlx',
				//'standard_surface_look_brass_tiled.mtlx',
				//'standard_surface_look_wood_tiled.mtlx',
				'standard_surface_marble_solid.mtlx',
				'standard_surface_metal_brushed.mtlx',
				'standard_surface_plastic.mtlx',
				//'standard_surface_thin_film.mtlx',
				'standard_surface_velvet.mtlx',
				'standard_surface_wood_tiled.mtlx'
			];

			const localSamples = [
				'open_pbr_pearl_thinfilm.mtlx',
				'open_pbr_soapbubble_transmission.mtlx',
				'open_pbr_brushed_metal_anisotropy.mtlx',
				'open_pbr_velvet_fuzz.mtlx',
				'gltf_pbr_carpaint_clearcoat.mtlx',
				'gltf_pbr_glass_dispersion.mtlx',
				'gltf_pbr_gold_metal.mtlx',
				'gltf_pbr_default_feature_sweep.mtlx',
				'standard_surface_marble_veins.mtlx',
				'standard_surface_jade_translucent.mtlx',
				'standard_surface_wood_grain.mtlx',
				'standard_surface_logic_composite_nodes.mtlx',
			];

			const sampleEntries = [
				...samples.map( ( sample ) => ( { id: `remote:${ sample }`, sample, path: SAMPLE_PATH } ) ),
				...localSamples.map( ( sample ) => ( { id: `local:${ sample }`, sample, path: LOCAL_SAMPLE_PATH } ) )
			];

			let camera, scene, renderer;
			let controls, prefab;
			let currentModel = null;
			let controlsRoot, sampleSelect, materialSelect, reloadButton;

			init();

			function init() {

				const container = document.createElement( 'div' );
				document.body.appendChild( container );

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.toneMapping = THREE.LinearToneMapping;
				renderer.toneMappingExposure = .5;
				renderer.inspector = new Inspector();
				renderer.setAnimationLoop( render );
				container.appendChild( renderer.domElement );

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.25, 200 );
				camera.position.set( 10, 10, 20 );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0xffffff );

				// Ground plane

				const material = new THREE.MeshBasicNodeMaterial();

				const grid = Fn( ( [ coord, lineWidth = float( 0.01 ), dotSize = float( 0.03 ) ] ) => {

					// https://bgolus.medium.com/the-best-darn-grid-shader-yet-727f9278b9d8

					const g = fract( coord );
					const fw = fwidth( coord );
					const gx = abs( g.x.sub( 0.5 ) );
					const gy = abs( g.y.sub( 0.5 ) );

					const lineX = saturate( lineWidth.sub( gx ).div( fw.x ).add( 0.5 ) );
					const lineY = saturate( lineWidth.sub( gy ).div( fw.y ).add( 0.5 ) );
					const lines = max( lineX, lineY );

					const squareDist = max( gx, gy );
					const aa = max( fw.x, fw.y );
					const dots = smoothstep( dotSize.add( aa ), dotSize.sub( aa ), squareDist );

					return max( dots, lines );

				} );

				const fade = Fn( ( [ radius = float( 10.0 ), falloff = float( 1.0 ) ] ) => {

					return smoothstep( radius, radius.sub( falloff ), length( positionWorld ) );

				} );

				const gridColor = vec4( 0.5, 0.5, 0.5, 1.0 );
				const baseColor = vec4( 1.0, 1.0, 1.0, 0.0 );

				material.colorNode = grid( positionWorld.xz, 0.007, 0.03 ).mix( baseColor, gridColor ).mul( fade( 30.0, 20.0 ) );
				material.transparent = true;

				const plane = new THREE.Mesh( new THREE.CircleGeometry( 40 ), material );
				plane.rotation.x = - Math.PI / 2;
				plane.renderOrder = - 1;
				scene.add( plane );

				//

				controls = new OrbitControls( camera );
				controls.connect( renderer.domElement );
				controls.enableDamping = true;
				controls.minDistance = 2;
				controls.maxDistance = 40;

				//

				new HDRLoader()
					.setPath( 'textures/equirectangular/' )
					.load( 'san_giuseppe_bridge_2k.hdr', async ( texture ) => {

						texture.mapping = THREE.EquirectangularReflectionMapping;

						scene.environment = texture;

						prefab = ( await new GLTFLoader().loadAsync( './models/gltf/ShaderBall.glb' ) ).scene;
						createMaterialXControls();
						await onSampleChanged();

						addGUI();

					} );

				window.addEventListener( 'resize', onWindowResize );

			}

			function createMaterialXControls() {

				controlsRoot = document.createElement( 'div' );
				controlsRoot.id = 'materialxControls';

				const sampleLabel = document.createElement( 'label' );
				sampleLabel.textContent = 'Sample';
				controlsRoot.appendChild( sampleLabel );

				sampleSelect = document.createElement( 'select' );
				for ( const entry of sampleEntries ) {

					const option = document.createElement( 'option' );
					option.value = entry.id;
					option.textContent = entry.id.startsWith( 'remote:' ) ? `MaterialX: ${ entry.sample }` : `Local: ${ entry.sample }`;
					sampleSelect.appendChild( option );

				}

				controlsRoot.appendChild( sampleSelect );

				const materialLabel = document.createElement( 'label' );
				materialLabel.textContent = 'Surface Material';
				controlsRoot.appendChild( materialLabel );

				materialSelect = document.createElement( 'select' );
				controlsRoot.appendChild( materialSelect );

				reloadButton = document.createElement( 'button' );
				reloadButton.textContent = 'Load Selected Material';
				controlsRoot.appendChild( reloadButton );

				document.body.appendChild( controlsRoot );

				sampleSelect.addEventListener( 'change', onSampleChanged );
				materialSelect.addEventListener( 'change', loadSelectedMaterial );
				reloadButton.addEventListener( 'click', loadSelectedMaterial );

			}

			function getSampleEntryById( id ) {

				return sampleEntries.find( ( entry ) => entry.id === id ) || sampleEntries[ 0 ];

			}

			function traceMaterialNodeIntegrity( material, sampleName, materialName ) {

				const issues = [];
				const visited = new Set();

				const requiredMaterialNodes = [
					'colorNode',
					'opacityNode',
					'roughnessNode',
					'metalnessNode',
					'specularIntensityNode',
					'specularColorNode',
					'iorNode',
					'transmissionNode',
					'thicknessNode'
				];

				for ( const slot of requiredMaterialNodes ) {

					const value = material[ slot ];
					if ( value === null || value === undefined ) {

						issues.push( `material.${ slot } is ${ value }` );

					} else if ( value.isNode !== true ) {

						issues.push( `material.${ slot } is not a Node (${ typeof value })` );

					}

				}

				const queue = [];

				for ( const slot of Object.getOwnPropertyNames( material ) ) {

					const value = material[ slot ];
					if ( value && value.isNode === true ) queue.push( { node: value, path: `material.${ slot }` } );

				}

				while ( queue.length > 0 ) {

					const { node, path } = queue.pop();
					if ( visited.has( node ) ) continue;
					visited.add( node );

					if ( Array.isArray( node.nodes ) ) {

						for ( let i = 0; i < node.nodes.length; i ++ ) {

							const child = node.nodes[ i ];
							const childPath = `${ path }.nodes[${ i }]`;

							if ( child === null || child === undefined ) {

								issues.push( `${ childPath } is ${ child }` );

							} else if ( child.isNode !== true ) {

								issues.push( `${ childPath } is not a Node (${ typeof child })` );

							}

						}

					}

					if ( Array.isArray( node.rawInputs ) ) {

						for ( let i = 0; i < node.rawInputs.length; i ++ ) {

							const child = node.rawInputs[ i ];
							if ( child === null ) issues.push( `${ path }.rawInputs[${ i }] is null` );

						}

					}

					if ( typeof node.getChildren === 'function' ) {

						for ( const childNode of node.getChildren() ) {

							if ( childNode && childNode.isNode === true ) {

								queue.push( { node: childNode, path: `${ path }->${ childNode.constructor?.name || 'Node' }` } );

							}

						}

					}

				}

				if ( issues.length > 0 ) {

					console.groupCollapsed( `[MaterialX TRACE] node-integrity issues: sample=${ sampleName } material=${ materialName || '(auto)' } count=${ issues.length }` );
					for ( const issue of issues ) console.error( issue );
					console.groupEnd();

				}

			}

			async function fetchSurfaceMaterialNames( entry ) {

				const response = await fetch( entry.path + entry.sample );
				if ( ! response.ok ) throw new Error( `HTTP ${ response.status }` );

				const xmlText = await response.text();
				const xmlRoot = new DOMParser().parseFromString( xmlText, 'application/xml' ).documentElement;
				const nodes = [ ...xmlRoot.querySelectorAll( 'surfacematerial' ) ];
				const names = nodes.map( ( node ) => node.getAttribute( 'name' ) ).filter( ( name ) => Boolean( name ) );

				return [ ...new Set( names ) ];

			}

			function rebuildMaterialSelect( materialNames ) {

				materialSelect.innerHTML = '';

				const autoOption = document.createElement( 'option' );
				autoOption.value = '';
				autoOption.textContent = '(auto / first material)';
				materialSelect.appendChild( autoOption );

				for ( const name of materialNames ) {

					const option = document.createElement( 'option' );
					option.value = name;
					option.textContent = name;
					materialSelect.appendChild( option );

				}

			}

			async function onSampleChanged() {

				const entry = getSampleEntryById( sampleSelect.value );

				try {

					const materialNames = await fetchSurfaceMaterialNames( entry );
					rebuildMaterialSelect( materialNames );

				} catch ( error ) {

					console.error( `Failed to inspect surfacematerial list for ${ entry.sample }`, error );
					rebuildMaterialSelect( [] );

				}

				await loadSelectedMaterial();

			}

			async function loadSelectedMaterial() {

				const entry = getSampleEntryById( sampleSelect.value );
				const selectedMaterialName = materialSelect.value || null;

				if ( currentModel ) {

					scene.remove( currentModel );
					currentModel = null;

				}

				const model = prefab.clone();
				scene.add( model );
				currentModel = model;

				const loader = new MaterialXLoader()
					.setPath( entry.path )
					.setUnsupportedPolicy( 'warn' );

				if ( selectedMaterialName ) loader.setMaterialName( selectedMaterialName );

				let material = null;

				try {

					const { materials, report } = await loader.loadAsync( entry.sample );

					if ( report.issues.length > 0 ) {

						console.groupCollapsed( `MaterialX issues: ${ entry.sample } :: ${ selectedMaterialName || '(auto)' } (${ report.issues.length })` );
						for ( const issue of report.issues ) console.log( issue );
						console.groupEnd();

					}

					material = Object.values( materials ).pop();

					if ( ! material ) {

						throw new Error( `No material compiled from ${ entry.sample } (material=${ selectedMaterialName || '(auto)' }).` );

					}

					const calibrationMesh = model.getObjectByName( 'Calibration_Mesh' );
					calibrationMesh.material = material;

					const previewMesh = model.getObjectByName( 'Preview_Mesh' );
					previewMesh.material = material;

					if ( material.transparent ) {

						calibrationMesh.renderOrder = 1;
						previewMesh.renderOrder = 2;

					}

					await renderer.compileAsync( model, camera, scene );

					console.info( `[MaterialX OK] sample=${ entry.sample } material=${ selectedMaterialName || '(auto)' }` );

				} catch ( error ) {

					console.error( `[MaterialX FAIL] sample=${ entry.sample } material=${ selectedMaterialName || '(auto)' }`, error );
					if ( material ) traceMaterialNodeIntegrity( material, entry.sample, selectedMaterialName );

				}

			}

			function addGUI() {

				const gui = renderer.inspector.createParameters( 'MaterialX Loader' );

				const API = {
					showCalibrationMesh: true,
					showPreviewMesh: true
				};

				gui.add( API, 'showCalibrationMesh' )
					.name( 'Calibration Mesh' )
					.onChange( function ( value ) {

						setVisibility( 'Calibration_Mesh', value );

					} );

				gui.add( API, 'showPreviewMesh' )
					.name( 'Preview Mesh' )
					.onChange( function ( value ) {

						setVisibility( 'Preview_Mesh', value );

					} );

			}

			function setVisibility( name, visible ) {

				scene.traverse( function ( node ) {

					if ( node.isMesh ) {

						if ( node.name == name ) node.visible = visible;

					}

				} );

			}

			//

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function render() {

				controls.update();
				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
