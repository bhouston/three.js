<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - materials - neural appearance</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - materials - neural appearance">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_materials_neural_appearance.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_materials_neural_appearance.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
		<style>
			#panel {
				position: absolute;
				left: 16px;
				bottom: 16px;
				padding: 12px;
				width: 330px;
				background: rgba( 0, 0, 0, 0.7 );
				color: #fff;
				font: 12px/1.45 monospace;
				border-radius: 4px;
				z-index: 2;
			}

			#panel button {
				margin: 4px 4px 4px 0;
			}

			#panel select {
				box-sizing: border-box;
				margin: 4px 0;
				width: 100%;
			}

			#status {
				margin-top: 8px;
				white-space: pre-line;
			}

			#estimate {
				margin-top: 8px;
				color: #bbb;
				white-space: pre-line;
			}

			#lossPanel {
				position: absolute;
				right: 16px;
				bottom: 16px;
				padding: 12px;
				background: rgba( 0, 0, 0, 0.7 );
				color: #fff;
				font: 12px/1.45 monospace;
				border-radius: 4px;
				z-index: 2;
			}

			#lossPanel[hidden],
			#modelLabels[hidden] {
				display: none;
			}

			#modelLabels {
				position: absolute;
				left: 0;
				right: 0;
				top: 120px;
				display: flex;
				justify-content: center;
				gap: min( 35vw, 420px );
				color: #fff;
				font: 13px/1.45 monospace;
				pointer-events: none;
				z-index: 1;
			}

			#modelLabels span {
				width: 180px;
				text-align: center;
				text-shadow: 0 1px 3px #000;
			}

			#lossGraph {
				display: block;
				width: 396px;
				height: 120px;
				background: #050505;
				border: 1px solid rgba( 255, 255, 255, 0.25 );
			}

			#lossLegend {
				display: flex;
				justify-content: center;
				gap: 12px;
				margin-top: 4px;
				color: #bbb;
			}
		</style>
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Neural Appearance</span>
			</div>

			<small>
				View a neural appearance material or train one from an opaque MaterialX material in the browser.
			</small>
		</div>

		<div id="panel">
			<div><strong>Material:</strong> <span id="materialName">loading default</span></div>
			<div><strong>Mode:</strong> <span id="mode">MaterialX teacher</span></div>
			<div><strong>Neural representation:</strong> <span id="neuralRepresentationSize">—</span></div>
			<label for="builtInMaterial"><strong>Built-in material:</strong></label>
			<select id="builtInMaterial"></select>
			<button id="openButton">Open .mtlx / .mtlx.zip</button>
			<button id="openNeuralButton">Open neural .json</button>
			<button id="trainButton">Train</button>
			<button id="stopButton" disabled>Stop training</button>
			<button id="downloadButton" disabled>Download JSON</button>
			<div id="status">Ready.</div>
			<div id="estimate"></div>
			<input id="fileInput" type="file" accept=".mtlx,.zip,.mtlx.zip" hidden>
			<input id="neuralFileInput" type="file" accept=".neuralAppearance,.json,application/json" hidden>
		</div>

		<div id="modelLabels" hidden>
			<span id="teacherLabel">MaterialX teacher</span>
			<span id="neuralLabel">Neural output</span>
		</div>

		<div id="lossPanel" hidden>
			<div><strong>Training loss</strong></div>
			<canvas id="lossGraph" width="396" height="120"></canvas>
			<div id="lossLegend"></div>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import * as TSL from 'three/tsl';

			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import WebGPU from 'three/addons/capabilities/WebGPU.js';
			import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
			import { MaterialXLoader } from 'three/addons/loaders/MaterialXLoader.js';
			import { NeuralAppearanceLoader } from 'three/addons/loaders/NeuralAppearanceLoader.js';
			import { NeuralAppearanceNodeMaterial } from 'three/addons/neural-appearance/NeuralAppearanceNodeMaterial.js';
			import { NeuralAppearanceTrainer, estimateTrainingMemory, disposeTrainingResult } from 'three/addons/neural-appearance/NeuralAppearanceTrainer.js';
			import { NeuralTeacherIBLEnvironmentNode, NeuralTeacherIBLLightingModel } from 'three/addons/neural-appearance/NeuralAppearanceTeacherLightingModels.js';
			import { NeuralLossGraph } from 'three/addons/neural/NeuralLossGraph.js';
			import { formatBytes, computeMLPParamCount } from 'three/addons/neural/NeuralModelSize.js';
			import { GRID_LEVELS_OPTIONS, GRID_BASE_RESOLUTION_OPTIONS, GRID_GROWTH_FACTOR_OPTIONS, MLP_HIDDEN_SIZE_OPTIONS } from 'three/addons/neural/NeuralGridModel.js';
			import { getMaterialXSample, populateMaterialXSelect } from 'three/addons/neural/NeuralMaterialXSamples.js';

			let camera, scene, renderer, mesh, neuralMesh;
			let materialXMaterial, neuralMaterial, whiteControlMaterial, previewPlaceholderMaterial, latestJson;
			let teacherNormalMaterial, teacherReflectionMaterial, teacherRoughnessMaterial, teacherIrradianceMaterial;
			const teacherIblDebugState = new WeakMap();
			let environmentMap = null;
			const directLights = [];
			let isTraining = false;
			let activeTrainer = null;
			let comparisonVisible = false;
			let frameToken = 0;
			let trainingRunId = 0;
			const trainingSettingControllers = [];

			function trackSetting( key, controller ) {

				trainingSettingControllers.push( { key, controller } );
				return controller;

			}

			const queryParams = new URLSearchParams( window.location.search );
			const DEFAULT_MATERIALX_KEY = 'neural_train_uv_grid';

			// Network (grid + MLP) settings are shared, global GUI controls -
			// mirroring examples/webgpu_materials_neural_texture.html, where
			// only "source" (there: bakeResolution; here: the MaterialX file)
			// is preset-specific and grid/MLP sizing is not. This table only
			// hand-tunes training length/cost for the materials it was
			// originally curated for (see NeuralMaterialXSamples.js for the
			// full, alphabetical catalog of built-in files) - anything else
			// picked from the dropdown falls back to DEFAULT_TRAINING_SETTINGS.
			const DEFAULT_TRAINING_SETTINGS = { iterations: 2000, batchSize: 1024, hiddenSize: 32 };
			const TRAINING_SETTINGS_OVERRIDES = {
				neural_train_uv_grid: { iterations: 2000, batchSize: 1024, hiddenSize: 16 },
				neural_train_uv_grid_glossy: { iterations: 2000, batchSize: 1024, hiddenSize: 32 },
				neural_train_lambert_red: { iterations: 1200, batchSize: 1024, hiddenSize: 16 },
				neural_train_glossy_red: { iterations: 2000, batchSize: 1024, hiddenSize: 32 },
				neural_train_glossy_gold: { iterations: 2000, batchSize: 1024, hiddenSize: 32 },
				neural_train_velvet: { iterations: 2000, batchSize: 1024, hiddenSize: 32 },
				neural_train_checkerboard: { iterations: 2000, batchSize: 1024, hiddenSize: 32 },
				neural_train_checkerboard_transparency: { iterations: 2000, batchSize: 1024, hiddenSize: 32 },
				neural_train_checkerboard_normal: { iterations: 2000, batchSize: 1024, hiddenSize: 32 },
				neural_train_normal_map: { iterations: 2000, batchSize: 1024, hiddenSize: 32 },
				neural_train_emissive_grid: { iterations: 10000, batchSize: 1024, hiddenSize: 32 },
				neural_train_alpha_cutoff: { iterations: 2000, batchSize: 1024, hiddenSize: 32 }
			};

			function getMaterialPreset( key ) {

				const sample = getMaterialXSample( key );
				if ( sample === undefined ) return undefined;

				return { file: sample.file, settings: TRAINING_SETTINGS_OVERRIDES[ key ] || DEFAULT_TRAINING_SETTINGS };

			}

			const initialMaterialKey = queryParams.get( 'test' ) || DEFAULT_MATERIALX_KEY;
			const initialMaterialPreset = getMaterialPreset( initialMaterialKey ) || getMaterialPreset( DEFAULT_MATERIALX_KEY );
			const autoTrain = queryParams.get( 'autoTrain' ) === '1';
			const noRotate = queryParams.get( 'noRotate' ) !== '0';

			const materialName = document.getElementById( 'materialName' );
			const mode = document.getElementById( 'mode' );
			const neuralRepresentationSize = document.getElementById( 'neuralRepresentationSize' );
			const status = document.getElementById( 'status' );
			const estimate = document.getElementById( 'estimate' );
			const builtInMaterial = document.getElementById( 'builtInMaterial' );
			const fileInput = document.getElementById( 'fileInput' );
			const neuralFileInput = document.getElementById( 'neuralFileInput' );
			const openButton = document.getElementById( 'openButton' );
			const openNeuralButton = document.getElementById( 'openNeuralButton' );
			const trainButton = document.getElementById( 'trainButton' );
			const stopButton = document.getElementById( 'stopButton' );
			const downloadButton = document.getElementById( 'downloadButton' );
			const modelLabels = document.getElementById( 'modelLabels' );
			const teacherLabel = document.getElementById( 'teacherLabel' );
			const neuralLabel = document.getElementById( 'neuralLabel' );
			const lossPanel = document.getElementById( 'lossPanel' );
			const lossGraph = new NeuralLossGraph(
				document.getElementById( 'lossGraph' ),
				[
					{ key: 'loss', label: 'training loss', color: '#50c8ff' },
					{ key: 'directLoss', label: 'direct', color: '#7ae582' },
					{ key: 'iblLoss', label: 'ibl', color: '#ff6b6b' },
					{ key: 'validationLoss', label: 'validation loss', color: '#ffd166' }
				],
				{ legend: document.getElementById( 'lossLegend' ) }
			);

			const presetSettings = initialMaterialPreset.settings;
			const params = {
				view: 'MaterialX teacher',
				debugView: queryParams.get( 'debugView' ) || 'shaded',
				levels: readNumberQuery( 'levels', 4 ),
				baseResolution: readNumberQuery( 'baseResolution', 16 ),
				growthFactor: readNumberQuery( 'growthFactor', 2 ),
				hiddenSize: readNumberQuery( 'hiddenSize', presetSettings.hiddenSize ),
				peOctaves: readNumberQuery( 'peOctaves', 0 ),
				inputEncoding: queryParams.get( 'inputEncoding' ) || 'none',
				iterations: readNumberQuery( 'iterations', presetSettings.iterations ),
				batchSize: readNumberQuery( 'batchSize', presetSettings.batchSize ),
				learningRate: readNumberQuery( 'learningRate', 0.001 ),
				quantization: queryParams.get( 'quantization' ) || 'none',
				previewSamples: readNumberQuery( 'previewSamples', Infinity ),
				seed: readNumberQuery( 'seed', 1 )
			};

			window.__neuralAppearanceTrainingReady = false;
			window.__neuralAppearanceTrainingDone = false;
			window.__neuralAppearanceLastLoss = NaN;
			window.__neuralAppearanceFirstLoss = NaN;
			window.__neuralAppearanceValidationLoss = NaN;
			window.__neuralAppearanceValidation = null;
			window.__neuralAppearanceLossHistory = lossGraph.history;
			window.__neuralAppearanceExportJson = null;
			window.__neuralAppearanceTeacherInputs = null;
			window.__neuralAppearanceActiveMaterialType = '';
			window.__neuralAppearanceFrameToken = 0;
			window.__neuralAppearanceRenderView = null;
			window.__neuralAppearanceMemoryEstimate = null;
			window.__neuralAppearanceSetView = ( view ) => {

				comparisonVisible = false;
				params.view = view === 'neural' ? 'trained neural' : ( view === 'white' ? 'forced white' : 'MaterialX teacher' );
				updateView();
				return params.view;

			};

			window.__neuralAppearanceSetDebugView = ( view ) => {

				params.debugView = view === 'normal' || view === 'reflection' || view === 'roughness' || view === 'irradiance' || view === 'ibl' || view === 'iblRadiance' || view === 'iblIrradiance' ? view : 'shaded';
				updateView();
				return params.debugView;

			};

			window.__neuralAppearanceSetRotation = ( y ) => {

				if ( mesh ) mesh.rotation.y = y;
				if ( neuralMesh ) neuralMesh.rotation.y = y;

			};

			init();

			async function init() {

				if ( WebGPU.isAvailable() === false ) {

					document.body.appendChild( WebGPU.getErrorMessage() );
					throw new Error( 'No WebGPU support' );

				}

				const container = document.createElement( 'div' );
				document.body.appendChild( container );

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 1.2, 5 );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x15171c );

				const keyLight = new THREE.DirectionalLight( 0xffffff, 0.9 );
				keyLight.position.set( 3.2, 2.4, 2.6 );
				keyLight.userData.baseIntensity = keyLight.intensity;
				scene.add( keyLight );
				directLights.push( keyLight );

				const fillLight = new THREE.DirectionalLight( 0xffffff, 0.32 );
				fillLight.position.set( - 2.8, 0.6, 2.2 );
				fillLight.userData.baseIntensity = fillLight.intensity;
				scene.add( fillLight );
				directLights.push( fillLight );

				const rimLight = new THREE.DirectionalLight( 0xffffff, 0.45 );
				rimLight.position.set( - 1.4, 3.2, - 2.8 );
				rimLight.userData.baseIntensity = rimLight.intensity;
				scene.add( rimLight );
				directLights.push( rimLight );

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				// The neural appearance teacher's CPU atlas readback (see
				// NeuralAppearanceTeacherReadback.js) assumes rows come back in the
				// same top-down order the write-side shader used (TSL's
				// viewportCoordinate, canonicalized per WebGPU convention) - true on
				// the native WebGPU backend, but NOT on the WebGL2 fallback backend
				// (its raw gl.readPixels() rows are bottom-up, unflipped), which would
				// silently scramble training targets row-by-row. WebGPURenderer falls
				// back to WebGL2 automatically whenever native WebGPU init fails, even
				// past the WebGPU.isAvailable() check above (e.g. adapter request
				// failure) - clearing the fallback here (there's no public
				// constructor option for this) makes that failure loud instead of
				// silently correct-looking-but-wrong.
				renderer._getFallback = null;
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( render );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 0.9;
				renderer.domElement.id = 'neuralAppearanceCanvas';
				renderer.inspector = new Inspector();
				container.appendChild( renderer.domElement );
				await renderer.init();
				environmentMap = await new HDRLoader()
					.setPath( 'textures/equirectangular/' )
					.loadAsync( 'san_giuseppe_bridge_2k.hdr' );
				environmentMap.mapping = THREE.EquirectangularReflectionMapping;
				updateLighting();

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 0, 0 );
				controls.enableZoom = false;
				controls.enablePan = false;
				controls.update();

				const geometry = new THREE.TorusKnotGeometry( 1, 0.36, 192, 32 );

				// Scale UV.x (the tubular/length direction) so tiling textures
				// repeat instead of stretching once around the knot's long path.
				const uvAttribute = geometry.attributes.uv;
				for ( let i = 0; i < uvAttribute.count; i ++ ) {

					uvAttribute.setX( i, uvAttribute.getX( i ) * 6 );

				}

				uvAttribute.needsUpdate = true;

				geometry.computeTangents();
				mesh = new THREE.Mesh( geometry, new THREE.MeshPhysicalNodeMaterial( { color: 0x93604a, roughness: 0.45 } ) );
				mesh.rotation.x = - 0.35;
				scene.add( mesh );
				previewPlaceholderMaterial = new THREE.MeshPhysicalNodeMaterial( { color: 0x222222, roughness: 0.8 } );
				neuralMesh = new THREE.Mesh( geometry, previewPlaceholderMaterial );
				neuralMesh.rotation.copy( mesh.rotation );
				neuralMesh.visible = false;
				scene.add( neuralMesh );
				whiteControlMaterial = new THREE.MeshBasicMaterial( { color: 0xffffff } );
				teacherNormalMaterial = new THREE.MeshNormalNodeMaterial( { toneMapped: false } );
				teacherReflectionMaterial = new THREE.NodeMaterial();
				teacherReflectionMaterial.lights = false;
				teacherReflectionMaterial.toneMapped = false;
				teacherReflectionMaterial.colorNode = TSL.colorSpaceToWorking(
					TSL.vec4( TSL.packNormalToRGB( TSL.positionViewDirection.negate().reflect( TSL.normalView ) ), 1 ),
					THREE.SRGBColorSpace
				);
				teacherRoughnessMaterial = new THREE.NodeMaterial();
				teacherRoughnessMaterial.lights = false;
				teacherRoughnessMaterial.toneMapped = false;
				teacherRoughnessMaterial.colorNode = TSL.vec3( 1 );
				teacherIrradianceMaterial = new THREE.NodeMaterial();
				teacherIrradianceMaterial.lights = false;
				teacherIrradianceMaterial.toneMapped = false;
				teacherIrradianceMaterial.colorNode = TSL.colorSpaceToWorking(
					TSL.vec4( TSL.packNormalToRGB( TSL.normalView ), 1 ),
					THREE.SRGBColorSpace
				);

				const gui = renderer.inspector.createParameters( 'Neural Appearance' );

				// Mirrors examples/webgpu_materials_neural_texture.html's
				// "network (grid + MLP)" folder: same control names, order,
				// and dropdown option sets for the shared grid + MLP encoding
				// (see NeuralGridModel.js / NeuralAppearanceFormat.js).
				const networkFolder = gui.addFolder( 'network (grid + MLP)' );
				trackSetting( 'levels', networkFolder.add( params, 'levels', GRID_LEVELS_OPTIONS ).name( 'grid levels' ).onChange( updateTrainingEstimate ) );
				trackSetting( 'baseResolution', networkFolder.add( params, 'baseResolution', GRID_BASE_RESOLUTION_OPTIONS ).name( 'grid base res' ).onChange( updateTrainingEstimate ) );
				trackSetting( 'growthFactor', networkFolder.add( params, 'growthFactor', GRID_GROWTH_FACTOR_OPTIONS ).name( 'grid growth factor' ).onChange( updateTrainingEstimate ) );
				trackSetting( 'hiddenSize', networkFolder.add( params, 'hiddenSize', MLP_HIDDEN_SIZE_OPTIONS ).name( 'MLP hidden width (x2 layers)' ).onChange( updateTrainingEstimate ) );
				trackSetting( 'inputEncoding', networkFolder.add( params, 'inputEncoding', [ 'none', 'raw', 'positional' ] ).name( 'uv input encoding' ).onChange( updateTrainingEstimate ) );
				trackSetting( 'peOctaves', networkFolder.add( params, 'peOctaves', 0, 8, 1 ).name( 'positional encoding octaves' ).onChange( updateTrainingEstimate ) );

				// Mirrors neural-texture's "training" folder (same names,
				// order, and option sets/ranges).
				const trainingFolder = gui.addFolder( 'training' );
				trackSetting( 'batchSize', trainingFolder.add( params, 'batchSize', [ 1024, 2048, 4096, 8192, 16384 ] ).name( 'batch size' ).onChange( updateTrainingEstimate ) );
				trackSetting( 'iterations', trainingFolder.add( params, 'iterations', 200, 20000, 100 ).name( 'iterations' ).onChange( updateTrainingEstimate ) );
				trainingFolder.add( params, 'learningRate', 0.001, 0.05, 0.001 ).name( 'learning rate' );
				trainingFolder.add( params, 'quantization', { 'Off': 'none', '8-bit': 'uint8' } ).name( 'quantization' );

				// Appearance-specific: debug views, IBL/emissive intensity -
				// no neural-texture analog, so these keep their own "view"
				// folder rather than forcing parity with texture's simpler
				// output-mode toggle.
				const viewFolder = gui.addFolder( 'view' );
				viewFolder.add( params, 'debugView', [ 'shaded', 'normal', 'reflection', 'roughness', 'irradiance', 'ibl', 'iblRadiance', 'iblIrradiance' ] ).name( 'debug view' ).onChange( updateView );
				// No "lighting" GUI folder: the debug-view render modes (normal,
				// reflection, roughness, irradiance, ibl, iblRadiance,
				// iblIrradiance) cover manual lighting inspection now, so direct
				// + environment lighting are just always both on (see
				// applyLights()) except where a debug view isolates IBL.
				updateTrainingEstimate();

				populateMaterialXSelect( builtInMaterial );

				builtInMaterial.addEventListener( 'change', onBuiltInMaterialSelected );
				openButton.addEventListener( 'click', () => fileInput.click() );
				fileInput.addEventListener( 'change', onFileSelected );
				openNeuralButton.addEventListener( 'click', () => neuralFileInput.click() );
				neuralFileInput.addEventListener( 'change', onNeuralFileSelected );
				trainButton.addEventListener( 'click', train );
				stopButton.addEventListener( 'click', stopTraining );
				downloadButton.addEventListener( 'click', download );
				window.addEventListener( 'resize', onWindowResize );

				await loadDefaultMaterialX();
				window.__neuralAppearanceTrainingReady = true;

				if ( autoTrain ) {

					await train();

				}

			}

			async function loadDefaultMaterialX() {

				if ( getMaterialPreset( initialMaterialKey ) === undefined ) {

					status.textContent = `Unknown neural appearance training test material: ${initialMaterialKey}`;
					return;

				}

				builtInMaterial.value = initialMaterialKey;
				await loadBuiltInMaterial( initialMaterialKey );

			}

			async function onBuiltInMaterialSelected() {

				applyMaterialPresetSettings( builtInMaterial.value );
				await loadBuiltInMaterial( builtInMaterial.value );

			}

			function applyMaterialPresetSettings( key ) {

				const preset = getMaterialPreset( key );
				if ( preset === undefined ) return;

				Object.assign( params, preset.settings );
				updateTrainingEstimate();

				for ( const { key, controller } of trainingSettingControllers ) controller.setValue( params[ key ] );

			}

			async function loadBuiltInMaterial( key ) {

				try {

					const preset = getMaterialPreset( key );
					if ( preset === undefined ) throw new Error( `Unknown built-in material: ${key}` );

					builtInMaterial.disabled = true;
					status.textContent = `Loading ${preset.file}...`;
					const loader = new MaterialXLoader().setPath( 'materialx/' );
					const asset = await loader.loadAsync( preset.file, {
						uvSpace: 'top-left',
						throwOnErrors: true
					} );

					// <image>-backed nodes load their bitmap asynchronously in the
					// background - loadAsync() above only waits for the MaterialX
					// document itself to parse. The live render loop will pick up
					// a bitmap that arrives after this point on its own, but
					// train()/autoTrain can fire right after this call returns and
					// both bake the teacher up front, so wait here too or an
					// immediate training run sees a blank texture.
					if ( asset.texturesReady ) await asset.texturesReady;

					setMaterialXMaterial( asset, preset.file );

				} catch ( error ) {

					console.error( error );
					status.textContent = error.message;

				} finally {

					builtInMaterial.disabled = isTraining;

				}

			}

			async function onFileSelected( event ) {

				const file = event.target.files[ 0 ];
				if ( file === undefined ) return;

				status.textContent = `Loading ${file.name}...`;

				try {

					const loader = new MaterialXLoader();
					const asset = loader.parseBuffer( await file.arrayBuffer(), file.name, {
						uvSpace: 'top-left',
						throwOnErrors: true
					} );

					// See the loadBuiltInMaterial() comment above - wait for any
					// <image>-backed textures to finish loading before training
					// can bake the teacher.
					if ( asset.texturesReady ) await asset.texturesReady;

					builtInMaterial.value = '';
					setMaterialXMaterial( asset, file.name );

				} catch ( error ) {

					console.error( error );
					status.textContent = error.message;

				}

				event.target.value = '';

			}

			async function onNeuralFileSelected( event ) {

				const file = event.target.files[ 0 ];
				if ( file === undefined ) return;

				status.textContent = `Loading ${file.name}...`;

				try {

					const json = JSON.parse( await file.text() );
					const neuralData = new NeuralAppearanceLoader().parse( cloneNeuralAppearanceJson( json ) );

					trainingRunId ++;
					materialXMaterial = undefined;
					builtInMaterial.value = '';
					latestJson = json;
					disposeNeuralMaterial();
					neuralMaterial = new NeuralAppearanceNodeMaterial( neuralData, {
						debugView: params.debugView
					} );
					materialName.textContent = json.name || file.name;
					updateNeuralRepresentationSize( json );
					params.view = 'trained neural';
					comparisonVisible = false;
					hideTrainingResults();
					trainButton.disabled = true;
					downloadButton.disabled = false;
					window.__neuralAppearanceTrainingDone = false;
					window.__neuralAppearanceExportJson = null;
					updateView();
					status.textContent = `Loaded ${file.name}.`;

				} catch ( error ) {

					console.error( error );
					status.textContent = error.message;

				}

				event.target.value = '';

			}

			function setMaterialXMaterial( asset, name ) {

				const materials = normalizeMaterialXMaterials( asset );

				const material = selectMaterialXMaterial( materials );

				if ( material === undefined ) {

					throw new Error( 'THREE.NeuralAppearanceTrainer: MaterialXLoader did not produce any materials.' );

				}

				if ( isPhysicalNodeMaterial( material ) === false ) {

					throw new Error( 'THREE.NeuralAppearanceTrainer: MaterialX must define a supported physical surface material.' );

				}

				materialXMaterial = material;
				materialName.textContent = material.name || name;
				params.view = 'MaterialX teacher';
				comparisonVisible = false;
				latestJson = null;
				trainingRunId ++;
				disposeNeuralMaterial();
				window.__neuralAppearanceTrainingDone = false;
				window.__neuralAppearanceFirstLoss = NaN;
				window.__neuralAppearanceValidationLoss = NaN;
				window.__neuralAppearanceValidation = null;
				resetLossGraph();
				window.__neuralAppearanceExportJson = null;
				window.__neuralAppearanceTeacherInputs = null;
				downloadButton.disabled = true;
				trainButton.disabled = false;
				hideTrainingResults();
				updateTrainingEstimate();
				updateView();
				status.textContent = getMaterialXStatus( asset, material );

			}

			function normalizeMaterialXMaterials( asset ) {

				return asset && asset.materials ? asset.materials : asset;

			}

			function getMaterialXStatus( asset, material ) {

				const log = asset && Array.isArray( asset.log ) ? asset.log : [];
				const errorCount = log.filter( ( entry ) => entry.severity === 'error' ).length;
				const warningCount = log.filter( ( entry ) => entry.severity === 'warning' ).length;
				const suffix = log.length > 0 ? `\nMaterialX log: ${errorCount} error(s), ${warningCount} warning(s). See console for details.` : '';

				if ( log.length > 0 ) {

					console.groupCollapsed( `THREE.MaterialXLoader: ${errorCount} error(s), ${warningCount} warning(s) for ${material.name || 'material'}` );

					for ( const entry of log ) {

						console[ entry.severity === 'warning' ? 'warn' : 'error' ]( `${entry.severity}: ${entry.code}: ${entry.message}` );

					}

					console.groupEnd();

				}

				return 'MaterialX loaded. Press Train to distill it.' + suffix;

			}

			function selectMaterialXMaterial( materials ) {

				const materialList = Object.values( materials );

				return materialList.find( isPhysicalNodeMaterial ) || materialList[ 0 ];

			}

			function isPhysicalNodeMaterial( material ) {

				return material !== undefined && (
					material.isMeshPhysicalNodeMaterial === true ||
					material.type === 'MeshPhysicalNodeMaterial'
				);

			}

			async function train() {

				if ( materialXMaterial === undefined ) return;

				setTrainingUi( true );
				comparisonVisible = true;
				showTrainingResults();
				updateView();
				const runId = ++ trainingRunId;
				const trainingMaterial = materialXMaterial;
				window.__neuralAppearanceTrainingDone = false;
				window.__neuralAppearanceFirstLoss = NaN;
				window.__neuralAppearanceValidationLoss = NaN;
				window.__neuralAppearanceValidation = null;
				resetLossGraph();
				status.textContent = 'Training...';

				try {

					const trainer = new NeuralAppearanceTrainer( {
						name: `${materialXMaterial.name || 'MaterialX'} neural appearance`,
						levels: Number( params.levels ),
						baseResolution: Number( params.baseResolution ),
						growthFactor: Number( params.growthFactor ),
						iterations: Number( params.iterations ),
						batchSize: Number( params.batchSize ),
						learningRate: Number( params.learningRate ),
						hiddenSize: Number( params.hiddenSize ),
						peOctaves: Number( params.peOctaves ),
						inputEncoding: params.inputEncoding,
						previewSampleCount: Number( params.previewSamples ),
						quantization: { mode: params.quantization },
						seed: Number( params.seed )
					} );
					activeTrainer = trainer;
					let lastLiveMaterialUpdate = - Infinity;
					const result = await trainer.train( {
						renderer,
						material: trainingMaterial,
						environment: environmentMap,
						onProgress: ( progress ) => {

							window.__neuralAppearanceLastLoss = progress.loss;
							if ( progress.iteration === 1 ) window.__neuralAppearanceFirstLoss = progress.loss;
							if ( Number.isFinite( progress.validationLoss ) ) window.__neuralAppearanceValidationLoss = progress.validationLoss;
							if ( progress.validation ) window.__neuralAppearanceValidation = progress.validation;
							appendLossPoint( progress );

							const now = performance.now();
							if ( progress.iteration === 1 || progress.iteration === progress.iterations || now - lastLiveMaterialUpdate >= 1000 ) {

								showLiveNeuralMaterial( progress.json );
								lastLiveMaterialUpdate = now;

							}

							if ( progress.iteration % 20 === 0 || progress.iteration === progress.iterations ) {

								// The current iteration and primary loss are shown on
								// the loss graph itself (top-right / bottom-right)
								// rather than duplicated here - see NeuralLossGraph.js.
								const validationText = formatValidationStatus( progress.validation, progress.validationLoss );
								const phaseText = progress.phase === 'ibl' ? 'IBL refinement' : 'Training';
								status.textContent = `${phaseText}...\n${formatTrainingLossStatus( progress )}${validationText}`;

							}

							drawLossGraph();

						}
					} );

					const teacherInputs = result.teacher.encodeInputs ? result.teacher.encodeInputs() : null;

					if ( runId !== trainingRunId || materialXMaterial !== trainingMaterial ) {

						disposeTrainingResult( result, renderer );
						return;

					}

					latestJson = result.json;
					updateNeuralRepresentationSize( latestJson );
					applyNeuralAppearanceData( new NeuralAppearanceLoader().parse( cloneNeuralAppearanceJson( latestJson ) ) );
					params.view = 'trained neural';
					comparisonVisible = true;
					window.__neuralAppearanceLastLoss = result.loss;
					window.__neuralAppearanceValidationLoss = result.validationLoss;
					window.__neuralAppearanceValidation = result.validation;
					window.__neuralAppearanceExportJson = cloneNeuralAppearanceJson( latestJson );
					window.__neuralAppearanceTeacherInputs = teacherInputs;
					window.__neuralAppearanceTrainingDone = true;
					downloadButton.disabled = false;
					disposeTrainingResult( result, renderer );
					updateView();
					drawLossGraph();
					const validationText = formatValidationStatus( result.validation, result.validationLoss );
					status.textContent = result.stoppedEarly ?
						`Training stopped.\n${formatTrainingLossStatus( result )}${validationText}` :
						`Training complete.\n${formatTrainingLossStatus( result )}${validationText}`;

				} catch ( error ) {

					console.error( error );
					status.textContent = error.message;

				} finally {

					activeTrainer = null;
					setTrainingUi( false );
					updateView();

				}

			}

			function stopTraining() {

				if ( activeTrainer === null ) return;

				activeTrainer.abort();
				stopButton.disabled = true;
				status.textContent = 'Stopping...';

			}

			function setTrainingUi( active ) {

				isTraining = active;
				stopButton.disabled = ! active;
				trainButton.disabled = active || materialXMaterial === undefined;
				builtInMaterial.disabled = active;
				openButton.disabled = active;
				openNeuralButton.disabled = active;

			}

			function showLiveNeuralMaterial( json ) {

				applyNeuralAppearanceData( new NeuralAppearanceLoader().parse( json ) );
				params.view = 'trained neural';
				comparisonVisible = true;
				updateView();
				mode.textContent = params.debugView === 'shaded' ? 'live neural (training)' : `live neural (training) / ${ params.debugView }`;

			}

			function applyNeuralAppearanceData( neuralData ) {

				if ( neuralMaterial && neuralMaterial.updateFromData( neuralData ) ) {

					return;

				}

				disposeNeuralMaterial();
				neuralMaterial = new NeuralAppearanceNodeMaterial( neuralData, {
					debugView: params.debugView
				} );

			}

			function showTrainingResults() {

				lossPanel.hidden = false;
				modelLabels.hidden = false;

			}

			function hideTrainingResults() {

				lossPanel.hidden = true;
				modelLabels.hidden = true;

			}

			function resetLossGraph() {

				lossGraph.reset();
				window.__neuralAppearanceLossHistory = lossGraph.history;

			}

			function formatTrainingLossStatus( progress ) {

				// The primary loss is shown on the loss graph itself (top-right)
				// rather than duplicated here - see NeuralLossGraph.js.
				const parts = [];
				if ( Number.isFinite( progress.directLoss ) ) parts.push( `direct ${progress.directLoss.toExponential( 3 )}` );
				if ( Number.isFinite( progress.iblLoss ) ) parts.push( `ibl ${progress.iblLoss.toExponential( 3 )}` );
				return parts.join( '  ' );

			}

			function formatValidationStatus( validation, validationLoss ) {

				if ( Number.isFinite( validationLoss ) === false ) return '';

				const parts = [];
				if ( validation && Number.isFinite( validation.directLoss ) ) parts.push( `direct ${validation.directLoss.toExponential( 3 )}` );
				if ( validation && Number.isFinite( validation.iblQueryLoss ) ) parts.push( `query ${validation.iblQueryLoss.toExponential( 3 )}` );
				if ( validation && Number.isFinite( validation.iblIndirectLoss ) ) parts.push( `indirect ${validation.iblIndirectLoss.toExponential( 3 )}` );
				const detail = parts.length > 0 ? ` (${ parts.join( ', ' ) })` : '';
				return `\nruntime validation ${validationLoss.toExponential( 3 )}${detail}`;

			}

			function appendLossPoint( progress ) {

				lossGraph.addPoint( {
					iteration: progress.iteration,
					loss: progress.loss,
					directLoss: progress.directLoss,
					iblLoss: progress.iblLoss,
					validationLoss: progress.validationLoss,
					validationDirectLoss: progress.validation ? progress.validation.directLoss : undefined,
					validationIblLoss: progress.validation ? progress.validation.iblLoss : undefined
				} );

			}

			function drawLossGraph() {

				lossGraph.draw();

			}

			function disposeNeuralMaterial() {

				if ( neuralMaterial === undefined || neuralMaterial === null ) return;

				// NeuralAppearanceNodeMaterial.dispose() now also releases its
				// own latentTextures - no need to do that here first.
				neuralMaterial.dispose();
				neuralMaterial = null;

			}

			function updateView() {

				syncTeacherDebugMaterials();
				applyLights();

				if ( neuralMaterial ) {

					if ( neuralMaterial.debugView !== params.debugView ) {

						neuralMaterial.debugView = params.debugView;
						neuralMaterial.needsUpdate = true;

					}

					neuralMaterial.toneMapped = params.debugView === 'shaded' || params.debugView === 'ibl' || params.debugView === 'iblRadiance' || params.debugView === 'iblIrradiance';

				}

				const teacherMaterial = getTeacherDisplayMaterial();
				const neuralDisplayMaterial = getNeuralDisplayMaterial();
				const labels = getDebugLabels();
				teacherLabel.textContent = labels.teacher;
				neuralLabel.textContent = labels.neural;

				if ( comparisonVisible ) {

					mode.textContent = isTraining ? 'training comparison' : 'teacher / neural comparison';
					if ( params.debugView !== 'shaded' ) mode.textContent += ` / ${ params.debugView }`;
					mesh.position.x = - 1.25;
					neuralMesh.position.x = 1.25;
					mesh.scale.setScalar( 0.58 );
					neuralMesh.scale.setScalar( 0.58 );
					if ( teacherMaterial ) mesh.material = teacherMaterial;
					neuralMesh.material = neuralDisplayMaterial;
					mesh.visible = true;
					neuralMesh.visible = true;
					modelLabels.hidden = false;

				} else {

					mode.textContent = params.debugView === 'shaded' ? params.view : `${ params.view } / ${ params.debugView }`;
					mesh.position.x = 0;
					mesh.scale.setScalar( 1 );
					mesh.visible = true;
					neuralMesh.visible = false;
					modelLabels.hidden = true;

					if ( params.view === 'trained neural' && neuralMaterial ) {

						mesh.material = neuralDisplayMaterial;

					} else if ( params.view === 'forced white' && whiteControlMaterial ) {

						mesh.material = whiteControlMaterial;

					} else if ( teacherMaterial ) {

						mesh.material = teacherMaterial;

					}

				}

				window.__neuralAppearanceActiveMaterialType = mesh.material ? mesh.material.type : '';
				window.__neuralAppearanceDebugView = params.debugView;

			}

			function getTeacherDisplayMaterial() {

				if ( params.debugView === 'normal' && teacherNormalMaterial ) return teacherNormalMaterial;
				if ( params.debugView === 'reflection' && teacherReflectionMaterial ) return teacherReflectionMaterial;
				if ( params.debugView === 'roughness' && teacherRoughnessMaterial ) return teacherRoughnessMaterial;
				if ( params.debugView === 'irradiance' && teacherIrradianceMaterial ) return teacherIrradianceMaterial;
				if ( params.debugView === 'ibl' || params.debugView === 'iblRadiance' || params.debugView === 'iblIrradiance' ) return materialXMaterial;

				return materialXMaterial;

			}

			function getNeuralDisplayMaterial() {

				return neuralMaterial || previewPlaceholderMaterial;

			}

			function getDebugLabels() {

				if ( params.debugView === 'normal' ) {

					return {
						teacher: 'Teacher normal',
						neural: 'Neural estimated normal'
					};

				}

				if ( params.debugView === 'reflection' ) {

					return {
						teacher: 'Teacher reflection',
						neural: 'Neural estimated reflection'
					};

				}

				if ( params.debugView === 'roughness' ) {

					return {
						teacher: 'Teacher roughness',
						neural: 'Neural IBL roughness'
					};

				}

				if ( params.debugView === 'irradiance' ) {

					return {
						teacher: 'Teacher IBL irradiance direction',
						neural: 'Neural IBL irradiance direction'
					};

				}

				if ( params.debugView === 'ibl' ) {

					return {
						teacher: 'Teacher IBL',
						neural: 'Neural IBL'
					};

				}

				if ( params.debugView === 'iblRadiance' ) {

					return {
						teacher: 'Teacher specular IBL',
						neural: 'Neural radiance IBL'
					};

				}

				if ( params.debugView === 'iblIrradiance' ) {

					return {
						teacher: 'Teacher diffuse/sheen IBL',
						neural: 'Neural irradiance IBL'
					};

				}

				return {
					teacher: 'MaterialX teacher',
					neural: 'Neural output'
				};

			}

			function syncTeacherDebugMaterials() {

				const normalNode = materialXMaterial ? materialXMaterial.normalNode : null;

				if ( teacherNormalMaterial && teacherNormalMaterial.normalNode !== normalNode ) {

					teacherNormalMaterial.normalNode = normalNode;
					teacherNormalMaterial.needsUpdate = true;

				}

				if ( teacherReflectionMaterial && teacherReflectionMaterial.normalNode !== normalNode ) {

					teacherReflectionMaterial.normalNode = normalNode;
					teacherReflectionMaterial.needsUpdate = true;

				}

				if ( teacherIrradianceMaterial && teacherIrradianceMaterial.normalNode !== normalNode ) {

					teacherIrradianceMaterial.normalNode = normalNode;
					teacherIrradianceMaterial.needsUpdate = true;

				}

				const roughnessSource = materialXMaterial ?
					( materialXMaterial.roughnessNode !== undefined && materialXMaterial.roughnessNode !== null ?
						materialXMaterial.roughnessNode :
						materialXMaterial.roughness ) :
					null;

				if ( teacherRoughnessMaterial && teacherRoughnessMaterial.userData.roughnessSource !== roughnessSource ) {

					teacherRoughnessMaterial.userData.roughnessSource = roughnessSource;
					const roughness = roughnessSource !== null && roughnessSource !== undefined ? TSL.float( roughnessSource ) : TSL.float( 1 );
					teacherRoughnessMaterial.colorNode = TSL.colorSpaceToWorking(
						TSL.vec4( TSL.vec3( roughness ), 1 ),
						THREE.SRGBColorSpace
					);
					teacherRoughnessMaterial.needsUpdate = true;

				}

				applyTeacherIblIsolate( materialXMaterial );

			}

			function applyTeacherIblIsolate( material ) {

				if ( ! material ) return;

				const isolate = params.debugView === 'iblRadiance' ? 'radiance' :
					params.debugView === 'iblIrradiance' ? 'irradiance' :
						params.debugView === 'ibl' ? 'full' :
							null;

				let state = teacherIblDebugState.get( material );
				if ( state === undefined ) {

					state = {
						isolate: undefined,
						setupLightingModel: material.setupLightingModel.bind( material ),
						setupEnvironment: material.setupEnvironment.bind( material ),
						customProgramCacheKey: material.customProgramCacheKey.bind( material )
					};
					teacherIblDebugState.set( material, state );

				}

				if ( state.isolate === isolate ) return;
				state.isolate = isolate;

				if ( isolate === null ) {

					material.setupLightingModel = state.setupLightingModel;
					material.setupEnvironment = state.setupEnvironment;
					material.customProgramCacheKey = state.customProgramCacheKey;
					delete material.teacherIblIsolate;

				} else {

					material.teacherIblIsolate = isolate;
					material.setupLightingModel = function () {

						return new NeuralTeacherIBLLightingModel( this, isolate );

					};

					material.setupEnvironment = function ( builder ) {

						let envNode = THREE.NodeMaterial.prototype.setupEnvironment.call( this, builder );
						if ( envNode === null && builder.environmentNode ) envNode = builder.environmentNode;
						return envNode ? new NeuralTeacherIBLEnvironmentNode( envNode, isolate ) : null;

					};

					material.customProgramCacheKey = function () {

						return state.customProgramCacheKey() + '|teacherIblIsolate:' + isolate;

					};

				}

				material.needsUpdate = true;

			}

			function applyLights() {

				const isolateIbl = params.debugView === 'ibl' || params.debugView === 'iblRadiance' || params.debugView === 'iblIrradiance';

				directLights.forEach( ( light ) => {

					light.intensity = isolateIbl === false ? light.userData.baseIntensity : 0;

					if ( light.parent !== scene ) scene.add( light );

				} );

				if ( scene.environment !== environmentMap ) {

					scene.environment = environmentMap;

					if ( neuralMaterial ) neuralMaterial.needsUpdate = true;

				}

			}

			function updateLighting() {

				applyLights();
				if ( mesh ) updateView();

			}

			function download() {

				if ( latestJson === undefined || latestJson === null ) return;

				const blob = new Blob( [ JSON.stringify( cloneNeuralAppearanceJson( latestJson ), null, '\t' ) ], { type: 'application/json' } );
				const url = URL.createObjectURL( blob );
				const link = document.createElement( 'a' );
				link.href = url;
				link.download = 'neural_appearance.neuralAppearance';
				link.click();
				URL.revokeObjectURL( url );

			}

			function cloneNeuralAppearanceJson( json ) {

				return JSON.parse( JSON.stringify( json ) );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function render() {

				const time = performance.now() * 0.001;

				if ( mesh && noRotate === false && isTraining === false ) {

					mesh.rotation.y = time * 0.15;
					neuralMesh.rotation.y = mesh.rotation.y;

				}

				renderer.render( scene, camera );
				frameToken ++;
				window.__neuralAppearanceFrameToken = frameToken;
				window.__neuralAppearanceRenderView = params.view;
				window.__neuralAppearanceDebugView = params.debugView;

			}

			function readNumberQuery( name, fallback ) {

				const rawValue = queryParams.get( name );
				const value = Number( rawValue );

				return rawValue !== null && Number.isFinite( value ) ? value : fallback;

			}

			function updateTrainingEstimate() {

				const memory = estimateTrainingMemory( Number( params.levels ), Number( params.baseResolution ), Number( params.growthFactor ) );
				const hiddenSize = Number( params.hiddenSize );
				const latentChannels = memory.levels * 4;
				const decoderInputSize = latentChannels + 12;
				const rotationValues = latentChannels * 12;
				const layerValues = computeMLPParamCount( { inputSize: decoderInputSize, hiddenSize, hiddenLayers: 2, outputSize: 3 } );
				const iblHiddenSize = Math.min( Math.max( hiddenSize, 16 ), 32 );
				const iblInputSize = latentChannels + 6;
				const indirectInputSize = latentChannels + 6;
				const iblLayerValues = computeMLPParamCount( { inputSize: iblInputSize, hiddenSize: iblHiddenSize, hiddenLayers: 1, outputSize: 4 } );
				const indirectLayerValues = computeMLPParamCount( { inputSize: indirectInputSize, hiddenSize: iblHiddenSize, hiddenLayers: 1, outputSize: 3 } );
				const representationBytes = memory.exportBytes + ( rotationValues + layerValues + iblLayerValues + indirectLayerValues ) * 4;
				const recordsPerIteration = Number( params.batchSize );
				const records = recordsPerIteration * Number( params.iterations );

				window.__neuralAppearanceMemoryEstimate = memory;
				neuralRepresentationSize.textContent = `${representationBytes.toLocaleString()} bytes`;
				const finestResolution = memory.resolutions[ memory.resolutions.length - 1 ];
				estimate.textContent = `${memory.levels} levels (${memory.baseResolution}px - ${finestResolution}px, growth ${memory.growthFactor}x), ${memory.latentTexels.toLocaleString()} latent texels\n~${formatBytes( memory.trainingBytes )} training state + ${formatBytes( memory.exportBytes )} FP16 latents\n${recordsPerIteration.toLocaleString()} records/iteration, ${records.toLocaleString()} total`;

			}

			function updateNeuralRepresentationSize( json ) {

				let bytes = 0;

				for ( const level of json.latents.levels ) bytes += level.data.length * 2;

				const outputs = json.outputs || {};
				if ( outputs.brdf && outputs.brdf.rotation ) bytes += outputs.brdf.rotation.weights.length * 4;

				for ( const output of Object.values( outputs ) ) {

					for ( const layer of output.layers ) {

						bytes += ( layer.weights.length + layer.biases.length ) * 4;

					}

				}

				const outputNames = Object.keys( outputs ).join( ', ' );
				neuralRepresentationSize.textContent = `${bytes.toLocaleString()} bytes (${outputNames})`;

			}

		</script>
	</body>
</html>
