<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - materials - neural texture</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - materials - neural texture">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_materials_neural_texture.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_materials_neural_texture.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
		<style>
			#panel {
				position: absolute;
				left: 16px;
				bottom: 16px;
				padding: 12px;
				width: 320px;
				background: rgba( 0, 0, 0, 0.7 );
				color: #fff;
				font: 12px/1.45 monospace;
				border-radius: 4px;
				z-index: 2;
			}

			#panel button {
				margin: 4px 4px 4px 0;
			}

			#panel select {
				box-sizing: border-box;
				margin: 4px 0;
				width: 100%;
			}

			#status {
				margin-top: 8px;
				white-space: pre-line;
			}

			#lossPanel {
				position: absolute;
				right: 16px;
				bottom: 16px;
				padding: 12px;
				background: rgba( 0, 0, 0, 0.7 );
				color: #fff;
				font: 12px/1.45 monospace;
				border-radius: 4px;
				z-index: 2;
			}

			#lossPanel[hidden],
			#modelLabels[hidden] {
				display: none;
			}

			#modelLabels {
				position: absolute;
				left: 0;
				right: 0;
				top: 120px;
				display: flex;
				justify-content: center;
				gap: min( 35vw, 420px );
				color: #fff;
				font: 13px/1.45 monospace;
				pointer-events: none;
				z-index: 1;
			}

			#modelLabels span {
				width: 180px;
				text-align: center;
				text-shadow: 0 1px 3px #000;
			}

			#lossGraph {
				display: block;
				width: 396px;
				height: 120px;
				background: #050505;
				border: 1px solid rgba( 255, 255, 255, 0.25 );
			}

			#lossLegend {
				display: flex;
				justify-content: center;
				gap: 12px;
				margin-top: 4px;
				color: #bbb;
			}
		</style>
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Neural Texture</span>
			</div>

			<small>
				Fits a small multiresolution-grid + MLP network to a single material input texture (e.g. a MaterialX base color), instead of the whole shading model.
			</small>
		</div>

		<div id="panel">
			<div><strong>Source:</strong> <span id="sourceName">loading default</span></div>
			<label for="builtInMaterial"><strong>Built-in MaterialX:</strong></label>
			<select id="builtInMaterial">
				<option value="checkerboard">Checkerboard 4x4</option>
				<option value="uvGrid">UV rainbow waves</option>
				<option value="lambertRed">Lambert red</option>
				<option value="lambertGreen">Lambert green</option>
				<option value="lambertBlue">Lambert blue</option>
				<option value="glossyGold">Metallic gold</option>
				<option value="velvet">Velvet</option>
				<option value="emissiveGrid">Emissive rainbow waves</option>
				<option value="brick">Brick wall</option>
				<option value="roadAggregate">Road aggregate</option>
				<option value="" disabled>Custom file</option>
			</select>
			<button id="openMtlxButton">Open .mtlx</button>
			<button id="openImageButton">Open image</button>
			<button id="trainButton">Train</button>
			<button id="stopButton" disabled>Stop training</button>
			<div><strong>Network size:</strong> <span id="networkSize">—</span></div>
			<div id="status">Ready.</div>
			<input id="mtlxFileInput" type="file" accept=".mtlx,.zip,.mtlx.zip" hidden>
			<input id="imageFileInput" type="file" accept="image/*" hidden>
		</div>

		<div id="modelLabels" hidden>
			<span>Source texture</span>
			<span id="neuralLabel">Neural output</span>
		</div>

		<div id="lossPanel" hidden>
			<div><strong>Training loss</strong></div>
			<canvas id="lossGraph" width="396" height="120"></canvas>
			<div id="lossLegend"></div>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import * as TSL from 'three/tsl';

			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import WebGPU from 'three/addons/capabilities/WebGPU.js';
			import { MaterialXLoader } from 'three/addons/loaders/MaterialXLoader.js';
			import { NeuralTextureTrainer } from 'three/addons/neural-texture/NeuralTextureTrainer.js';
			import { NeuralTextureNodeMaterial } from 'three/addons/neural-texture/NeuralTextureNodeMaterial.js';
			import { NeuralTextureSource, extractBaseColorNode } from 'three/addons/neural-texture/NeuralTextureSource.js';
			import { computeTextureModelLayout } from 'three/addons/neural-texture/NeuralTextureGPUModel.js';
			import { computeGridLevels, computeTileOctaves, GRID_LEVELS_OPTIONS, GRID_BASE_RESOLUTION_OPTIONS, GRID_GROWTH_FACTOR_OPTIONS, MLP_HIDDEN_SIZE_OPTIONS } from 'three/addons/neural/NeuralGridModel.js';
			import { NeuralLossGraph } from 'three/addons/neural/NeuralLossGraph.js';
			import { formatModelSizeSummary } from 'three/addons/neural/NeuralModelSize.js';

			let camera, scene, renderer;
			let teacherMesh, neuralMesh, teacherMaterial, neuralMaterial, placeholderMaterial;
			let source = null, materialXMaterial = null;
			let isTraining = false, activeTrainer = null, comparisonVisible = false;

			const params = {
				bakeResolution: 1024,
				uvScaleX: 1,
				uvScaleY: 1,
				uvOffsetX: 0,
				uvOffsetY: 0,
				levels: 4,
				baseResolution: 16,
				growthFactor: 2,
				hiddenSize: 16,
				inputEncoding: 'positional',
				batchSize: 8192,
				iterations: 3000,
				learningRate: 0.01,
				outputMode: 'neural',
				errorScale: 6
			};

			const uvScaleUniform = TSL.uniform( new THREE.Vector2( 1, 1 ) );
			const uvOffsetUniform = TSL.uniform( new THREE.Vector2( 0, 0 ) );

			const materialPresets = {
				checkerboard: 'neural_train_checkerboard.mtlx',
				uvGrid: 'neural_train_uv_grid.mtlx',
				lambertRed: 'neural_train_lambert_red.mtlx',
				lambertGreen: 'neural_train_lambert_green.mtlx',
				lambertBlue: 'neural_train_lambert_blue.mtlx',
				glossyGold: 'neural_train_glossy_gold.mtlx',
				velvet: 'neural_train_velvet.mtlx',
				emissiveGrid: 'neural_train_emissive_grid.mtlx',
				brick: 'neural_train_brick.mtlx',
				roadAggregate: 'neural_train_road_aggregate.mtlx'
			};

			const sourceName = document.getElementById( 'sourceName' );
			const status = document.getElementById( 'status' );
			const builtInMaterial = document.getElementById( 'builtInMaterial' );
			const mtlxFileInput = document.getElementById( 'mtlxFileInput' );
			const imageFileInput = document.getElementById( 'imageFileInput' );
			const openMtlxButton = document.getElementById( 'openMtlxButton' );
			const openImageButton = document.getElementById( 'openImageButton' );
			const trainButton = document.getElementById( 'trainButton' );
			const stopButton = document.getElementById( 'stopButton' );
			const modelLabels = document.getElementById( 'modelLabels' );
			const lossPanel = document.getElementById( 'lossPanel' );
			const lossGraph = new NeuralLossGraph(
				document.getElementById( 'lossGraph' ),
				[ { key: 'loss', label: 'L2 loss (log)', color: '#50c8ff' } ],
				{ legend: document.getElementById( 'lossLegend' ) }
			);

			init();

			async function init() {

				if ( WebGPU.isAvailable() === false ) {

					document.body.appendChild( WebGPU.getErrorMessage() );
					throw new Error( 'No WebGPU support' );

				}

				const container = document.createElement( 'div' );
				document.body.appendChild( container );

				camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 0, 3.2 );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x15171c );

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( render );
				renderer.domElement.id = 'neuralParametersCanvas';
				renderer.inspector = new Inspector();
				container.appendChild( renderer.domElement );
				await renderer.init();

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.enableRotate = false;
				controls.target.set( 0, 0, 0 );
				controls.update();

				const geometry = new THREE.PlaneGeometry( 1, 1 );
				placeholderMaterial = new THREE.MeshBasicNodeMaterial( { color: 0x222222 } );

				teacherMesh = new THREE.Mesh( geometry, placeholderMaterial );
				teacherMesh.position.x = - 0.65;
				scene.add( teacherMesh );

				neuralMesh = new THREE.Mesh( geometry, placeholderMaterial );
				neuralMesh.position.x = 0.65;
				scene.add( neuralMesh );

				const gui = renderer.inspector.createParameters( 'Neural Texture' );

				const sourceFolder = gui.addFolder( 'source' );
				sourceFolder.add( params, 'bakeResolution', [ 128, 256, 512, 1024, 2048, 4096 ] ).name( 'bake resolution' ).onChange( () => { reloadCurrentSource(); updateNetworkSize(); } );

				const uvFolder = gui.addFolder( 'uv scale / offset' );
				uvFolder.add( params, 'uvScaleX', 0.1, 8, 0.05 ).name( 'scale x' ).onChange( updateUvUniforms );
				uvFolder.add( params, 'uvScaleY', 0.1, 8, 0.05 ).name( 'scale y' ).onChange( updateUvUniforms );
				uvFolder.add( params, 'uvOffsetX', - 4, 4, 0.01 ).name( 'offset x' ).onChange( updateUvUniforms );
				uvFolder.add( params, 'uvOffsetY', - 4, 4, 0.01 ).name( 'offset y' ).onChange( updateUvUniforms );

				const networkFolder = gui.addFolder( 'network (grid + MLP)' );
				networkFolder.add( params, 'levels', GRID_LEVELS_OPTIONS ).name( 'grid levels' ).onChange( updateNetworkSize );
				networkFolder.add( params, 'baseResolution', GRID_BASE_RESOLUTION_OPTIONS ).name( 'grid base res' ).onChange( updateNetworkSize );
				networkFolder.add( params, 'growthFactor', GRID_GROWTH_FACTOR_OPTIONS ).name( 'grid growth factor' ).onChange( updateNetworkSize );
				networkFolder.add( params, 'hiddenSize', MLP_HIDDEN_SIZE_OPTIONS ).name( 'MLP hidden width (x2 layers)' ).onChange( updateNetworkSize );
				networkFolder.add( params, 'inputEncoding', [ 'none', 'raw', 'positional' ] ).name( 'uv input encoding' ).onChange( updateNetworkSize );

				const trainingFolder = gui.addFolder( 'training' );
				trainingFolder.add( params, 'batchSize', [ 1024, 2048, 4096, 8192, 16384 ] ).name( 'batch size' );
				trainingFolder.add( params, 'iterations', 200, 20000, 100 ).name( 'iterations' );
				trainingFolder.add( params, 'learningRate', 0.001, 0.05, 0.001 ).name( 'learning rate' );

				const viewFolder = gui.addFolder( 'view' );
				viewFolder.add( params, 'outputMode', [ 'neural', 'diff' ] ).name( 'right side shows' ).onChange( () => rebuildNeuralMaterial( null ) );
				viewFolder.add( params, 'errorScale', 1, 30, 0.5 ).name( 'error amplification' ).onChange( () => rebuildNeuralMaterial( null ) );

				builtInMaterial.addEventListener( 'change', () => loadBuiltInMaterial( builtInMaterial.value ) );
				openMtlxButton.addEventListener( 'click', () => mtlxFileInput.click() );
				mtlxFileInput.addEventListener( 'change', onMtlxFileSelected );
				openImageButton.addEventListener( 'click', () => imageFileInput.click() );
				imageFileInput.addEventListener( 'change', onImageFileSelected );
				trainButton.addEventListener( 'click', train );
				stopButton.addEventListener( 'click', stopTraining );
				window.addEventListener( 'resize', onWindowResize );

				updateUvUniforms();
				updateNetworkSize();
				builtInMaterial.value = 'checkerboard';
				await loadBuiltInMaterial( 'checkerboard' );

			}

			function updateUvUniforms() {

				uvScaleUniform.value.set( params.uvScaleX, params.uvScaleY );
				uvOffsetUniform.value.set( params.uvOffsetX, params.uvOffsetY );

			}

			// The finest grid level is very likely coarser than the actual bake
			// resolution content is fit at - NTC-style tiled positional encoding
			// (see NeuralGridModel.js) bridges that gap, sized automatically from
			// how many octaves of upsampling separate the two (never fewer than
			// the paper's own default of 3 octaves).
			function currentPeOctaves() {

				const resolutions = computeGridLevels( Number( params.baseResolution ), Number( params.growthFactor ), Number( params.levels ) );
				const finestGridResolution = resolutions[ resolutions.length - 1 ];

				return Math.max( 3, computeTileOctaves( finestGridResolution, Number( params.bakeResolution ) ) );

			}

			function updateNetworkSize() {

				const hidden = Number( params.hiddenSize );
				const layout = computeTextureModelLayout( {
					channels: 4,
					levels: Number( params.levels ),
					baseResolution: Number( params.baseResolution ),
					growthFactor: Number( params.growthFactor ),
					hiddenSizes: [ hidden, hidden ],
					outputChannels: 3,
					peOctaves: currentPeOctaves(),
					inputEncoding: params.inputEncoding
				} );

				const latentTexels = layout.gridLevels.reduce( ( sum, level ) => sum + level.texelCount, 0 );
				const latentBytes = layout.totalLatents * 2; // exported as fp16, like the neural appearance runtime
				const weightBytes = layout.totalWeights * 4; // fp32

				document.getElementById( 'networkSize' ).textContent = formatModelSizeSummary( {
					grid: { label: `${latentTexels.toLocaleString()} texels`, bytes: latentBytes },
					heads: [ { label: 'MLP', bytes: weightBytes } ]
				} );

			}

			async function loadBuiltInMaterial( key ) {

				const file = materialPresets[ key ];
				if ( file === undefined ) return;

				try {

					builtInMaterial.disabled = true;
					status.textContent = `Loading ${file}...`;
					const loader = new MaterialXLoader().setPath( 'materialx/' );
					const asset = await loader.loadAsync( file, { uvSpace: 'top-left', throwOnErrors: true } );
					const materials = asset && asset.materials ? asset.materials : asset;
					const material = Object.values( materials ).find( isPhysicalNodeMaterial ) || Object.values( materials )[ 0 ];

					if ( material === undefined ) throw new Error( 'MaterialXLoader did not produce any materials.' );

					materialXMaterial = material;
					await setSourceFromMaterialX( material, file );

				} catch ( error ) {

					console.error( error );
					status.textContent = error.message;

				} finally {

					builtInMaterial.disabled = isTraining;

				}

			}

			async function onMtlxFileSelected( event ) {

				const file = event.target.files[ 0 ];
				if ( file === undefined ) return;

				try {

					status.textContent = `Loading ${file.name}...`;
					const loader = new MaterialXLoader();
					const asset = loader.parseBuffer( await file.arrayBuffer(), file.name, { uvSpace: 'top-left', throwOnErrors: true } );
					const materials = asset && asset.materials ? asset.materials : asset;
					const material = Object.values( materials ).find( isPhysicalNodeMaterial ) || Object.values( materials )[ 0 ];

					if ( material === undefined ) throw new Error( 'MaterialXLoader did not produce any materials.' );

					builtInMaterial.value = '';
					materialXMaterial = material;
					await setSourceFromMaterialX( material, file.name );

				} catch ( error ) {

					console.error( error );
					status.textContent = error.message;

				}

				event.target.value = '';

			}

			async function onImageFileSelected( event ) {

				const file = event.target.files[ 0 ];
				if ( file === undefined ) return;

				try {

					status.textContent = `Loading ${file.name}...`;
					const url = URL.createObjectURL( file );
					const loaded = await NeuralTextureSource.fromImage( url );
					URL.revokeObjectURL( url );

					builtInMaterial.value = '';
					materialXMaterial = null;
					setSource( loaded );
					sourceName.textContent = file.name;
					status.textContent = `Loaded ${file.name}. Press Train to fit it.`;

				} catch ( error ) {

					console.error( error );
					status.textContent = error.message;

				}

				event.target.value = '';

			}

			function isPhysicalNodeMaterial( material ) {

				return material !== undefined && ( material.isMeshPhysicalNodeMaterial === true || material.type === 'MeshPhysicalNodeMaterial' );

			}

			async function setSourceFromMaterialX( material, name ) {

				const colorNode = extractBaseColorNode( material );
				if ( colorNode === null ) throw new Error( 'MaterialX material has no usable base color.' );

				const baked = await NeuralTextureSource.fromBakedColorNode( renderer, colorNode, Number( params.bakeResolution ) );
				setSource( baked );
				sourceName.textContent = material.name || name;
				status.textContent = 'Base color baked from MaterialX. Press Train to fit it.';

			}

			async function reloadCurrentSource() {

				if ( materialXMaterial ) await setSourceFromMaterialX( materialXMaterial, materialXMaterial.name );

			}

			function setSource( newSource ) {

				if ( source ) source.dispose();
				source = newSource;

				if ( teacherMaterial ) teacherMaterial.dispose();
				teacherMaterial = new THREE.NodeMaterial();
				teacherMaterial.lights = false;
				teacherMaterial.toneMapped = false;
				teacherMaterial.colorNode = TSL.vec4( TSL.texture( source.texture, TSL.fract( TSL.uv().mul( uvScaleUniform ).add( uvOffsetUniform ) ) ).rgb, 1 );
				teacherMesh.material = teacherMaterial;

				disposeNeuralMaterial();
				neuralMesh.material = placeholderMaterial;
				comparisonVisible = false;
				modelLabels.hidden = true;
				lossPanel.hidden = true;
				lossGraph.reset();
				trainButton.disabled = false;

			}

			async function train() {

				if ( source === null ) return;

				setTrainingUi( true );
				comparisonVisible = true;
				modelLabels.hidden = false;
				lossPanel.hidden = false;
				lossGraph.reset();
				status.textContent = 'Training...';

				try {

					const trainer = new NeuralTextureTrainer( {
						channels: 4,
						levels: Number( params.levels ),
						baseResolution: Number( params.baseResolution ),
						growthFactor: Number( params.growthFactor ),
						hiddenSizes: [ Number( params.hiddenSize ), Number( params.hiddenSize ) ],
						outputChannels: 3,
						peOctaves: currentPeOctaves(),
						inputEncoding: params.inputEncoding,
						batchSize: Number( params.batchSize ),
						iterations: Number( params.iterations ),
						learningRate: Number( params.learningRate ),
						seed: 1
					} );
					activeTrainer = trainer;

					const result = await trainer.train( {
						renderer,
						sourceTexture: source.texture,
						onProgress: ( progress ) => {

							// The current iteration and primary loss are shown on the
							// loss graph itself (top-right / bottom-right) rather than
							// duplicated in the status text - see NeuralLossGraph.js.
							lossGraph.addPoint( { iteration: progress.iteration, loss: progress.loss } );
							lossGraph.draw();
							rebuildNeuralMaterial( progress.cpuModel );

						}
					} );

					rebuildNeuralMaterial( result.cpuModel );
					status.textContent = result.stoppedEarly ? 'Stopped.' : 'Training complete.';

				} catch ( error ) {

					console.error( error );
					status.textContent = error.message;

				} finally {

					activeTrainer = null;
					setTrainingUi( false );

				}

			}

			function stopTraining() {

				if ( activeTrainer === null ) return;
				activeTrainer.abort();
				stopButton.disabled = true;
				status.textContent = 'Stopping...';

			}

			function setTrainingUi( active ) {

				isTraining = active;
				stopButton.disabled = ! active;
				trainButton.disabled = active || source === null;
				builtInMaterial.disabled = active;
				openMtlxButton.disabled = active;
				openImageButton.disabled = active;

			}

			function rebuildNeuralMaterial( cpuModel ) {

				if ( cpuModel === null && neuralMaterial === null ) return;
				if ( cpuModel === null ) cpuModel = neuralMaterial.cpuModel;

				disposeNeuralMaterial();
				neuralMaterial = new NeuralTextureNodeMaterial( cpuModel, {
					mode: params.outputMode,
					sourceTexture: source.texture,
					errorScale: Number( params.errorScale ),
					uvScaleNode: uvScaleUniform,
					uvOffsetNode: uvOffsetUniform
				} );
				neuralMesh.material = neuralMaterial;

			}

			function disposeNeuralMaterial() {

				if ( neuralMaterial === null || neuralMaterial === undefined ) return;
				neuralMaterial.dispose();
				neuralMaterial = null;

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function render() {

				teacherMesh.visible = true;
				neuralMesh.visible = comparisonVisible;

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
