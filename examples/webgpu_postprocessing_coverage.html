<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - coverage lighting</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>
		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>
			<div class="title-wrapper"><a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Coverage Lighting</span></div>
			<small>Coverage-based resolve of SSR and reflection probes by <a href="https://ben3d.ca" target="_blank" rel="noopener">Ben Houston</a><br />
				<a href="https://sketchfab.com/3d-models/space-ship-hallway-e97dce00ae5549a8a3795e06bc2cfc96" target="_blank" rel="noopener">Space Ship Hallway</a> by <a href="https://sketchfab.com/yeeyeeman" target="_blank" rel="noopener">yeeyeeman</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>.<br />
				<span id="status">Loading corridor…</span>
			</small>
		</div>
		<script type="importmap">
			{
				"imports": {
					"three": "../src/Three.WebGPU.js",
					"three/webgpu": "../src/Three.WebGPU.js",
					"three/tsl": "../src/Three.TSL.js",
					"three/addons/": "./jsm/",
					"three-mesh-bvh/webgpu": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.18/src/webgpu/index.js"
				}
			}
		</script>
		<script type="module">
			import * as THREE from 'three/webgpu';
			import { Fn, builtinIndirectContext, getViewPosition, materialMetalness, mrt, normalView, roughness as materialRoughness, packNormalToRGB, pass, pmremTexture, positionPrevious, sample, screenUV, uniform, unpackRGBToNormal, vec2, vec3, vec4, velocity } from 'three/tsl';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { LightMapper } from 'three/addons/lighting/LightMapper.js';
			import { RayTracedRadiosity, rayTracedRadiosityIrradiance } from 'three/addons/lighting/RayTracedRadiosity.js';
			import { ReflectionProbe, ReflectionProbes } from 'three/addons/lighting/ReflectionProbes.js';
			import { reflectionProbesSpecular } from 'three/addons/tsl/lighting/ReflectionProbesNode.js';
			import { unwrapUVs } from 'three/addons/utils/unwrapUVs.js';
			import { denoise } from 'three/addons/tsl/display/DenoiseNode.js';
			import { ssr } from 'three/addons/tsl/display/SSRNode.js';
			import { temporalReproject } from 'three/addons/tsl/display/TemporalReprojectNode.js';
			import { recurrentDenoise } from 'three/addons/tsl/display/RecurrentDenoiseNode.js';
			import { ssrHistory } from 'three/addons/tsl/display/SSRHistory.js';
			import { LightProbeGrid } from 'three/addons/lighting/LightProbeGrid.js';
			import { lightProbeGridDiffuse } from 'three/addons/tsl/lighting/LightProbeGridDiffuse.js';
			import { lightMapDiffuse } from 'three/addons/tsl/lighting/LightMapDiffuse.js';
			import { traa } from 'three/addons/tsl/display/TRAANode.js';

			const status = document.getElementById( 'status' );
			const LIGHT_MAP_SIZE = 1024;
			const BAKE_SAMPLES = 32;
			const PROBE_SIZE = 256;
			const params = {
				output: 'Beauty', ssr: true, probes: true,
				exposure: 1.5, environment: 0.25
			};
			const ssrEnabled = uniform( 1 );
			const probesEnabled = uniform( 1 );

			const bakeMeshes = [];
			const materials = new Set();
			let renderer, scene, camera, controls, pipeline, lightMapper, radiosity, lightMapDenoise;
			let probes, ssrPass, ssrDenoise, traaPass, views;
			let bakeComplete = false;
			let diffuseGrid, reflectionHistory, beautyPass, receiver;

			init().catch( error => {

				status.textContent = error.message;

			} );

			async function init() {

				renderer = new THREE.WebGPURenderer();
				renderer.inspector = new Inspector();
				renderer.setPixelRatio( Math.min( window.devicePixelRatio, 1.5 ) );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.toneMapping = THREE.AgXToneMapping;
				renderer.toneMappingExposure = params.exposure;
				document.body.appendChild( renderer.domElement );
				await renderer.init();

				scene = new THREE.Scene();
				camera = new THREE.PerspectiveCamera( 60, window.innerWidth / window.innerHeight, 0.05, 100 );
				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;

				const [ gltf, environment ] = await Promise.all( [
					new GLTFLoader().loadAsync( 'models/gltf/space_ship_hallway.glb' ),
					new HDRLoader().loadAsync( 'textures/equirectangular/quarry_01_1k.hdr' )
				] );
				environment.mapping = THREE.EquirectangularReflectionMapping;
				scene.background = environment;
				scene.backgroundIntensity = params.environment;
				// Diffuse sky irradiance is already baked into the light map.

				scene.environment = environment;
				scene.environmentIntensity = params.environment;
				renderer.contextNode = builtinIndirectContext( { diffuse: [ lightMapDiffuse() ] } );

				const model = gltf.scene;
				const transparent = [];
				model.traverse( object => {

					if ( ! object.isMesh ) return;
					const original = object.material;
					const material = new THREE.MeshStandardNodeMaterial();
					material.copy( original );
					object.material = material;
					if ( material.transparent ) {

						// Exclude glass from the opaque radiosity bake.

						transparent.push( object );

					} else {

						bakeMeshes.push( object );
						materials.add( material );

					}

				} );
				scene.add( model );
				model.updateMatrixWorld( true );
				const bounds = new THREE.Box3().setFromObject( model );
				const size = bounds.getSize( new THREE.Vector3() );
				const center = bounds.getCenter( new THREE.Vector3() );
				const eye = bounds.min.y + size.y * 0.35;
				camera.position.set( center.x, eye, bounds.max.z - size.z * 0.08 );
				controls.target.set( center.x, eye, bounds.min.z + size.z * 0.08 );
				controls.update();
				window.addEventListener( 'resize', onWindowResize );

				status.textContent = 'Unwrapping the corridor into a light-map atlas…';
				await new Promise( requestAnimationFrame );
				// Preserve authored material UVs; generate an independent uv1 atlas in world space.
				const oldGeometries = new Set();
				model.traverse( object => {

					if ( object.isMesh ) oldGeometries.add( object.geometry );

				} );
				const atlas = unwrapUVs( model, { resolution: LIGHT_MAP_SIZE, padding: 3 } );
				for ( const geometry of oldGeometries ) geometry.dispose();

				status.textContent = 'Building the ray radiosity bounce cache…';
				await new Promise( requestAnimationFrame );
				// Captures must include geometry and emissive surfaces, but not the transparent glass.
				for ( const object of transparent ) object.visible = false;
				radiosity = new RayTracedRadiosity( { rays: 4, bounces: 8, cacheSamples: 16, cacheSize: 256 } );
				try {

					radiosity.update( renderer, scene );

				} finally {

					for ( const object of transparent ) object.visible = true;

				}

				lightMapper = new LightMapper( renderer, atlas.resolution, rayTracedRadiosityIrradiance( radiosity ), { variance: true, guides: true } );
				lightMapper.addObjects( bakeMeshes );
				for ( const material of materials ) material.lightMapNode = lightMapper.getTextureNode().rgb;

				probes = new ReflectionProbes();
				for ( const offset of [ - 1 / 3, 0, 1 / 3 ] ) {

					const probe = new ReflectionProbe( size.x + size.z / 6, size.y + size.z / 6, size.z * 0.42 );
					probe.position.copy( center );
					probe.position.z += size.z * offset;
					probe.projectionSize = size.clone();
					probe.projectionOffset.copy( center ).sub( probe.position );
					probe.blendDistance = size.z / 12;
					probes.add( probe );

				}

				scene.add( probes );
				// Fade overlapping probe volumes toward the environment fallback.

				createParameters();
				renderer.setAnimationLoop( animate );

				function finishBake() {

					lightMapDenoise = denoise( lightMapper.getTextureNode(), {
						position: lightMapper.getTextureNode( 'position' ), normal: lightMapper.getTextureNode( 'normal' ),
						variance: lightMapper.varianceTexture !== null ? lightMapper.getTextureNode( 'variance' ) : null, quality: 'quality'
					} );
					lightMapDenoise.autoUpdate = false;
					for ( const material of materials ) {

						material.lightMapNode = lightMapDenoise.rgb;
						material.needsUpdate = true;

					}

					status.textContent = 'Baking diffuse probes from the light-mapped corridor…';
					diffuseGrid = new LightProbeGrid( size.x, size.y, size.z, 3, 3, 9 );
					diffuseGrid.position.copy( center );
					diffuseGrid.bake( renderer, scene, { cubemapSize: 32, near: 0.05, far: 100 } );
					const diffuse = [ lightMapDiffuse(), lightProbeGridDiffuse( diffuseGrid ) ];
					renderer.contextNode = builtinIndirectContext( { diffuse } );

					status.textContent = 'Capturing 3 Refl. probes from the baked GI…';
					// SSR is not installed yet. Capture the denoised GI, emission and environment.
					probes.bake( renderer, scene, { resolution: PROBE_SIZE, near: 0.05, far: 100 } );

					// An unlightmapped object receives diffuse probes and local reflections.
					receiver = new THREE.Mesh( new THREE.SphereGeometry( size.x * 0.08, 32, 24 ), new THREE.MeshStandardNodeMaterial( { color: 0xffffff, roughness: 0.25, metalness: 0.25 } ) );
					receiver.position.copy( center );
					receiver.position.y = eye;
					scene.add( receiver );

					buildPipeline( diffuse );
					bakeComplete = true;
					status.textContent = `Ready · ${ atlas.resolution }² atlas · ${ BAKE_SAMPLES * radiosity.rays } rays/texel · 3 probes.`;

				}

				function animate() {

					controls.update();
					if ( ! bakeComplete ) {

						if ( lightMapper.samples < BAKE_SAMPLES ) {

							lightMapper.update();
							status.textContent = `Baking diffuse GI: ${ lightMapper.samples } / ${ BAKE_SAMPLES } samples`;
							renderer.render( scene, camera );
							return;

						}

						finishBake();

					}

					reflectionHistory.prepare( renderer );
					pipeline.render();
					reflectionHistory.capture( renderer, beautyPass.getTexture( 'output' ) );

				}

			}

			function buildPipeline( diffuse ) {

				const probeSource = reflectionProbesSpecular( probes );
				const local = query => probeSource( query ).mul( probesEnabled );
				const geometryPass = pass( scene, camera );
				geometryPass.setMRT( mrt( {
					output: vec4( packNormalToRGB( normalView ), materialRoughness ),
					metalness: materialMetalness,
					velocity: vec4( velocity, velocity.previousCameraViewMatrix.mul( velocity.previousModelWorldMatrix ).mul( vec4( positionPrevious, 1 ) ).z.toVarying(), 0 )
				} ) );
				const depth = geometryPass.getTextureNode( 'depth' );
				const normalRoughness = geometryPass.getTextureNode();
				const motion = geometryPass.getTextureNode( 'velocity' );
				const metalness = geometryPass.getTextureNode( 'metalness' );
				const normals = sample( coordinate => unpackRGBToNormal( normalRoughness.sample( coordinate ).rgb ).normalize() );
				const roughness = sample( coordinate => normalRoughness.sample( coordinate ).a );
				reflectionHistory = ssrHistory( camera, geometryPass, motion );
				ssrPass = ssr( reflectionHistory.source, depth, normals, {
					camera, stochastic: true, binaryRefine: true, roughnessNode: roughness, metalnessNode: metalness.r
				} );
				ssrPass.quality.value = 0.5;
				ssrPass.maxDistance.value = 20;
				ssrPass.thickness.value = 0.15;

				const temporal = temporalReproject( ssrPass, depth, normalRoughness, motion, camera, {
					mode: 'specular', hitDistance: ssrPass.getHitDistanceNode(), accumulate: false
				} );
				ssrDenoise = recurrentDenoise( temporal, camera, {
					depth, normal: normalRoughness, raw: ssrPass,
					hitDistance: ssrPass.getHitDistanceNode(), frameCount: temporal.getFrameCountNode(),
					metalRoughness: sample( coordinate => vec2( metalness.sample( coordinate ).r, roughness.sample( coordinate ) ) ),
					mode: 'specular', accumulate: true
				} );
				temporal.setHistoryTexture( ssrDenoise );
				const filtered = ssrDenoise.getTextureNode();
				const screenReflection = ssrPass.getSpecularSource( filtered.sample( screenUV ) ).mul( ssrEnabled );

				beautyPass = pass( scene, camera );
				beautyPass.contextNode = builtinIndirectContext( { diffuse, specular: [ screenReflection, local ] } );
				traaPass = traa( beautyPass, depth, motion, camera );

				const screenQuery = coordinate => {

					const viewPosition = getViewPosition( coordinate, depth.sample( coordinate ).r, uniform( camera.projectionMatrixInverse ) );
					const normal = normals.sample( coordinate ).transformDirection( uniform( camera.matrixWorld ) );
					const viewDirection = viewPosition.negate().normalize().transformDirection( uniform( camera.matrixWorld ) );
					const r = roughness.sample( coordinate );
					const direction = r.pow4().mix( viewDirection.negate().reflect( normal ), normal ).normalize();
					return { position: uniform( camera.matrixWorld ).mul( vec4( viewPosition, 1 ) ).xyz, direction, roughness: r };

				};

				const probeSample = sample( coordinate => local( screenQuery( coordinate ) ) );
				const resolved = sample( coordinate => Fn( () => {

					const query = screenQuery( coordinate );
					const screen = filtered.sample( coordinate ).mul( ssrEnabled ).toConst();
					const probe = local( query ).toConst();
					const environment = pmremTexture( scene.environment, query.direction, query.roughness ).mul( scene.environmentIntensity );
					return vec4( screen.rgb.add( probe.rgb.add( environment.mul( probe.a.oneMinus() ) ).mul( screen.a.oneMinus() ) ), 1 );

				} )() );
				views = {
					Beauty: traaPass,
					'SSR Radiance': vec4( filtered.sample( screenUV ).rgb, 1 ),
					'SSR Coverage': vec4( vec3( filtered.sample( screenUV ).a.mul( ssrEnabled ) ), 1 ),
					'Refl. probes Radiance': vec4( probeSample.sample( screenUV ).rgb, 1 ),
					'Refl. probes Coverage': vec4( vec3( probeSample.sample( screenUV ).a ), 1 ),
					'Resolved Radiance': resolved
				};
				pipeline = new THREE.RenderPipeline( renderer );
				updateOutput();

			}

			function createParameters() {

				const gui = renderer.inspector.createParameters( 'Coverage lighting' );
				gui.add( params, 'output', [ 'Beauty', 'SSR Radiance', 'SSR Coverage', 'Refl. probes Radiance', 'Refl. probes Coverage', 'Resolved Radiance' ] ).name( 'Output' ).onChange( updateOutput );
				gui.add( params, 'ssr' ).name( 'SSR' ).onChange( value => {

					ssrEnabled.value = Number( value );
					resetHistory();

				} );
				gui.add( params, 'probes' ).name( 'Refl. probes' ).onChange( value => {

					probesEnabled.value = Number( value );
					resetHistory();

				} );
				gui.add( params, 'exposure', 0.25, 4 ).name( 'Exposure' ).onChange( value => renderer.toneMappingExposure = value );

			}

			function updateOutput() {

				if ( ! pipeline ) return;
				pipeline.outputColorTransform = ! [ 'SSR Coverage', 'Refl. probes Coverage' ].includes( params.output );
				const beautyColor = beautyPass.getTextureNode();
				pipeline.outputNode = params.output === 'Beauty' ? views.Beauty : views[ params.output ].bypass( Fn( () => {

					beautyColor.toVar();

				} )() );
				pipeline.needsUpdate = true;
				resetHistory();

			}

			function resetHistory() {

				reflectionHistory?.invalidate();
				traaPass?.setSize( 1, 1 );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );
				resetHistory();

			}

		</script>
	</body>
</html>
