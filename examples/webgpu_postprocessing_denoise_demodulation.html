<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - denoising demodulation</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="example.css">
		<style>
			#comparison { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-around; pointer-events: none; text-shadow: 0 1px 4px #000; }
		</style>
	</head>
	<body>
		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>
			<div class="title-wrapper"><a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Denoising demodulation</span></div>
			<small>Divide out the surface color, denoise lighting, then multiply the color back.<br />Both sides use the same noisy diffuse signal and spatial filter. Drag to orbit.</small>
		</div>
		<div id="comparison"><span>Without demodulation — blurred texture</span><span>With demodulation — sharp texture</span></div>
		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>
		<script type="module">
			import * as THREE from 'three/webgpu';
			import { diffuseColor, dot, float, fract, mix, mrt, normalView, normalWorld, output, packNormalToRGB, pass, screenCoordinate, screenUV, sin, step, uniform, uv, vec2, vec3, vec4 } from 'three/tsl';
			import { demodulate, recurrentDenoise, remodulate } from 'three/addons/tsl/display/RecurrentDenoiseNode.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

			const renderer = new THREE.WebGPURenderer( { antialias: true } );
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			document.body.appendChild( renderer.domElement );

			const camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 0.1, 30 );
			camera.position.set( 0, 2.4, 7.5 );
			const controls = new OrbitControls( camera, renderer.domElement );
			controls.target.set( 0, 0.4, 0 );
			controls.update();

			const scene = new THREE.Scene();
			scene.background = new THREE.Color( 0x20252b );
			const frame = uniform( 0 );
			const noiseStrength = uniform( 0.8 );
			const textureScale = uniform( 36 );

			// A high-frequency two-color weave makes the loss of material detail easy to see.
			const cell = uv().mul( textureScale ).floor();
			const checker = cell.x.add( cell.y ).mod( 2 );
			const albedo = mix( vec3( 0.025, 0.09, 0.22 ), vec3( 0.95, 0.65, 0.16 ), checker );
			const noise = fract( sin( dot( screenCoordinate.xy, vec2( 12.9898, 78.233 ) ).add( frame.mul( 17.13 ) ) ).mul( 43758.5453 ) );
			const lighting = normalWorld.dot( vec3( 0.4, 0.8, 0.5 ).normalize() ).max( 0 ).mul( 0.65 ).add( 0.35 );
			const noisyLighting = lighting.mul( mix( float( 1 ), noise.mul( 2 ), noiseStrength ) );
			const material = new THREE.MeshBasicNodeMaterial();
			material.colorNode = albedo;
			// Explicitly synthetic diffuse radiance: surface color multiplied by noisy illumination.
			material.outputNode = vec4( diffuseColor.rgb.mul( noisyLighting ), 1 );

			const floor = new THREE.Mesh( new THREE.PlaneGeometry( 9, 6 ), material );
			floor.rotation.x = - Math.PI / 2;
			floor.position.y = - 0.65;
			scene.add( floor );
			for ( const x of [ - 1.6, 1.6 ] ) {

				const sphere = new THREE.Mesh( new THREE.SphereGeometry( 1, 64, 32 ), material );
				sphere.position.set( x, 0.35, 0 );
				scene.add( sphere );

			}

			const scenePass = pass( scene, camera );
			scenePass.setMRT( mrt( {
				output,
				albedo: vec4( diffuseColor.rgb, 1 ),
				normal: vec4( packNormalToRGB( normalView ), 1 )
			} ) );
			const noisy = scenePass.getTextureNode( 'output' );
			const surfaceColor = scenePass.getTextureNode( 'albedo' );
			const options = {
				depth: scenePass.getTextureNode( 'depth' ),
				normal: scenePass.getTextureNode( 'normal' ),
				mode: 'diffuse',
				accumulate: false
			};
			const without = recurrentDenoise( noisy, camera, { ...options, raw: noisy } );
			const demodulated = demodulate( noisy, surfaceColor.rgb );
			const filteredLighting = recurrentDenoise( demodulated, camera, { ...options, raw: demodulated } );
			const withDemodulation = remodulate( filteredLighting, surfaceColor.rgb );
			const denoisers = [ without, filteredLighting ];
			for ( const denoiser of denoisers ) {

				denoiser.alphaSource = 'none';
				denoiser.radius.value = 1.5;
				denoiser.lumaPhi.value = 0.01;
				denoiser.normalPhi.value = 5;

			}

			// No temporal accumulation: isolate the effect of removing albedo before spatial filtering.
			const pipeline = new THREE.RenderPipeline( renderer );
			const split = mix( without, withDemodulation, step( 0.5, screenUV.x ) );
			pipeline.outputNode = split;
			const params = { view: 'Split', radius: 1.5, animateNoise: true };
			const gui = new GUI();
			gui.add( params, 'view', [ 'Split', 'Without demodulation', 'With demodulation', 'Noisy signal', 'Albedo', 'Filtered lighting' ] ).onChange( value => {

				pipeline.outputNode = {
					'Split': split,
					'Without demodulation': without,
					'With demodulation': withDemodulation,
					'Noisy signal': noisy,
					'Albedo': surfaceColor,
					'Filtered lighting': filteredLighting
				}[ value ];
				pipeline.needsUpdate = true;
				document.getElementById( 'comparison' ).style.display = value === 'Split' ? 'flex' : 'none';

			} );
			gui.add( params, 'radius', 0.1, 3 ).onChange( value => {

				for ( const denoiser of denoisers ) denoiser.radius.value = value;

			} );
			gui.add( noiseStrength, 'value', 0, 1 ).name( 'noise strength' );
			gui.add( textureScale, 'value', 8, 64, 1 ).name( 'texture frequency' );
			gui.add( params, 'animateNoise' ).name( 'animate noise' );

			window.addEventListener( 'resize', () => {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );

			} );
			renderer.setAnimationLoop( () => {

				if ( params.animateNoise ) frame.value ++;
				pipeline.render();

			} );
		</script>
	</body>
</html>
