<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - postprocessing - octahedral normals</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>
			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Octahedral Normals</span>
			</div>
			<small>
				Normal-mapped view-space normals stored in a signed RG16F buffer.<br />
				Error compares decoded normals with geometry + normal map, multiplied by the error scale.<br />
				Ninja head from <a href="https://web.archive.org/web/2024/https://gpuopen.com/archive/gamescgi/amd-gpu-meshmapper/" target="_blank" rel="noopener">AMD GPU MeshMapper</a>.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { abs, mrt, normalView, octDecode, octEncode, output, pass, uniform, vec4 } from 'three/tsl';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

			const params = { view: 'Beauty' };
			const errorScale = uniform( 1000 );
			let camera, renderer, renderPipeline, controls;

			init();

			async function init() {

				renderer = new THREE.WebGPURenderer();
				renderer.inspector = new Inspector();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				document.body.appendChild( renderer.domElement );

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 100, 3000 );
				camera.position.z = 1500;

				const scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x202020 );
				scene.add( new THREE.HemisphereLight( 0xffffff, 0x444466, 2 ) );

				const light = new THREE.DirectionalLight( 0xffffff, 3 );
				light.position.set( 1, 1, 2 );
				scene.add( light );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.minDistance = 700;
				controls.maxDistance = 2400;
				controls.enableDamping = true;

				const scenePass = pass( scene, camera );
				scenePass.setMRT( mrt( {
					output,
					normal: octEncode( normalView ),
					// Reference includes the same geometry + normal map used by forward lighting.
					reference: vec4( normalView, 1 )
				} ).setClearColor( 'reference', 0x000000, 0 ) );

				const normalTexture = scenePass.getTexture( 'normal' );
				normalTexture.format = THREE.RGFormat;
				normalTexture.type = THREE.HalfFloatType;
				normalTexture.minFilter = THREE.NearestFilter;
				normalTexture.magFilter = THREE.NearestFilter;

				const referenceTexture = scenePass.getTexture( 'reference' );
				referenceTexture.type = THREE.FloatType;
				referenceTexture.minFilter = THREE.NearestFilter;
				referenceTexture.magFilter = THREE.NearestFilter;

				const reference = scenePass.getTextureNode( 'reference' );
				const reconstructed = octDecode( scenePass.getTextureNode( 'normal' ).rg );
				const views = {
					Beauty: scenePass.getTextureNode(),
					Normals: vec4( reconstructed.mul( 0.5 ).add( 0.5 ).mul( reference.a ), 1 ),
					'Error delta': vec4( abs( reconstructed.sub( reference.rgb ) ).mul( errorScale ).mul( reference.a ), 1 )
				};

				renderPipeline = new THREE.RenderPipeline( renderer );
				renderPipeline.outputNode = views.Beauty;

				const gui = renderer.inspector.createParameters( 'Normals' );
				gui.add( params, 'view', Object.keys( views ) ).onChange( ( value ) => {

					renderPipeline.outputNode = views[ value ];
					renderPipeline.outputColorTransform = value === 'Beauty';
					renderPipeline.needsUpdate = true;

				} );
				gui.add( errorScale, 'value', 1, 5000, 1 ).name( 'error scale' );

				window.addEventListener( 'resize', onWindowResize );

				const group = await new OBJLoader().loadAsync( 'models/obj/ninja/ninjaHead_Low.obj' );
				const geometry = group.children[ 0 ].geometry;
				geometry.center();

				const normalMap = await new THREE.TextureLoader().loadAsync( 'models/obj/ninja/normal.png' );
				const material = new THREE.MeshStandardMaterial( { color: 0xaaaaaa, metalness: 0.15, roughness: 0.6, normalMap } );
				const mesh = new THREE.Mesh( geometry, material );
				mesh.scale.setScalar( 25 );
				scene.add( mesh );

				renderer.setAnimationLoop( animate );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				controls.update();
				renderPipeline.render();

			}

		</script>
	</body>
</html>
