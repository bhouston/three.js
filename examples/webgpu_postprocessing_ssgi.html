<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - SSGI</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - SSGI">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_postprocessing_ssgi.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_postprocessing_ssgi.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>SSGI</span>
			</div>

			<small>Real-time indirect illumination and ambient occlusion using screen-space information.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { pass, mrt, output, normalView, diffuseColor, velocity, add, vec3, vec4, packNormalToRGB, unpackRGBToNormal, sample } from 'three/tsl';
			import { ssgi } from 'three/addons/tsl/display/SSGINode.js';
			import { traa } from 'three/addons/tsl/display/TRAANode.js';
			import { denoise } from 'three/addons/tsl/display/DenoiseNode.js';
			import { temporalReproject } from 'three/addons/tsl/display/TemporalReprojectNode.js';
			import { recurrentDenoise } from 'three/addons/tsl/display/RecurrentDenoiseNode.js';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

			import { Inspector } from 'three/addons/inspector/Inspector.js';

			let camera, scene, renderer, renderPipeline, controls, mixer, timer;

			init();

			async function init() {

				timer = new THREE.Timer();

				camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 10, 30 );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0xaaaaaa );

				renderer = new THREE.WebGPURenderer();
				//renderer.setPixelRatio( window.devicePixelRatio ); // probably too costly for most hardware
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.shadowMap.enabled = true;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				//

				controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 7, 0 );
				controls.enablePan = true;
				controls.minDistance = 1;
				controls.maxDistance = 100;
				controls.update();

				//

				renderPipeline = new THREE.RenderPipeline( renderer );

				const scenePass = pass( scene, camera );
				scenePass.setMRT( mrt( {
					output: output,
					diffuseColor: diffuseColor,
					normal: packNormalToRGB( normalView ),
					velocity: velocity
				} ) );

				const scenePassColor = scenePass.getTextureNode( 'output' );
				const scenePassDiffuse = scenePass.getTextureNode( 'diffuseColor' ).toInspector( 'Diffuse Color' );
				const scenePassDepth = scenePass.getTextureNode( 'depth' ).toInspector( 'Depth', () => {

					return scenePass.getLinearDepthNode();

				} );

				const scenePassNormal = scenePass.getTextureNode( 'normal' ).toInspector( 'Normal' );
				const scenePassVelocity = scenePass.getTextureNode( 'velocity' ).toInspector( 'Velocity' );

				// bandwidth optimization

				const diffuseTexture = scenePass.getTexture( 'diffuseColor' );
				diffuseTexture.type = THREE.UnsignedByteType;

				const normalTexture = scenePass.getTexture( 'normal' );
				normalTexture.type = THREE.UnsignedByteType;

				const sceneNormal = sample( ( uv ) => {

					return unpackRGBToNormal( scenePassNormal.sample( uv ) );

				} );

				// gi

				const giPass = ssgi( scenePassColor, scenePassDepth, sceneNormal, camera );
				giPass.sliceCount.value = 2;
				giPass.stepCount.value = 8;

				const giParams = { denoising: 'spatial', denoiseRadius: 4 };

				// denoising: none, spatial (denoise node, stable with a static noise pattern) or temporal
				// (per-signal temporal accumulation and spatial filtering, then TRAA for anti-aliasing)

				giPass.useTemporalFiltering = giParams.denoising === 'temporal';

				const aoDenoised = denoise( giPass.getAONode(), scenePassDepth, sceneNormal, camera );
				const giDenoised = denoise( giPass.getGINode(), scenePassDepth, sceneNormal, camera );
				aoDenoised.radius.value = giDenoised.radius.value = giParams.denoiseRadius;

				// the temporal nodes only filter RGB, so AO and GI each get their own chain

				const temporalDenoise = ( signal ) => {

					const reprojected = temporalReproject( signal, scenePassDepth, scenePassNormal, scenePassVelocity, camera );
					const denoised = recurrentDenoise( reprojected, camera, { depth: scenePassDepth, normal: scenePassNormal, raw: signal } );
					denoised.alphaSource = 'none';
					reprojected.setHistoryTexture( denoised );
					return denoised;

				};

				const aoTemporal = temporalDenoise( giPass.getAONode() );
				const giTemporal = temporalDenoise( giPass.getGINode() );

				// composite

				// the denoisers leave the background undefined, so keep it untouched

				const isBackground = scenePassDepth.r.greaterThanEqual( 1 );

				const composite = ( ao, gi, name ) => {

					const lit = add( scenePassColor.rgb.mul( ao ), ( scenePassDiffuse.rgb.mul( gi.rgb ) ) );
					const node = vec4( isBackground.select( scenePassColor.rgb, lit ), scenePassColor.a );
					node.name = name;
					return node;

				};

				const aoRaw = giPass.getAONode().toInspector( 'SSGI.AO' );
				const giRaw = giPass.getGINode().toInspector( 'SSGI.GI' );
				const aoSmooth = aoDenoised.r.toInspector( 'SSGI.AO (denoised)' );
				const giSmooth = giDenoised.rgb.toInspector( 'SSGI.GI (denoised)' );
				const aoAccumulated = aoTemporal.r.toInspector( 'SSGI.AO (temporal)' );
				const giAccumulated = giTemporal.rgb.toInspector( 'SSGI.GI (temporal)' );

				const compositePass = composite( aoRaw, giRaw, 'Composite' );
				const compositeDenoisedPass = composite( aoSmooth, giSmooth, 'Composite (denoised)' );
				const compositeTemporalPass = composite( aoAccumulated, giAccumulated, 'Composite (temporal)' );

				// traa

				const traaPass = traa( compositeTemporalPass, scenePassDepth, scenePassVelocity, camera );
				renderPipeline.outputNode = compositeDenoisedPass;

				// Cornell Box inspired scene

				// Walls
				const wallGeometry = new THREE.PlaneGeometry( 1, 1 );

				// Left wall - red
				const redWallMaterial = new THREE.MeshPhysicalMaterial( { color: '#ff0000' } );
				const leftWall = new THREE.Mesh( wallGeometry, redWallMaterial );
				leftWall.scale.set( 20, 15, 1 );
				leftWall.rotation.y = Math.PI * 0.5;
				leftWall.position.set( - 10, 7.5, 0 );
				leftWall.receiveShadow = true;
				scene.add( leftWall );

				// Right wall - green
				const greenWallMaterial = new THREE.MeshPhysicalMaterial( { color: '#00ff00' } );
				const rightWall = new THREE.Mesh( wallGeometry, greenWallMaterial );
				rightWall.scale.set( 20, 15, 1 );
				rightWall.rotation.y = Math.PI * - 0.5;
				rightWall.position.set( 10, 7.5, 0 );
				rightWall.receiveShadow = true;
				scene.add( rightWall );

				// White walls and boxes
				const whiteMaterial = new THREE.MeshPhysicalMaterial( { color: '#fff' } );

				// Floor
				const floor = new THREE.Mesh( wallGeometry, whiteMaterial );
				floor.scale.set( 20, 20, 1 );
				floor.rotation.x = Math.PI * - .5;
				floor.receiveShadow = true;
				scene.add( floor );

				// Back wall
				const backWall = new THREE.Mesh( wallGeometry, whiteMaterial );
				backWall.scale.set( 15, 20, 1 );
				backWall.rotation.z = Math.PI * - 0.5;
				backWall.position.set( 0, 7.5, - 10 );
				backWall.receiveShadow = true;
				scene.add( backWall );

				// Ceiling
				const ceiling = new THREE.Mesh( wallGeometry, whiteMaterial );
				ceiling.scale.set( 20, 20, 1 );
				ceiling.rotation.x = Math.PI * 0.5;
				ceiling.position.set( 0, 15, 0 );
				ceiling.receiveShadow = true;
				scene.add( ceiling );

				// Boxes
				const tallBoxGeometry = new THREE.BoxGeometry( 5, 7, 5 );
				const tallBox = new THREE.Mesh( tallBoxGeometry, whiteMaterial );
				tallBox.rotation.y = Math.PI * 0.25;
				tallBox.position.set( - 3, 3.5, - 2 );
				tallBox.castShadow = true;
				tallBox.receiveShadow = true;
				scene.add( tallBox );

				const shortBoxGeometry = new THREE.BoxGeometry( 4, 4, 4 );
				const shortBox = new THREE.Mesh( shortBoxGeometry, whiteMaterial );
				shortBox.rotation.y = Math.PI * - 0.1;
				shortBox.position.set( 4, 2, 4 );
				shortBox.castShadow = true;
				shortBox.receiveShadow = true;
				scene.add( shortBox );

				// Rounded alternatives, roughly matching the boxes they replace
				const cone = new THREE.Mesh( new THREE.ConeGeometry( 2.5, 7, 64 ), whiteMaterial );
				cone.position.set( - 3, 3.5, - 2 );
				cone.castShadow = true;
				cone.receiveShadow = true;
				scene.add( cone );

				const sphereGeometry = new THREE.SphereGeometry( 2, 64, 32 );
				const sphere = new THREE.Mesh( sphereGeometry, whiteMaterial );
				sphere.position.set( 4, 2, 4 );
				sphere.castShadow = true;
				sphere.receiveShadow = true;
				scene.add( sphere );

				cone.visible = sphere.visible = false; // hidden while the character loads

				// Animated character, scaled to fit in the box
				const gltf = await new GLTFLoader().loadAsync( 'models/gltf/Michelle.glb' );
				const character = gltf.scene;
				character.traverse( ( child ) => {

					if ( child.isMesh ) {

						child.castShadow = true;
						child.receiveShadow = true;

					}

				} );
				character.scale.setScalar( 10 / new THREE.Box3().setFromObject( character ).getSize( new THREE.Vector3() ).y );
				scene.add( character );

				mixer = new THREE.AnimationMixer( character );
				mixer.clipAction( gltf.animations[ 0 ] ).play();

				const setups = {
					basic: [ tallBox, shortBox ],
					rounded: [ cone, sphere ],
					animated: [ character ]
				};
				const setupObjects = [ tallBox, shortBox, cone, sphere, character ];

				function updateScene() {

					for ( const object of setupObjects ) object.visible = setups[ params.scene ].includes( object );

				}

				// Light source geometry
				const lightSourceGeometry = new THREE.CylinderGeometry( 2.5, 2.5, 1, 64 );
				const lightSourceMaterial = new THREE.MeshBasicMaterial();
				const lightSource = new THREE.Mesh( lightSourceGeometry, lightSourceMaterial );
				lightSource.position.y = 15;
				scene.add( lightSource );

				// Point light
				const pointLight = new THREE.PointLight( '#ffffff', 100 );
				pointLight.position.set( 0, 13, 0 );
				pointLight.distance = 100;
				pointLight.castShadow = true;
				pointLight.shadow.mapSize.width = 1024;
				pointLight.shadow.mapSize.height = 1024;
				scene.add( pointLight );

				// Ambient light
				const ambientLight = new THREE.AmbientLight( '#0c0c0c' );
				scene.add( ambientLight );

				window.addEventListener( 'resize', onWindowResize );

				//

				const params = {
					output: 0,
					scene: 'basic'
				};

				updateScene();

				const types = { Combined: 0, Direct: 3, AO: 1, GI: 2 };

				const gui = renderer.inspector.createParameters( 'SSGI settings' );
				gui.add( params, 'scene', { 'Basic': 'basic', 'Rounded': 'rounded', 'Animated': 'animated' } ).onChange( updateScene );
				gui.add( giPass, 'resolutionScale', { 'None': 1, '2x': 1 / 2, '3x': 1 / 3, '4x': 1 / 4 } ).name( 'downsampling' );
				gui.add( params, 'output', types ).onChange( updatePostprocessing );

				const denoiseFolder = gui.addFolder( 'Denoising' );
				denoiseFolder.add( giParams, 'denoising', { 'none': 'none', 'spatial': 'spatial', 'temporal': 'temporal' } ).name( 'method' ).onChange( updatePostprocessing );
				const denoiseRadiusControl = denoiseFolder.add( giParams, 'denoiseRadius', 0, 16 ).name( 'denoise radius' ).onChange( ( value ) => aoDenoised.radius.value = giDenoised.radius.value = value );

				const aoFolder = gui.addFolder( 'AO' );
				aoFolder.add( giPass.aoIntensity, 'value', 0, 4 ).name( 'AO intensity' );

				const giFolder = gui.addFolder( 'SSGI' );
				giFolder.add( giPass.sliceCount, 'value', 1, 4, 1 ).name( 'slice count' );
				giFolder.add( giPass.stepCount, 'value', 1, 32, 1 ).name( 'step count' );
				giFolder.add( giPass.radius, 'value', 1, 25 ).name( 'radius' );
				giFolder.add( giPass.expFactor, 'value', 1, 3 ).name( 'exp factor' );
				giFolder.add( giPass.thickness, 'value', 0.01, 10 ).name( 'thickness' );
				giFolder.add( giPass.backfaceLighting, 'value', 0, 1 ).name( 'backface lighting' );
				giFolder.add( giPass.giIntensity, 'value', 0, 100 ).name( 'GI intensity' );
				giFolder.add( giPass.useLinearThickness, 'value' ).name( 'use linear thickness' );
				giFolder.add( giPass.useScreenSpaceSampling, 'value' ).name( 'screen-space sampling' );

				function updatePostprocessing() {

					const spatial = giParams.denoising === 'spatial';
					const temporal = giParams.denoising === 'temporal';
					giPass.useTemporalFiltering = temporal;

					if ( spatial ) denoiseRadiusControl.show(); else denoiseRadiusControl.hide();

					const ao = spatial ? aoSmooth : temporal ? aoAccumulated : aoRaw;
					const gi = spatial ? giSmooth : temporal ? giAccumulated : giRaw;

					if ( params.output === 1 ) {

						renderPipeline.outputNode = vec4( vec3( ao ), 1 );

					} else if ( params.output === 2 ) {

						renderPipeline.outputNode = vec4( gi, 1 );

					} else if ( params.output === 3 ) {

						renderPipeline.outputNode = scenePassColor;

					} else {

						renderPipeline.outputNode = spatial ? compositeDenoisedPass : temporal ? traaPass : compositePass;

					}

					renderPipeline.needsUpdate = true;


				}


			}

			function onWindowResize() {

				const width = window.innerWidth;
				const height = window.innerHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize( width, height );

			}

			function animate() {

				timer.update();

				controls.update();

				if ( mixer ) mixer.update( timer.getDelta() );

				renderPipeline.render();

			}

		</script>
	</body>
</html>
