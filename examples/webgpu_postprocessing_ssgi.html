<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - SSGI</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - SSGI">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_postprocessing_ssgi.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_postprocessing_ssgi.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>SSGI</span>
			</div>

			<small>Real-time indirect illumination and ambient occlusion using screen-space information.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { pass, mrt, normalView, velocity, vec2, vec3, vec4, packNormalToRGB, unpackRGBToNormal, sample, texture, screenUV, uniform, builtinGIContext, builtinRadianceContext, materialMetalness, materialRoughness } from 'three/tsl';
			import { ssgi } from 'three/addons/tsl/display/SSGINode.js';
			import { ssr } from 'three/addons/tsl/display/SSRNode.js';
			import { traa } from 'three/addons/tsl/display/TRAANode.js';
			import { temporalReproject } from 'three/addons/tsl/display/TemporalReprojectNode.js';
			import { recurrentDenoise } from 'three/addons/tsl/display/RecurrentDenoiseNode.js';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

			import { Inspector } from 'three/addons/inspector/Inspector.js';

			let camera, scene, renderer, renderPipeline, controls, mixer, timer;

			init();

			async function init() {

				timer = new THREE.Timer();

				camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 10, 30 );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0xaaaaaa );

				renderer = new THREE.WebGPURenderer();
				//renderer.setPixelRatio( window.devicePixelRatio ); // probably too costly for most hardware
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.shadowMap.enabled = true;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				//

				controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 7, 0 );
				controls.enablePan = true;
				controls.minDistance = 1;
				controls.maxDistance = 100;
				controls.update();

				//

				renderPipeline = new THREE.RenderPipeline( renderer );

				// pre-pass: SSGI runs before the scene pass so its result can light the materials, which
				// means depth, normals and velocity have to come from a separate pass

				const prePass = pass( scene, camera );
				prePass.name = 'Pre-Pass';
				prePass.transparent = false;
				prePass.setMRT( mrt( {
					output: packNormalToRGB( normalView ),
					velocity: velocity,
					metalRoughness: vec2( materialMetalness, materialRoughness )
				} ) );

				const prePassNormal = prePass.getTextureNode().toInspector( 'Normal' );
				const prePassDepth = prePass.getTextureNode( 'depth' ).toInspector( 'Depth', () => prePass.getLinearDepthNode() );
				const prePassVelocity = prePass.getTextureNode( 'velocity' ).toInspector( 'Velocity' );

				// bandwidth optimization

				prePass.getTexture( 'output' ).type = THREE.UnsignedByteType;
				prePass.getTexture( 'metalRoughness' ).type = THREE.UnsignedByteType;

				const prePassMetalRoughness = prePass.getTextureNode( 'metalRoughness' );

				const sceneNormal = sample( ( uv ) => unpackRGBToNormal( prePassNormal.sample( uv ) ) );

				// scene pass, anti-aliased with TRAA

				const scenePass = pass( scene, camera );
				const traaPass = traa( scenePass, prePassDepth, prePassVelocity, camera );

				// gi: the bounced light comes from the previous frame's final image reprojected to the current frame,
				// which also accumulates multiple bounces over successive frames

				const previousFrame = texture( traaPass.getTextureNode().value );
				const previousRadiance = sample( ( uv ) => previousFrame.sample( uv.sub( prePassVelocity.sample( uv ).xy.mul( vec2( 0.5, - 0.5 ) ) ) ) );

				const giPass = ssgi( previousRadiance, prePassDepth, sceneNormal, camera );
				giPass.sliceCount.value = 2;
				giPass.stepCount.value = 8;

				// the materials expect irradiance: for uniform radiance L, SSGI integrates 2L/π while the irradiance is πL

				giPass.giIntensity.value = Math.PI * Math.PI / 2;

				// reflections: SSR of the same previous frame, output as unweighted radiance so the materials apply
				// their own Fresnel, metalness and roughness to it like to an environment map

				const ssrPass = ssr( previousRadiance, prePassDepth, sceneNormal, {
					metalnessNode: prePassMetalRoughness.r,
					roughnessNode: prePassMetalRoughness.g,
					outputRadiance: true,
					camera
				} );
				ssrPass.maxDistance.value = 20;

				const reflections = ssrPass.getTextureNode().sample( screenUV ).rgb.toInspector( 'SSR' );

				// denoising: none or temporal (per-signal temporal accumulation and spatial filtering)

				const giParams = { denoising: 'temporal' };

				// the temporal nodes only filter RGB, so AO and GI each get their own chain

				const denoiseNodes = [];

				const temporalDenoise = ( signal ) => {

					const reprojected = temporalReproject( signal, prePassDepth, prePassNormal, prePassVelocity, camera );
					const denoised = recurrentDenoise( reprojected, camera, { depth: prePassDepth, normal: prePassNormal, raw: signal } );
					denoised.alphaSource = 'none';
					denoiseNodes.push( denoised );
					reprojected.setHistoryTexture( denoised );
					return denoised.getTextureNode();

				};

				// the signals are sampled in screen space since they are applied in the materials of the scene pass

				const signals = {
					none: {
						ao: giPass.getAONode().sample( screenUV ).r.toInspector( 'SSGI.AO' ),
						gi: giPass.getGINode().sample( screenUV ).rgb.toInspector( 'SSGI.GI' )
					},
					temporal: {
						ao: temporalDenoise( giPass.getAONode() ).sample( screenUV ).r.toInspector( 'SSGI.AO (temporal)' ),
						gi: temporalDenoise( giPass.getGINode() ).sample( screenUV ).rgb.toInspector( 'SSGI.GI (temporal)' )
					}
				};

				// the debug views are selected with a uniform so the scene pass and TRAA keep running, since SSGI
				// samples their previous frame

				const debugView = uniform( 0 );

				// Cornell Box inspired scene

				// Walls
				const wallGeometry = new THREE.PlaneGeometry( 1, 1 );

				// Left wall - red
				const redWallMaterial = new THREE.MeshPhysicalMaterial( { color: '#ff0000' } );
				const leftWall = new THREE.Mesh( wallGeometry, redWallMaterial );
				leftWall.scale.set( 20, 15, 1 );
				leftWall.rotation.y = Math.PI * 0.5;
				leftWall.position.set( - 10, 7.5, 0 );
				leftWall.receiveShadow = true;
				scene.add( leftWall );

				// Right wall - green
				const greenWallMaterial = new THREE.MeshPhysicalMaterial( { color: '#00ff00' } );
				const rightWall = new THREE.Mesh( wallGeometry, greenWallMaterial );
				rightWall.scale.set( 20, 15, 1 );
				rightWall.rotation.y = Math.PI * - 0.5;
				rightWall.position.set( 10, 7.5, 0 );
				rightWall.receiveShadow = true;
				scene.add( rightWall );

				// White walls and boxes
				const whiteMaterial = new THREE.MeshPhysicalMaterial( { color: '#fff' } );

				// Floor
				const floor = new THREE.Mesh( wallGeometry, whiteMaterial );
				floor.scale.set( 20, 20, 1 );
				floor.rotation.x = Math.PI * - .5;
				floor.receiveShadow = true;
				scene.add( floor );

				// Back wall
				const backWall = new THREE.Mesh( wallGeometry, whiteMaterial );
				backWall.scale.set( 15, 20, 1 );
				backWall.rotation.z = Math.PI * - 0.5;
				backWall.position.set( 0, 7.5, - 10 );
				backWall.receiveShadow = true;
				scene.add( backWall );

				// Ceiling
				const ceiling = new THREE.Mesh( wallGeometry, whiteMaterial );
				ceiling.scale.set( 20, 20, 1 );
				ceiling.rotation.x = Math.PI * 0.5;
				ceiling.position.set( 0, 15, 0 );
				ceiling.receiveShadow = true;
				scene.add( ceiling );

				// Boxes
				const tallBoxGeometry = new THREE.BoxGeometry( 5, 7, 5 );
				const tallBox = new THREE.Mesh( tallBoxGeometry, whiteMaterial );
				tallBox.rotation.y = Math.PI * 0.25;
				tallBox.position.set( - 3, 3.5, - 2 );
				tallBox.castShadow = true;
				tallBox.receiveShadow = true;
				scene.add( tallBox );

				const shortBoxGeometry = new THREE.BoxGeometry( 4, 4, 4 );
				const shortBox = new THREE.Mesh( shortBoxGeometry, whiteMaterial );
				shortBox.rotation.y = Math.PI * - 0.1;
				shortBox.position.set( 4, 2, 4 );
				shortBox.castShadow = true;
				shortBox.receiveShadow = true;
				scene.add( shortBox );

				// Rounded alternatives, roughly matching the boxes they replace
				const cone = new THREE.Mesh( new THREE.ConeGeometry( 2.5, 7, 64 ), whiteMaterial );
				cone.position.set( - 3, 3.5, - 2 );
				cone.castShadow = true;
				cone.receiveShadow = true;
				scene.add( cone );

				const sphereGeometry = new THREE.SphereGeometry( 2, 64, 32 );
				const sphere = new THREE.Mesh( sphereGeometry, whiteMaterial );
				sphere.position.set( 4, 2, 4 );
				sphere.castShadow = true;
				sphere.receiveShadow = true;
				scene.add( sphere );

				// Mirror sphere: metals have no diffuse term, so the GI must not change it
				const metalSphere = new THREE.Mesh( sphereGeometry, new THREE.MeshPhysicalMaterial( { color: '#fff', metalness: 1, roughness: 0 } ) );
				metalSphere.position.copy( sphere.position );
				metalSphere.castShadow = true;
				metalSphere.receiveShadow = true;
				scene.add( metalSphere );

				cone.visible = sphere.visible = metalSphere.visible = false; // hidden while the character loads

				// Animated character, scaled to fit in the box
				const gltf = await new GLTFLoader().loadAsync( 'models/gltf/Michelle.glb' );
				const character = gltf.scene;
				character.traverse( ( child ) => {

					if ( child.isMesh ) {

						child.castShadow = true;
						child.receiveShadow = true;

					}

				} );
				character.scale.setScalar( 10 / new THREE.Box3().setFromObject( character ).getSize( new THREE.Vector3() ).y );
				scene.add( character );

				mixer = new THREE.AnimationMixer( character );
				mixer.clipAction( gltf.animations[ 0 ] ).play();

				const setups = {
					basic: [ tallBox, shortBox ],
					rounded: [ cone, sphere ],
					metallic: [ cone, metalSphere ],
					animated: [ character ]
				};
				const setupObjects = [ tallBox, shortBox, cone, sphere, metalSphere, character ];

				function updateScene() {

					for ( const object of setupObjects ) object.visible = setups[ params.scene ].includes( object );

				}

				// Light source geometry
				const lightSourceGeometry = new THREE.CylinderGeometry( 2.5, 2.5, 1, 64 );
				const lightSourceMaterial = new THREE.MeshStandardMaterial( { color: 0x000000, emissive: 0xffffff } ); // emissive so AO doesn't darken it
				const lightSource = new THREE.Mesh( lightSourceGeometry, lightSourceMaterial );
				lightSource.position.y = 15;
				scene.add( lightSource );

				// Point light
				const pointLight = new THREE.PointLight( '#ffffff', 100 );
				pointLight.position.set( 0, 13, 0 );
				pointLight.distance = 100;
				pointLight.castShadow = true;
				pointLight.shadow.mapSize.width = 1024;
				pointLight.shadow.mapSize.height = 1024;
				scene.add( pointLight );

				// Ambient light
				const ambientLight = new THREE.AmbientLight( '#0c0c0c' );
				scene.add( ambientLight );

				window.addEventListener( 'resize', onWindowResize );

				//

				const params = {
					output: 0,
					scene: 'basic',
					reflections: true,
					animatedNoise: true
				};

				updateScene();

				const types = { Combined: 0, Direct: 3, AO: 1, GI: 2 };

				const gui = renderer.inspector.createParameters( 'SSGI settings' );
				gui.add( params, 'scene', { 'Basic': 'basic', 'Rounded': 'rounded', 'Metallic': 'metallic', 'Animated': 'animated' } ).onChange( updateScene );
				gui.add( giPass, 'resolutionScale', { 'None': 1, '2x': 1 / 2, '3x': 1 / 3, '4x': 1 / 4 } ).name( 'downsampling' );
				gui.add( params, 'output', types ).onChange( updatePostprocessing );
				gui.add( params, 'reflections' ).onChange( updatePostprocessing );

				const denoiseFolder = gui.addFolder( 'Denoising' );
				denoiseFolder.add( giParams, 'denoising', { 'none': 'none', 'temporal': 'temporal' } ).name( 'method' ).onChange( updatePostprocessing );
				denoiseFolder.add( params, 'animatedNoise' ).name( 'animated noise' ).onChange( updateNoise );

				const aoFolder = gui.addFolder( 'AO' );
				aoFolder.add( giPass.aoIntensity, 'value', 0, 4 ).name( 'AO intensity' );

				const giFolder = gui.addFolder( 'SSGI' );
				giFolder.add( giPass.sliceCount, 'value', 1, 4, 1 ).name( 'slice count' );
				giFolder.add( giPass.stepCount, 'value', 1, 32, 1 ).name( 'step count' );
				giFolder.add( giPass.radius, 'value', 1, 25 ).name( 'radius' );
				giFolder.add( giPass.expFactor, 'value', 1, 3 ).name( 'exp factor' );
				giFolder.add( giPass.thickness, 'value', 0.01, 10 ).name( 'thickness' );
				giFolder.add( giPass.backfaceLighting, 'value', 0, 1 ).name( 'backface lighting' );
				giFolder.add( giPass.giIntensity, 'value', 0, 100 ).name( 'GI intensity' );
				giFolder.add( giPass.useLinearThickness, 'value' ).name( 'use linear thickness' );
				giFolder.add( giPass.useScreenSpaceSampling, 'value' ).name( 'screen-space sampling' );

				function updatePostprocessing() {


					const { ao, gi } = signals[ giParams.denoising ];

					debugView.value = params.output === 3 ? 0 : params.output;

					const radiance = params.reflections ? builtinRadianceContext( reflections ) : null;

					scenePass.contextNode = params.output === 3 ? null : builtinGIContext( ao, gi, radiance );
					scenePass.needsUpdate = true;

					renderPipeline.outputNode = debugView.equal( 1 ).select( vec4( vec3( ao ), 1 ), debugView.equal( 2 ).select( vec4( gi, 1 ), traaPass ) );
					renderPipeline.needsUpdate = true;

				}

				// one switch for all temporal randomness: the effects' noise and the TRAA jitter. The effects
				// share the frame index but use their own sequences, so their noise stays uncorrelated

				function updateNoise() {

					const animated = params.animatedNoise;

					giPass.useTemporalFiltering = ssrPass.useTemporalFiltering = traaPass.useJitter = animated;
					for ( const node of denoiseNodes ) node.useTemporalFiltering = animated;

				}

				updateNoise();
				updatePostprocessing();

			}

			function onWindowResize() {

				const width = window.innerWidth;
				const height = window.innerHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize( width, height );

			}

			function animate() {

				timer.update();

				controls.update();

				if ( mixer ) mixer.update( timer.getDelta() );

				renderPipeline.render();

			}

		</script>
	</body>
</html>
