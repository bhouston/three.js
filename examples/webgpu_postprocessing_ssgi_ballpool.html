<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - SSGI Ball Pool</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - SSGI Ball Pool">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_postprocessing_ssgi_ballpool.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_postprocessing_ssgi_ballpool.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
		<style>
			canvas {
				touch-action: none;
			}
		</style>
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>SSGI Ball Pool</span>
			</div>

			<small>Real-time indirect illumination with interactive physics ball pool.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { pass, mrt, normalView, velocity, vec4, packNormalToRGB, unpackRGBToNormal, sample, rtt, screenUV, uniform, vec3, Fn, builtinIndirectContext } from 'three/tsl';
			import { ssgi } from 'three/addons/tsl/display/SSGINode.js';
			import { depthAwareDownsample } from 'three/addons/tsl/display/DepthAwareDownsampleNode.js';
			import { jointBilateralUpsample } from 'three/addons/tsl/display/JointBilateralUpsample.js';
			import { temporalReproject } from 'three/addons/tsl/display/TemporalReprojectNode.js';
			import { reprojectedBeauty, previousViewZ } from 'three/addons/tsl/display/ReprojectedBeautyNode.js';
			import { traa } from 'three/addons/tsl/display/TRAANode.js';
			import { RapierPhysics } from 'three/addons/physics/RapierPhysics.js';

			import { Inspector } from 'three/addons/inspector/Inspector.js';

			const BALL_RADIUS = 0.4;
			const FILL_RATIO = 0.4;
			const PACKING = 0.6;
			const BOX_HEIGHT = 6;
			const BOX_DEPTH = 8;
			const WALL_THICKNESS = 0.5;
			const CAM_FOV = 45;
			const EASE_SPEED = 8;

			let camera, scene, renderer, renderPipeline;
			let raycaster, pointer;
			let mouseLight;

			let physics;
			let ballCount = 0;
			let ballsMesh = null;
			let wallMeshes = [];
			const boxSize = { w: 8, h: BOX_HEIGHT, d: BOX_DEPTH };

			const whiteMaterial = new THREE.MeshPhysicalMaterial( {
				color: 0xeeeeee,
				roughness: 0.7,
				metalness: 0.0
			} );

			const redMaterial = new THREE.MeshPhysicalMaterial( {
				color: 0xff2222,
				roughness: 0.7,
				metalness: 0.0
			} );

			const greenMaterial = new THREE.MeshPhysicalMaterial( {
				color: 0x22ff22,
				roughness: 0.7,
				metalness: 0.0
			} );

			const ballGeometry = new THREE.SphereGeometry( BALL_RADIUS, 32, 16 );

			const ballMaterial = new THREE.MeshPhysicalMaterial( {
				roughness: 0.3,
				metalness: 0.1
			} );

			const mouseRayOrigin = new THREE.Vector3();
			const mouseRayDir = new THREE.Vector3();
			let mouseMoving = false;
			let mouseStopTimer = 0;
			let pointerDown = false;
			const activePointers = new Set();
			const mouseLightTarget = new THREE.Vector3( 0, BOX_HEIGHT / 2, BOX_DEPTH / 2 );
			const mouseRayOriginTarget = new THREE.Vector3();
			const mouseRayDirTarget = new THREE.Vector3();

			init();

			async function init() {

				physics = await RapierPhysics();

				camera = new THREE.PerspectiveCamera( CAM_FOV, window.innerWidth / window.innerHeight, 0.1, 100 );

				scene = new THREE.Scene();

				renderer = new THREE.WebGPURenderer( { antialias: false } );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 0.5;
				renderer.shadowMap.enabled = true;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				//

				renderPipeline = new THREE.RenderPipeline( renderer );

				// the pre-pass renders the geometry SSGI traces, without shading it

				const prePass = pass( scene, camera );
				prePass.setMRT( mrt( {
					output: packNormalToRGB( normalView ),
					velocity: vec4( velocity, 0, previousViewZ )
				} ) );

				const prePassNormal = prePass.getTextureNode( 'output' );
				const prePassDepth = prePass.getTextureNode( 'depth' );
				const prePassVelocity = prePass.getTextureNode( 'velocity' );

				// bandwidth optimization

				const normalTexture = prePass.getTexture( 'output' );
				normalTexture.type = THREE.UnsignedByteType;

				// the beauty pass shades the scene with the GI, which gathers the previous frame's beauty

				const beautyPass = pass( scene, camera );
				const previousBeauty = reprojectedBeauty( prePass, beautyPass );

				const sceneNormal = sample( ( uv ) => {

					return unpackRGBToNormal( prePassNormal.sample( uv ) );

				} );

				// gi

				const giPass = ssgi( previousBeauty, prePassDepth, sceneNormal, camera );
				giPass.sliceCount.value = 2;
				giPass.stepCount.value = 8;

				// downsample: at a ratio above 1, the GI is computed and accumulated from downsampled inputs and upsampled afterwards

				const downsampleParams = { level: 1, upsampler: 'Joint bilateral' };

				const downsample = depthAwareDownsample( prePassDepth, { normal: prePassNormal, velocity: prePassVelocity } );
				const downsampleDepth = downsample.getTextureNode( 'depth' );
				const downsampleVelocity = downsample.getTextureNode( 'velocity' );
				const downsampleNormal = sample( ( uv ) => {

					return unpackRGBToNormal( downsample.getTextureNode( 'normal' ).sample( uv ) );

				} );

				// without depth rejection, the joint bilateral filter is a bilinear filter

				const depthTolerance = uniform( 0.005 );

				const upsample = ( node ) => {

					const upsampled = rtt( jointBilateralUpsample( node, downsampleDepth, prePassDepth, camera, { depthTolerance } ).sample( screenUV ) ).sample( screenUV );

					return Fn( () => ( downsampleParams.level > 0 ) ? upsampled : node.sample( screenUV ) )();

				};

				function updateDownsample() {

					const reduced = downsampleParams.level > 0;

					if ( reduced ) downsample.level = downsampleParams.level;

					giPass.depthNode = reduced ? downsampleDepth : prePassDepth;
					giPass.normalNode = reduced ? downsampleNormal : sceneNormal;

					giTexture.setResolutionScale( 1 / ( 1 << downsampleParams.level ) );

					temporalReprojectNode.depthNode = giPass.depthNode;
					temporalReprojectNode.normalNode = reduced ? downsample.getTextureNode( 'normal' ) : prePassNormal;
					temporalReprojectNode.velocityNode = reduced ? downsampleVelocity : prePassVelocity;

					renderPipeline.needsUpdate = true;

					reduced ? upsamplerControl.show() : upsamplerControl.hide();

				}

				// temporal accumulation at the resolution of the GI: the GI in rgb and its coverage, the complement of the AO, in alpha

				const giTexture = rtt( vec4( giPass.getGINode().toInspector( 'SSGI.GI' ).rgb, giPass.getAONode().toInspector( 'SSGI.AO' ).r.oneMinus() ) );

				const temporalReprojectNode = temporalReproject( giTexture, prePassDepth, prePassNormal, prePassVelocity, camera, { accumulate: true } );
				temporalReprojectNode.clampIntensity.value = 0.25;

				const accumulated = upsample( temporalReprojectNode.getTextureNode().toInspector( 'Temporal Accumulation' ) );

				// the materials receive the GI through their BRDF, and it occludes the ambient light and the environment

				const ao = accumulated.a.oneMinus();
				const gi = accumulated.rgb;
				const giUnfiltered = upsample( giTexture ).rgb;

				beautyPass.contextNode = builtinIndirectContext( { diffuse: [ giPass.getDiffuseSource( gi, ao ) ] } );

				// traa

				const traaPass = traa( beautyPass, prePassDepth, prePassVelocity, camera );
				renderPipeline.outputNode = traaPass;

				//

				const params = { output: 0 };

				const displayGui = renderer.inspector.createParameters( 'Display' );
				displayGui.add( params, 'output', { Combined: 0, AO: 1, GI: 2, 'GI (unfiltered)': 4 } ).onChange( updatePostprocessing );

				const downsampleGui = renderer.inspector.createParameters( 'Downsample' );
				downsampleGui.add( downsampleParams, 'level', { '1': 0, '2': 1, '4': 2 } ).name( 'ratio' ).onChange( ( value ) => {

					downsampleParams.level = Number( value );
					updateDownsample();

				} );
				const upsamplerControl = downsampleGui.add( downsampleParams, 'upsampler', [ 'Bilinear', 'Joint bilateral' ] ).onChange( ( value ) => depthTolerance.value = ( value === 'Bilinear' ) ? 1e6 : 0.005 );

				updateDownsample();

				const giGui = renderer.inspector.createParameters( 'SSGI' );
				giGui.add( giPass.sliceCount, 'value', 1, 4, 1 ).name( 'slice count' );
				giGui.add( giPass.stepCount, 'value', 1, 32, 1 ).name( 'step count' );
				giGui.add( giPass.radius, 'value', 1, 25 ).name( 'radius' );
				giGui.add( giPass.expFactor, 'value', 1, 3 ).name( 'exp factor' );
				giGui.add( giPass.thickness, 'value', 0.01, 10 ).name( 'thickness' );
				giGui.add( giPass.backfaceLighting, 'value', 0, 1 ).name( 'backface lighting' );
				giGui.add( giPass.aoIntensity, 'value', 0, 4 ).name( 'AO intensity' );
				giGui.add( giPass.giIntensity, 'value', 0, 100 ).name( 'GI intensity' );
				giGui.add( giPass.useLinearThickness, 'value' ).name( 'linear thickness' );
				giGui.add( giPass.useScreenSpaceSampling, 'value' ).name( 'screen-space sampling' );

				const filteringGui = renderer.inspector.createParameters( 'Filtering' );
				filteringGui.add( giPass, 'useTemporalFiltering' ).name( 'temporal' ).onChange( updatePostprocessing );
				filteringGui.add( temporalReprojectNode.maxFrames, 'value', 1, 128, 1 ).name( 'history frames' );
				filteringGui.add( temporalReprojectNode.clampIntensity, 'value', 0, 1 ).name( 'clamp intensity' );
				filteringGui.add( temporalReprojectNode.flickerSuppression, 'value', 0, 1 ).name( 'flicker suppression' );

				function updatePostprocessing() {

					const outputs = {
						1: vec4( vec3( ao ), 1 ),
						2: vec4( gi, 1 ),
						4: vec4( giUnfiltered, 1 )
					};

					renderPipeline.outputNode = outputs[ params.output ] || ( giPass.useTemporalFiltering ? traaPass : beautyPass );
					renderPipeline.needsUpdate = true;

				}

				// light

				mouseLight = new THREE.PointLight( 0xffffff, 80 );
				mouseLight.position.set( 0, BOX_HEIGHT / 2, BOX_DEPTH / 2 );
				mouseLight.castShadow = true;
				mouseLight.shadow.mapSize.set( 1024, 1024 );
				mouseLight.shadow.radius = 20;
				scene.add( mouseLight );

				//

				raycaster = new THREE.Raycaster();
				pointer = new THREE.Vector2();

				rebuildScene();

				//

				renderer.domElement.addEventListener( 'pointerdown', onPointerDown );
				renderer.domElement.addEventListener( 'pointermove', onPointerMove );
				renderer.domElement.addEventListener( 'pointerup', onPointerUp );
				renderer.domElement.addEventListener( 'pointercancel', onPointerUp );
				window.addEventListener( 'resize', onWindowResize );

			}

			function getBoxWidth() {

				const aspect = window.innerWidth / window.innerHeight;
				const vFov = THREE.MathUtils.degToRad( CAM_FOV / 2 );
				const dist = ( BOX_HEIGHT / 2 ) / Math.tan( vFov );
				return Math.tan( vFov ) * aspect * dist * 2;

			}

			function getBallCount() {

				const roomVolume = boxSize.w * boxSize.h * boxSize.d;
				const ballVolume = ( 4 / 3 ) * Math.PI * Math.pow( BALL_RADIUS, 3 );
				return Math.floor( roomVolume * FILL_RATIO * PACKING / ballVolume );

			}

			function rebuildScene() {

				for ( const mesh of wallMeshes ) {

					physics.world.removeRigidBody( mesh.userData.physics.body );
					scene.remove( mesh );
					mesh.geometry.dispose();

				}

				wallMeshes = [];

				if ( ballsMesh ) {

					physics.removeMesh( ballsMesh );
					scene.remove( ballsMesh );
					ballsMesh.dispose();
					ballsMesh = null;

				}

				boxSize.w = getBoxWidth();
				ballCount = getBallCount();

				fitCameraToBox();
				createBox();
				createBalls();

			}

			function createBox() {

				const hw = boxSize.w / 2;
				const hh = boxSize.h / 2;
				const hd = boxSize.d / 2;
				const t = WALL_THICKNESS;

				const walls = [
					{ size: [ boxSize.w, t, boxSize.d ], pos: [ 0, - t / 2, 0 ], mat: whiteMaterial },
					{ size: [ boxSize.w, t, boxSize.d ], pos: [ 0, boxSize.h + t / 2, 0 ], mat: whiteMaterial },
					{ size: [ boxSize.w, boxSize.h, t ], pos: [ 0, hh, - hd - t / 2 ], mat: whiteMaterial },
					{ size: [ boxSize.w, boxSize.h, t ], pos: [ 0, hh, hd + t / 2 ], mat: whiteMaterial, noMesh: true },
					{ size: [ t, boxSize.h, boxSize.d ], pos: [ - hw - t / 2, hh, 0 ], mat: redMaterial },
					{ size: [ t, boxSize.h, boxSize.d ], pos: [ hw + t / 2, hh, 0 ], mat: greenMaterial }
				];

				for ( const w of walls ) {

					const geo = new THREE.BoxGeometry( w.size[ 0 ], w.size[ 1 ], w.size[ 2 ] );
					const mesh = new THREE.Mesh( geo, w.mat );
					mesh.position.set( ...w.pos );
					mesh.receiveShadow = true;
					wallMeshes.push( mesh );

					physics.addMesh( mesh, 0, 0.4 );

					if ( ! w.noMesh ) scene.add( mesh );

				}

			}

			function createBalls() {

				ballsMesh = new THREE.InstancedMesh( ballGeometry, ballMaterial, ballCount );
				ballsMesh.castShadow = true;
				ballsMesh.receiveShadow = true;
				scene.add( ballsMesh );

				const colors = [
					0xff4444, 0x44ff44, 0x4488ff, 0xffaa00, 0xff44ff,
					0x44ffff, 0xffff44, 0xff8844, 0x8844ff, 0x44ff88
				];

				const color = new THREE.Color();
				const matrix = new THREE.Matrix4();
				const hw = boxSize.w / 2 - BALL_RADIUS - 0.1;
				const hd = boxSize.d / 2 - BALL_RADIUS - 0.1;

				for ( let i = 0; i < ballCount; i ++ ) {

					color.set( colors[ i % colors.length ] );
					ballsMesh.setColorAt( i, color );

					const x = ( Math.random() - 0.5 ) * 2 * hw;
					const y = BALL_RADIUS + Math.random() * ( boxSize.h - BALL_RADIUS * 2 );
					const z = ( Math.random() - 0.5 ) * 2 * hd;

					ballsMesh.setMatrixAt( i, matrix.makeTranslation( x, y, z ) );

				}

				physics.addMesh( ballsMesh, 1, 0.5 );

			}

			function onPointerDown( event ) {

				activePointers.add( event.pointerId );

				if ( event.pointerType === 'touch' ) {

					pointerDown = activePointers.size >= 2;

				} else {

					pointerDown = true;

				}

			}

			function onPointerUp( event ) {

				activePointers.delete( event.pointerId );

				if ( event.pointerType === 'touch' ) {

					pointerDown = activePointers.size >= 2;

				} else {

					pointerDown = false;

				}

			}

			function onPointerMove( event ) {

				pointer.x = ( event.clientX / window.innerWidth ) * 2 - 1;
				pointer.y = - ( event.clientY / window.innerHeight ) * 2 + 1;

				raycaster.setFromCamera( pointer, camera );

				mouseRayOriginTarget.copy( raycaster.ray.origin );
				mouseRayDirTarget.copy( raycaster.ray.direction );
				mouseMoving = true;
				clearTimeout( mouseStopTimer );
				mouseStopTimer = setTimeout( () => mouseMoving = false, 50 );

				const frontPlane = new THREE.Plane( new THREE.Vector3( 0, 0, 1 ), - boxSize.d / 2 );
				const hit = new THREE.Vector3();
				if ( raycaster.ray.intersectPlane( frontPlane, hit ) ) {

					mouseLightTarget.copy( hit );

				}

			}

			function respawnBalls() {

				const hw = boxSize.w / 2 - BALL_RADIUS - 0.1;
				const hd = boxSize.d / 2 - BALL_RADIUS - 0.1;
				const count = 5;
				const position = new THREE.Vector3();

				for ( let i = 0; i < count; i ++ ) {

					position.set(
						( Math.random() - 0.5 ) * 2 * hw,
						boxSize.h - BALL_RADIUS - Math.random() * 1,
						( Math.random() - 0.5 ) * 2 * hd
					);

					const index = Math.floor( Math.random() * ballCount );

					physics.setMeshPosition( ballsMesh, position, index );
					ballsMesh.userData.physics.body[ index ].wakeUp();

				}

			}

			function fitCameraToBox() {

				const vFov = THREE.MathUtils.degToRad( CAM_FOV / 2 );
				const dist = ( boxSize.h / 2 ) / Math.tan( vFov );

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.position.set( 0, boxSize.h / 2, dist + boxSize.d / 2 );
				camera.lookAt( 0, boxSize.h / 2, 0 );
				camera.updateProjectionMatrix();

			}

			function onWindowResize() {

				renderer.setSize( window.innerWidth, window.innerHeight );
				rebuildScene();

			}

			const timer = new THREE.Timer();
			const _matrix = new THREE.Matrix4();

			function animate() {

				timer.update();
				const dt = Math.min( timer.getDelta(), 1 / 30 );

				const easeFactor = 1 - Math.exp( - EASE_SPEED * dt );
				mouseRayOrigin.lerp( mouseRayOriginTarget, easeFactor );
				mouseRayDir.lerp( mouseRayDirTarget, easeFactor );
				mouseLight.position.lerp( mouseLightTarget, easeFactor );

				if ( pointerDown ) {

					respawnBalls();

				}

				if ( mouseMoving ) {

					const pushRadius = 1.5;
					const pushStrength = 15;
					const _closest = new THREE.Vector3();
					const _ballPos = new THREE.Vector3();
					const _pushDir = new THREE.Vector3();

					for ( let i = 0; i < ballCount; i ++ ) {

						ballsMesh.getMatrixAt( i, _matrix );
						_ballPos.setFromMatrixPosition( _matrix );

						const ray = new THREE.Ray( mouseRayOrigin, mouseRayDir );
						ray.closestPointToPoint( _ballPos, _closest );

						const dist = _closest.distanceTo( _ballPos );

						if ( dist < pushRadius ) {

							_pushDir.subVectors( _ballPos, _closest );
							if ( _pushDir.lengthSq() < 0.001 ) _pushDir.set( 0, 1, 0 );
							_pushDir.normalize();

							const strength = pushStrength * ( 1 - dist / pushRadius );
							physics.applyImpulse( ballsMesh, _pushDir.multiplyScalar( strength ), i );

						}

					}

				}

				renderPipeline.render();

			}

		</script>

	</body>
</html>
