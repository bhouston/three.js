<!DOCTYPE html>
<html lang="en">

<head>

	<head>
		<title>three.js webgpu - postprocessing - Screen Space Reflections (SSR)</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - postprocessing - Screen Space Reflections (SSR)">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_postprocessing_ssr.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_postprocessing_ssr.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>

<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>SSR</span>
			</div>

			<small>
				Screen Space Reflections.<br />
				<a href="https://skfb.ly/6tqYD" target="_blank" rel="noopener">Steampunk Camera</a> by
				<a href="https://sketchfab.com/lumoize" target="_blank" rel="noopener">dylanheyes</a> is licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">Creative Commons Attribution</a>.
			</small>
		</div>

	<script>
		// Source imports keep commit-pinned comparisons runnable without generated builds.
		const sourceImports = new URLSearchParams( window.location.search ).get( 'source' ) === '1';
		const importMap = document.createElement( 'script' );
		importMap.type = 'importmap';
		importMap.textContent = JSON.stringify( { imports: {
			'three': sourceImports ? '../src/Three.WebGPU.js' : '../build/three.webgpu.js',
			'three/webgpu': sourceImports ? '../src/Three.WebGPU.js' : '../build/three.webgpu.js',
			'three/tsl': sourceImports ? '../src/Three.TSL.js' : '../build/three.tsl.js',
			'three/addons/': './jsm/'
		} } );
		document.currentScript.after( importMap );
	</script>

	<script type="module">

		import * as THREE from 'three/webgpu';
		import { pass, mrt, output, normalView, metalness, roughness, screenUV, color, sample, packNormalToRGB, unpackRGBToNormal, vec2, vec3, vec4, diffuseColor, velocity, colorSpaceToWorking } from 'three/tsl';
		import { ssr } from 'three/addons/tsl/display/SSRNode.js';
		import { powerLobeSSR } from 'three/addons/tsl/display/PowerLobeSSRNode.js';
		import { readSSRComparison, addSSRComparisonGUI, applySSRComparison, createSSRComparisonDenoiser, createSSRHistoryReset } from 'three/addons/tsl/display/SSRComparison.js';
		import { smaa } from 'three/addons/tsl/display/SMAANode.js';

		import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
		import { Inspector } from 'three/addons/inspector/Inspector.js';
		import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';

		const comparison = readSSRComparison( 'mirror', false, 32 );
		// Explicit comparison modes replace scene environment specular with the estimator.
		// The URL-less example retains its original mirror/blur composition and defaults.
		if ( comparison.explicit ) {

			const indirectSpecular = THREE.PhysicalLightingModel.prototype.indirectSpecular;
			THREE.PhysicalLightingModel.prototype.indirectSpecular = function ( builder ) {

				builder.context.radiance = vec3( 0 );
				if ( this.clearcoatRadiance ) this.clearcoatRadiance.assign( vec3( 0 ) );
				indirectSpecular.call( this, builder );

			};

		}

		const params = {
			quality: 0.5,
			blurQuality: 1,
			maxDistance: 1,
			intensity: 1,
			thickness: 0.03,
			binaryRefine: false,
			roughness: 1,
			enabled: true
		};
		params.maxDistance = comparison.maxDistance ?? params.maxDistance;
		params.thickness = comparison.thickness ?? params.thickness;

		let camera, scene, model, renderer, renderPipeline, ssrPass;
		let controls, historyReset;

		init();

		async function init() {

			camera = new THREE.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 0.1, 50 );
			camera.position.set( 3, 2, 3 );

			scene = new THREE.Scene();
			scene.backgroundNode = screenUV.distance( .5 ).remap( 0, 0.5 ).mix( color( 0x888877 ), color( 0x776666 ) );

			const dracoLoader = new DRACOLoader();

			const loader = new GLTFLoader();
			loader.setDRACOLoader( dracoLoader );
			loader.load( 'models/gltf/steampunk_camera.glb', function ( gltf ) {

				model = gltf.scene;

				model.traverse( function ( object ) {

					if ( object.material ) {

						if ( object.material.name === 'Lense_Casing' ) {

							object.material.transparent = true;

						}

						// Avoid overdrawing
						object.material.side = THREE.FrontSide;

					}

				} );

				model.position.y = 0.1;
				scene.add( model );

			} );

			// Add a reflective plane under the camera

			const floorGeometry = new THREE.CircleGeometry( 2, 64 );
			const floorMaterial = new THREE.MeshStandardMaterial( {
				color: 0xffffff,
				metalness: 1,
				roughness: 0.5
			} );
			const floor = new THREE.Mesh( floorGeometry, floorMaterial );
			floor.rotation.x = - Math.PI / 2;
			floor.position.y = - 0.8;
			scene.add( floor );

			//

			renderer = new THREE.WebGPURenderer();
			// renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.toneMapping = THREE.ACESFilmicToneMapping;
			renderer.inspector = new Inspector();
			document.body.appendChild( renderer.domElement );

			await renderer.init();

			const environment = new RoomEnvironment();
			const pmremGenerator = new THREE.PMREMGenerator( renderer );

			scene.environment = pmremGenerator.fromScene( environment, 0.04 ).texture;
			scene.environmentIntensity = 1.25;
			pmremGenerator.dispose();
			let comparisonEnvironment = null;
			if ( comparison.explicit ) {

				comparisonEnvironment = await new HDRLoader().loadAsync( 'textures/equirectangular/quarry_01_1k.hdr' );
				comparisonEnvironment.mapping = THREE.EquirectangularReflectionMapping;
				scene.environment = comparisonEnvironment;

			}

			//

			renderPipeline = new THREE.RenderPipeline( renderer );

			const scenePass = pass( scene, camera );
			const tracePass = comparison.mode === 'power' ? pass( scene, camera ) : scenePass;
			tracePass.transparent = comparison.mode !== 'power';
			tracePass.setMRT( mrt( {
				output: output,
				normal: vec4( packNormalToRGB( normalView ), roughness ),
				diffuseColor: vec4( diffuseColor.rgb, metalness ),
				velocity: velocity
			} ) );

			const scenePassColor = scenePass.getTextureNode( 'output' ).toInspector( 'Color' );
			const scenePassNormal = tracePass.getTextureNode( 'normal' ).toInspector( 'Normal', ( node ) => {

				return colorSpaceToWorking( node, THREE.SRGBColorSpace );

			} );
			const scenePassDepth = tracePass.getTextureNode( 'depth' ).toInspector( 'Depth', () => {

				return tracePass.getLinearDepthNode();

			} );
			const scenePassDiffuse = tracePass.getTextureNode( 'diffuseColor' );
			const scenePassMetalRough = sample( ( uv ) => vec2( scenePassDiffuse.sample( uv ).a, scenePassNormal.sample( uv ).a ) );
			const traceColor = tracePass.getTextureNode( 'output' );
			const traceVelocity = tracePass.getTextureNode( 'velocity' );

			// optional: optimize bandwidth by reducing the texture precision for normals and metal/roughness

			const normalTexture = tracePass.getTexture( 'normal' );
			normalTexture.type = THREE.UnsignedByteType;

			tracePass.getTexture( 'diffuseColor' ).type = THREE.UnsignedByteType;

			const sceneNormal = sample( ( uv ) => {

				return unpackRGBToNormal( scenePassNormal.sample( uv ).rgb );

			} );

			//

			const createSSR = comparison.mode === 'power' ? powerLobeSSR : ssr;
			ssrPass = createSSR( traceColor, scenePassDepth, sceneNormal, {
				camera,
				stochastic: comparison.mode === 'ggx',
				maxRayLength: comparison.explicit ? params.maxDistance : null,
				metalnessNode: scenePassMetalRough.r,
				roughnessNode: scenePassMetalRough.g,
				diffuseNode: tracePass.getTextureNode( 'diffuseColor' ),
				environmentNode: comparisonEnvironment,
				velocityNode: traceVelocity
			} ).toInspector( 'SSR' );
			const reconstruction = comparison.denoise ? createSSRComparisonDenoiser( ssrPass, scenePassDepth, scenePassNormal, traceVelocity, scenePassMetalRough, camera ) : null;
			const reflection = reconstruction ? reconstruction.color : ssrPass;

			// blend SSR over beauty (SSR outputs premultiplied color, so use additive blending)

			const outputNode = smaa( scenePassColor.add( reflection.rgb ) );

			renderPipeline.outputNode = outputNode;

			//

			controls = new OrbitControls( camera, renderer.domElement );
			controls.enableDamping = true;
			controls.update();

			window.addEventListener( 'resize', onWindowResize );

			// GUI

			const gui = renderer.inspector.createParameters( 'Settings' );
			const ssrFolder = gui.addFolder( 'SSR' );
			addSSRComparisonGUI( gui.addFolder( 'Estimator comparison' ), comparison, updateParameters );
			if ( comparison.mode === 'mirror' ) ssrFolder.add( params, 'blurQuality', 1, 3, 1 ).name( 'blur quality' ).onChange( updateParameters );
			ssrFolder.add( params, 'maxDistance', 0, 1 ).onChange( updateParameters );
			ssrFolder.add( params, 'intensity', 0, 1 ).onChange( updateParameters );
			ssrFolder.add( params, 'thickness', 0, 0.05 ).onChange( updateParameters );
			if ( comparison.mode !== 'power' ) ssrFolder.add( params, 'binaryRefine' ).name( 'binary refine (stock)' ).onChange( updateParameters );
			ssrFolder.add( params, 'enabled' ).onChange( () => {

				if ( params.enabled === true ) {

					renderPipeline.outputNode = outputNode;

				} else {

					renderPipeline.outputNode = scenePass;

				}

				renderPipeline.needsUpdate = true;

			} );
			const modelFolder = gui.addFolder( 'Model' );
			modelFolder.add( params, 'roughness', 0, 1 ).onChange( ( value ) => {

				scene.traverse( function ( object ) {

					if ( object.material ) {

						object.material.roughness = value;

					}

				} );

			} );

			historyReset = createSSRHistoryReset( ssrPass, camera, reconstruction?.temporal, reconstruction?.denoise );
			gui.add( { resetHistory: historyReset.reset }, 'resetHistory' ).name( 'reset history / seed' );
			updateParameters();
			window.ssrComparison = { renderer, camera, scene, params, comparison, node: ssrPass, controls, resetHistory: historyReset.reset, renderPipeline, reconstruction };
			renderer.setAnimationLoop( animate );

		}

		function updateParameters() {

			if ( comparison.mode !== 'power' ) {

				ssrPass.quality.value = params.quality;
				// blurQuality is a build-time constant: assigning it recompiles the blur material
				// (the setter no-ops when the value is unchanged).
				ssrPass.blurQuality = params.blurQuality;
				ssrPass.binaryRefine = params.binaryRefine;

			}

			ssrPass.maxDistance.value = params.maxDistance;
			ssrPass.intensity.value = params.intensity;
			if ( comparison.explicit ) ssrPass.environmentIntensity.value = scene.environmentIntensity;
			ssrPass.thickness.value = params.thickness;
			comparison.maxDistance = params.maxDistance;
			comparison.thickness = params.thickness;
			// build-time constant: assigning it recompiles the SSR material (setter no-ops if unchanged)
			applySSRComparison( ssrPass, comparison );
			historyReset?.reset();

		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize( window.innerWidth, window.innerHeight );
			historyReset?.reset();

		}

		function animate() {

			controls.update();
			historyReset.update();

			renderPipeline.render();

		}

	</script>
</body>

</html>
