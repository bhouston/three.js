<!DOCTYPE html>
<html lang="en">

<head>

	<head>
		<title>three.js webgpu - postprocessing - Screen Space Reflections (SSR)</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - postprocessing - Screen Space Reflections (SSR)">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_postprocessing_ssr.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_postprocessing_ssr.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>

<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>SSR</span>
			</div>

			<small>
				Screen Space Reflections.<br />
				<a href="https://skfb.ly/6tqYD" target="_blank" rel="noopener">Steampunk Camera</a> by
				<a href="https://sketchfab.com/lumoize" target="_blank" rel="noopener">dylanheyes</a> is licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">Creative Commons Attribution</a>.
			</small>
		</div>

	<script type="importmap">
		{
			"imports": {
				"three": "../build/three.webgpu.js",
				"three/webgpu": "../build/three.webgpu.js",
				"three/tsl": "../build/three.tsl.js",
				"three/addons/": "./jsm/"
			}
		}
	</script>

	<script type="module">

		import * as THREE from 'three/webgpu';
		import { pass, mrt, normalView, metalness, roughness, velocity, screenUV, color, sample, texture, packNormalToRGB, unpackRGBToNormal, vec2, colorSpaceToWorking, builtinRadianceContext } from 'three/tsl';
		import { ssr } from 'three/addons/tsl/display/SSRNode.js';
		import { smaa } from 'three/addons/tsl/display/SMAANode.js';

		import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
		import { Inspector } from 'three/addons/inspector/Inspector.js';

		const params = {
			quality: 0.5,
			blurQuality: 1,
			maxDistance: 1,
			intensity: 1,
			thickness: 0.03,
			binaryRefine: false,
			roughness: 1,
			enabled: true
		};

		let camera, scene, model, renderer, renderPipeline, ssrPass;
		let controls;

		init();

		async function init() {

			camera = new THREE.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 0.1, 50 );
			camera.position.set( 3, 2, 3 );

			scene = new THREE.Scene();
			scene.backgroundNode = screenUV.distance( .5 ).remap( 0, 0.5 ).mix( color( 0x888877 ), color( 0x776666 ) );

			const dracoLoader = new DRACOLoader();

			const loader = new GLTFLoader();
			loader.setDRACOLoader( dracoLoader );
			loader.load( 'models/gltf/steampunk_camera.glb', function ( gltf ) {

				model = gltf.scene;

				model.traverse( function ( object ) {

					if ( object.material ) {

						if ( object.material.name === 'Lense_Casing' ) {

							object.material.transparent = true;

						}

						// Avoid overdrawing
						object.material.side = THREE.FrontSide;

					}

				} );

				model.position.y = 0.1;
				scene.add( model );

			} );

			// Add a reflective plane under the camera

			const floorGeometry = new THREE.CircleGeometry( 2, 64 );
			const floorMaterial = new THREE.MeshStandardMaterial( {
				color: 0xffffff,
				metalness: 1,
				roughness: 0.5
			} );
			const floor = new THREE.Mesh( floorGeometry, floorMaterial );
			floor.rotation.x = - Math.PI / 2;
			floor.position.y = - 0.8;
			scene.add( floor );

			//

			renderer = new THREE.WebGPURenderer();
			// renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.setAnimationLoop( animate );
			renderer.toneMapping = THREE.ACESFilmicToneMapping;
			renderer.inspector = new Inspector();
			document.body.appendChild( renderer.domElement );

			await renderer.init();

			const environment = new RoomEnvironment();
			const pmremGenerator = new THREE.PMREMGenerator( renderer );

			scene.environment = pmremGenerator.fromScene( environment, 0.04 ).texture;
			scene.environmentIntensity = 1.25;
			pmremGenerator.dispose();

			//

			renderPipeline = new THREE.RenderPipeline( renderer );

			// pre-pass: SSR feeds the materials of the scene pass, so depth, normals and velocity have to come
			// from a separate pass

			const prePass = pass( scene, camera );
			prePass.name = 'Pre-Pass';
			prePass.transparent = false;
			prePass.setMRT( mrt( {
				output: packNormalToRGB( normalView ),
				velocity: velocity,
				metalrough: vec2( metalness, roughness ) // pack metalness and roughness into a single attachment
			} ) );

			const prePassNormal = prePass.getTextureNode().toInspector( 'Normal', ( node ) => {

				return colorSpaceToWorking( node, THREE.SRGBColorSpace );

			} );
			const prePassDepth = prePass.getTextureNode( 'depth' ).toInspector( 'Depth', () => {

				return prePass.getLinearDepthNode();

			} );
			const prePassVelocity = prePass.getTextureNode( 'velocity' ).toInspector( 'Velocity' );

			// sampled in screen space since the blur mip selection also runs in the materials of the scene pass

			const prePassMetalRough = prePass.getTextureNode( 'metalrough' ).sample( screenUV ).toInspector( 'Metalness-Roughness' );

			// optional: optimize bandwidth by reducing the texture precision for metal/roughness
			// (the normals stay half float, 8 bits quantize the reflection directions into bands)

			prePass.getTexture( 'metalrough' ).type = THREE.UnsignedByteType;

			const sceneNormal = sample( ( uv ) => {

				return unpackRGBToNormal( prePassNormal.sample( uv ) );

			} );

			// scene pass: the reflections show its previous (anti-aliased) frame, reprojected to the current one.
			// SSR renders while the scene pass does, so it reads the SMAA output rather than the scene pass

			const scenePass = pass( scene, camera );
			const smaaPass = smaa( scenePass );

			const previousFrame = texture( smaaPass.getTextureNode().value );
			const previousRadiance = sample( ( uv ) => previousFrame.sample( uv.sub( prePassVelocity.sample( uv ).xy.mul( vec2( 0.5, - 0.5 ) ) ) ) );

			// SSR outputs the complete reflected radiance, falling back to the environment map, which replaces
			// the environment reflections of the materials so they apply their own Fresnel, metalness and roughness

			ssrPass = ssr( previousRadiance, prePassDepth, sceneNormal, {
				metalnessNode: prePassMetalRough.r,
				roughnessNode: prePassMetalRough.g,
				outputRadiance: true,
				environmentNode: scene.environment,
				camera
			} );
			ssrPass.environmentIntensity.value = scene.environmentIntensity;

			// there is no temporal accumulation here, so keep the march jitter fixed instead of flickering

			ssrPass.useTemporalFiltering = false;

			const reflections = ssrPass.getTextureNode().sample( screenUV ).rgb.toInspector( 'SSR' );
			const radianceContext = builtinRadianceContext( reflections );

			scenePass.contextNode = radianceContext;

			renderPipeline.outputNode = smaaPass;

			//

			controls = new OrbitControls( camera, renderer.domElement );
			controls.enableDamping = true;
			controls.update();

			window.addEventListener( 'resize', onWindowResize );

			// GUI

			const gui = renderer.inspector.createParameters( 'Settings' );
			const ssrFolder = gui.addFolder( 'SSR' );
			ssrFolder.add( params, 'quality', 0, 1 ).onChange( updateParameters );
			ssrFolder.add( params, 'blurQuality', 1, 3, 1 ).onChange( updateParameters );
			ssrFolder.add( params, 'maxDistance', 0, 1 ).onChange( updateParameters );
			ssrFolder.add( params, 'intensity', 0, 1 ).onChange( updateParameters );
			ssrFolder.add( params, 'thickness', 0, 0.05 ).onChange( updateParameters );
			ssrFolder.add( params, 'binaryRefine' ).name( 'binary refine' ).onChange( updateParameters );
			ssrFolder.add( params, 'enabled' ).onChange( () => {

				scenePass.contextNode = params.enabled === true ? radianceContext : null;
				scenePass.needsUpdate = true;

			} );
			const modelFolder = gui.addFolder( 'Model' );
			modelFolder.add( params, 'roughness', 0, 1 ).onChange( ( value ) => {

				model.traverse( function ( object ) {

					if ( object.material ) {

						object.material.roughness = value;

					}

				} );

			} );

			updateParameters();

		}

		function updateParameters() {

			ssrPass.quality.value = params.quality;
			// blurQuality is a build-time constant: assigning it recompiles the blur material
			// (the setter no-ops when the value is unchanged).
			ssrPass.blurQuality = params.blurQuality;
			ssrPass.maxDistance.value = params.maxDistance;
			ssrPass.intensity.value = params.intensity;
			ssrPass.thickness.value = params.thickness;
			// build-time constant: assigning it recompiles the SSR material (setter no-ops if unchanged)
			ssrPass.binaryRefine = params.binaryRefine;

		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize( window.innerWidth, window.innerHeight );

		}

		function animate() {

			controls.update();

			renderPipeline.render();

		}

	</script>
</body>

</html>
