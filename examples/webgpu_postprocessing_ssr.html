<!DOCTYPE html>
<html lang="en">

<head>

	<head>
		<title>three.js webgpu - postprocessing - Screen Space Reflections (SSR)</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - postprocessing - Screen Space Reflections (SSR)">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_postprocessing_ssr.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_postprocessing_ssr.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>

<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>SSR</span>
			</div>

			<small>
				Screen Space Reflections.<br />
				<a href="https://skfb.ly/6tqYD" target="_blank" rel="noopener">Steampunk Camera</a> by
				<a href="https://sketchfab.com/lumoize" target="_blank" rel="noopener">dylanheyes</a> is licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">Creative Commons Attribution</a>.
			</small>
		</div>

	<script type="importmap">
		{
			"imports": {
				"three": "../build/three.webgpu.js",
				"three/webgpu": "../build/three.webgpu.js",
				"three/tsl": "../build/three.tsl.js",
				"three/addons/": "./jsm/"
			}
		}
	</script>

	<script type="module">

		import * as THREE from 'three/webgpu';
		import { pass, mrt, output, normalView, roughness, screenUV, color, sample, packNormalToRGB, unpackRGBToNormal, vec4, uniform, mix, Fn, context, indirectSpecular, environmentSpecular, pmremTexture, velocity } from 'three/tsl';
		import { reprojectedRadiance } from 'three/addons/tsl/display/ReprojectedRadianceNode.js';
		import { temporalDenoise } from 'three/addons/tsl/display/DenoiseNode.js';
		import { resolveSSRHitDistance } from 'three/addons/tsl/utils/SpecularHelpers.js';
		import { ssr } from 'three/addons/tsl/display/SSRNode.js';
		import { traa } from 'three/addons/tsl/display/TRAANode.js';
		import { smaa } from 'three/addons/tsl/display/SMAANode.js';

		import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
		import { Inspector } from 'three/addons/inspector/Inspector.js';

		const params = {
			output: 'Beauty',
			traa: true,
			traaFrames: 20,
			steps: 32,
			traceSource: 'Previous frame',
			maxFrames: 20,
			denoise: true,
			luminancePhi: 3,
			maxDistance: 1,
			thickness: 0.03,
			binaryRefine: true,
			roughness: 1
		};

		let camera, scene, model, renderer, renderPipeline, ssrPass;
		let controls, radianceHistory, ssrDenoise;

		init();

		async function init() {

			camera = new THREE.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 0.1, 50 );
			camera.position.set( 3, 2, 3 );

			scene = new THREE.Scene();
			scene.backgroundNode = screenUV.distance( .5 ).remap( 0, 0.5 ).mix( color( 0x888877 ), color( 0x776666 ) );

			const dracoLoader = new DRACOLoader();

			const loader = new GLTFLoader();
			loader.setDRACOLoader( dracoLoader );
			loader.load( 'models/gltf/steampunk_camera.glb', function ( gltf ) {

				model = gltf.scene;

				model.traverse( function ( object ) {

					if ( object.material ) {

						if ( object.material.name === 'Lense_Casing' ) {

							object.material.transparent = true;

						}

						// Avoid overdrawing
						object.material.side = THREE.FrontSide;

					}

				} );

				model.position.y = 0.1;
				scene.add( model );

			} );

			// Add a reflective plane under the camera

			const floorGeometry = new THREE.CircleGeometry( 2, 64 );
			const floorMaterial = new THREE.MeshStandardMaterial( {
				color: 0xffffff,
				metalness: 1,
				roughness: 0.5
			} );
			const floor = new THREE.Mesh( floorGeometry, floorMaterial );
			floor.rotation.x = - Math.PI / 2;
			floor.position.y = - 0.8;
			scene.add( floor );

			//

			renderer = new THREE.WebGPURenderer();
			// renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.setAnimationLoop( animate );
			renderer.toneMapping = THREE.ACESFilmicToneMapping;
			renderer.inspector = new Inspector();
			document.body.appendChild( renderer.domElement );

			await renderer.init();

			const environment = new RoomEnvironment();
			const pmremGenerator = new THREE.PMREMGenerator( renderer );

			scene.environment = pmremGenerator.fromScene( environment, 0.04 ).texture;
			scene.environmentIntensity = 1.25;
			pmremGenerator.dispose();

			//

			renderPipeline = new THREE.RenderPipeline( renderer );

			const geometryPass = pass( scene, camera );
			geometryPass.name = 'SSR G-buffer';
			geometryPass.contextNode = context( { indirectSpecularNode: indirectSpecular( [] ) } );
			geometryPass.setMRT( mrt( {
				output: vec4( packNormalToRGB( normalView ), roughness ),
				velocity
			} ) );
			geometryPass.getTexture().type = THREE.UnsignedByteType;
			const depth = geometryPass.getTextureNode( 'depth' );
			const packedNormal = geometryPass.getTextureNode();
			const sceneNormal = sample( coordinate => unpackRGBToNormal( packedNormal.sample( coordinate ).rgb ).normalize() );
			const surfaceRoughness = sample( coordinate => packedNormal.sample( coordinate ).a );
			const motion = geometryPass.getTextureNode( 'velocity' );
			const fallback = environmentSpecular( pmremTexture( scene.environment ) );
			const scenePass = pass( scene, camera );
			scenePass.name = 'SSR current lighting';
			scenePass.contextNode = context( { indirectSpecularNode: indirectSpecular( [ fallback ] ) } );
			scenePass.setMRT( mrt( { output: vec4( output.rgb, 1 ) } ) );
			const beautyPass = pass( scene, camera );
			beautyPass.name = 'SSR resolved beauty';
			radianceHistory = reprojectedRadiance( beautyPass, depth, sceneNormal, camera );
			const previousSource = sample( coordinate => radianceHistory.sample( coordinate ) );
			ssrPass = ssr( scenePass.getTextureNode(), depth, sceneNormal, {
				camera, stochastic: true, outputCoverage: true, binaryRefine: params.binaryRefine, roughnessNode: surfaceRoughness
			} ).toInspector( 'SSR' );
			ssrDenoise = temporalDenoise( ssrPass.getTextureNode(), {
				camera, depth, normal: sceneNormal, roughness: surfaceRoughness, velocity: motion, coverage: true,
				hitDistance: sample( coordinate => resolveSSRHitDistance( ssrPass.getHitNode().sample( coordinate ).r, ssrPass.getTextureNode().sample( coordinate ).a ) )
			} );
			const filtered = ssrDenoise.getTextureNode();
			const denoiseEnabled = uniform( 1 );
			const signal = sample( coordinate => mix( ssrPass.getTextureNode().sample( coordinate ), filtered.sample( coordinate ), denoiseEnabled ) );
			// Coverage resolves the traced base specular lobe; other lobes use the environment.
			const screenReflection = query => query.lobe === 'specular' ? signal.sample( screenUV ) : vec4( 0 );
			const spatialAA = smaa( beautyPass );
			// Reuse the temporal pass when switching outputs to preserve history.
			const temporalAA = traa( beautyPass, depth, motion, camera );
			temporalAA.maxFrames.value = params.traaFrames;

			function updateTraceSource() {

				const previous = params.traceSource === 'Previous frame';
				ssrPass.setColorNode( previous ? previousSource : scenePass.getTextureNode() );
				beautyPass.contextNode = context( { indirectSpecularNode: indirectSpecular( [ screenReflection, fallback ] ) } );
				updateOutput();

			}

			function updateOutput() {

				const outputNode = params.traa ? temporalAA : spatialAA;
				const coverage = params.output.includes( 'Coverage' );
				const value = params.output.endsWith( 'Denoised' ) ? filtered : ssrPass.getTextureNode();
				const view = params.output === 'Beauty' ? outputNode : vec4( coverage ? value.aaa : value.rgb, 1 );
				renderPipeline.outputColorTransform = ! coverage;
				renderPipeline.outputNode = Fn( ( _, builder ) => {

					radianceHistory.build( builder );
					beautyPass.build( builder );
					return view;

				} )();
				renderPipeline.needsUpdate = true;

			}

			updateTraceSource();

			//

			controls = new OrbitControls( camera, renderer.domElement );
			controls.enableDamping = true;
			controls.update();

			window.addEventListener( 'resize', onWindowResize );

			// GUI

			const displayGui = renderer.inspector.createParameters( 'Display' );
			displayGui.add( params, 'output', [ 'Beauty', 'SSR Raw', 'SSR Denoised', 'SSR Coverage Raw', 'SSR Coverage Denoised' ] ).name( 'Output' ).onChange( updateOutput );
			displayGui.add( params, 'traa' ).name( 'TRAA' ).onChange( updateOutput );
			displayGui.add( params, 'traaFrames', 1, 64, 1 ).name( 'TRAA history frames' ).onChange( value => temporalAA.maxFrames.value = value );

			const ssrGui = renderer.inspector.createParameters( 'SSR' );
			ssrGui.add( params, 'traceSource', [ 'Current frame', 'Previous frame' ] ).name( 'Trace source' ).onChange( updateTraceSource );
			ssrGui.add( params, 'steps', 1, 64, 1 ).name( 'Steps' ).info( 'Maximum ray-march steps for one GGX ray per SSR pixel per frame. Rays can stop early; binary refinement adds up to 8 refinement steps.' ).onChange( updateParameters );
			ssrGui.add( params, 'binaryRefine' ).name( 'Binary refine' ).onChange( updateParameters );
			ssrGui.add( params, 'maxDistance', 0.01, 50, 0.01 ).name( 'Max distance' ).onChange( updateParameters );
			ssrGui.add( params, 'thickness', 0, 0.5, 0.001 ).name( 'Thickness' ).onChange( updateParameters );

			const denoiseGui = renderer.inspector.createParameters( 'Denoising' );
			denoiseGui.add( params, 'denoise' ).name( 'Enabled' ).onChange( value => denoiseEnabled.value = Number( value ) );
			denoiseGui.add( params, 'maxFrames', 1, 32, 1 ).name( 'SSR history frames' ).onChange( updateParameters );
			denoiseGui.add( params, 'luminancePhi', 0, 10 ).name( 'Luminance phi' ).onChange( updateParameters );

			const sceneGui = renderer.inspector.createParameters( 'Scene' );
			sceneGui.add( params, 'roughness', 0, 1 ).name( 'Roughness' ).onChange( value => {

				model.traverse( object => {

					if ( object.material ) object.material.roughness = value;

				} );

			} );

			updateParameters();

		}

		function updateParameters() {

			ssrPass.quality.value = params.steps / 64;
			ssrDenoise.maxFrames.value = params.maxFrames;
			ssrDenoise.luminancePhi.value = params.luminancePhi;
			ssrPass.maxDistance.value = params.maxDistance;
			ssrPass.thickness.value = params.thickness;
			// build-time constant: assigning it recompiles the SSR material (setter no-ops if unchanged)
			ssrPass.binaryRefine = params.binaryRefine;

		}

		function onWindowResize() {

			radianceHistory.reset();
			ssrDenoise.reset();

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize( window.innerWidth, window.innerHeight );

		}

		function animate() {

			controls.update();

			renderPipeline.render();

		}

	</script>
</body>

</html>
