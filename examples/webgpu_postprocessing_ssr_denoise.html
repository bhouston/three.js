<!DOCTYPE html>
<html lang="en">

	<head>
		<title>three.js webgpu - postprocessing - Screen Space Reflections (SSR) + denoise</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - postprocessing - Screen Space Reflections (SSR) + denoise">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_postprocessing_ssr_denoise.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_postprocessing_ssr_denoise.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
		<style>
			#compare-hint {
				position: fixed;
				bottom: 20px;
				left: 50%;
				transform: translateX(-50%);
				z-index: 1001;
				color: #e0e0e0;
				font: 400 13px 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
				text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.7);
				pointer-events: none;
				opacity: 0.85;
				white-space: nowrap;
			}
		</style>
	</head>

<body>

	<div id="compare-hint" hidden>Hold Shift and move the mouse to scrub the comparison</div>

	<div id="info">
		<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

		<div class="title-wrapper">
			<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>SSR + Denoising</span>
		</div>

		<small>
			Screen Space Reflections with Spatiotemporal Denoising by <a href="https://x.com/0beqz" target="_blank" rel="noopener">0beqz</a>.<br />
			Dungeon - Low Poly Game Level Challenge by
			Warkarma.<br />
		</small>
	</div>

	<script type="importmap">
		{
			"imports": {
				"three": "../build/three.webgpu.js",
				"three/webgpu": "../build/three.webgpu.js",
				"three/tsl": "../build/three.tsl.js",
				"three/addons/": "./jsm/"
			}
		}
	</script>

	<script type="module">

		import * as THREE from 'three/webgpu';
		import { pass, mrt, output, normalView, roughness as materialRoughness, screenUV, sample, packNormalToRGB, unpackRGBToNormal, velocity, vec4, uniform, mix, step, abs, float, renderOutput, saturation, Fn, context, indirectSpecular, environmentSpecular, pmremTexture } from 'three/tsl';
		import { reprojectedRadiance } from 'three/addons/tsl/display/ReprojectedRadianceNode.js';
		import { resolveSSRHitDistance } from 'three/addons/tsl/utils/SpecularHelpers.js';
		import { ssr } from 'three/addons/tsl/display/SSRNode.js';
		import { temporalDenoise } from 'three/addons/tsl/display/DenoiseNode.js';
		import { sharpen } from 'three/addons/tsl/display/SharpenNode.js';
		import { traa } from 'three/addons/tsl/display/TRAANode.js';

		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { Inspector } from 'three/addons/inspector/Inspector.js';
		import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';

		const OUTPUT_COMPARE_DENOISE = 8;
		const OUTPUT_COMPARE_SSR = 9;

		const GRADED_OUTPUTS = new Set( [ 0, 1, 3, 4, OUTPUT_COMPARE_DENOISE, OUTPUT_COMPARE_SSR ] );

		const compareHint = document.getElementById( 'compare-hint' );

		function isCompareMode( output ) {

			return output === OUTPUT_COMPARE_DENOISE || output === OUTPUT_COMPARE_SSR;

		}

		function updateCompareHint( output ) {

			compareHint.hidden = ! isCompareMode( output );

		}

		const compareSplit = uniform( 0.5 );
		const compareResolution = uniform( new THREE.Vector2( window.innerWidth, window.innerHeight ) );

		function buildCompareNode( noisy, denoised ) {

			const compareColor = mix( noisy, denoised, step( compareSplit, screenUV.x ) );
			const lineWidth = float( 1 ).div( compareResolution.x );
			const onLine = float( 1 ).sub( step( lineWidth, abs( screenUV.x.sub( compareSplit ) ) ) );

			return mix( compareColor, vec4( 1 ), onLine );

		}

		const params = {
			output: 0,
			roughness: 0.3,

			ssr: {
				traceSource: 'Current frame',
				resolutionScale: 1,
				quality: 0.25,
				mirrorBias: 0,
				maxDistance: 0.4,
				intensity: 1,
				thickness: 0.1,
				maxLuminance: 35,
				binaryRefine: true,
				stepExponent: 3,
				screenEdgeFade: 0.2,
				screenEdgeFadeBlack: false, // for indoor scenes, set to true
				environmentIntensity: 1,
			},

			denoise: {
				enabled: true,
				luminancePhi: 3,
				maxFrames: 20
			},

			post: {
				traa: true,
				traaFrames: 20,
				grading: { toneMapping: 'AgX', exposure: 1.57, gamma: 0.89, contrast: 1.31, saturation: 1 },
			},
		};

		let camera, scene, model, renderer, postProcessing, ssrNode, denoiseNode, denoised;
		let controls, radianceHistory, setTraceSource;
		const environmentIntensity = uniform( params.ssr.environmentIntensity );
		let scenePassNode, combinedOutputNode, scenePassDepth, scenePassVelocity;
		let gammaUniform, contrastUniform, saturationUniform;
		const denoiseEnabled = uniform( 1 );
		const temporalPasses = [];
		// Cache temporal passes by input so output changes preserve history.
		const temporalOutputs = new Map();

		init();

		async function init() {

			camera = new THREE.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 0.1, 8 );

			camera.position.set( 0.9210513838983053, 0.16195074025403253, 0.431687274895316 );

			scene = new THREE.Scene();

			const loader = new GLTFLoader();
			loader.load( 'models/gltf/dungeon_warkarma.glb', function ( gltf ) {

				gltf.scene.scale.multiplyScalar( 0.1 );

				gltf.scene.traverse( function ( object ) {

					if ( ! object.material ) return;

					object.castShadow = true;
					object.receiveShadow = true;
					object.material.roughness = 0.3;
					object.material.normalMap = null;

				} );

				model = gltf.scene;
				scene.add( model );

			} );

			renderer = new THREE.WebGPURenderer();
			renderer.inspector = new Inspector();
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.toneMapping = THREE.AgXToneMapping;
			renderer.toneMappingExposure = params.post.grading.exposure;
			renderer.shadowMap.enabled = true;
			document.body.appendChild( renderer.domElement );

			const hdrLoader = new HDRLoader().setPath( 'textures/equirectangular/' );
			const hdrTexture = await hdrLoader.loadAsync( 'quarry_01_1k.hdr' );
			hdrTexture.mapping = THREE.EquirectangularReflectionMapping;
			scene.background = hdrTexture;
			scene.environment = hdrTexture;
			hdrTexture.generateMipmaps = true;
			hdrTexture.needsUpdate = true;

			const directionalLight = new THREE.DirectionalLight( '#ffffff', 20 );
			directionalLight.position.set( - 10.9, 2.2, 10.75 );
			directionalLight.castShadow = true;
			directionalLight.shadow.autoUpdate = false;
			directionalLight.shadow.needsUpdate = true;
			directionalLight.shadow.mapSize.width = 4096;
			directionalLight.shadow.mapSize.height = 4096;
			directionalLight.shadow.camera.left = - 1.75;
			directionalLight.shadow.camera.right = 1.75;
			directionalLight.shadow.camera.top = 1.75;
			directionalLight.shadow.camera.bottom = - 1.75;
			directionalLight.shadow.camera.near = 0.1;
			directionalLight.shadow.camera.far = 50;
			directionalLight.shadow.bias = - 0.0005;
			scene.add( directionalLight );

			await renderer.init();

			scene.environmentIntensity = 1;

			postProcessing = new THREE.RenderPipeline( renderer );

			const geometryPass = pass( scene, camera );
			geometryPass.name = 'SSR G-buffer';
			geometryPass.contextNode = context( { indirectSpecularNode: indirectSpecular( [] ) } );
			geometryPass.setMRT( mrt( {
				output: vec4( packNormalToRGB( normalView ), materialRoughness ),
				velocity
			} ) );
			geometryPass.getTexture().type = THREE.UnsignedByteType;
			const scenePassNormal = geometryPass.getTextureNode();
			scenePassDepth = geometryPass.getTextureNode( 'depth' );
			scenePassVelocity = geometryPass.getTextureNode( 'velocity' );
			const sceneNormal = sample( coordinate => unpackRGBToNormal( scenePassNormal.sample( coordinate ).rgb ).normalize() );
			const surfaceRoughness = sample( coordinate => scenePassNormal.sample( coordinate ).a );
			const fallback = environmentSpecular( pmremTexture( scene.environment ), environmentIntensity );
			const scenePass = pass( scene, camera );
			scenePass.name = 'SSR current lighting';
			scenePass.contextNode = context( { indirectSpecularNode: indirectSpecular( [ fallback ] ) } );
			scenePass.setMRT( mrt( { output: vec4( output.rgb, 1 ) } ) );
			scenePassNode = scenePass;
			const beautyPass = pass( scene, camera );
			beautyPass.name = 'SSR resolved beauty';
			radianceHistory = reprojectedRadiance( beautyPass, scenePassDepth, sceneNormal, camera );
			const previousSource = sample( coordinate => radianceHistory.sample( coordinate ) );
			ssrNode = ssr( scenePass.getTextureNode(), scenePassDepth, sceneNormal, {
				camera, stochastic: true, outputCoverage: true, roughnessNode: surfaceRoughness, binaryRefine: params.ssr.binaryRefine
			} ).toInspector( 'SSR' );
			const ssrTexture = ssrNode.getTextureNode();
			denoiseNode = temporalDenoise( ssrTexture, {
				depth: scenePassDepth, normal: sceneNormal, camera, velocity: scenePassVelocity, roughness: surfaceRoughness, coverage: true,
				hitDistance: sample( coordinate => resolveSSRHitDistance( ssrNode.getHitNode().sample( coordinate ).r, ssrTexture.sample( coordinate ).a ) )
			} );
			const signal = sample( coordinate => mix( ssrTexture.sample( coordinate ), denoiseNode.getTextureNode().sample( coordinate ), denoiseEnabled ) );
			denoised = signal.sample( screenUV ).rgb;
			// Coverage resolves the traced base specular lobe; other lobes use the environment.
			const screenReflection = query => query.lobe === 'specular' ? signal.sample( screenUV ) : vec4( 0 );
			beautyPass.contextNode = context( { indirectSpecularNode: indirectSpecular( [ screenReflection, fallback ] ) } );
			setTraceSource = () => {

				ssrNode.setColorNode( params.ssr.traceSource === 'Previous frame' ? previousSource : scenePass.getTextureNode() );

			};

			setTraceSource();

			gammaUniform = uniform( params.post.grading.gamma );
			contrastUniform = uniform( params.post.grading.contrast );
			saturationUniform = uniform( params.post.grading.saturation );

			combinedOutputNode = beautyPass.getTextureNode().toInspector( 'Combined SSR' );

			postProcessing.outputNode = applyPostProcessing( combinedOutputNode );
			postProcessing.outputColorTransform = false;

			controls = new OrbitControls( camera, renderer.domElement );
			controls.enableDamping = true;
			controls.update();

			// Initial camera transform
			camera.position.set( 1.259878548682251, 0.5391287340899181, - 0.27217301481427114 );
			camera.rotation.set( - 0.3158233106804791, 0.26820684188431526, 0.08637696823742165 );
			controls.target.set( 1.0258536154689288, 0.2746440590977971, - 1.0815876858987743 );

			window.addEventListener( 'resize', onWindowResize );
			renderer.domElement.addEventListener( 'pointermove', onComparePointerMove );

			applyParams();
			applyPost();

			const outputTypes = {
				Beauty: 0,
				'SSR Raw': 1,
				'SSR Denoised': 4,
				'SSR Coverage Raw': 10,
				'SSR Coverage Denoised': 11,
				'Compare (Denoise)': OUTPUT_COMPARE_DENOISE,
				'Compare (Reflections)': OUTPUT_COMPARE_SSR,
				'Ray Length': 7
			};

			const displayGui = renderer.inspector.createParameters( 'Display' );
			displayGui.add( params, 'output', outputTypes ).name( 'Output' ).onChange( updateOutputNode );
			displayGui.add( params.post, 'traa' ).name( 'TRAA' ).onChange( updateOutputNode );
			displayGui.add( params.post, 'traaFrames', 1, 64, 1 ).name( 'TRAA history frames' ).onChange( () => {

				for ( const temporal of temporalPasses ) temporal.maxFrames.value = params.post.traaFrames;

			} );

			const ssrGui = renderer.inspector.createParameters( 'SSR' );
			ssrGui.add( params.ssr, 'traceSource', [ 'Current frame', 'Previous frame' ] ).name( 'Trace source' ).onChange( () => {

				setTraceSource();
				updateOutputNode();

			} );
			ssrGui.add( params.ssr, 'quality', 0.1, 1, 0.05 ).name( 'Quality' ).onChange( applyParams );
			ssrGui.add( params.ssr, 'binaryRefine' ).name( 'Binary refine' ).onChange( applyParams );
			ssrGui.add( params.ssr, 'maxDistance', 0.01, 50, 0.01 ).name( 'Max distance' ).onChange( applyParams );
			ssrGui.add( params.ssr, 'intensity', 0, 4, 0.01 ).name( 'Intensity' ).onChange( applyParams );
			ssrGui.add( params.ssr, 'thickness', 0, 0.5, 0.001 ).name( 'Thickness' ).onChange( applyParams );

			const denoiseGui = renderer.inspector.createParameters( 'Denoising' );
			denoiseGui.add( params.denoise, 'enabled' ).name( 'Enabled' ).onChange( applyParams );
			denoiseGui.add( params.denoise, 'maxFrames', 1, 32, 1 ).name( 'SSR history frames' ).onChange( applyParams );
			denoiseGui.add( params.denoise, 'luminancePhi', 0, 10 ).name( 'Luminance phi' ).onChange( applyParams );

			const sceneGui = renderer.inspector.createParameters( 'Scene' );
			sceneGui.add( params, 'roughness', 0, 1 ).name( 'Roughness' ).onChange( value => {

				scene.traverse( object => {

					if ( object.material ) object.material.roughness = value;

				} );

			} );
			sceneGui.add( params.ssr, 'environmentIntensity', 0, 10 ).name( 'Environment intensity' ).onChange( applyParams );

			const advancedGui = renderer.inspector.createParameters( 'SSR advanced' ).close();
			advancedGui.add( params.ssr, 'mirrorBias', 0, 1 ).name( 'Mirror bias' ).onChange( applyParams );
			advancedGui.add( params.ssr, 'stepExponent', 1, 4, 0.5 ).name( 'Step exponent' ).onChange( applyParams );

			// Concise UI for Directional Light controls
			const lightGui = renderer.inspector.createParameters( 'Light' ).close();
			[ 'x', 'y', 'z' ].forEach( axis => {

				lightGui.add( directionalLight.position, axis, - 30, 30 ).name( axis.toUpperCase() )
					.onChange( () => directionalLight.shadow.needsUpdate = true );

			} );
			lightGui.add( directionalLight, 'intensity', 0, 50 ).name( 'Intensity' );

			updateOutputNode();
			renderer.setAnimationLoop( animate );

		}

		function applyParams() {

			if ( ! ssrNode ) return;

			ssrNode.resolutionScale = params.ssr.resolutionScale;
			ssrNode.quality.value = params.ssr.quality;
			ssrNode.mirrorBias.value = params.ssr.mirrorBias;
			// stepExponent / screenEdgeFadeBlack / binaryRefine are build-time constants: assigning
			// them recompiles the SSR material (the setters no-op when the value is unchanged).
			ssrNode.stepExponent = params.ssr.stepExponent;
			ssrNode.binaryRefine = params.ssr.binaryRefine;
			ssrNode.maxDistance.value = params.ssr.maxDistance;
			ssrNode.intensity.value = params.ssr.intensity;
			ssrNode.thickness.value = params.ssr.thickness;
			ssrNode.maxLuminance.value = params.ssr.maxLuminance;
			ssrNode.screenEdgeFade.value = params.ssr.screenEdgeFade;
			ssrNode.screenEdgeFadeBlack = params.ssr.screenEdgeFadeBlack;
			environmentIntensity.value = params.ssr.environmentIntensity;

			if ( denoiseNode ) {

				denoiseEnabled.value = params.denoise.enabled ? 1 : 0;
				denoiseNode.luminancePhi.value = params.denoise.luminancePhi;
				denoiseNode.maxFrames.value = params.denoise.maxFrames;

			}

		}

		function applyGrading( source ) {

			let rgb = source.rgb;

			rgb = renderOutput( vec4( rgb, 1 ), THREE.AgXToneMapping, THREE.SRGBColorSpace ).rgb;
			rgb = rgb.sub( 0.5 ).mul( contrastUniform ).add( 0.5 );
			rgb = saturation( rgb, saturationUniform );
			rgb = rgb.max( 0.0 ).pow( float( 1 ).div( gammaUniform ) );

			return vec4( rgb, 1 );

		}

		function applyPostProcessing( source, key = source ) {

			const graded = applyGrading( source );
			if ( ! params.post.traa ) return graded;
			let temporal = temporalOutputs.get( key );
			if ( temporal === undefined ) {

				temporal = traa( graded, scenePassDepth, scenePassVelocity, camera );
				temporalOutputs.set( key, temporal );
				temporalPasses.push( temporal );

			}

			temporal.maxFrames.value = params.post.traaFrames;
			return sharpen( temporal, 0 );

		}

		function applyPost() {

			const g = params.post.grading;
			gammaUniform.value = g.gamma;
			contrastUniform.value = g.contrast;
			saturationUniform.value = g.saturation;

			renderer.toneMapping = THREE.AgXToneMapping;
			renderer.toneMappingExposure = g.exposure;

		}

		function updateOutputNode() {

			if ( ! postProcessing ) return;

			let node;

			switch ( params.output ) {

				case 0: node = applyPostProcessing( combinedOutputNode ); break; // Combined
				case 1: node = applyGrading( vec4( ssrNode.rgb, 1 ) ); break; // SSR (Raw)
				case 4: node = applyGrading( vec4( denoiseNode.getTextureNode().rgb, 1 ) ); break; // Denoised SSR
				case 10: node = vec4( ssrNode.getTextureNode().aaa, 1 ); break; // Raw coverage
				case 11: node = vec4( denoiseNode.getTextureNode().aaa, 1 ); break; // Denoised coverage
				case 7: node = vec4( ssrNode.getHitNode().rrr, 1 ); break; // Ray Length (Raw)
				case OUTPUT_COMPARE_DENOISE: { // Compare (denoised | noisy)

					const noisySSR = applyPostProcessing( vec4( ssrNode.rgb, 1 ), 'raw' );
					const denoisedSSR = applyPostProcessing( vec4( denoised, 1 ), 'denoised' );
					node = buildCompareNode( denoisedSSR, noisySSR );
					break;

				}

				case OUTPUT_COMPARE_SSR: { // Compare (combined SSR vs. scene only)

					node = buildCompareNode( applyPostProcessing( combinedOutputNode ), applyPostProcessing( scenePassNode ) );
					break;

				}

			}

			if ( ! isCompareMode( params.output ) ) controls.enabled = true;

			updateCompareHint( params.output );

			postProcessing.outputColorTransform = ! GRADED_OUTPUTS.has( params.output ) && params.output !== 10 && params.output !== 11;
			postProcessing.outputNode = Fn( ( _, builder ) => {

				radianceHistory.build( builder );
				combinedOutputNode.build( builder );
				return node;

			} )();
			postProcessing.needsUpdate = true;

		}

		function onWindowResize() {

			radianceHistory.reset();
			denoiseNode.reset();

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize( window.innerWidth, window.innerHeight );
			compareResolution.value.set( window.innerWidth, window.innerHeight );

		}

		function onComparePointerMove( event ) {

			if ( ! isCompareMode( params.output ) ) return;

			if ( event.shiftKey ) {

				controls.enabled = false;

				const rect = renderer.domElement.getBoundingClientRect();
				compareSplit.value = Math.max( 0, Math.min( 1, ( event.clientX - rect.left ) / rect.width ) );

			} else {

				controls.enabled = true;

			}

		}

		function animate() {

			controls.update();

			postProcessing.render();

		}

	</script>
</body>

</html>
