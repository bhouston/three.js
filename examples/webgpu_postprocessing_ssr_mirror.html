<!DOCTYPE html>
<html lang="en">

<head>

	<head>
		<title>three.js webgpu - postprocessing - Mirror Screen Space Reflections (SSR)</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - postprocessing - Mirror Screen Space Reflections (SSR)">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_postprocessing_ssr_mirror.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_postprocessing_ssr_mirror.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>

<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Mirror SSR</span>
			</div>

			<small>
				One ray per pixel over the GGX lobe of the material, denoised over space and time.<br />
				The materials reflect the traced scene through their BRDF, in front of the environment.<br />
				<a href="https://skfb.ly/6tqYD" target="_blank" rel="noopener">Steampunk Camera</a> by
				<a href="https://sketchfab.com/lumoize" target="_blank" rel="noopener">dylanheyes</a> is licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">Creative Commons Attribution</a>.
			</small>
		</div>

	<script type="importmap">
		{
			"imports": {
				"three": "../build/three.webgpu.js",
				"three/webgpu": "../build/three.webgpu.js",
				"three/tsl": "../build/three.tsl.js",
				"three/addons/": "./jsm/"
			}
		}
	</script>

	<script type="module">

		import * as THREE from 'three/webgpu';
		import { pass, mrt, Fn, builtinIndirectContext, defaultIndirectSpecular, normalView, metalness, roughness, velocity, screenUV, color, sample, packNormalToRGB, packNormalToOctahedral, unpackOctahedralToNormal, vec2, vec4, uniform, mix, colorSpaceToWorking } from 'three/tsl';
		import { ssr } from 'three/addons/tsl/display/SSRNode.js';
		import { temporalReproject } from 'three/addons/tsl/display/TemporalReprojectNode.js';
		import { recurrentDenoise } from 'three/addons/tsl/display/RecurrentDenoiseNode.js';
		import { smaa } from 'three/addons/tsl/display/SMAANode.js';
		import { reprojectedBeauty, previousViewZ } from 'three/addons/tsl/display/ReprojectedBeautyNode.js';
		import { opaqueFragment, opaqueFragmentSource } from 'three/addons/tsl/utils/OpaqueFragment.js';

		import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
		import { Inspector } from 'three/addons/inspector/Inspector.js';
		import { coverageCascade } from 'three/addons/tsl/lighting/CoverageCascade.js';

		const params = {
			output: 'Beauty', enabled: true, quality: 0.5, intensity: 1,
			maxDistance: 3, thickness: 0.2, binaryRefine: false,
			roughness: 1, denoise: true, alphaThreshold: 1, aoMap: false,
			traceSource: 'Clean Beauty'
		};

		let camera, scene, model, renderer, renderPipeline;
		let controls;

		const aoMaps = new Map();

		init();

		async function init() {

			camera = new THREE.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 0.1, 50 );
			camera.position.set( 3, 2, 3 );

			scene = new THREE.Scene();
			scene.backgroundNode = screenUV.distance( .5 ).remap( 0, 0.5 ).mix( color( 0x888877 ), color( 0x776666 ) );

			const dracoLoader = new DRACOLoader();

			const loader = new GLTFLoader();
			loader.setDRACOLoader( dracoLoader );
			loader.load( 'models/gltf/steampunk_camera.glb', function ( gltf ) {

				model = gltf.scene;

				model.traverse( function ( object ) {

					if ( object.material ) {

						if ( object.material.name === 'Lense_Casing' ) {

							object.material.transparent = true;

						}

						// Avoid overdrawing
						object.material.side = THREE.FrontSide;

						if ( aoMaps.has( object.material ) === false ) aoMaps.set( object.material, object.material.aoMap );

					}

				} );

				updateAO();

				model.position.y = 0.1;
				scene.add( model );

			} );

			// Add a reflective plane under the camera

			const floorGeometry = new THREE.CircleGeometry( 2, 64 );
			const floorMaterial = new THREE.MeshStandardMaterial( {
				color: 0xffffff,
				metalness: 1,
				roughness: 0.5
			} );
			const floor = new THREE.Mesh( floorGeometry, floorMaterial );
			floor.rotation.x = - Math.PI / 2;
			floor.position.y = - 0.8;
			scene.add( floor );

			//

			renderer = new THREE.WebGPURenderer();
			// renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.setAnimationLoop( animate );
			renderer.toneMapping = THREE.ACESFilmicToneMapping;
			renderer.inspector = new Inspector();
			document.body.appendChild( renderer.domElement );

			await renderer.init();

			const environment = new RoomEnvironment();
			const pmremGenerator = new THREE.PMREMGenerator( renderer );

			scene.environment = pmremGenerator.fromScene( environment, 0.04 ).texture;
			scene.environmentIntensity = 1.25;
			pmremGenerator.dispose();

			//

			renderPipeline = new THREE.RenderPipeline( renderer );

			// the pre-pass renders the opaque fragments SSR traces, without shading them

			const alphaThreshold = uniform( params.alphaThreshold );

			const scenePass = pass( scene, camera );
			scenePass.setMRT( mrt( {
				output: opaqueFragment( packNormalToOctahedral( normalView ), alphaThreshold ),
				metalrough: vec2( metalness, roughness ), // pack metalness and roughness into a single attachment
				velocity: vec4( velocity, 0, previousViewZ )
			} ) );

			// the attachments hold data, so the blending of transparent materials does not apply

			scenePass.getMRT().setBlendMode( 'output', new THREE.BlendMode( THREE.NoBlending ) );

			const scenePassNormal = scenePass.getTextureNode( 'output' ).toInspector( 'Normal', ( node ) => {

				return colorSpaceToWorking( packNormalToRGB( unpackOctahedralToNormal( node.rg ) ), THREE.SRGBColorSpace );

			} );
			const scenePassDepth = scenePass.getTextureNode( 'depth' ).toInspector( 'Depth', () => {

				return scenePass.getLinearDepthNode();

			} );
			const scenePassMetalRough = scenePass.getTextureNode( 'metalrough' ).toInspector( 'Metalness-Roughness' );

			// the attachments clone the output texture, so the velocity is created before the output becomes RG

			const scenePassVelocity = scenePass.getTextureNode( 'velocity' );

			// octahedral normals can't be filtered across their folds

			const normalTexture = scenePass.getTexture( 'output' );
			normalTexture.format = THREE.RGFormat;
			normalTexture.minFilter = normalTexture.magFilter = THREE.NearestFilter;

			// optional: optimize bandwidth by reducing the texture precision for metal/roughness

			const metalRoughTexture = scenePass.getTexture( 'metalrough' );
			metalRoughTexture.type = THREE.UnsignedByteType;

			const normalDecode = ( value ) => unpackOctahedralToNormal( value.rg );
			const sceneNormal = sample( ( uv ) => normalDecode( scenePassNormal.sample( uv ) ) );

			//

			// SSR traces this frame rendered without reflections, or the previous frame's beauty

			const beautyPass = pass( scene, camera );

			const traceSources = {
				'Clean Beauty': pass( scene, camera ),
				'Previous Frame': reprojectedBeauty( scenePass, beautyPass )
			};

			const reflection = ssr( traceSources[ params.traceSource ], scenePassDepth, sceneNormal, {
				camera,
				stochastic: true,
				metalnessNode: scenePassMetalRough.r,
				roughnessNode: scenePassMetalRough.g,
				binaryRefine: params.binaryRefine
			} ).toInspector( 'SSR' );

			// one ray per pixel is noisy, so it is reprojected and denoised

			const hitDistance = reflection.getHitDistanceNode();

			const temporal = temporalReproject( reflection, scenePassDepth, scenePassNormal, scenePassVelocity, camera, {
				mode: 'specular',
				hitDistance,
				accumulate: false,
				normalDecode
			} );
			temporal.maxFrames.value = 16;
			temporal.clampIntensity.value = 0.25;
			temporal.flickerSuppression.value = 0; // it clamps the bright floor the model reflects

			const denoised = recurrentDenoise( temporal, camera, {
				depth: scenePassDepth,
				normal: sceneNormal,
				raw: reflection,
				metalRoughness: scenePassMetalRough,
				hitDistance,
				frameCount: temporal.getFrameCountNode(),
				mode: 'specular',
				accumulate: true
			} ).toInspector( 'Denoise' );
			denoised.lumaPhi.value = 0.75;
			denoised.depthPhi.value = 20;
			denoised.normalPhi.value = 0.3;
			denoised.alphaPhi.value = 5;
			denoised.radius.value = 1.5;
			denoised.strength.value = 0.725;
			denoised.adaptiveTrust.value = 1;
			denoised.flickerSuppression.value = 0;

			temporal.setHistoryTexture( denoised );

			const raw = reflection.getTextureNode();
			const filtered = denoised.getTextureNode();

			const denoiseEnabled = uniform( 1 );

			// the materials reflect SSR through their BRDF, and the environment where SSR has no coverage

			beautyPass.contextNode = builtinIndirectContext( {
				specular: coverageCascade( [ opaqueFragmentSource( mix( raw.sample( screenUV ), filtered.sample( screenUV ), denoiseEnabled ), alphaThreshold ) ], defaultIndirectSpecular )
			} );

			const spatialAA = smaa( beautyPass );

			// every view renders the beauty, since the next frame reflects it

			const keepBeauty = Fn( () => {

				beautyPass.toVar();

			} )();

			function updateOutput() {

				let view;
		
				switch ( params.output ) {

					case 'Beauty': view = spatialAA; break;
					case 'SSR': view = vec4( raw.rgb, 1 ); break;
					case 'SSR DN': view = vec4( filtered.rgb, 1 ); break;
					case 'Coverage': view = vec4( filtered.aaa, 1 ); break;

				}

				renderPipeline.outputNode = view.bypass( keepBeauty );
				renderPipeline.outputColorTransform = true;
				renderPipeline.needsUpdate = true;

			}

			controls = new OrbitControls( camera, renderer.domElement );
			controls.enableDamping = true;
			controls.update();

			window.addEventListener( 'resize', onWindowResize );

			// GUI

			const displayGui = renderer.inspector.createParameters( 'Display' );
			displayGui.add( params, 'output', [ 'Beauty', 'SSR', 'SSR DN', 'Coverage' ] ).name( 'Output' ).onChange( updateOutput );

			const ssrGui = renderer.inspector.createParameters( 'SSR' );
			ssrGui.add( params, 'enabled' ).name( 'Enabled' ).onChange( updateParameters );
			ssrGui.add( params, 'traceSource', Object.keys( traceSources ) ).name( 'Trace Source' ).onChange( updateTraceSource );
			ssrGui.add( params, 'intensity', 0, 1 ).name( 'Intensity' ).onChange( updateParameters );
			ssrGui.add( params, 'quality', 0, 1, 0.01 ).name( 'Quality' ).onChange( updateParameters );
			ssrGui.add( params, 'binaryRefine' ).name( 'Binary refine' ).onChange( updateParameters );
			ssrGui.add( params, 'maxDistance', 0, 5 ).name( 'Max distance' ).onChange( updateParameters );
			ssrGui.add( params, 'thickness', 0, 0.5 ).name( 'Thickness' ).onChange( updateParameters );

			const denoiseGui = renderer.inspector.createParameters( 'Denoise' );
			denoiseGui.add( params, 'denoise' ).name( 'Enabled' ).onChange( value => denoiseEnabled.value = Number( value ) );

			const sceneGui = renderer.inspector.createParameters( 'Scene' );
			sceneGui.add( params, 'alphaThreshold', 0, 1, 0.01 ).name( 'Alpha threshold' ).info( 'Fragments of transparent materials below this alpha are not traced and reflect the environment.' ).onChange( value => alphaThreshold.value = value );
			sceneGui.add( params, 'aoMap' ).name( 'AO map' ).onChange( updateAO );
			sceneGui.add( params, 'roughness', 0, 1 ).name( 'Roughness' ).onChange( value => {

				model?.traverse( object => {

					if ( object.material ) object.material.roughness = value;

				} );

			} );

			updateParameters();
			updateOutput();

			function updateTraceSource() {

				reflection.colorNode = traceSources[ params.traceSource ];
				reflection._buildSSRMaterial(); // the source is baked into the SSR material

			}

			function updateParameters() {

				reflection.quality.value = params.quality;
				reflection.intensity.value = params.enabled ? params.intensity : 0;
				reflection.binaryRefine = params.binaryRefine;
				reflection.maxDistance.value = params.maxDistance;
				reflection.thickness.value = params.thickness;

			}

		}

		function updateAO() {

			for ( const [ material, aoMap ] of aoMaps ) {

				material.aoMap = params.aoMap ? aoMap : null;
				material.needsUpdate = true;

			}

		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize( window.innerWidth, window.innerHeight );

		}

		function animate() {

			controls.update();

			renderPipeline.render();

		}

	</script>
</body>

</html>
