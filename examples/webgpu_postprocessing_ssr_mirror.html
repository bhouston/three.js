<!DOCTYPE html>
<html lang="en">

<head>

	<head>
		<title>three.js webgpu - postprocessing - Mirror Screen Space Reflections (SSR)</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - postprocessing - Mirror Screen Space Reflections (SSR)">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_postprocessing_ssr_mirror.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_postprocessing_ssr_mirror.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>

<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Mirror SSR</span>
			</div>

			<small>
				Stochastic screen space reflections on a metallic floor, denoised over time.<br />
				<a href="https://skfb.ly/6tqYD" target="_blank" rel="noopener">Steampunk Camera</a> by
				<a href="https://sketchfab.com/lumoize" target="_blank" rel="noopener">dylanheyes</a> is licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">Creative Commons Attribution</a>.
			</small>
		</div>

	<script type="importmap">
		{
			"imports": {
				"three": "../build/three.webgpu.js",
				"three/webgpu": "../build/three.webgpu.js",
				"three/tsl": "../build/three.tsl.js",
				"three/addons/": "./jsm/"
			}
		}
	</script>

	<script type="module">

		import * as THREE from 'three/webgpu';
		import { pass, mrt, output, normalView, materialMetalness, materialRoughness, diffuseColor, screenUV, color, sample, packNormalToRGB, packNormalToOctahedral, unpackOctahedralToNormal, vec2, vec4, uniform, mix, velocity, colorSpaceToWorking, rtt, Fn } from 'three/tsl';
		import { ssr } from 'three/addons/tsl/display/SSRNode.js';
		import { depthAwareDownsample } from 'three/addons/tsl/display/DepthAwareDownsampleNode.js';
		import { jointBilateralUpsample } from 'three/addons/tsl/display/JointBilateralUpsample.js';
		import { temporalReproject } from 'three/addons/tsl/display/TemporalReprojectNode.js';
		import { recurrentDenoise } from 'three/addons/tsl/display/RecurrentDenoiseNode.js';
		import { traa } from 'three/addons/tsl/display/TRAANode.js';
		import { smaa } from 'three/addons/tsl/display/SMAANode.js';

		import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
		import { Inspector } from 'three/addons/inspector/Inspector.js';

		const params = {
			output: 'Beauty', traa: true,
			adaptive: true, adaptiveSteps: 64, occlusionSkipping: true, coneEnabled: true, coneMaxLevel: 5, coneSamples: 4, coneTracing: true, coneValidate: true, cameraRays: false, quality: 0.5, binaryRefine: false, maxDistance: 3, thickness: 0.1,
			denoise: true, lumaPhi: 0.75,
			roughness: 0.18, cameraRoughness: 1
		};

		let camera, scene, model, renderer, renderPipeline, temporalAA;
		let controls;

		init();

		async function init() {

			camera = new THREE.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 0.1, 50 );
			camera.position.set( 3, 2, 3 );

			scene = new THREE.Scene();
			scene.backgroundNode = screenUV.distance( .5 ).remap( 0, 0.5 ).mix( color( 0x888877 ), color( 0x776666 ) );

			const dracoLoader = new DRACOLoader();

			const loader = new GLTFLoader();
			loader.setDRACOLoader( dracoLoader );
			loader.load( 'models/gltf/steampunk_camera.glb', function ( gltf ) {

				model = gltf.scene;

				model.traverse( function ( object ) {

					if ( object.material ) {

						if ( object.material.name === 'Lense_Casing' ) {

							object.material.transparent = true;

						}

						// Avoid overdrawing
						object.material.side = THREE.FrontSide;

					}

				} );

				model.position.y = 0.1;
				scene.add( model );

				// the model has no velocity when it appears, so restart the TRAA history

				temporalAA?.reset();

			} );

			// Add a reflective plane under the camera

			const floorGeometry = new THREE.CircleGeometry( 2, 64 );
			const floorMaterial = new THREE.MeshStandardMaterial( {
				color: 0xffffff,
				metalness: 1,
				roughness: params.roughness
			} );
			const floor = new THREE.Mesh( floorGeometry, floorMaterial );
			floor.rotation.x = - Math.PI / 2;
			floor.position.y = - 0.8;
			scene.add( floor );

			//

			renderer = new THREE.WebGPURenderer();
			// renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.setAnimationLoop( animate );
			renderer.toneMapping = THREE.ACESFilmicToneMapping;
			renderer.inspector = new Inspector();
			document.body.appendChild( renderer.domElement );

			await renderer.init();

			// Hi-Z tracing requires WebGPU, the WebGL 2 fallback uses the linear tracer

			params.adaptive = renderer.backend.isWebGPUBackend === true;

			const environment = new RoomEnvironment();
			const pmremGenerator = new THREE.PMREMGenerator( renderer );

			scene.environment = pmremGenerator.fromScene( environment, 0.04 ).texture;
			scene.environmentIntensity = 1.25;
			pmremGenerator.dispose();

			//

			renderPipeline = new THREE.RenderPipeline( renderer );

			const scenePass = pass( scene, camera );
			scenePass.setMRT( mrt( {
				output: output,
				diffuseColor: vec4( diffuseColor.rgb, materialMetalness ),
				normal: packNormalToOctahedral( normalView ),
				velocity: vec4( velocity, materialRoughness, 0 )
			} ) );

			// octahedral normals can't be filtered across their folds

			const normalTexture = scenePass.getTexture( 'normal' );
			normalTexture.format = THREE.RGFormat;
			normalTexture.minFilter = normalTexture.magFilter = THREE.NearestFilter;

			scenePass.getTexture( 'diffuseColor' ).type = THREE.UnsignedByteType;

			// mip chain of the beauty pass for the SSR cone footprint lookup
			const beautyTexture = scenePass.getTexture( 'output' );
			beautyTexture.generateMipmaps = true;
			beautyTexture.minFilter = THREE.LinearMipmapLinearFilter;

			const scenePassColor = scenePass.getTextureNode( 'output' ).toInspector( 'Color' );
			const scenePassNormal = scenePass.getTextureNode( 'normal' ).toInspector( 'Normal', ( node ) => {

				return colorSpaceToWorking( packNormalToRGB( unpackOctahedralToNormal( node.rg ) ), THREE.SRGBColorSpace );

			} );
			const scenePassDepth = scenePass.getTextureNode( 'depth' ).toInspector( 'Depth', () => {

				return scenePass.getLinearDepthNode();

			} );
			const scenePassVelocity = scenePass.getTextureNode( 'velocity' ).toInspector( 'Velocity' );
			const scenePassDiffuseColor = scenePass.getTextureNode( 'diffuseColor' ).toInspector( 'Diffuse Color' );

			const normalDecode = ( value ) => unpackOctahedralToNormal( value.rg );
			const sceneNormal = sample( ( uv ) => normalDecode( scenePassNormal.sample( uv ) ) );
			const sceneRoughness = sample( ( uv ) => scenePassVelocity.sample( uv ).z );

			// metalness in diffuseColor.a, roughness in velocity.z

			const sceneMetalRough = sample( ( uv ) => vec2(
				scenePassDiffuseColor.sample( uv ).a,
				scenePassVelocity.sample( uv ).z
			) );

			// ssr

			const ssrNode = ssr( scenePassColor, scenePassDepth, sceneNormal, {
				stochastic: true,
				diffuseNode: scenePassDiffuseColor,
				metalnessNode: scenePassDiffuseColor.a,
				roughnessNode: sceneRoughness,
				binaryRefine: params.binaryRefine
			} ).toInspector( 'SSR' );

			// downsample: at a ratio above 1, the reflections are computed and denoised from downsampled inputs and upsampled afterwards

			const downsampleParams = { level: 1, upsampler: 'Joint bilateral' };

			const downsample = depthAwareDownsample( scenePassDepth, { normal: scenePassNormal, diffuseColor: scenePassDiffuseColor, velocity: scenePassVelocity } );
			const downsampleDepth = downsample.getTextureNode( 'depth' );
			const downsampleDiffuseColor = downsample.getTextureNode( 'diffuseColor' );
			const downsampleVelocity = downsample.getTextureNode( 'velocity' );
			const downsampleNormal = sample( ( uv ) => normalDecode( downsample.getTextureNode( 'normal' ).sample( uv ) ) );
			const downsampleRoughness = sample( ( uv ) => downsampleVelocity.sample( uv ).z );
			const downsampleMetalRough = sample( ( uv ) => vec2( downsampleDiffuseColor.sample( uv ).a, downsampleVelocity.sample( uv ).z ) );

			// without depth rejection, the joint bilateral filter is a bilinear filter

			const depthTolerance = uniform( 0.005 );

			const upsample = ( node ) => {

				const upsampled = rtt( jointBilateralUpsample( node, downsampleDepth, scenePassDepth, camera, { depthTolerance } ).sample( screenUV ) ).sample( screenUV );

				return Fn( () => ( downsampleParams.level > 0 ) ? upsampled : node )();

			};

			function updateDownsample() {

				const reduced = downsampleParams.level > 0;

				if ( reduced ) downsample.level = downsampleParams.level;

				ssrNode.depthNode = reduced ? downsampleDepth : scenePassDepth;
				ssrNode.normalNode = reduced ? downsampleNormal : sceneNormal;
				ssrNode.diffuseNode = reduced ? downsampleDiffuseColor : scenePassDiffuseColor;
				ssrNode.metalnessNode = reduced ? downsampleDiffuseColor.a : scenePassDiffuseColor.a;
				ssrNode.roughnessNode = reduced ? downsampleRoughness : sceneRoughness;

				temporalReprojectNode.depthNode = ssrNode.depthNode;
				temporalReprojectNode.normalNode = reduced ? downsample.getTextureNode( 'normal' ) : scenePassNormal;
				temporalReprojectNode.velocityNode = reduced ? downsampleVelocity : scenePassVelocity;

				denoiseNode.depthNode = ssrNode.depthNode;
				denoiseNode.normalNode = ssrNode.normalNode;
				denoiseNode.roughnessMetalnessNode = reduced ? downsampleMetalRough : sceneMetalRough;

				renderPipeline.needsUpdate = true;

				reduced ? upsamplerControl.show() : upsamplerControl.hide();

			}

			const ssrTexture = ssrNode.getTextureNode();

			// denoise

			const temporalReprojectNode = temporalReproject( ssrTexture, scenePassDepth, scenePassNormal, scenePassVelocity, camera, {
				mode: 'specular',
				accumulate: false,
				normalDecode: normalDecode
			} );
			temporalReprojectNode.maxFrames.value = 16;
			temporalReprojectNode.clampIntensity.value = 0.25;

			const denoiseNode = recurrentDenoise( temporalReprojectNode, camera, {
				depth: scenePassDepth,
				normal: sceneNormal,
				raw: ssrTexture,
				metalRoughness: sceneMetalRough,
				mode: 'specular',
				accumulate: true
			} );
			denoiseNode.depthPhi.value = 20;
			denoiseNode.normalPhi.value = 0.3;
			denoiseNode.radius.value = 1.5;
			denoiseNode.alphaPhi.value = 5;
			denoiseNode.strength.value = 0.725;
			denoiseNode.adaptiveTrust.value = 1;

			// feed the denoised result + velocity back into SSR for multi-bounce reflections

			ssrNode.setHistory( denoiseNode, scenePassVelocity );
			temporalReprojectNode.setHistoryTexture( denoiseNode );

			// composite

			const denoiseEnabled = uniform( 1 );

			const ssrUpsampled = upsample( ssrTexture );
			const denoiseUpsampled = upsample( denoiseNode.getTextureNode() );

			const combined = scenePassColor.rgb.add( mix( ssrUpsampled.rgb, denoiseUpsampled.rgb, denoiseEnabled ) );

			temporalAA = traa( vec4( combined, 1 ), scenePassDepth, scenePassVelocity, camera );
			const spatialAA = smaa( vec4( combined, 1 ) );

			function updateOutput() {

				let outputNode;

				switch ( params.output ) {

					case 'Beauty': outputNode = params.traa ? temporalAA : spatialAA; break;
					case 'SSR': case 'SSR iterations': outputNode = vec4( ssrUpsampled.rgb, 1 ); break;
					case 'SSR DN': outputNode = vec4( denoiseUpsampled.rgb, 1 ); break;

				}

				ssrNode.showIterations = params.output === 'SSR iterations';
				renderPipeline.outputNode = outputNode;
				renderPipeline.outputColorTransform = true;
				renderPipeline.needsUpdate = true;

			}

			function updateParameters() {

				ssrNode.tracing = params.adaptive ? 'adaptive' : 'linear';
				ssrNode.adaptiveMaxSteps.value = params.adaptiveSteps;
				// Only the active tracer's group is shown.
				adaptiveGui[ params.adaptive ? 'show' : 'hide' ]();
				linearGui[ params.adaptive ? 'hide' : 'show' ]();
				for ( const controller of coneControllers ) controller.disable( ! params.coneEnabled );
				ssrNode.occlusionSkipping = params.occlusionSkipping;
				ssrNode.coneMaxLevel.value = params.coneEnabled ? params.coneMaxLevel : 0;
				ssrNode.coneSamples.value = params.coneSamples;
				ssrNode.coneTracing = params.coneTracing;
				ssrNode.coneValidate = params.coneValidate;
				ssrNode.cameraRays = params.cameraRays;
				ssrNode.quality.value = params.quality;
				ssrNode.binaryRefine = params.binaryRefine;
				ssrNode.maxDistance.value = params.maxDistance;
				ssrNode.thickness.value = params.thickness;

				denoiseNode.lumaPhi.value = params.lumaPhi;

			}

			controls = new OrbitControls( camera, renderer.domElement );
			controls.enableDamping = true;
			controls.update();

			window.addEventListener( 'resize', onWindowResize );

			// GUI

			const displayGui = renderer.inspector.createParameters( 'Display' );
			displayGui.add( params, 'output', [ 'Beauty', 'SSR', 'SSR DN', 'SSR iterations' ] ).name( 'Output' ).info( 'DN means denoise. Iterations is a heat map of trace steps against the budget: blue, green, red, and white where it ran out.' ).onChange( updateOutput );
			displayGui.add( params, 'traa' ).name( 'TRAA' ).onChange( updateOutput );

			const downsampleGui = renderer.inspector.createParameters( 'Downsample' );
			downsampleGui.add( downsampleParams, 'level', { '1': 0, '2': 1, '4': 2 } ).name( 'ratio' ).onChange( ( value ) => {

				downsampleParams.level = Number( value );
				updateDownsample();

			} );
			const upsamplerControl = downsampleGui.add( downsampleParams, 'upsampler', [ 'Bilinear', 'Joint bilateral' ] ).onChange( ( value ) => depthTolerance.value = ( value === 'Bilinear' ) ? 1e6 : 0.005 );
			updateDownsample();

			const ssrGui = renderer.inspector.createParameters( 'SSR' );
			ssrGui.add( params, 'maxDistance', 0, 50 ).name( 'Max distance' ).onChange( updateParameters );
			ssrGui.add( params, 'thickness', 0, 0.5, 0.001 ).name( 'Thickness' ).onChange( updateParameters );

			// Each ray reads the beauty mip matching its cone footprint; off reads full resolution.
			const coneGui = renderer.inspector.createParameters( 'SSR Cone Samples' );
			coneGui.add( params, 'coneEnabled' ).name( 'Enabled' ).onChange( updateParameters );
			const coneControllers = [
				coneGui.add( params, 'coneMaxLevel', 1, 8, 1 ).name( 'Max mip' ).onChange( updateParameters ),
				coneGui.add( params, 'coneSamples', 1, 32, 1 ).name( 'Samples' ).onChange( updateParameters )
			];

			const adaptiveGui = renderer.inspector.createParameters( 'Adaptive/Cone Tracing' );
			adaptiveGui.add( params, 'adaptiveSteps', 16, 256, 16 ).name( 'Max steps' ).onChange( updateParameters );
			adaptiveGui.add( params, 'occlusionSkipping' ).name( 'Skip occluded' ).onChange( updateParameters );
			adaptiveGui.add( params, 'coneTracing' ).name( 'Cone tracing' ).onChange( updateParameters );
			adaptiveGui.add( params, 'coneValidate' ).name( 'Cone validate' ).onChange( updateParameters );
			adaptiveGui.add( params, 'cameraRays' ).name( 'Camera rays' ).onChange( updateParameters );

			const linearGui = renderer.inspector.createParameters( 'Linear Tracing' );
			linearGui.add( params, 'quality', 0, 1, 0.01 ).name( 'Quality' ).onChange( updateParameters );
			linearGui.add( params, 'binaryRefine' ).name( 'Binary refine' ).onChange( updateParameters );

			const denoiseGui = renderer.inspector.createParameters( 'Denoising' );
			denoiseGui.add( params, 'denoise' ).name( 'Enabled' ).onChange( ( value ) => denoiseEnabled.value = Number( value ) );
			denoiseGui.add( params, 'lumaPhi', 0, 3 ).name( 'Luma phi' ).onChange( updateParameters );

			const sceneGui = renderer.inspector.createParameters( 'Scene' );
			sceneGui.add( params, 'roughness', 0, 1 ).name( 'Floor roughness' ).onChange( value => floor.material.roughness = value );
			sceneGui.add( params, 'cameraRoughness', 0, 1 ).name( 'Camera roughness' ).onChange( value => {

				model?.traverse( object => {

					if ( object.material ) object.material.roughness = value;

				} );

			} );

			updateParameters();
			updateOutput();

		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize( window.innerWidth, window.innerHeight );

		}

		function animate() {

			controls.update();

			renderPipeline.render();

		}

	</script>
</body>

</html>
