<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - SSR radiance reprojection</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - SSR radiance reprojection">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_postprocessing_ssr_reprojection.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_postprocessing_ssr_reprojection.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>
		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>
			<div class="title-wrapper"><a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>SSR Reprojection</span></div>
			<small>Radiance reprojection experiment by <a href="https://ben3d.ca" target="_blank" rel="noopener">Ben Houston</a>.<br>
				<span id="view-label">Left: current radiance · Right: reprojected radiance</span><br>
				Pause animation to isolate camera motion. Animated surfaces stress history rejection.
			</small>
		</div>
		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>
		<script type="module">
			import * as THREE from 'three/webgpu';
			import { Fn, abs, color, context, indirectSpecular, environmentSpecular, pmremTexture, float, roughness as materialRoughness, mix, mrt, normalView, output, packNormalToRGB, pass, positionLocal, sample, screenSize, screenUV, step, uniform, unpackRGBToNormal, vec3, vec4, velocity } from 'three/tsl';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { reprojectedRadiance } from 'three/addons/tsl/display/ReprojectedRadianceNode.js';
			import { resolveSSRHitDistance } from 'three/addons/tsl/utils/SpecularHelpers.js';
			import { ssr } from 'three/addons/tsl/display/SSRNode.js';
			import { temporalDenoise } from 'three/addons/tsl/display/DenoiseNode.js';
			import { traa } from 'three/addons/tsl/display/TRAANode.js';

			const params = { output: 'Split', split: 0.5, animate: true, orbit: false, roughness: 0.18, quality: 0.5, denoise: true, frames: 1, traa: false, traaFrames: 20, reset: resetHistory };
			const scene = new THREE.Scene();
			scene.background = new THREE.Color( 0x18212c );
			const camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 60 );
			camera.position.set( 7, 4.8, 9 );
			const renderer = new THREE.WebGPURenderer();
			renderer.inspector = new Inspector();
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.toneMapping = THREE.AgXToneMapping;
			renderer.toneMappingExposure = 1.2;
			document.body.appendChild( renderer.domElement );
			await renderer.init();

			const environment = new RoomEnvironment();
			const pmrem = new THREE.PMREMGenerator( renderer );
			scene.environment = pmrem.fromScene( environment ).texture;
			environment.dispose();
			pmrem.dispose();
			scene.environmentIntensity = 0.6;
			scene.add( new THREE.HemisphereLight( 0xddeeff, 0x3b2620, 1.5 ) );
			const key = new THREE.DirectionalLight( 0xffffff, 4 );
			key.position.set( 4, 8, 4 );
			scene.add( key );

			const floor = new THREE.Mesh( new THREE.PlaneGeometry( 18, 18 ), new THREE.MeshStandardNodeMaterial( { color: 0xb8c4d5, metalness: 0.85, roughness: 0.18 } ) );
			floor.rotation.x = - Math.PI / 2;
			scene.add( floor );
			const wallGeometry = new THREE.BoxGeometry( 1, 5, 0.25 );
			for ( let i = 0; i < 11; i ++ ) {

				const wall = new THREE.Mesh( wallGeometry, new THREE.MeshStandardNodeMaterial( { color: i % 2 ? 0xdacbbb : 0x183444, roughness: 0.8 } ) );
				wall.position.set( i - 5, 2.5, - 4 );
				scene.add( wall );

			}

			const spheres = [];
			const sphereGeometry = new THREE.SphereGeometry( 0.9, 64, 32 );
			for ( const [ i, tint ] of [ 0xff4030, 0x30e0a0, 0x4080ff ].entries() ) {

				const material = new THREE.MeshStandardNodeMaterial( { metalness: 0.9, roughness: params.roughness } );
				const stripe = positionLocal.y.mul( 12 ).add( positionLocal.x.mul( 8 ) ).sin().smoothstep( - 0.1, 0.1 );
				material.colorNode = mix( color( tint ), color( 0xffffff ), stripe.mul( 0.35 ) );
				const sphere = new THREE.Mesh( sphereGeometry, material );
				sphere.position.set( ( i - 1 ) * 2.5, 1.1, 0 );
				scene.add( sphere );
				spheres.push( sphere );

			}

			const moving = new THREE.Mesh( new THREE.TorusKnotGeometry( 0.45, 0.16, 96, 16 ), new THREE.MeshStandardNodeMaterial( { color: 0xffb020, emissive: 0xff5000, emissiveIntensity: 1.5, roughness: 0.35 } ) );
			scene.add( moving );
			const controls = new OrbitControls( camera, renderer.domElement );
			controls.target.set( 0, 1, 0 );
			controls.enableDamping = true;
			controls.autoRotateSpeed = 0.8;
			controls.update();

			const geometryPass = pass( scene, camera );
			geometryPass.name = 'SSR G-buffer';
			geometryPass.contextNode = context( { indirectSpecularNode: indirectSpecular( [] ) } );
			geometryPass.setMRT( mrt( { output: vec4( packNormalToRGB( normalView ), materialRoughness ), velocity } ) );
			geometryPass.getTexture().type = THREE.UnsignedByteType;
			const depth = geometryPass.getTextureNode( 'depth' );
			const packedNormal = geometryPass.getTextureNode();
			const motion = geometryPass.getTextureNode( 'velocity' );
			const normal = sample( coordinate => unpackRGBToNormal( packedNormal.sample( coordinate ).rgb ).normalize() );
			const roughness = sample( coordinate => packedNormal.sample( coordinate ).a );
			const fallback = environmentSpecular( pmremTexture( scene.environment ) );
			const scenePass = pass( scene, camera );
			scenePass.name = 'SSR current lighting';
			scenePass.contextNode = context( { indirectSpecularNode: indirectSpecular( [ fallback ] ) } );
			scenePass.setMRT( mrt( { output: vec4( output.rgb, 1 ) } ) );
			const current = scenePass.getTextureNode();
			const beauties = [ pass( scene, camera ), pass( scene, camera ) ];
			beauties[ 0 ].name = 'Current-source beauty';
			beauties[ 1 ].name = 'Previous-source beauty';
			const history = reprojectedRadiance( beauties[ 1 ], depth, normal, camera );
			const previous = sample( coordinate => history.sample( coordinate ) );

			const denoiseEnabled = uniform( 1 );
			const compareSplit = uniform( params.split );
			const reflections = [];
			const filters = [];
			const temporalPasses = [];
			const results = [ current, previous ].map( ( source, index ) => {

				const reflection = ssr( source, depth, normal, { camera, stochastic: true, outputCoverage: true, binaryRefine: true, roughnessNode: roughness } );
				reflection.quality.value = params.quality;
				reflection.maxDistance.value = 20;
				reflection.thickness.value = 0.12;
				const texture = reflection.getTextureNode();
				const filter = temporalDenoise( texture, {
					camera, depth, normal, velocity: motion, roughness, coverage: true,
					hitDistance: sample( coordinate => resolveSSRHitDistance( reflection.getHitNode().sample( coordinate ).r, texture.sample( coordinate ).a ) )
				} );
				filter.maxFrames.value = params.frames;
				reflections.push( reflection );
				filters.push( filter );
				const signal = sample( coordinate => mix( texture.sample( coordinate ), filter.getTextureNode().sample( coordinate ), denoiseEnabled ) );
				// Coverage resolves the traced base specular lobe; other lobes use the environment.
				const screenReflection = query => query.lobe === 'specular' ? signal.sample( screenUV ) : vec4( 0 );
				beauties[ index ].contextNode = context( { indirectSpecularNode: indirectSpecular( [ screenReflection, fallback ] ) } );
				return beauties[ index ].getTextureNode();

			} );

			const pipeline = new THREE.RenderPipeline( renderer );
			const timer = new THREE.Timer();
			let time = 0;

			const gui = renderer.inspector.createParameters( 'Reprojection experiment' );
			gui.add( params, 'output', [ 'Split', 'Current', 'Reprojected', 'Source diff ×10', 'History support', 'SSR Raw', 'SSR Denoised', 'SSR Coverage Raw', 'SSR Coverage Denoised' ] ).name( 'Output' ).onChange( updateOutput );
			gui.add( params, 'split', 0, 1, 0.01 ).name( 'Split position' ).onChange( value => compareSplit.value = value );
			gui.add( params, 'animate' ).name( 'Animation' ).onChange( resetHistory );
			gui.add( params, 'orbit' ).name( 'Orbit camera' ).onChange( resetHistory );
			gui.add( params, 'roughness', 0.02, 0.8, 0.01 ).name( 'Roughness' ).onChange( value => {

				floor.material.roughness = value;
				for ( const sphere of spheres ) sphere.material.roughness = value;
				resetHistory();

			} );
			gui.add( params, 'quality', 0.1, 1, 0.05 ).name( 'SSR quality' ).onChange( value => {

				for ( const reflection of reflections ) reflection.quality.value = value;

			} );
			gui.add( params, 'denoise' ).name( 'Denoise' ).onChange( resetHistory );
			gui.add( params, 'frames', 1, 32, 1 ).name( 'SSR history frames' ).onChange( resetHistory );
			gui.add( params, 'traa' ).name( 'TRAA' ).onChange( updateOutput );
			gui.add( params, 'traaFrames', 1, 64, 1 ).name( 'TRAA history frames' ).onChange( () => {

				for ( const temporal of temporalPasses ) temporal.maxFrames.value = params.traaFrames;

			} );
			gui.add( params, 'reset' ).name( 'Reset history' );

			function updateOutput() {

				for ( const temporal of temporalPasses ) temporal.dispose();
				temporalPasses.length = 0;
				const images = results.map( result => {

					if ( ! params.traa || params.output.startsWith( 'SSR ' ) ) return result;
					const temporal = traa( result, depth, motion, camera );
					temporal.maxFrames.value = params.traaFrames;
					temporalPasses.push( temporal );
					return temporal;

				} );
				let view;
				const diagnostic = params.output.startsWith( 'SSR ' );
				const coverage = params.output.includes( 'Coverage' );
				if ( diagnostic ) {

					const values = ( params.output.endsWith( 'Denoised' ) ? filters : reflections ).map( node => {

						const value = node.getTextureNode();
						return vec4( coverage ? value.aaa : value.rgb, 1 );

					} );
					view = mix( values[ 0 ], values[ 1 ], step( compareSplit, screenUV.x ) );

				} else if ( params.output === 'History support' ) {

					view = vec4( vec3( history.sample( screenUV ).a ), 1 );

				} else if ( params.output === 'Source diff ×10' ) {

					const value = previous.sample( screenUV );
					view = vec4( abs( value.rgb.sub( current.rgb ) ).mul( value.a ).mul( 10 ), 1 );

				} else {

					const weight = params.output === 'Split' ? step( compareSplit, screenUV.x ) : float( params.output === 'Reprojected' ? 1 : 0 );
					view = mix( images[ 0 ], images[ 1 ], weight );
					if ( params.output === 'Split' ) {

						const line = step( screenSize.x.reciprocal(), abs( screenUV.x.sub( compareSplit ) ) ).oneMinus();
						view = mix( view, vec4( 1 ), line );

					}

				}

				pipeline.outputNode = Fn( ( _, builder ) => {

					history.build( builder );
					for ( const beauty of beauties ) beauty.build( builder );
					return view;

				} )();
				pipeline.outputColorTransform = ! coverage && params.output !== 'History support';
				pipeline.needsUpdate = true;
				document.getElementById( 'view-label' ).textContent = params.output === 'Split' || diagnostic ? `${ params.output } · Left: current frame · Right: previous frame` : params.output;

			}

			function resetHistory() {

				history.reset();
				denoiseEnabled.value = Number( params.denoise );
				for ( const filter of filters ) {

					filter.maxFrames.value = params.frames;
					filter.reset();

				}

				updateOutput();

			}

			window.addEventListener( 'resize', () => {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );
				resetHistory();

			} );
			resetHistory();
			renderer.setAnimationLoop( animate );

			function animate() {

				timer.update();
				const delta = Math.min( timer.getDelta(), 0.05 );
				if ( params.animate ) time += delta;
				for ( const [ i, sphere ] of spheres.entries() ) {

					sphere.rotation.set( time * 0.35, time * ( 0.7 + i * 0.2 ), 0.25 );
					sphere.position.y = 1.1 + Math.sin( time * 1.4 + i ) * 0.18;

				}

				moving.position.set( Math.sin( time ) * 3.5, 1.3, - 1.5 );
				moving.rotation.set( time * 0.5, time, 0 );
				controls.autoRotate = params.orbit;
				controls.update( delta );
				pipeline.render();

			}
		</script>
	</body>
</html>
