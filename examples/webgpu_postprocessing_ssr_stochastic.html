<!DOCTYPE html>
<html lang="en">

	<head>
		<title>three.js webgpu - postprocessing - Stochastic Screen Space Reflections (SSR)</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - postprocessing - Stochastic Screen Space Reflections (SSR)">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_postprocessing_ssr_stochastic.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_postprocessing_ssr_stochastic.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
		<style>
			#compare-hint {
				position: fixed;
				bottom: 20px;
				width: 100%;
				text-align: center;
				color: #e0e0e0;
				z-index: 1001;
				pointer-events: none;
				text-shadow: 1px 1px 5px #000;
			}
		</style>
	</head>

<body>

	<div id="compare-hint" hidden>Hold Shift and move the mouse to scrub the comparison</div>

	<div id="info">
		<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

		<div class="title-wrapper">
			<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Stochastic SSR</span>
		</div>

		<small>
			Integrates multiple samples from a GGX stochastic distribution over space and time.<br />
			Temporal reprojection by <a href="https://x.com/0beqz" target="_blank" rel="noopener">0beqz</a>.<br />
			Dungeon - Low Poly Game Level Challenge by
			Warkarma.<br />
		</small>
	</div>

	<script type="importmap">
		{
			"imports": {
				"three": "../build/three.webgpu.js",
				"three/webgpu": "../build/three.webgpu.js",
				"three/tsl": "../build/three.tsl.js",
				"three/addons/": "./jsm/"
			}
		}
	</script>

	<script type="module">

		import * as THREE from 'three/webgpu';
		import { pass, mrt, builtinIndirectContext, defaultIndirectSpecular, normalView, materialMetalness, materialRoughness, screenUV, sample, packNormalToRGB, packNormalToOctahedral, unpackOctahedralToNormal, vec2, velocity, vec3, vec4, uniform, mix, step, abs, float, renderOutput, saturation, rtt, Fn, mx_hsvtorgb } from 'three/tsl';
		import { ssr } from 'three/addons/tsl/display/SSRNode.js';
		import { depthAwareDownsample } from 'three/addons/tsl/display/DepthAwareDownsampleNode.js';
		import { jointBilateralUpsample } from 'three/addons/tsl/display/JointBilateralUpsample.js';
		import { temporalReproject } from 'three/addons/tsl/display/TemporalReprojectNode.js';
		import { sharpen } from 'three/addons/tsl/display/SharpenNode.js';
		import { traa } from 'three/addons/tsl/display/TRAANode.js';
		import { reprojectedBeauty, previousViewZ } from 'three/addons/tsl/display/ReprojectedBeautyNode.js';
		import { opaqueFragment, opaqueFragmentSource } from 'three/addons/tsl/utils/OpaqueFragment.js';

		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { Inspector } from 'three/addons/inspector/Inspector.js';
		import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
		import { coverageCascade } from 'three/addons/tsl/lighting/CoverageCascade.js';

		const OUTPUT_COMPARE_ACCUMULATION = 8;
		const OUTPUT_COMPARE_SSR = 9;
		const compareHint = document.getElementById( 'compare-hint' );
		const compareSplit = uniform( 0.5 );
		const compareResolution = uniform( new THREE.Vector2( window.innerWidth, window.innerHeight ) );

		function isCompareMode() {

			return params.output === OUTPUT_COMPARE_ACCUMULATION || params.output === OUTPUT_COMPARE_SSR;

		}

		function buildCompareNode( left, right ) {

			const compareColor = mix( left, right, step( compareSplit, screenUV.x ) );
			const lineWidth = float( 1 ).div( compareResolution.x );
			const onLine = float( 1 ).sub( step( lineWidth, abs( screenUV.x.sub( compareSplit ) ) ) );

			return mix( compareColor, vec4( 1 ), onLine );

		}

		const params = {
			output: 0,
			roughness: 0.3,

			ssr: {
				adaptive: true, adaptiveSteps: 64, occlusionSkipping: true, roughMinLevel: 0,
				coneEnabled: true, coneMaxLevel: 5, coneSamples: 4, coneTaps: 2, coneTracing: true, coneValidate: false, cameraRayThreshold: 0, rayReuse: true,
				quality: 0.25,
				mirrorBias: 0.7,
				mirrorRoughnessStart: 0.3, mirrorRoughnessEnd: 0.6, mirrorJitter: 0.1,
				maxDistance: 5,
				thickness: 0,
				maxLuminance: 35,
				binaryRefine: false,
				stepExponent: 3,
				screenEdgeFade: 0.2,
			},

			temporalReproject: {
				maxFrames: 16,
				clampIntensity: 0.25,
				flickerSuppression: 1,
				hitPointReprojection: true,
			},

			post: {
				traa: true,
				grading: { toneMapping: 'AgX', exposure: 1.57, gamma: 0.89, contrast: 1.31, saturation: 1 },
			},
		};

		let camera, scene, model, renderer, renderPipeline, ssrNode, ssrTexture, ssrUpsampled, temporalReprojectNode, accumulatedUpsampled;
		let controls;
		let combinedOutputNode, normalOutputNode, depthOutputNode, environmentPass, scenePassDepth, scenePassVelocity;
		let gammaUniform, contrastUniform, saturationUniform;
		const temporalOutputs = new Map();

		init();

		async function init() {

			camera = new THREE.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 0.1, 8 );

			camera.position.set( 0.9210513838983053, 0.16195074025403253, 0.431687274895316 );

			scene = new THREE.Scene();

			const loader = new GLTFLoader();
			loader.load( 'models/gltf/dungeon_warkarma.glb', function ( gltf ) {

				gltf.scene.scale.multiplyScalar( 0.1 );

				gltf.scene.traverse( function ( object ) {

					if ( ! object.material ) return;

					object.castShadow = true;
					object.receiveShadow = true;
					object.material.roughness = params.roughness;
					object.material.normalMap = null;

				} );

				model = gltf.scene;
				scene.add( model );

			} );

			renderer = new THREE.WebGPURenderer();
			renderer.inspector = new Inspector();
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.toneMapping = THREE.AgXToneMapping;
			renderer.toneMappingExposure = params.post.grading.exposure;
			renderer.shadowMap.enabled = true;
			document.body.appendChild( renderer.domElement );

			const hdrLoader = new HDRLoader().setPath( 'textures/equirectangular/' );
			const hdrTexture = await hdrLoader.loadAsync( 'quarry_01_1k.hdr' );
			hdrTexture.mapping = THREE.EquirectangularReflectionMapping;
			scene.background = hdrTexture;
			scene.environment = hdrTexture;
			hdrTexture.generateMipmaps = true;
			hdrTexture.needsUpdate = true;

			const directionalLight = new THREE.DirectionalLight( '#ffffff', 20 );
			directionalLight.position.set( - 10.9, 2.2, 10.75 );
			directionalLight.castShadow = true;
			directionalLight.shadow.autoUpdate = false;
			directionalLight.shadow.needsUpdate = true;
			directionalLight.shadow.mapSize.width = 4096;
			directionalLight.shadow.mapSize.height = 4096;
			directionalLight.shadow.camera.left = - 1.75;
			directionalLight.shadow.camera.right = 1.75;
			directionalLight.shadow.camera.top = 1.75;
			directionalLight.shadow.camera.bottom = - 1.75;
			directionalLight.shadow.camera.near = 0.1;
			directionalLight.shadow.camera.far = 50;
			directionalLight.shadow.bias = - 0.0005;
			scene.add( directionalLight );

			await renderer.init();

			// Hi-Z tracing requires WebGPU, the WebGL 2 fallback uses the linear tracer

			params.ssr.adaptive = renderer.backend.isWebGPUBackend === true;

			scene.environmentIntensity = 1;

			renderPipeline = new THREE.RenderPipeline( renderer );

			// the pre-pass renders the opaque fragments SSR traces, without shading them

			const scenePass = pass( scene, camera );
			scenePass.setMRT( mrt( {
				output: opaqueFragment( packNormalToOctahedral( normalView ) ),
				metalrough: vec2( materialMetalness, materialRoughness ),
				velocity: vec4( velocity, 0, previousViewZ )
			} ) );

			// the attachments hold data, so the blending of transparent materials does not apply

			scenePass.getMRT().setBlendMode( 'output', new THREE.BlendMode( THREE.NoBlending ) );

			const scenePassNormal = scenePass.getTextureNode( 'output' );
			scenePassDepth = scenePass.getTextureNode( 'depth' );
			const scenePassMetalRough = scenePass.getTextureNode( 'metalrough' );

			// the attachments clone the output texture, so the velocity is created before the output becomes RG

			scenePassVelocity = scenePass.getTextureNode( 'velocity' );

			// octahedral normals can't be filtered across their folds

			const normalTexture = scenePass.getTexture( 'output' );
			normalTexture.format = THREE.RGFormat;
			normalTexture.minFilter = normalTexture.magFilter = THREE.NearestFilter;

			scenePass.getTexture( 'metalrough' ).type = THREE.UnsignedByteType;

			const normalDecode = ( value ) => unpackOctahedralToNormal( value.rg );
			const sceneNormal = sample( ( uv ) => normalDecode( scenePassNormal.sample( uv ) ) );

			normalOutputNode = vec4( packNormalToRGB( sceneNormal.sample( screenUV ) ), 1 );
			// Repeat the full hue wheel 16 times over normalized linear depth.
			const depthHue = scenePass.getLinearDepthNode().mul( 16 ).fract();
			depthOutputNode = vec4( mx_hsvtorgb( vec3( depthHue, 1, 1 ) ), 1 );

			// ssr reflects the previous frame's beauty, so it is ready before this frame is shaded

			const beautyPass = pass( scene, camera );
			const previousBeauty = reprojectedBeauty( scenePass, beautyPass );

			// mip chain of the reflected radiance for the SSR cone footprint lookup

			previousBeauty.renderTarget.texture.generateMipmaps = true;
			previousBeauty.renderTarget.texture.minFilter = THREE.LinearMipmapLinearFilter;

			ssrNode = ssr( previousBeauty, scenePassDepth, sceneNormal, {
				camera,
				stochastic: true,
				metalnessNode: scenePassMetalRough.r,
				roughnessNode: scenePassMetalRough.g,
				binaryRefine: params.ssr.binaryRefine
			} ).toInspector( 'SSR' );

			// downsample: at a ratio above 1, the reflections are computed and accumulated from downsampled inputs and upsampled afterwards

			const downsampleParams = { level: 1, upsampler: 'Joint bilateral' };

			const downsample = depthAwareDownsample( scenePassDepth, { normal: scenePassNormal, metalrough: scenePassMetalRough, velocity: scenePassVelocity } );
			const downsampleDepth = downsample.getTextureNode( 'depth' );
			const downsampleMetalRough = downsample.getTextureNode( 'metalrough' );
			const downsampleVelocity = downsample.getTextureNode( 'velocity' );
			const downsampleNormal = sample( ( uv ) => normalDecode( downsample.getTextureNode( 'normal' ).sample( uv ) ) );

			// without depth rejection, the joint bilateral filter is a bilinear filter

			const depthTolerance = uniform( 0.005 );

			const upsample = ( node ) => {

				const upsampled = rtt( jointBilateralUpsample( node, downsampleDepth, scenePassDepth, camera, { depthTolerance } ).sample( screenUV ) ).sample( screenUV );

				return Fn( () => ( downsampleParams.level > 0 ) ? upsampled : node.sample( screenUV ) )();

			};

			function updateDownsample() {

				const reduced = downsampleParams.level > 0;

				if ( reduced ) downsample.level = downsampleParams.level;

				ssrNode.depthNode = reduced ? downsampleDepth : scenePassDepth;
				ssrNode.normalNode = reduced ? downsampleNormal : sceneNormal;
				ssrNode.metalnessNode = reduced ? downsampleMetalRough.r : scenePassMetalRough.r;
				ssrNode.roughnessNode = reduced ? downsampleMetalRough.g : scenePassMetalRough.g;

				temporalReprojectNode.depthNode = ssrNode.depthNode;
				temporalReprojectNode.normalNode = reduced ? downsample.getTextureNode( 'normal' ) : scenePassNormal;
				temporalReprojectNode.velocityNode = reduced ? downsampleVelocity : scenePassVelocity;

				renderPipeline.needsUpdate = true;

				reduced ? upsamplerControl.show() : upsamplerControl.hide();

			}

			ssrTexture = ssrNode.getTextureNode();

			// temporal accumulation: ray reuse filters over space, so there is no spatial denoiser

			temporalReprojectNode = temporalReproject( ssrTexture, scenePassDepth, scenePassNormal, scenePassVelocity, camera, {
				mode: 'specular',
				hitDistance: ssrNode.getHitDistanceNode(),
				accumulate: true,
				normalDecode: normalDecode
			} );
			temporalReprojectNode.toInspector( 'Temporal Accumulation' );

			ssrUpsampled = upsample( ssrTexture );
			accumulatedUpsampled = upsample( temporalReprojectNode.getTextureNode() );

			// the materials reflect SSR through their BRDF, and the environment where SSR has no coverage

			beautyPass.contextNode = builtinIndirectContext( {
				specular: coverageCascade( [ opaqueFragmentSource( ssrNode.getSpecularSource( accumulatedUpsampled ) ) ], defaultIndirectSpecular )
			} );

			// the same frame lit by the environment alone, for the comparison

			environmentPass = pass( scene, camera );

			gammaUniform = uniform( params.post.grading.gamma );
			contrastUniform = uniform( params.post.grading.contrast );
			saturationUniform = uniform( params.post.grading.saturation );

			combinedOutputNode = beautyPass.getTextureNode().toInspector( 'Combined SSR' );

			renderPipeline.outputNode = applyPostProcessing( combinedOutputNode );
			renderPipeline.outputColorTransform = false;

			controls = new OrbitControls( camera, renderer.domElement );
			controls.enableDamping = true;
			controls.update();

			// Initial camera transform
			camera.position.set( 1.259878548682251, 0.5391287340899181, - 0.27217301481427114 );
			camera.rotation.set( - 0.3158233106804791, 0.26820684188431526, 0.08637696823742165 );
			controls.target.set( 1.0258536154689288, 0.2746440590977971, - 1.0815876858987743 );

			window.addEventListener( 'resize', onWindowResize );
			renderer.domElement.addEventListener( 'pointermove', onComparePointerMove );
			renderer.domElement.addEventListener( 'pointerleave', releaseCompareControls );
			window.addEventListener( 'keyup', event => {

				if ( event.key === 'Shift' ) releaseCompareControls();

			} );
			window.addEventListener( 'blur', releaseCompareControls );

			applyParams();
			applyPost();

			const outputTypes = {
				Beauty: 0,
				SSR: 1,
				Normal: 2,
				Depth: 3,
				'SSR accumulated': 4,
				'Compare (Accumulation)': OUTPUT_COMPARE_ACCUMULATION,
				'Compare (Reflections)': OUTPUT_COMPARE_SSR,
				'Ray Length': 7,
				'SSR Iterations': 8,
				'SSR Cone Mip': 9,
				Coverage: 6
			};

			const displayGui = renderer.inspector.createParameters( 'Display' );
			displayGui.add( params, 'output', outputTypes ).name( 'Output' ).onChange( updateOutputNode );
			displayGui.add( params.post, 'traa' ).name( 'TRAA' ).onChange( updateOutputNode );

			const downsampleGui = renderer.inspector.createParameters( 'Downsample' );
			downsampleGui.add( downsampleParams, 'level', { '1': 0, '2': 1, '4': 2 } ).name( 'ratio' ).onChange( ( value ) => {

				downsampleParams.level = Number( value );
				updateDownsample();

			} );
			const upsamplerControl = downsampleGui.add( downsampleParams, 'upsampler', [ 'Bilinear', 'Joint bilateral' ] ).onChange( ( value ) => depthTolerance.value = ( value === 'Bilinear' ) ? 1e6 : 0.005 );
			updateDownsample();

			const ssrGui = renderer.inspector.createParameters( 'SSR' );
			// Only the active tracer's group is shown.
			const updateTracing = () => {

				applyParams();
				adaptiveGui[ params.ssr.adaptive ? 'show' : 'hide' ]();
				linearGui[ params.ssr.adaptive ? 'hide' : 'show' ]();

			};

			ssrGui.add( params.ssr, 'maxDistance', 0, 50 ).name( 'Max distance' ).onChange( applyParams );
			ssrGui.add( params.ssr, 'thickness', 0, 0.25 ).name( 'Thickness' ).onChange( applyParams );
			ssrGui.add( params.ssr, 'rayReuse' ).name( 'Ray reuse' ).onChange( applyParams );

			// Each ray reads the beauty mip matching its cone footprint; off reads full resolution.
			const coneGui = renderer.inspector.createParameters( 'SSR Cone Samples' );
			const updateCone = () => {

				applyParams();
				for ( const controller of coneControllers ) controller.disable( ! params.ssr.coneEnabled );

			};

			coneGui.add( params.ssr, 'coneEnabled' ).name( 'Enabled' ).onChange( updateCone );
			const coneControllers = [
				coneGui.add( params.ssr, 'coneMaxLevel', 1, 8, 1 ).name( 'Max mip' ).onChange( applyParams ),
				coneGui.add( params.ssr, 'coneSamples', 1, 32, 1 ).name( 'Samples' ).onChange( applyParams ),
				coneGui.add( params.ssr, 'coneTaps', 0, 16, 1 ).name( 'Taps' ).onChange( applyParams )
			];
			updateCone();

			const adaptiveGui = renderer.inspector.createParameters( 'Adaptive/Cone Tracing' );
			adaptiveGui.add( params.ssr, 'adaptiveSteps', 16, 256, 16 ).name( 'Max steps' ).onChange( applyParams );
			adaptiveGui.add( params.ssr, 'occlusionSkipping' ).name( 'Skip occluded' ).onChange( applyParams );
			adaptiveGui.add( params.ssr, 'roughMinLevel', 0, 3, 1 ).name( 'Rough min mip' ).onChange( applyParams );
			adaptiveGui.add( params.ssr, 'coneTracing' ).name( 'Cone tracing' ).onChange( applyParams );
			adaptiveGui.add( params.ssr, 'coneValidate' ).name( 'Cone validate' ).onChange( applyParams );
			adaptiveGui.add( params.ssr, 'cameraRayThreshold', 0, 1 ).name( 'Camera rays' ).onChange( applyParams );

			const linearGui = renderer.inspector.createParameters( 'Linear Tracing' );
			linearGui.add( params.ssr, 'quality', 0, 1, 0.01 ).name( 'Quality' ).onChange( applyParams );
			linearGui.add( params.ssr, 'binaryRefine' ).name( 'Binary refine' ).onChange( applyParams );
			linearGui.add( params.ssr, 'stepExponent', 1, 4, 0.5 ).name( 'Step exponent' ).onChange( applyParams );
			updateTracing();

			const temporalReprojectGui = renderer.inspector.createParameters( 'Temporal accumulation' );
			temporalReprojectGui.add( params.temporalReproject, 'maxFrames', 1, 128, 1 ).name( 'History frames' ).onChange( applyParams );
			temporalReprojectGui.add( params.temporalReproject, 'clampIntensity', 0, 1 ).name( 'Clamp intensity' ).onChange( applyParams );
			temporalReprojectGui.add( params.temporalReproject, 'flickerSuppression', 0, 1 ).name( 'Flicker suppression' ).onChange( applyParams );
			temporalReprojectGui.add( params.temporalReproject, 'hitPointReprojection' ).name( 'Hit point reprojection' ).onChange( applyParams );

			const sceneGui = renderer.inspector.createParameters( 'Scene' );
			sceneGui.add( params, 'roughness', 0, 1 ).name( 'Roughness' ).onChange( value => {

				scene.traverse( object => {

					if ( object.material ) object.material.roughness = value;

				} );

			} );

			const advancedGui = renderer.inspector.createParameters( 'SSR advanced' ).close();
			advancedGui.add( params.ssr, 'mirrorBias', 0, 1 ).name( 'Mirror bias' ).onChange( applyParams );
			advancedGui.add( params.ssr, 'mirrorRoughnessStart', 0, 1 ).name( 'Mirror rough. start' ).onChange( applyParams );
			advancedGui.add( params.ssr, 'mirrorRoughnessEnd', 0, 1 ).name( 'Mirror rough. end' ).onChange( applyParams );
			advancedGui.add( params.ssr, 'mirrorJitter', 0, 1 ).name( 'Mirror jitter' ).onChange( applyParams );

			// Concise UI for Directional Light controls
			const lightGui = renderer.inspector.createParameters( 'Light' ).close();
			[ 'x', 'y', 'z' ].forEach( axis => {

				lightGui.add( directionalLight.position, axis, - 30, 30 ).name( axis.toUpperCase() )
					.onChange( () => directionalLight.shadow.needsUpdate = true );

			} );
			lightGui.add( directionalLight, 'intensity', 0, 50 ).name( 'Intensity' );

			updateOutputNode();
			renderer.setAnimationLoop( animate );

		}

		function applyParams() {

			if ( ! ssrNode ) return;

			ssrNode.tracing = params.ssr.adaptive ? 'adaptive' : 'linear';
			ssrNode.roughMinLevel = params.ssr.roughMinLevel;
			ssrNode.coneTracing = params.ssr.coneTracing;
			ssrNode.coneValidate = params.ssr.coneValidate;
			ssrNode.coneTaps = params.ssr.coneTaps;
			ssrNode.cameraRayThreshold.value = params.ssr.cameraRayThreshold;
			ssrNode.rayReuse = params.ssr.rayReuse;
			ssrNode.adaptiveMaxSteps.value = params.ssr.adaptiveSteps;
			ssrNode.occlusionSkipping = params.ssr.occlusionSkipping;
			ssrNode.quality.value = params.ssr.quality;
			ssrNode.mirrorBias.value = params.ssr.mirrorBias;
			ssrNode.mirrorRoughnessStart.value = params.ssr.mirrorRoughnessStart;
			ssrNode.mirrorRoughnessEnd.value = params.ssr.mirrorRoughnessEnd;
			ssrNode.mirrorJitter.value = params.ssr.mirrorJitter;
			ssrNode.coneMaxLevel.value = params.ssr.coneEnabled ? params.ssr.coneMaxLevel : 0;
			ssrNode.coneSamples.value = params.ssr.coneSamples;
			// stepExponent / binaryRefine are build-time constants: assigning
			// them recompiles the SSR material (the setters no-op when the value is unchanged).
			ssrNode.stepExponent = params.ssr.stepExponent;
			ssrNode.binaryRefine = params.ssr.binaryRefine;
			ssrNode.maxDistance.value = params.ssr.maxDistance;
			ssrNode.thickness.value = params.ssr.thickness;
			ssrNode.maxLuminance.value = params.ssr.maxLuminance;
			ssrNode.screenEdgeFade.value = params.ssr.screenEdgeFade;

			if ( temporalReprojectNode ) {

				temporalReprojectNode.maxFrames.value = params.temporalReproject.maxFrames;
				temporalReprojectNode.clampIntensity.value = params.temporalReproject.clampIntensity;
				temporalReprojectNode.flickerSuppression.value = params.temporalReproject.flickerSuppression;
				temporalReprojectNode.hitPointReprojection.value = params.temporalReproject.hitPointReprojection;

			}

		}

		function applyGrading( source ) {

			let rgb = source.rgb;

			rgb = renderOutput( vec4( rgb, 1 ), THREE.AgXToneMapping, THREE.SRGBColorSpace ).rgb;
			rgb = rgb.sub( 0.5 ).mul( contrastUniform ).add( 0.5 );
			rgb = saturation( rgb, saturationUniform );
			rgb = rgb.max( 0.0 ).pow( float( 1 ).div( gammaUniform ) );

			return vec4( rgb, 1 );

		}

		function applyPostProcessing( source ) {

			if ( ! params.post.traa ) return applyGrading( source );
			let temporal = temporalOutputs.get( source );
			if ( temporal === undefined ) {

				temporal = traa( applyGrading( source ), scenePassDepth, scenePassVelocity, camera );
				temporalOutputs.set( source, temporal );

			}

			return sharpen( temporal, 0 );

		}

		function applyPost() {

			const g = params.post.grading;
			gammaUniform.value = g.gamma;
			contrastUniform.value = g.contrast;
			saturationUniform.value = g.saturation;

			renderer.toneMapping = THREE.AgXToneMapping;
			renderer.toneMappingExposure = g.exposure;

		}

		function updateOutputNode() {

			if ( ! renderPipeline ) return;

			let node;

			switch ( params.output ) {

				case 0: node = applyPostProcessing( combinedOutputNode ); break; // Beauty
				case 1: node = applyGrading( vec4( ssrUpsampled.rgb, 1 ) ); break; // SSR
				case 4: node = applyGrading( vec4( accumulatedUpsampled.rgb, 1 ) ); break; // SSR accumulated
				case 6: node = vec4( accumulatedUpsampled.aaa, 1 ); break; // Coverage
				case 7: node = vec4( ssrNode.getHitDistanceNode().sample( screenUV ).rrr, 1 ); break; // Ray Length
				case 2: node = renderOutput( normalOutputNode, THREE.NoToneMapping, THREE.SRGBColorSpace ); break; // Normal
				case 3: node = renderOutput( depthOutputNode, THREE.NoToneMapping, THREE.SRGBColorSpace ); break; // Linear depth
				case 8: // Iteration heat map
				case 9: node = vec4( ssrUpsampled.rgb, 1 ); break; // Cone mip heat map
				case OUTPUT_COMPARE_ACCUMULATION:
					node = buildCompareNode(
						applyGrading( vec4( accumulatedUpsampled.rgb, 1 ) ),
						applyGrading( vec4( ssrUpsampled.rgb, 1 ) )
					);
					break;
				case OUTPUT_COMPARE_SSR:
					node = buildCompareNode( applyPostProcessing( combinedOutputNode ), applyPostProcessing( environmentPass ) );
					break;

			}

			compareHint.hidden = ! isCompareMode();
			releaseCompareControls();

			ssrNode.showIterations = params.output === 8;
			ssrNode.showConeMip = params.output === 9;
			renderPipeline.outputColorTransform = params.output >= 6 && params.output <= 9;
			renderPipeline.outputNode = node;
			renderPipeline.needsUpdate = true;

		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize( window.innerWidth, window.innerHeight );
			compareResolution.value.set( window.innerWidth, window.innerHeight );

		}

		function releaseCompareControls() {

			controls.enabled = true;

		}

		function onComparePointerMove( event ) {

			if ( ! isCompareMode() ) return;

			controls.enabled = ! event.shiftKey;

			if ( event.shiftKey ) {

				const rect = renderer.domElement.getBoundingClientRect();
				compareSplit.value = Math.max( 0, Math.min( 1, ( event.clientX - rect.left ) / rect.width ) );

			}

		}

		function animate() {

			controls.update();

			renderPipeline.render();

		}

	</script>
</body>

</html>
