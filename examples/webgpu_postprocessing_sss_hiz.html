<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - SSS Hi-Z</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - SSS Hi-Z">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_postprocessing_sss_hiz.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_postprocessing_sss_hiz.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>SSS Hi-Z</span>
			</div>

			<small>
				Long Screen-Space Shadows (SSS), traced through a hierarchical depth buffer or marched linearly.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { pass, mrt, velocity, normalView, packNormalToOctahedral, unpackOctahedralToNormal, sample, vec3, vec4, mix, checker, hash, varying, instanceIndex, positionWorld, screenUV, builtinShadowContext } from 'three/tsl';
			import { sss } from 'three/addons/tsl/display/SSSNode.js';
			import { traa } from 'three/addons/tsl/display/TRAANode.js';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';

			let camera, scene, renderer, renderPipeline, controls;

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 60, window.innerWidth / window.innerHeight, 0.1, 1000 );
				camera.position.set( 0, 1.7, 6 );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x9fc4e8 );
				scene.fog = new THREE.Fog( 0x9fc4e8, 100, 400 );

				// lights

				scene.add( new THREE.HemisphereLight( 0xcfe3ff, 0x6b6558, 1 ) );

				// the shadow map stays empty since no object casts shadows, the light only casts the screen-space shadows

				const sun = new THREE.DirectionalLight( 0xfff1dd, 4 );
				sun.castShadow = true;
				sun.shadow.mapSize.set( 16, 16 );
				scene.add( sun );

				// ground

				const groundMaterial = new THREE.MeshStandardNodeMaterial( { roughness: 0.9 } );
				groundMaterial.colorNode = mix( vec3( 0.4, 0.39, 0.36 ), vec3( 0.46, 0.45, 0.42 ), checker( positionWorld.xz.mul( 0.25 ) ) );

				const ground = new THREE.Mesh( new THREE.PlaneGeometry( 1000, 1000 ), groundMaterial );
				ground.rotation.x = - Math.PI / 2;
				ground.receiveShadow = true;
				scene.add( ground );

				// objects, each instance has its own color, metalness and roughness

				const material = new THREE.MeshStandardNodeMaterial();
				material.metalnessNode = varying( hash( instanceIndex ) );
				material.roughnessNode = varying( hash( instanceIndex.add( 7 ) ).mul( 0.6 ).add( 0.15 ) );

				const geometries = [
					new THREE.BoxGeometry(),
					new THREE.SphereGeometry( 0.5 ),
					new THREE.CylinderGeometry( 0.5, 0.5, 1 ),
					new THREE.ConeGeometry( 0.5, 1 ),
					new THREE.IcosahedronGeometry( 0.5 ),
					new THREE.TorusKnotGeometry( 0.3, 0.1, 64, 12 ).scale( 1.1, 1.1, 1.1 )
				];

				const COUNT = 1000; // per geometry
				const EXTENT = 300;

				const random = THREE.MathUtils.seededRandom;
				const dummy = new THREE.Object3D();
				const color = new THREE.Color();

				THREE.MathUtils.seededRandom( 4 );

				for ( const geometry of geometries ) {

					const mesh = new THREE.InstancedMesh( geometry, material, COUNT );
					mesh.receiveShadow = true;

					for ( let i = 0; i < COUNT; i ++ ) {

						// many small objects and some larger ones

						const size = random() < 0.94 ? 0.15 + random() * 0.7 : 1.5 + random() * 4.5;
						const height = size * ( 0.5 + random() );

						do {

							dummy.position.set( ( random() - 0.5 ) * EXTENT, height / 2, ( random() - 0.5 ) * EXTENT );

						} while ( Math.hypot( dummy.position.x, dummy.position.z ) < size * 2 + 3 ); // keep the start clear

						dummy.rotation.y = random() * Math.PI * 2;
						dummy.scale.set( size, height, size );
						dummy.updateMatrix();

						mesh.setMatrixAt( i, dummy.matrix );
						mesh.setColorAt( i, color.setHSL( random(), 0.4 + random() * 0.6, 0.3 + random() * 0.4 ) );

					}

					scene.add( mesh );

				}

				//

				renderer = new THREE.WebGPURenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				renderer.toneMapping = THREE.NeutralToneMapping;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				const pmremGenerator = new THREE.PMREMGenerator( renderer );
				scene.environment = pmremGenerator.fromScene( new RoomEnvironment(), 0.04 ).texture;
				scene.environmentIntensity = 0.6;

				// post-processing

				renderPipeline = new THREE.RenderPipeline( renderer );

				// pre-pass

				const prePass = pass( scene, camera );
				prePass.name = 'Pre-Pass';

				prePass.setMRT( mrt( {
					output: velocity,
					normal: packNormalToOctahedral( normalView )
				} ) );

				const prePassDepth = prePass.getTextureNode( 'depth' ).toInspector( 'Depth', () => prePass.getLinearDepthNode() );
				const prePassVelocity = prePass.getTextureNode( 'output' ).toInspector( 'Velocity' );
				const prePassNormal = prePass.getTextureNode( 'normal' );

				const sceneNormal = sample( ( uv ) => unpackOctahedralToNormal( prePassNormal.sample( uv ).rg ) ).toInspector( 'Normal' );

				// scene pass

				const scenePass = pass( scene, camera ).toInspector( 'Color' );

				// sss

				const sssPass = sss( prePassDepth, camera, sun );
				sssPass.normalNode = sceneNormal;
				sssPass.hiZ = true;
				sssPass.maxDistance.value = 30;
				sssPass.fadeOutDistance.value = 10;
				sssPass.screenEdgeFade.value = 0.1;
				sssPass.thickness.value = 1;

				// scene context

				const sssSample = sssPass.getTextureNode().sample( screenUV ).r;

				scenePass.contextNode = builtinShadowContext( sssSample, sun );

				// traa, the jittered depth antialiases the edges of the shadows

				const traaPass = traa( scenePass, prePassDepth, prePassVelocity, camera );

				renderPipeline.outputNode = traaPass;

				//

				controls = new OrbitControls( camera, renderer.domElement );
				controls.minDistance = 0.5;
				controls.maxDistance = 150;
				controls.maxPolarAngle = Math.PI / 2 - 0.01;
				controls.screenSpacePanning = false;
				controls.target.set( 0, 1.2, 0 );
				controls.enableDamping = true;
				controls.update();

				//

				const params = {
					azimuth: 135,
					altitude: 25,
					hiZ: true,
					traa: true,
					output: 0
				};

				function updateSun() {

					const phi = THREE.MathUtils.degToRad( 90 - params.altitude );
					const theta = THREE.MathUtils.degToRad( params.azimuth );

					sun.position.setFromSphericalCoords( 100, phi, theta );

				}

				function updatePostprocessing() {

					sssPass.hiZ = params.hiZ;
					sssPass.useTemporalFiltering = params.traa;

					renderPipeline.outputNode = params.output === 1 ? vec4( vec3( sssPass.r ), 1 ) : ( params.traa ? traaPass : scenePass );
					renderPipeline.needsUpdate = true;

				}

				updateSun();
				updatePostprocessing();

				const gui = renderer.inspector.createParameters( 'SSS settings' );
				gui.add( params, 'azimuth', - 180, 180 ).name( 'sun azimuth' ).onChange( updateSun );
				gui.add( params, 'altitude', 0.5, 90 ).name( 'sun altitude' ).onChange( updateSun );
				gui.add( params, 'hiZ', { 'Hi-Z': true, 'linear': false } ).name( 'tracing' ).onChange( updatePostprocessing );
				gui.add( params, 'traa' ).name( 'TRAA' ).onChange( updatePostprocessing );
				gui.add( params, 'output', { 'Scene with SSS': 0, 'SSS': 1 } ).onChange( updatePostprocessing );
				gui.add( sssPass.shadowIntensity, 'value', 0, 1 ).name( 'shadow intensity' );
				gui.add( sssPass.maxDistance, 'value', 0.1, 200 ).name( 'max ray distance' );
				gui.add( sssPass.fadeOutDistance, 'value', 0, 100 ).name( 'fade out distance' );
				gui.add( sssPass.screenEdgeFade, 'value', 0, 0.5 ).name( 'screen edge fade' );
				gui.add( sssPass.grazingFade, 'value', 0, 1 ).name( 'grazing fade' );
				gui.add( sssPass.thickness, 'value', 0.01, 10 ).name( 'thickness' );
				gui.add( sssPass.maxSteps, 'value', 4, 256, 1 ).name( 'max steps (Hi-Z)' );
				gui.add( sssPass.quality, 'value', 0, 1 ).name( 'quality (linear)' );

				window.addEventListener( 'resize', onWindowResize );

				renderer.setAnimationLoop( animate );

			}

			function onWindowResize() {

				const width = window.innerWidth;
				const height = window.innerHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize( width, height );

			}

			function animate() {

				controls.update();

				renderPipeline.render();

			}

		</script>
	</body>
</html>
