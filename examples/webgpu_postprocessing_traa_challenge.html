<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - postprocessing traa challenge</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - postprocessing traa challenge">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_postprocessing_traa_challenge.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_postprocessing_traa_challenge.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>
		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>
			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>TRAA Challenge</span>
			</div>
			<small>Thin edges, fine textures, rotation, specular aliasing, disocclusion, alpha and instanced motion.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { mrt, output, pass, velocity } from 'three/tsl';
			import { traa } from 'three/addons/tsl/display/TRAANode.js';
			import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';

			const params = {
				output: 'TRAA',
				historySampling: 'catmull-rom',
				cameraMotion: 'Pan',
				animate: true
			};

			let camera, scene, renderer, renderPipeline, scenePass, traaPass;
			let time = 0;

			const groups = [];
			const animated = {};
			const matrix = new THREE.Matrix4();

			const timer = new THREE.Timer();
			timer.connect( document );

			init();

			async function init() {

				renderer = new THREE.WebGPURenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.toneMapping = THREE.NeutralToneMapping;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				camera = new THREE.PerspectiveCamera( 42, window.innerWidth / window.innerHeight, 0.1, 60 );

				scene = new THREE.Scene();
				scene.add( new THREE.HemisphereLight( 0xffffff, 0x334466, 2 ) );

				const light = new THREE.PointLight( 0xffffff, 100 );
				light.position.set( 2, 4, 6 );
				scene.add( light );
				animated.light = light;

				const environment = await new HDRLoader().loadAsync( 'textures/equirectangular/venice_sunset_1k.hdr' );
				environment.mapping = THREE.EquirectangularReflectionMapping;
				scene.environment = environment;
				scene.background = environment;
				scene.backgroundBlurriness = 0.15;

				createChallenges();

				// postprocessing

				renderPipeline = new THREE.RenderPipeline( renderer );

				scenePass = pass( scene, camera );
				scenePass.setMRT( mrt( {
					output: output,
					velocity: velocity
				} ) );

				updatePostprocessing();

				// gui

				const gui = renderer.inspector.createParameters( 'TRAA settings' );
				gui.add( params, 'output', [ 'TRAA', 'No AA' ] ).onChange( updatePostprocessing );
				gui.add( params, 'historySampling', [ 'catmull-rom', 'linear' ] ).name( 'history sampling' ).onChange( updatePostprocessing );
				gui.add( params, 'cameraMotion', [ 'Still', 'Pan', 'Orbit', 'Zoom' ] ).name( 'camera motion' );
				gui.add( params, 'animate' );

				window.addEventListener( 'resize', onWindowResize );

			}

			function updatePostprocessing() {

				if ( traaPass !== undefined ) traaPass.dispose();
				traaPass = undefined;

				if ( params.output === 'TRAA' ) {

					traaPass = traa( scenePass.getTextureNode( 'output' ), scenePass.getTextureNode( 'depth' ), scenePass.getTextureNode( 'velocity' ), camera );
					traaPass.historySampling = params.historySampling;
					renderPipeline.outputNode = traaPass;

				} else {

					renderPipeline.outputNode = scenePass.getTextureNode( 'output' );

				}

				renderPipeline.needsUpdate = true;

			}

			function createChallenges() {

				// procedural textures with detail at the pixel scale

				const checkerData = new Uint8Array( 64 * 64 * 4 );
				const cutoutData = new Uint8Array( 64 * 64 * 4 );

				for ( let y = 0; y < 64; y ++ ) {

					for ( let x = 0; x < 64; x ++ ) {

						const i = ( y * 64 + x ) * 4;
						const white = ( ( x >> 1 ) + ( y >> 1 ) ) % 2 === 0;
						checkerData.set( [ white ? 255 : 8, white ? 255 : 8, white ? 255 : 8, 255 ], i );
						cutoutData.set( [ 255, 180, 30, white ? 255 : 0 ], i );

					}

				}

				const checker = new THREE.DataTexture( checkerData, 64, 64 );
				const cutout = new THREE.DataTexture( cutoutData, 64, 64 );

				for ( const texture of [ checker, cutout ] ) {

					texture.minFilter = texture.magFilter = THREE.NearestFilter;
					texture.needsUpdate = true;

				}

				// tangent-space wave normals for specular aliasing

				const waveData = new Uint8Array( 256 * 256 * 4 );

				for ( let y = 0; y < 256; y ++ ) {

					for ( let x = 0; x < 256; x ++ ) {

						const u = x / 256 * Math.PI * 6;
						const v = y / 256 * Math.PI * 6;
						const phase = u * 12 + 0.4 * Math.sin( v * 3 );
						const nx = - 0.65 * Math.cos( phase );
						const ny = - 0.9 * Math.cos( v * 6 ) - 0.2 * Math.cos( phase ) * Math.cos( v * 3 );
						const length = Math.hypot( nx, ny, 1 );
						waveData.set( [ ( nx / length * 0.5 + 0.5 ) * 255, ( ny / length * 0.5 + 0.5 ) * 255, ( 1 / length * 0.5 + 0.5 ) * 255, 255 ], ( y * 256 + x ) * 4 );

					}

				}

				const waves = new THREE.DataTexture( waveData, 256, 256 );
				waves.wrapS = waves.wrapT = THREE.RepeatWrapping;
				waves.minFilter = THREE.LinearMipmapLinearFilter;
				waves.generateMipmaps = true;
				waves.needsUpdate = true;

				const white = new THREE.MeshBasicMaterial( { color: 0xffffff } );
				const patterned = new THREE.MeshBasicMaterial( { map: checker, side: THREE.DoubleSide } );

				for ( let i = 0; i < 9; i ++ ) {

					const group = new THREE.Group();
					group.position.set( ( i % 3 - 1 ) * 3.7, ( 1 - Math.floor( i / 3 ) ) * 2.8, 0 );
					scene.add( group );
					groups.push( group );

				}

				const mesh = ( geometry, material, parent ) => {

					const object = new THREE.Mesh( geometry, material );
					parent.add( object );
					return object;

				};

				// static: thin edges and fine texture

				mesh( new THREE.PlaneGeometry( 1.5, 1.5 ), patterned, groups[ 0 ] ).rotation.z = 0.2;

				for ( let i = 0; i < 12; i ++ ) {

					const bar = mesh( new THREE.BoxGeometry( 0.015, 1.8, 0.02 ), white, groups[ 0 ] );
					bar.position.set( ( i - 5.5 ) * 0.17, 0, 0.1 );
					bar.rotation.z = 0.4;

				}

				// linear translation

				animated.linear = mesh( new THREE.PlaneGeometry( 1.25, 1.25 ), patterned, groups[ 1 ] );

				// rotation: spokes and texture

				animated.spinner = new THREE.Group();
				groups[ 2 ].add( animated.spinner );
				mesh( new THREE.CircleGeometry( 0.9, 64 ), patterned, animated.spinner );

				for ( let i = 0; i < 16; i ++ ) {

					const spoke = mesh( new THREE.BoxGeometry( 0.022, 1.85, 0.03 ), white, animated.spinner );
					spoke.rotation.z = i * Math.PI / 16;
					spoke.position.z = 0.1;

				}

				// specular highlights and reflections

				animated.shiny = mesh( new THREE.TorusKnotGeometry( 0.55, 0.18, 160, 24 ), new THREE.MeshStandardMaterial( { color: 0xddddff, metalness: 1, roughness: 0.04, normalMap: waves } ), groups[ 3 ] );

				// opposing motion and crossing edges

				animated.rear = mesh( new THREE.PlaneGeometry( 1.7, 1.6 ), patterned, groups[ 4 ] );
				animated.front = new THREE.Group();
				groups[ 4 ].add( animated.front );

				for ( let i = 0; i < 6; i ++ ) {

					const bar = mesh( new THREE.BoxGeometry( 0.13, 1.8, 0.15 ), new THREE.MeshBasicMaterial( { color: i % 2 ? 0xff4422 : 0x22aaff } ), animated.front );
					bar.position.set( ( i - 2.5 ) * 0.27, 0, 0.3 );

				}

				// zoom: approaching fine detail

				animated.zoom = mesh( new THREE.PlaneGeometry( 1.5, 1.5 ), patterned, groups[ 5 ] );

				// concavity: newly exposed surfaces

				animated.concave = new THREE.Group();
				groups[ 6 ].add( animated.concave );

				for ( let i = 0; i < 5; i ++ ) {

					const wall = mesh( new THREE.BoxGeometry( 0.12, 1.7, 1.5 ), new THREE.MeshStandardMaterial( { color: new THREE.Color().setHSL( i / 5, 0.8, 0.5 ), roughness: 0.8 } ), animated.concave );
					wall.position.x = ( i - 2 ) * 0.4;

				}

				mesh( new THREE.BoxGeometry( 1.9, 1.7, 0.12 ), new THREE.MeshStandardMaterial( { color: 0xeeeeee } ), animated.concave ).position.z = - 0.75;

				// alpha cutout and blended surface

				animated.alphaTest = mesh( new THREE.PlaneGeometry( 1.6, 1.6 ), new THREE.MeshBasicMaterial( { map: cutout, alphaTest: 0.5, side: THREE.DoubleSide } ), groups[ 7 ] );
				animated.blended = mesh( new THREE.PlaneGeometry( 1, 1.3 ), new THREE.MeshBasicMaterial( { color: 0x44aaff, transparent: true, opacity: 0.45, depthWrite: false, side: THREE.DoubleSide } ), groups[ 7 ] );
				animated.blended.position.z = 0.3;

				// morphing and instanced motion

				const morphGeometry = new THREE.PlaneGeometry( 1.4, 1.4, 20, 20 );
				const morphPosition = morphGeometry.attributes.position.clone();
				for ( let i = 0; i < morphPosition.count; i ++ ) morphPosition.setZ( i, 0.4 * Math.sin( morphPosition.getX( i ) * 9 ) );
				morphGeometry.morphAttributes.position = [ morphPosition ];
				animated.morph = mesh( morphGeometry, patterned, groups[ 8 ] );

				animated.instances = new THREE.InstancedMesh( new THREE.BoxGeometry( 0.14, 0.14, 0.14 ), white, 12 );
				groups[ 8 ].add( animated.instances );

			}

			function update() {

				const { linear, spinner, shiny, light, rear, front, zoom, concave, alphaTest, blended, morph, instances } = animated;

				linear.position.set( 0.65 * Math.sin( time ), 0.18 * Math.cos( time * 0.7 ), 0 );
				spinner.rotation.z = time * 0.6;
				shiny.rotation.set( time * 0.3, time * 0.5, 0 );
				light.position.x = 5 * Math.sin( time * 0.5 );
				rear.position.x = 0.45 * Math.sin( time * 1.3 );
				front.position.x = - 0.55 * Math.sin( time * 1.3 );
				zoom.scale.setScalar( 0.85 + 0.35 * Math.sin( time * 0.7 ) );
				zoom.position.z = 1.2 * Math.sin( time * 0.7 );
				concave.rotation.y = time * 0.45;
				alphaTest.rotation.z = time * 0.25;
				blended.position.x = 0.6 * Math.sin( time * 1.2 );
				morph.morphTargetInfluences[ 0 ] = 0.5 + 0.5 * Math.sin( time );

				for ( let i = 0; i < 12; i ++ ) {

					const angle = i * Math.PI / 6 + time * 0.5;
					matrix.makeTranslation( Math.cos( angle ), Math.sin( angle ), 0.5 );
					instances.setMatrixAt( i, matrix );

				}

				instances.instanceMatrix.needsUpdate = true;

				// fit the 3×3 grid of challenges to the viewport

				const distance = Math.max( 14, 10 / camera.aspect );
				camera.position.set( 0, 0, distance );

				if ( params.cameraMotion === 'Pan' ) camera.position.x = 0.8 * Math.sin( time * 0.6 );
				if ( params.cameraMotion === 'Orbit' ) camera.position.set( 3 * Math.sin( time * 0.4 ), 0.7 * Math.cos( time * 0.4 ), distance );
				if ( params.cameraMotion === 'Zoom' ) camera.position.z = distance - 1 + 1.5 * Math.sin( time * 0.5 );

				camera.lookAt( 0, 0, 0 );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				if ( renderPipeline === undefined ) return;

				timer.update();

				if ( params.animate ) time += timer.getDelta();

				update();

				renderPipeline.render();

			}

		</script>
	</body>
</html>
