<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - reflection probes</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>
		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>
			<div class="title-wrapper"><a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Reflection Probes</span></div>
			<small>Box-projected reflection probes blended per pixel by <a href="https://ben3d.ca" target="_blank" rel="noopener">Ben Houston</a></small>
		</div>
		<script type="importmap">
			{
				"imports": {
					"three": "../src/Three.WebGPU.js",
					"three/webgpu": "../src/Three.WebGPU.js",
					"three/tsl": "../src/Three.TSL.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>
		<script type="module">

			import * as THREE from 'three/webgpu';
			import { indirectDiffuse, indirectSpecular, indirectLightingContext, environmentSpecular } from 'three/tsl';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { LightProbeGrid } from 'three/addons/lighting/LightProbeGrid.js';
			import { lightProbeGridDiffuse } from 'three/addons/tsl/lighting/LightProbeGridNode.js';
			import { ReflectionProbe, ReflectionProbes } from 'three/addons/lighting/ReflectionProbes.js';
			import { reflectionProbesSpecular, reflectionProbesEnvironment } from 'three/addons/tsl/lighting/ReflectionProbesNode.js';
			import { ReflectionProbesHelper } from 'three/addons/helpers/ReflectionProbesHelper.js';

			const params = { showProbes: false, dynamicObject: 'Bunny', pause: false, showGrid: false, gridResolution: 6, gridSize: 0.12, resolution: 256, boxProjection: true, bounces: 3, capture: capture };
			const grid = new THREE.Group();
			const timer = new THREE.Timer();
			let camera, scene, renderer, controls, lightProbes, probes, probesHelper, gridMaterial, dynamicObject;
			let animationTime = 0;

			init();

			async function init() {

				// Camera

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 2.5, 16 );

				// Scene

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x111111 );

				const gltf = await new GLTFLoader().loadAsync( 'models/gltf/dual-rooms.glb' );
				gltf.scene.traverse( ( object ) => {

					if ( object.isMesh ) {

						object.castShadow = true;
						object.receiveShadow = true;

					}

					if ( object.isLight && object.shadow ) {

						object.castShadow = true;
						object.shadow.mapSize.setScalar( 256 );
						object.shadow.radius = 12;
						object.shadow.bias = - 0.002;

					}

				} );
				scene.add( gltf.scene );

				// Renderer

				renderer = new THREE.WebGPURenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );
				await renderer.init();

				controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 2.5, 0 );
				controls.update();

				// Diffuse lighting for both rooms, with visibility across the divider.

				lightProbes = new LightProbeGrid( 15.6, 4.7, 7.6, 12, 6, 6 );
				lightProbes.position.set( 0, 2.45, 0 );
				lightProbes.visibility = true;
				lightProbes.multiBounce = true;
				scene.add( lightProbes );

				// One reflection probe per room plus a smaller doorway probe.

				probes = new ReflectionProbes();

				const probeSetup = [
					{ position: [ - 4, 2.5, 0 ], influenceSize: [ 8.4, 5.4, 8.4 ], projectionSize: [ 8, 5, 8 ] },
					{ position: [ 4, 2.5, 0 ], influenceSize: [ 8.4, 5.4, 8.4 ], projectionSize: [ 8, 5, 8 ] },
					// captured at doorway height, projected onto both rooms
					{ position: [ 0, 1.9, 0 ], influenceSize: [ 2.4, 3.8, 2.5 ], projectionSize: [ 16, 5, 8 ], projectionOffset: [ 0, 0.6, 0 ] }
				];

				for ( const setup of probeSetup ) {

					const probe = new ReflectionProbe( ...setup.influenceSize );
					probe.position.set( ...setup.position );
					probe.projectionSize = new THREE.Vector3( ...setup.projectionSize );
					if ( setup.projectionOffset ) probe.projectionOffset.set( ...setup.projectionOffset );
					probes.add( probe );

				}

				scene.add( probes );

				// Each test surface evaluates the probe blend at its own world position.

				gridMaterial = new THREE.MeshStandardMaterial( { metalness: 1, roughness: 0.08 } );
				const dynamicMaterial = new THREE.MeshStandardMaterial( { metalness: 1, roughness: 0 } );

				const loader = new DRACOLoader();
				const bunnyGeometry = await loader.loadAsync( 'models/draco/bunny.drc' );
				loader.dispose();

				bunnyGeometry.computeVertexNormals();
				bunnyGeometry.center();
				bunnyGeometry.computeBoundingBox();
				const bunnySize = bunnyGeometry.boundingBox.getSize( new THREE.Vector3() );
				// The bunny's longest dimension is 4.5 times the grid sphere diameter.
				const bunnyScale = 4.5 * 2 * params.gridSize / Math.max( bunnySize.x, bunnySize.y, bunnySize.z );
				bunnyGeometry.scale( bunnyScale, bunnyScale, bunnyScale );
				const dynamicGeometries = {
					Bunny: bunnyGeometry,
					Sphere: new THREE.SphereGeometry( 4.5 * params.gridSize, 32, 24 )
				};
				dynamicObject = new THREE.Mesh( dynamicGeometries[ params.dynamicObject ], dynamicMaterial );
				dynamicObject.castShadow = true;
				dynamicObject.receiveShadow = true;
				dynamicObject.visible = params.dynamicObject !== 'None';
				updateDynamicObject( 0 );

				probesHelper = new ReflectionProbesHelper( probes );
				probesHelper.material.roughness = 0.08;
				probesHelper.visible = params.showProbes;
				scene.add( probesHelper, grid, dynamicObject );
				updateGrid();

				// Every physical material picks up the probes, like scene.environment.

				capture();

				const gui = renderer.inspector.createParameters( 'Reflection Probes' );
				gui.add( params, 'resolution', [ 256, 512, 1024 ] ).name( 'Capture Resolution' );
				gui.add( params, 'capture' ).name( 'Capture' );
				gui.add( params, 'bounces', 0, 10, 1 ).name( 'Additional Bounces' ).onChange( capture ).debounce( 250 );
				gui.add( params, 'boxProjection' ).name( 'Box Projection' ).onChange( ( value ) => probes.boxProjection = value );

				const dynamicTest = gui.addFolder( 'Dynamic Test' );
				dynamicTest.add( params, 'dynamicObject', [ 'None', 'Bunny', 'Sphere' ] ).name( 'Object' ).onChange( ( value ) => {

					if ( value !== 'None' ) dynamicObject.geometry = dynamicGeometries[ value ];
					dynamicObject.visible = value !== 'None';

				} );
				dynamicTest.add( params, 'pause' ).name( 'Pause' );
				dynamicTest.add( dynamicMaterial, 'roughness', 0, 1, 0.01 ).name( 'Roughness' );

				const staticTest = gui.addFolder( 'Static Test' );
				staticTest.add( params, 'showGrid' ).name( 'Grid' ).onChange( ( value ) => grid.visible = value );
				staticTest.add( params, 'gridResolution', 2, 12, 1 ).name( 'Grid resolution' ).onChange( updateGrid );
				staticTest.add( gridMaterial, 'roughness', 0, 1, 0.01 ).name( 'Grid roughness' );

				const internalStructure = gui.addFolder( 'Internal Structure' );
				internalStructure.add( params, 'showProbes' ).name( 'Influence boxes and probes' ).onChange( ( value ) => probesHelper.visible = value );
				internalStructure.add( probesHelper.material, 'roughness', 0, 1, 0.01 ).name( 'Probe roughness' );

				window.addEventListener( 'resize', () => {

					camera.aspect = window.innerWidth / window.innerHeight;
					camera.updateProjectionMatrix();
					renderer.setSize( window.innerWidth, window.innerHeight );

				} );
				renderer.setAnimationLoop( animate );

			}

			function animate() {

				timer.update();

				if ( ! params.pause && params.dynamicObject !== 'None' ) {

					animationTime += timer.getDelta();
					updateDynamicObject( animationTime );

				}

				renderer.render( scene, camera );

			}

			function updateDynamicObject( time ) {

				// A figure eight around both room centers, crossing x=0 at the doorway.
				// Stay above the table objects and inside the rows of columns at z=+/-2.5.
				const phase = time * 0.35;
				dynamicObject.position.set( 5.6 * Math.sin( phase ), 2.5, 1.4 * Math.sin( 2 * phase ) );
				dynamicObject.rotation.y = Math.atan2( 5.6 * Math.cos( phase ), 2.8 * Math.cos( 2 * phase ) );

			}

			function updateGrid() {

				for ( const mesh of [ ...grid.children ] ) {

					grid.remove( mesh );
					mesh.geometry.dispose();
					mesh.dispose();

				}

				const resolution = params.gridResolution;
				const matrix = new THREE.Matrix4();
				for ( const centerX of [ - 3.9, 3.9 ] ) {

					const mesh = new THREE.InstancedMesh( new THREE.SphereGeometry( params.gridSize, 16, 12 ), gridMaterial, resolution ** 3 );
					let index = 0;
					for ( let z = 0; z < resolution; z ++ ) {

						for ( let y = 0; y < resolution; y ++ ) {

							for ( let x = 0; x < resolution; x ++ ) {

								matrix.makeTranslation( centerX - 3.9 + x * 7.8 / ( resolution - 1 ), 0.1 + y * 4.7 / ( resolution - 1 ), - 3.8 + z * 7.6 / ( resolution - 1 ) );
								mesh.setMatrixAt( index ++, matrix );

							}

						}

					}

					mesh.instanceMatrix.needsUpdate = true;
					grid.add( mesh );

				}

				grid.visible = params.showGrid;

			}

			function capture() {

				// Keep helpers and test objects out of the reflections.

				probesHelper.visible = grid.visible = dynamicObject.visible = false;

				// Bake diffuse lighting before recording it in the reflections.

				const environmentNode = scene.environmentNode;
				scene.environmentNode = null;

				try {

					lightProbes.bake( renderer, scene, { cubemapSize: 32, near: 0.05, far: 30, bounces: params.bounces } );

				} finally {

					scene.environmentNode = environmentNode;

				}

				const diffuse = indirectDiffuse( [ lightProbeGridDiffuse( lightProbes ) ] );
				renderer.contextNode = indirectLightingContext( diffuse );
				probes.bake( renderer, scene, { resolution: Number( params.resolution ), near: 0.05, far: 30, bounces: params.bounces } );
				renderer.contextNode = indirectLightingContext( diffuse, indirectSpecular( [ reflectionProbesSpecular( probes ), environmentSpecular( reflectionProbesEnvironment( probes ) ) ] ) );
				probesHelper.visible = params.showProbes;
				grid.visible = params.showGrid;
				dynamicObject.visible = params.dynamicObject !== 'None';

			}

		</script>
	</body>
</html>
