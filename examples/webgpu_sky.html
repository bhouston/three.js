<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - physical sun and sky</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta property="og:title" content="three.js webgpu - physical sun and sky">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_sky.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_sky.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
		<style>
			#readout { position: absolute; bottom: 20px; left: 20px; padding: 12px 16px; background: #14202acc; color: #fff; font: 12px/1.7 monospace; pointer-events: none; border-radius: 4px; }
		</style>
	</head>
	<body>
		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>
			<div class="title-wrapper"><a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Physical Sun and Sky</span></div>
			Drag to orbit · right drag to pan · scroll to zoom<br>
			Single scattering atmosphere · sun in lux · sky in cd/m²
		</div>
		<div id="readout"></div>
		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>
		<script type="module">
			import * as THREE from 'three/webgpu';
			import { Fn, Loop, float, vec2, vec3, vec4, uv, texture, equirectUV, equirectDirection, positionWorldDirection, uniform, dot, smoothstep } from 'three/tsl';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { AtmosphereNode, atmosphereTransmittance } from 'three/addons/tsl/display/AtmosphereNode.js';
			import { atmosphere, luminance, sunDirection, sunLightState, exposure } from 'three/addons/math/Atmosphere.js';

			const params = {
				altitude: 32,
				azimuth: 235,
				northRotation: 0,
				aerosol: 1,
				groundAlbedo: '#738260',
				observerAltitude: 0.002,
				autoExposure: false,
				ev100: 13.6,
				compensation: 0,
				resolution: 512,
				showSunDisc: true,
				autoRotate: true,
				rebake: changed
			};
			const scene = new THREE.Scene();
			const camera = new THREE.PerspectiveCamera( 45, innerWidth / innerHeight, 0.1, 500 );
			camera.position.set( 18, 7, 23 );
			const renderer = new THREE.WebGPURenderer();
			renderer.setPixelRatio( Math.min( devicePixelRatio, 2 ) );
			renderer.setSize( innerWidth, innerHeight );
			renderer.shadowMap.enabled = true;
			renderer.toneMapping = THREE.ACESFilmicToneMapping;
			renderer.inspector = new Inspector();
			document.body.appendChild( renderer.domElement );
			await renderer.init();

			const controls = new OrbitControls( camera, renderer.domElement );
			controls.target.set( 0, 2, 0 );
			controls.enableDamping = true;
			controls.maxPolarAngle = Math.PI * 0.49;
			controls.minDistance = 6;
			controls.maxDistance = 90;
			controls.autoRotateSpeed = 0.35;
			const timer = new THREE.Timer();
			let exposureCorrection = 1;

			const sun = new THREE.DirectionalLight();
			sun.castShadow = true;
			sun.shadow.mapSize.setScalar( 2048 );
			scene.add( sun, sun.target );
			const sunVector = uniform( new THREE.Vector3() );
			const sunRadiance = uniform( new THREE.Color() );
			const sunDisc = uniform( 1 );
			const lutTarget = new THREE.RenderTarget( 256, 128, { type: THREE.HalfFloatType, depthBuffer: false } );
			const skyTarget = new THREE.RenderTarget( params.resolution, params.resolution / 2, { type: THREE.HalfFloatType, depthBuffer: false } );
			skyTarget.texture.mapping = THREE.EquirectangularReflectionMapping;
			skyTarget.texture.wrapS = THREE.RepeatWrapping;
			const meterTarget = new THREE.RenderTarget( 1, 1, { type: THREE.HalfFloatType, depthBuffer: false } );
			const atmosphereNode = new AtmosphereNode( lutTarget.texture, equirectDirection( uv().flipY() ) );
			const lutMaterial = new THREE.NodeMaterial();
			lutMaterial.fragmentNode = Fn( () => {

				const coord = uv().flipY();
				const u = coord.x.mul( 2 ).sub( 1 );
				const cosine = u.sign().mul( u.mul( u ) );
				const radius = coord.y.mul( coord.y ).mul( atmosphere.atmosphereRadius - atmosphere.planetRadius ).add( atmosphere.planetRadius );
				return vec4( atmosphereTransmittance( radius, cosine, atmosphereNode.aerosol ), 1 );

			} )();
			const skyMaterial = new THREE.NodeMaterial();
			skyMaterial.fragmentNode = vec4( atmosphereNode, 1 );
			const groundRadiance = uniform( new THREE.Color() );
			const groundMaterial = new THREE.NodeMaterial( { transparent: true, depthTest: false, depthWrite: false } );
			groundMaterial.fragmentNode = vec4( groundRadiance, float( uv().y.greaterThan( 0.5 ) ) );
			const meterMaterial = new THREE.NodeMaterial();
			meterMaterial.fragmentNode = Fn( () => {

				const irradiance = vec3( 0 ).toVar();
				Loop( 16, ( { i } ) => {

					const altitude = float( i ).add( 0.5 ).mul( Math.PI / 32 );
					Loop( 32, ( { i: j } ) => {

						const coord = vec2( float( j ).add( 0.5 ).div( 32 ), altitude.div( Math.PI ).add( 0.5 ) );
						irradiance.addAssign( texture( skyTarget.texture, coord ).level( 0 ).rgb.mul( altitude.sin() ).mul( altitude.cos() ).mul( Math.PI * Math.PI / 512 ) );

					} );

				} );
				return vec4( irradiance, 1 );

			} )();
			const quad = new THREE.QuadMesh();
			const disc = smoothstep( Math.cos( THREE.MathUtils.degToRad( atmosphere.sunRadius + 0.02 ) ), Math.cos( THREE.MathUtils.degToRad( atmosphere.sunRadius ) ), dot( positionWorldDirection, sunVector ) );
			// The solar disc is excluded from the environment bake.
			scene.backgroundNode = texture( skyTarget.texture, equirectUV() ).rgb.add( sunRadiance.mul( disc ).mul( positionWorldDirection.y.greaterThan( 0 ) ).mul( sunDisc ) );
			const pmrem = new THREE.PMREMGenerator( renderer );
			let environment, dirty = true, baking = false, lastBake = - Infinity, bakeCount = 0;
			let lutAerosol, skyIlluminance = 0, storageScale = 1;
			let directHorizontal = 0, directNormal = 0;

			function mesh( geometry, color, x, y, z, roughness = 0.8, metalness = 0 ) {

				const object = new THREE.Mesh( geometry, new THREE.MeshStandardMaterial( { color, roughness, metalness } ) );
				object.position.set( x, y, z );
				object.castShadow = object.receiveShadow = true;
				scene.add( object );
				return object;

			}

			const ground = mesh( new THREE.BoxGeometry( 10000, 0.2, 10000 ), params.groundAlbedo, 0, - 0.1, 0 );
			mesh( new THREE.BoxGeometry( 8, 0.2, 7 ), 0xb6b0a3, 0, 0.1, 0 );
			mesh( new THREE.BoxGeometry( 6, 3.6, 4.8 ), 0xe6dcc5, 0, 2, 0 );
			// A triangular gable roof, extruded along the house's depth.
			const roofShape = new THREE.Shape();
			roofShape.moveTo( - 3.5, 0 );
			roofShape.lineTo( 0, 2.2 );
			roofShape.lineTo( 3.5, 0 );
			roofShape.closePath();
			mesh( new THREE.ExtrudeGeometry( roofShape, { depth: 5.6, bevelEnabled: false } ), 0x9c4b36, 0, 3.8, - 2.8 );
			mesh( new THREE.BoxGeometry( 0.7, 2.3, 0.7 ), 0x907460, 1.7, 5, - 1 );
			mesh( new THREE.BoxGeometry( 1.1, 2.3, 0.15 ), 0x584434, 0, 1.35, 2.45 );
			mesh( new THREE.SphereGeometry( 0.06 ), 0xd4af58, 0.36, 1.3, 2.56, 0.2, 0.8 );
			for ( const x of [ - 1.9, 1.9 ] ) {

				mesh( new THREE.BoxGeometry( 1.3, 1.5, 0.16 ), 0xf7efe0, x, 2.3, 2.45 );
				mesh( new THREE.BoxGeometry( 1.05, 1.25, 0.18 ), 0x42687c, x, 2.3, 2.48, 0.15, 0.35 );
				mesh( new THREE.BoxGeometry( 0.06, 1.3, 0.2 ), 0xf7efe0, x, 2.3, 2.5 );
				mesh( new THREE.BoxGeometry( 1.1, 0.06, 0.2 ), 0xf7efe0, x, 2.3, 2.5 );

			}

			mesh( new THREE.BoxGeometry( 1.5, 0.08, 9 ), 0xb5aa95, 0, 0.04, 7 );
			for ( const [ x, z, size ] of [[ - 7, - 3, 1.2 ], [ 7, - 5, 1.5 ], [ - 9, 5, 0.9 ], [ 10, 3, 1.1 ], [ 3, - 10, 1 ]] ) {

				mesh( new THREE.CylinderGeometry( 0.23 * size, 0.3 * size, 2 * size, 8 ), 0x67503a, x, size, z );
				mesh( new THREE.ConeGeometry( 1.6 * size, 4 * size, 12 ), 0x325c3b, x, 3.3 * size, z );
				mesh( new THREE.ConeGeometry( 1.25 * size, 3 * size, 12 ), 0x3e7043, x, 4.6 * size, z );

			}

			mesh( new THREE.SphereGeometry( 0.8, 48, 24 ), 0xffffff, - 4.5, 0.8, 5, 1 );
			mesh( new THREE.SphereGeometry( 0.8, 48, 24 ), 0xffffff, 4.5, 0.8, 5, 0.04, 1 );
			mesh( new THREE.SphereGeometry( 0.8, 48, 24 ), 0xc4a078, 6.5, 0.8, 5, 0.45, 1 );

			function fitShadow() {

				// Fit the bounded diorama in light space.
				sun.updateMatrixWorld();
				sun.target.updateMatrixWorld();
				sun.shadow.updateMatrices( sun );
				const bounds = new THREE.Box3();
				for ( const x of [ - 70, 70 ] ) for ( const y of [ 0, 9 ] ) for ( const z of [ - 70, 70 ] ) {

					bounds.expandByPoint( new THREE.Vector3( x, y, z ).applyMatrix4( sun.shadow.camera.matrixWorldInverse ) );

				}

				const camera = sun.shadow.camera;
				camera.left = bounds.min.x - 1;
				camera.right = bounds.max.x + 1;
				camera.bottom = bounds.min.y - 1;
				camera.top = bounds.max.y + 1;
				camera.near = Math.max( 0.1, - bounds.max.z - 10 );
				camera.far = - bounds.min.z + 10;
				camera.updateProjectionMatrix();
				sun.shadow.normalBias = 1.5 * Math.max( camera.right - camera.left, camera.top - camera.bottom ) / 2048;
				sun.shadow.bias = - 0.00005;

			}

			function updateExposure() {

				const meter = exposure( directHorizontal + skyIlluminance, params.autoExposure ? null : params.ev100 );
				exposureCorrection = meter.scale / storageScale;
				renderer.toneMappingExposure = exposureCorrection * 2 ** params.compensation;
				return meter.ev;

			}

			function renderPass( material, target ) {

				quad.material = material;
				renderer.setRenderTarget( target );
				quad.render( renderer );
				renderer.setRenderTarget( null );

			}

			async function bakeSky() {

				baking = true;
				dirty = false;
				const settings = { ...params };
				const model = { ...atmosphere, aerosol: settings.aerosol, observerAltitude: settings.observerAltitude };
				const direction = sunDirection( settings.altitude, settings.azimuth, settings.northRotation );
				const light = sunLightState( settings.altitude, model );
				const solidAngle = 2 * Math.PI * ( 1 - Math.cos( THREE.MathUtils.degToRad( model.sunRadius ) ) );
				const discRadiance = light.transmission.map( value => light.visibility > 0 ? value * model.sunIlluminance / solidAngle : 0 );
				storageScale = Math.min( 1, 60000 / Math.max( model.sunIlluminance, ...discRadiance ) );
				atmosphereNode.sunDirection.value.fromArray( direction );
				atmosphereNode.aerosol.value = settings.aerosol;
				atmosphereNode.observerAltitude.value = settings.observerAltitude;
				atmosphereNode.preExposure.value = storageScale;
				const start = performance.now();
				if ( lutAerosol !== settings.aerosol ) {

					renderPass( lutMaterial, lutTarget );
					lutAerosol = settings.aerosol;

				}

				if ( skyTarget.width !== settings.resolution ) {

					skyTarget.setSize( settings.resolution, settings.resolution / 2 );
					if ( environment ) environment.dispose();
					environment = undefined;

				}

				renderPass( skyMaterial, skyTarget );
				renderPass( meterMaterial, meterTarget );
				const meterPixels = await renderer.readRenderTargetPixelsAsync( meterTarget, 0, 0, 1, 1 );
				const skyRGB = Array.from( meterPixels ).slice( 0, 3 ).map( value => THREE.DataUtils.fromHalfFloat( value ) / storageScale );
				skyIlluminance = luminance( skyRGB );
				directNormal = light.illuminance;
				directHorizontal = directNormal * Math.max( direction[ 1 ], 0 );
				const albedo = new THREE.Color( settings.groundAlbedo );
				ground.material.color.copy( albedo );
				groundRadiance.value.setRGB( ...skyRGB.map( ( value, c ) => albedo.toArray()[ c ] * ( value + light.color[ c ] * directHorizontal ) * storageScale / Math.PI ) );
				const autoClear = renderer.autoClear;
				renderer.autoClear = false;
				renderPass( groundMaterial, skyTarget );
				renderer.autoClear = autoClear;
				environment = pmrem.fromEquirectangular( skyTarget.texture, environment );
				scene.environment = environment.texture;
				sunVector.value.fromArray( direction );
				sun.position.fromArray( direction ).multiplyScalar( 200 );
				sun.color.setRGB( ...light.color );
				sun.intensity = directNormal * storageScale;
				sun.visible = sun.castShadow = light.visibility > 0;
				fitShadow();
				sunRadiance.value.setRGB( ...discRadiance.map( value => value * storageScale ) );
				sunDisc.value = params.showSunDisc ? 1 : 0;
				const ev = updateExposure();
				bakeCount ++;
				const band = settings.altitude > 0 ? 'Daylight' : settings.altitude > - 6 ? 'Civil twilight' : settings.altitude > - 12 ? 'Nautical twilight' : settings.altitude > - 18 ? 'Astronomical twilight' : 'Night';
				document.getElementById( 'readout' ).innerHTML = `${band}<br>Direct normal: ${directNormal.toFixed( 1 )} lux<br>Direct horizontal: ${directHorizontal.toFixed( 1 )} lux<br>Sky horizontal: ${skyIlluminance.toFixed( 3 )} lux<br>EV100: ${ev.toFixed( 2 )}<br>Sky: ${skyTarget.width} × ${skyTarget.height} · PMREM face: ${environment.width}<br>Bake wall time (includes meter readback): ${( performance.now() - start ).toFixed( 0 )} ms<br>Bakes: ${bakeCount}`;
				baking = false;
				lastBake = performance.now();

			}

			const gui = renderer.inspector.createParameters( 'Physical sun and sky' );
			function changed() {

				dirty = true;

			}

			const sunFolder = gui.addFolder( 'Sun (apparent altitude)' );
			sunFolder.add( params, 'altitude', - 20, 90, 0.05 ).name( 'altitude °' ).onChange( changed );
			sunFolder.add( params, 'azimuth', 0, 360, 0.1 ).name( 'azimuth ° (N → E)' ).onChange( changed );
			sunFolder.add( params, 'northRotation', - 180, 180, 1 ).name( 'north rotation °' ).onChange( changed );
			const airFolder = gui.addFolder( 'Atmosphere' );
			airFolder.add( params, 'aerosol', 0.5, 5, 0.1 ).onChange( changed );
			airFolder.addColor( params, 'groundAlbedo' ).onChange( changed );
			airFolder.add( params, 'observerAltitude', 0.002, 2, 0.001 ).name( 'observer height km' ).onChange( changed );
			const exposureFolder = gui.addFolder( 'Exposure' );
			exposureFolder.add( params, 'autoExposure' ).onChange( updateExposure );
			exposureFolder.add( params, 'ev100', - 3, 17, 0.1 ).name( 'manual EV100' ).onChange( updateExposure );
			exposureFolder.add( params, 'compensation', - 3, 3, 0.1 ).name( 'compensation EV' ).onChange( value => {

				renderer.toneMappingExposure = exposureCorrection * 2 ** value;

			} );
			gui.add( params, 'showSunDisc' ).onChange( value => {

				sunDisc.value = value ? 1 : 0;

			} );
			gui.add( params, 'autoRotate' );
			gui.add( params, 'resolution', [ 128, 256, 512, 1024 ] ).name( 'sky width (px)' ).onChange( changed );
			gui.add( params, 'rebake' );

			window.addEventListener( 'resize', () => {

				camera.aspect = innerWidth / innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( innerWidth, innerHeight );

			} );
			renderer.setAnimationLoop( animate );

			function animate() {

				timer.update();
				controls.autoRotate = params.autoRotate;
				controls.update( timer.getDelta() );
				if ( dirty && ! baking && performance.now() - lastBake > 100 ) bakeSky();
				if ( ! baking ) renderer.render( scene, camera );

			}
		</script>
	</body>
</html>
