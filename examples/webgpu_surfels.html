<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - surfel global illumination</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - surfel global illumination">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_surfels.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_surfels.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Surfel Global Illumination</span>
			</div>

			<small>Real-time multi-bounce diffuse GI from surfels with precomputed transfer by <a href="https://ben3d.ca" target="_blank" rel="noopener">Ben Houston</a>.<br/><span id="status"></span><br/><span id="report"></span><br/><span id="selection"></span></small>
		</div>

		<progress id="progress" max="1" style="position: fixed; left: 50%; top: 50%; width: 240px; margin-left: -120px; z-index: 1;"></progress>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/",
					"three-mesh-bvh/webgpu": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.18/src/webgpu/index.js"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { Fn, If, Loop, Return, builtinIndirectContext, cross, dFdx, dFdy, dot, float, instanceIndex, materialColor, materialEmissive, mrt, normalWorldGeometry, mix, positionWorld, select, storage, texture, textureStore, uint, uniform, uniformArray, unpackOctahedralToNormal, uv, uvec2, vec2, vec3, vec4, vertexColor } from 'three/tsl';
			import { BVHComputeData, rayIntersectionResultStruct, rayStruct, wgslTagFn } from 'three-mesh-bvh/webgpu';


			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { SkyMesh } from 'three/addons/objects/SkyMesh.js';
			import { denoise } from 'three/addons/tsl/display/DenoiseNode.js';
			import { unwrapUVs } from 'three/addons/utils/unwrapUVs.js';

			import WebGPU from 'three/addons/capabilities/WebGPU.js';

			if ( WebGPU.isAvailable() === false ) {

				document.body.appendChild( WebGPU.getErrorMessage() );

				throw new Error( 'No WebGPU support' );

			}

			const SPONZA_URL = 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Sponza/glTF/Sponza.gltf';

			let camera, scene, renderer, controls, status, selection;
			let sky, sun, cubeCamera, world, rendererState;
			let environmentSHPending = 0;

			// a scene is hidden behind the progress bar until it is loaded and baked and its bounces have settled

			let loading = true;

			// after a change of the sun or of the transport, the bounces settle faster for some frames

			let hurry = 0;

			const progress = document.getElementById( 'progress' );

			const lightPosition = new THREE.Vector3();

			const atlasCamera = new THREE.OrthographicCamera();
			const raycaster = new THREE.Raycaster();
			const pointer = new THREE.Vector2(), pointerDown = new THREE.Vector2();
			const linkMaterial = new THREE.LineBasicNodeMaterial( { vertexColors: true } );
			const surfelMaterial = new THREE.MeshBasicNodeMaterial();

			// the sizes of the atlas of the light map

			const ATLAS_SIZES = [ 1024, 2048, 4096 ];

			// the transfer bake: rays per surfel (a power of two) and surfels traced per dispatch. A ray ends as a
			// miss, on a back face, on a texel without a surfel, or on surfel j as j + 3.
			// A link is the surfel that rays hit or, past the surfels, a cluster of them, with the number of rays in
			// the bits above

			const RAYS = 1024;
			const BATCH = 2048;
			const LINK_RAYS = 0x200000;
			const MISS = 0, BACKFACE = 1, UNKNOWN = 2;

			// the lights of the surfels, two vec4 each: the position or the direction to the light with 1 for point
			// lights in w, and the color times the intensity. And the SH of the radiance of the sky

			const MAX_LIGHTS = 4;

			const lightData = uniformArray( Array.from( { length: MAX_LIGHTS * 2 }, () => new THREE.Vector4() ) );
			const environmentSH = uniformArray( Array.from( { length: 9 }, () => new THREE.Vector3() ) );

			// the terms of the transport that are on: direct, sky, bounce and emissive

			const terms = uniform( new THREE.Vector4( 1, 1, 1, 1 ) );

			// the light map of the current scene with the indirect irradiance of the surfels. It is the indirect
			// diffuse light of the meshes that have light map UVs, in place of the diffuse light of the environment,
			// whose specular light stays

			const giAmount = uniform( 1 );
			const lightMapNode = texture( new THREE.Texture(), uv( 1 ) );
			const skyMapNode = texture( new THREE.Texture(), uv( 1 ) );

			// The reflections of the meshes with a light map. The environment is not occluded: on its own it lights
			// the inside of a building like the open sky does. So it keeps the share of the sky that the surfels
			// see, which the light map holds in its alpha, and the rest reflects the light of the surfels

			const reflections = Fn( () => {

				const blocked = skyMapNode.r.oneMinus().mul( giAmount ).toVar();

				return vec4( lightMapNode.rgb.div( Math.PI ).mul( blocked ), blocked );

			} );

			// SH basis of L2 in the order of THREE.SphericalHarmonics3

			const shBasis = ( x, y, z ) => [ 0.282095, 0.488603 * y, 0.488603 * z, 0.488603 * x, 1.092548 * x * y, 1.092548 * y * z, 0.315392 * ( 3 * z * z - 1 ), 1.092548 * x * z, 0.546274 * ( x * x - y * y ) ];

			// The normals of the surfels are octahedral coordinates, two floats each, like packNormalToOctahedral()

			function encodeNormals( normals ) {

				const encoded = new Float32Array( normals.length / 3 * 2 );

				for ( let i = 0; i < encoded.length / 2; i ++ ) {

					const x = normals[ i * 3 ], y = normals[ i * 3 + 1 ], z = normals[ i * 3 + 2 ];
					const sum = Math.abs( x ) + Math.abs( y ) + Math.abs( z );

					let u = x / sum, v = y / sum;

					// the lower hemisphere folds over the corners, zero counts as positive

					if ( z < 0 ) [ u, v ] = [ ( 1 - Math.abs( v ) ) * ( u >= 0 ? 1 : - 1 ), ( 1 - Math.abs( u ) ) * ( v >= 0 ? 1 : - 1 ) ];

					encoded[ i * 2 ] = u;
					encoded[ i * 2 + 1 ] = v;

				}

				return encoded;

			}

			function decodeNormals( encoded ) {

				const normals = new Float32Array( encoded.length / 2 * 3 );

				for ( let i = 0; i < encoded.length / 2; i ++ ) {

					let x = encoded[ i * 2 ], y = encoded[ i * 2 + 1 ];

					const z = 1 - Math.abs( x ) - Math.abs( y ), t = Math.max( - z, 0 );

					x += x >= 0 ? - t : t;
					y += y >= 0 ? - t : t;

					const length = Math.hypot( x, y, z );

					normals.set( [ x / length, y / length, z / length ], i * 3 );

				}

				return normals;

			}

			const params = {
				scene: 'Cornell Box',
				view: 'Beauty',
				placement: 'Atlas Grid',
				thinWalls: true,
				denoise: true,
				denoiseStrength: 1,
				blur: true,
				blurRadius: 2,
				blurStrength: 0.3,
				detailSize: 0.25,
				surfelTexels: 4,
				links: 128,
				budgetMethod: 'Stratified Random',
				adaptive: false,
				azimuth: 40,
				altitude: 12,
				exposure: 0.5,
				direct: true,
				sky: true,
				bounce: true,
				emissive: true,
				iterations: 1,
				hysteresis: 0.15,
				spread: 4,
				surfelScale: 0.6
			};

			const views = [ 'Beauty', 'Beauty (no GI)', 'Light Map', 'Surfels: Radiosity', 'Surfels: Irradiance', 'Surfels: Direct Light', 'Surfels: Sky Light', 'Surfels: Bounce Light', 'Surfels: Albedo', 'Surfels: Emissive', 'Surfels: Normal', 'Surfels: Sky Visibility', 'Atlas: Position', 'Atlas: Normal', 'Atlas: Albedo', 'Atlas: Emissive' ];

			const scenes = { 'Cornell Box': createCornellBox, 'Two Rooms': createTwoRooms, 'Hallway': loadHallway, 'Sponza': loadSponza };
			const placements = { 'Atlas Grid': placeSurfels, 'Sample Elimination': eliminateSurfels };
			const worlds = {};

			const sunDirection = new THREE.Vector3();
			const environmentSunDirection = new THREE.Vector3();

			const sunColor = new THREE.Color( 0xfff2dc );
			const horizonColor = new THREE.Color( 0xff8a3c );

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 500 );

				scene = new THREE.Scene();

				// Renderer

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				renderer.toneMapping = THREE.NeutralToneMapping;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				renderer.contextNode = builtinIndirectContext( {
					diffuse: [ ( query, builder ) => builder.object.userData.giStatic === true ? vec4( lightMapNode.rgb.mul( giAmount ), giAmount ) : null ],
					specular: [ ( query, builder ) => builder.object.userData.giStatic === true ? reflections() : null ]
				} );

				controls = new OrbitControls( camera, renderer.domElement );

				status = document.getElementById( 'status' );
				selection = document.getElementById( 'selection' );

				renderer.domElement.addEventListener( 'pointerdown', ( event ) => pointerDown.set( event.clientX, event.clientY ) );
				renderer.domElement.addEventListener( 'pointerup', onPointerUp );

				// Sky, sun and the environment captured from the sky. The sky is on layer 1 as well, which is all
				// that the cube camera sees

				sky = new SkyMesh();
				sky.scale.setScalar( 450 );
				sky.rayleigh.value = 2;
				sky.mieCoefficient.value = 0.025;
				sky.cloudSpeed.value = 0;
				sky.showSunDisc.value = false; // the sun is represented by the light
				sky.layers.enable( 1 );
				scene.add( sky );

				sun = new THREE.DirectionalLight();
				sun.castShadow = true;
				sun.shadow.mapSize.setScalar( 2048 );
				scene.add( sun, sun.target );

				cubeCamera = new THREE.CubeCamera( 1, 1000, new THREE.CubeRenderTarget( 64, { type: THREE.HalfFloatType } ) );
				cubeCamera.layers.set( 1 );

				// GUI

				const gui = renderer.inspector.createParameters( 'Surfel GI' );
				gui.add( params, 'scene', Object.keys( scenes ) ).name( 'Scene' ).onChange( setScene );
				gui.add( params, 'view', views ).name( 'View' ).onChange( setView );
				gui.add( params, 'exposure', 0.05, 4, 0.01 ).name( 'Exposure' ).listen();

				// the sun of the open scenes

				const hurryUp = () => hurry = 30;

				gui.add( params, 'azimuth', 0, 360, 1 ).name( 'Sun Azimuth' ).listen().onChange( hurryUp );
				gui.add( params, 'altitude', 0, 90, 1 ).name( 'Sun Altitude' ).listen().onChange( hurryUp );

				const layoutGui = gui.addFolder( 'Surfel Layout' );
				layoutGui.add( params, 'detailSize', 0.05, 2, 0.01 ).name( 'Detail Size' ).listen().onChange( ( value ) => {

					world.detailSize = value;
					bake();

				} ).debounce( 500 );
				layoutGui.add( params, 'links', 16, 256, 16 ).name( 'Links per Surfel' ).onChange( bake ).debounce( 500 );
				layoutGui.add( params, 'budgetMethod', [ 'Stratified Random', 'Random', 'Largest', 'Cluster Tree' ] ).name( 'Budget Method' ).onChange( bake );
				layoutGui.add( params, 'placement', Object.keys( placements ) ).name( 'Placement' ).onChange( bake );
				layoutGui.add( params, 'adaptive' ).name( 'Adaptive Size (Sample Elimination)' ).onChange( bake );
				layoutGui.add( params, 'surfelScale', 0.1, 1, 0.01 ).name( 'Display Scale' ).onChange( () => updateSurfelMesh( world ) );

				const updateTerms = () => {

					terms.value.set( params.direct, params.sky, params.bounce, params.emissive );
					hurryUp();

				};

				const transportGui = gui.addFolder( 'Light Transport' );
				transportGui.add( params, 'direct' ).name( 'Direct' ).onChange( updateTerms );
				transportGui.add( params, 'sky' ).name( 'Sky' ).onChange( updateTerms );
				transportGui.add( params, 'bounce' ).name( 'Bounce' ).onChange( updateTerms );
				transportGui.add( params, 'emissive' ).name( 'Emissive' ).onChange( updateTerms );
				transportGui.add( params, 'iterations', 1, 4, 1 ).name( 'Iterations per Frame' );
				transportGui.add( params, 'hysteresis', 0.01, 1, 0.01 ).name( 'Hysteresis' );
				transportGui.add( params, 'spread', 1, 16, 1 ).name( 'Update Spread (frames)' );

				const lightMapGui = gui.addFolder( 'Lightmap Bake' );
				lightMapGui.add( params, 'surfelTexels', 1, 8, 1 ).name( 'Texels per Surfel' ).onChange( bake ).debounce( 500 );
				lightMapGui.add( params, 'thinWalls' ).name( 'Thin Wall Fix' ).onChange( bake );
				lightMapGui.add( params, 'denoise' ).name( 'Denoise' );
				lightMapGui.add( params, 'denoiseStrength', 0, 1, 0.01 ).name( 'Denoise Strength' );
				lightMapGui.add( params, 'blur' ).name( 'Blur' );
				lightMapGui.add( params, 'blurRadius', 0.5, 8, 0.5 ).name( 'Blur Radius (Surfels)' );
				lightMapGui.add( params, 'blurStrength', 0.05, 1, 0.01 ).name( 'Blur Strength' );

				window.addEventListener( 'resize', onWindowResize );

				await setScene();

				renderer.setAnimationLoop( animate );

			}

			async function setScene() {

				const name = params.scene;

				loading = true;
				progress.removeAttribute( 'value' );

				status.textContent = `Loading ${ name }…`;
				selection.textContent = '';
				document.getElementById( 'report' ).textContent = '';

				worlds[ name ] ??= await scenes[ name ]();

				// another scene was picked while this one loaded

				if ( name !== params.scene ) return;

				if ( world !== undefined ) scene.remove( world.root );

				world = worlds[ name ];
				scene.add( world.root );
				loading = false;

				// the sun of a scene starts low, in the morning

				[ params.azimuth, params.altitude ] = world.sun ?? [ 40, 12 ];
				params.exposure = world.exposure ?? 0.5;

				world.root.traverse( ( object ) => {

					// all meshes of the scenes are static, flagged before their materials compile

					if ( object.isMesh ) object.castShadow = object.receiveShadow = object.userData.giStatic = true;

				} );

				camera.position.copy( world.camera );
				controls.target.copy( world.target );
				controls.update();

				// closed scenes have no sky and no sun, only their own lights

				if ( ! world.sky ) environmentSH.array.forEach( ( vector ) => vector.set( 0, 0, 0 ) );

				sun.visible = world.sky;
				scene.background = world.sky ? null : new THREE.Color( 0x111111 );
				scene.environment = world.sky ? cubeCamera.renderTarget.texture : null;
				environmentSunDirection.set( 0, 0, 0 );

				// the shadow of the sun covers the bounds of the scene

				world.bounds ??= new THREE.Box3().setFromObject( world.root ).getBoundingSphere( new THREE.Sphere() );

				const radius = world.bounds.radius;
				const shadowCamera = sun.shadow.camera;

				shadowCamera.left = shadowCamera.bottom = - radius;
				shadowCamera.right = shadowCamera.top = radius;
				shadowCamera.near = radius * 0.1;
				shadowCamera.far = radius * 4;
				shadowCamera.updateProjectionMatrix();

				sun.shadow.normalBias = radius * 0.004;
				sun.target.position.copy( world.bounds.center );

				params.detailSize = world.detailSize;

				document.getElementById( 'report' ).textContent = world.report ?? '';

				if ( world.atlas === undefined ) bake();

				setView();

			}

			// Bake: light map UVs for all meshes of the scene, then their surfaces rasterized into the atlas

			async function bake() {

				const baked = world;
				const id = baked.bakeId = ( baked.bakeId ?? 0 ) + 1;

				baked.transfer?.dispose();
				baked.lighting?.dispose();
				baked.transfer = baked.lighting = undefined;
				baked.ready = false;
				baked.progress = 0;
				selectSurfel( baked, - 1 );
				const meshes = [];
				world.root.traverse( ( object ) => object.isMesh && object !== world.surfelMesh && meshes.push( object ) );

				// each mesh gets a new geometry with light map UVs in uv1, in the smallest atlas that fits the
				// scene at the texel size of the detail size. If none does, the largest atlas is fitted and the
				// texels are larger
				// ponytail: unwraps again per atlas size, estimate the size from the surface area if that is slow

				const start = performance.now();
				const geometries = new Set( meshes.map( ( mesh ) => mesh.geometry ) );
				const texelsPerUnit = params.surfelTexels / world.detailSize;

				let layout = null;

				for ( const resolution of ATLAS_SIZES ) {

					layout = unwrapUVs( world.root, { resolution, padding: 3, texelsPerUnit } ) ?? layout;

					if ( layout !== null && layout.texelsPerUnit >= texelsPerUnit * 0.99 ) break;

				}

				for ( const geometry of geometries ) geometry.dispose();

				baked.atlas?.target.dispose();
				for ( const material of Object.values( baked.atlas?.views ?? {} ) ) material.dispose();
				baked.atlas = { layout, meshes, target: renderAtlas( meshes, layout.resolution ), views: {} };

				const texelSize = 1 / layout.texelsPerUnit;

				// surfels from the atlas, read back to the CPU

				const size = layout.resolution;
				const [ position, normal, albedo, emissive ] = await Promise.all( baked.atlas.target.textures.map( ( map, i ) => renderer.readRenderTargetPixelsAsync( baked.atlas.target, 0, 0, size, size, i ) ) );

				const times = { 'atlas': performance.now() - start };

				baked.surfels = placements[ params.placement ]( { position, normal, albedo, emissive, size, texelSize }, baked.detailSize );

				times[ 'surfels' ] = performance.now() - start;
				baked.progress = 0.1;

				// baked again meanwhile

				if ( baked.bakeId !== id ) return;

				createSurfelMesh( baked );

				const report = ( text ) => {

					if ( baked === world ) status.textContent = `${ ( baked.bounds.radius * 2 ).toFixed( 0 ) } m scene, ${ meshes.length } meshes, ${ layout.charts.length } charts, ${ size }² atlas, ${ texelSize.toFixed( 3 ) } m texels, ${ baked.surfels.count } surfels, ${ text }`;

				};

				report( 'tracing…' );

				if ( baked === world ) setView();

				// transfer between the surfels and from the sky

				const transfer = await bakeTransfer( baked, ( done ) => {

					baked.progress = 0.1 + done * 0.5;
					report( `tracing ${ Math.round( done * 100 ) }%` );

				}, () => baked.bakeId !== id );

				if ( transfer === null ) return;

				times[ 'transfer' ] = performance.now() - start;

				// the transfer dropped the buried surfels

				createSurfelMesh( baked );

				const lightMapLinks = await bakeLightMapLinks( { position, normal, size }, baked.surfels, transfer, baked.detailSize, () => baked.bakeId !== id );

				if ( lightMapLinks === null ) return transfer.dispose();

				baked.transfer = transfer;
				baked.lighting = createLighting( baked, lightMapLinks );

				times[ 'light map' ] = performance.now() - start;
				baked.progress = 0.75;

				const transferSummary = `${ ( transfer.links.length / baked.surfels.count ).toFixed( 1 ) } links per surfel, ${ transfer.buried } buried surfels dropped, ${ ( transfer.unknown * 100 ).toFixed( 1 ) }% of hits without a surfel`;

				report( transferSummary );

				if ( baked === world ) setView();

				// how long each step of the bake took, and the memory of what it left on the GPU

				const megabytes = ( ...arrays ) => ( arrays.reduce( ( sum, array ) => sum + array.byteLength, 0 ) / 2 ** 20 ).toFixed( 1 ) + ' MB';

				let previous = 0;

				baked.report = 'Bake: ' + Object.entries( times ).map( ( [ name, time ] ) => {

					const step = time - previous;

					previous = time;

					return `${ name } ${ ( step / 1000 ).toFixed( 2 ) } s`;

				} ).join( ', ' ) + `. Memory: atlas ${ ( size * size * 32 / 2 ** 20 ).toFixed( 0 ) } MB, surfel links ${ megabytes( transfer.links, transfer.offsets, transfer.skyTransfer ) }, light map links ${ megabytes( lightMapLinks.texels, lightMapLinks.indices, lightMapLinks.weights ) }`;

				if ( baked === world ) document.getElementById( 'report' ).textContent = baked.report;

			}

			// Transfer bake: cosine-distributed rays from each surfel, traced on the GPU through a BVH of the scene.
			// The surfel of a hit is the one of its light map texel. The hits are read back and reduced on the CPU
			// to the links with the largest share of the rays, and the misses to the SH of the visible sky

			async function bakeTransfer( world, onProgress, cancelled ) {

				const { surfels, atlas, detailSize } = world;
				const { count, texelMap } = surfels;
				const rank = mortonRanks( surfels.position, count, detailSize * 4 );
				const budget = params.links;

				// only the cluster tree links to clusters

				const clusters = surfels.clusters = params.budgetMethod === 'Cluster Tree' ? clusterSurfels( surfels, detailSize * 4, world.bounds.center.clone().subScalar( world.bounds.radius ) ) : { count: 0, levels: [] };

				// The ways to bring the links of a surfel, each a surfel with its rays, down to the budget. The links are
				// scaled below so that they carry the light of all hits

				const reduce = {

					// At random, which leaves noise that the filter of the light map removes. Stratified, so that there
					// is less of it: one ray is kept per stride of rays along the links in the order of a Morton curve,
					// from a random start. A large link keeps its share of the rays, and of the small ones of a region
					// one stands for all

					'Stratified Random': ( runs ) => {

						runs.sort( ( a, b ) => rank[ a[ 0 ] ] - rank[ b[ 0 ] ] );

						const stride = runs.reduce( ( sum, link ) => sum + link[ 1 ], 0 ) / budget;

						let next = Math.random() * stride, sum = 0, kept = 0;

						for ( const [ target, rays ] of runs ) {

							let strides = 0;

							for ( sum += rays; next < sum; next += stride ) strides ++;

							if ( strides > 0 ) runs[ kept ++ ] = [ target, strides ];

						}

						runs.length = kept;

					},

					// as many of the rays as the budget, picked at random

					'Random': ( runs ) => {

						const pool = runs.flatMap( ( [ target, rays ] ) => Array( rays ).fill( target ) ), kept = new Map();

						for ( let k = 0; k < budget; k ++ ) {

							const other = k + Math.floor( Math.random() * ( pool.length - k ) );

							[ pool[ k ], pool[ other ] ] = [ pool[ other ], pool[ k ] ];
							kept.set( pool[ k ], ( kept.get( pool[ k ] ) ?? 0 ) + 1 );

						}

						runs.length = 0;
						runs.push( ...kept );

					},

					// The links with the most rays. Many links have a ray or two, so they are shuffled first: the sort
					// would keep the surfels with low indices

					'Largest': ( runs ) => {

						for ( let k = runs.length - 1; k > 0; k -- ) {

							const other = Math.floor( Math.random() * ( k + 1 ) );

							[ runs[ k ], runs[ other ] ] = [ runs[ other ], runs[ k ] ];

						}

						runs.sort( ( a, b ) => b[ 1 ] - a[ 1 ] ).length = budget;

					},

					// The links with the fewest rays merge into the cluster above them, again and again: what sends much

						data.emissive[ i * 3 + c ] = data.emissive[ front * 3 + c ] / ( front === i ? counts[ front ] : 1 );

					}

				}

				return {
					grow: GROW,
					texelMap,
					pair: new Int8Array( data.pair ),
					count: data.radius.length,
					position: new Float32Array( data.position ),
					normal: encodeNormals( data.normal ),
					radius: new Float32Array( data.radius ),
					albedo: new Float32Array( data.albedo ),
					emissive: new Float32Array( data.emissive )
				};

			}

			// The surfels as instanced disks for the debug views

			function createSurfelMesh( world ) {

				world.surfelMesh?.removeFromParent();
				world.surfelMesh?.dispose();

				const mesh = new THREE.InstancedMesh( new THREE.CircleGeometry( 1, 12 ), surfelMaterial, world.surfels.count );

				mesh.setColorAt( 0, new THREE.Color() );
				mesh.frustumCulled = false;
				mesh.visible = false;

				world.surfelMesh = mesh;
				world.root.add( mesh );

				updateSurfelMesh( world );

			}

			// Click a surfel in a surfel view to show its links, colored from blue to red by their weight, and the
			// lights that reach it, in white

			async function selectSurfel( world, i ) {

				world.links?.removeFromParent();
				world.links?.geometry.dispose();
				world.links = undefined;

				if ( i < 0 || world.transfer === undefined ) return;

				const { position } = world.surfels;
				const normal = decodeNormals( world.surfels.normal );
				const { offsets, links, skyTransfer, invalid } = world.transfer;
				const start = offsets[ i ], end = offsets[ i + 1 ];
				const points = [], colors = [], color = new THREE.Color();
				const lift = world.detailSize * 0.05;
				const from = [ position[ i * 3 ] + normal[ i * 3 ] * lift, position[ i * 3 + 1 ] + normal[ i * 3 + 1 ] * lift, position[ i * 3 + 2 ] + normal[ i * 3 + 2 ] * lift ];

				let largest = 0;

				for ( let l = start; l < end; l ++ ) largest = Math.max( largest, Math.floor( links[ l ] / LINK_RAYS ) );

				for ( let l = start; l < end; l ++ ) {

					// to the surfel, or to the center of the cluster

					const target = links[ l ] % LINK_RAYS;

					if ( target < position.length / 3 ) points.push( ...from, position[ target * 3 ] + normal[ target * 3 ] * lift, position[ target * 3 + 1 ] + normal[ target * 3 + 1 ] * lift, position[ target * 3 + 2 ] + normal[ target * 3 + 2 ] * lift );
					else points.push( ...from, ...world.surfels.clusters.center.subarray( target * 3 - position.length, target * 3 - position.length + 3 ) );

					color.setHSL( 0.66 * ( 1 - Math.floor( links[ l ] / LINK_RAYS ) / largest ), 1, 0.5 );
					colors.push( color.r, color.g, color.b, color.r, color.g, color.b );

				}

				// the lights that the last lighting pass found visible from the surfel, as bits

				const lights = updateLights();
				const reached = new Float32Array( await renderer.getArrayBufferAsync( world.lighting.attribute ) )[ i * 16 + 3 ];
				const lit = lights.filter( ( light, l ) => ( reached >> l ) & 1 );

				if ( world.transfer === undefined || world.transfer.offsets !== offsets ) return;

				for ( const light of lit ) {

					// towards the sun, or to the point light

					light.getWorldPosition( lightPosition );

					if ( light.isDirectionalLight ) lightPosition.sub( light.target.position ).setLength( world.bounds.radius ).add( new THREE.Vector3().fromArray( position, i * 3 ) );

					points.push( position[ i * 3 ] + normal[ i * 3 ] * lift, position[ i * 3 + 1 ] + normal[ i * 3 + 1 ] * lift, position[ i * 3 + 2 ] + normal[ i * 3 + 2 ] * lift, lightPosition.x, lightPosition.y, lightPosition.z );
					colors.push( 1, 1, 1, 1, 1, 1 );

				}

				world.links?.removeFromParent();
				world.links?.geometry.dispose();

				const geometry = new THREE.BufferGeometry();
				geometry.setAttribute( 'position', new THREE.Float32BufferAttribute( points, 3 ) );
				geometry.setAttribute( 'color', new THREE.Float32BufferAttribute( colors, 3 ) );

				world.links = new THREE.LineSegments( geometry, linkMaterial );
				world.links.frustumCulled = false;
				world.root.add( world.links );

				const visibility = skyTransfer[ i * 9 ] / ( Math.PI * 0.282095 );

				selection.textContent = `Surfel ${ i }: ${ end - start } links${ invalid[ i ] ? ', buried' : '' }, receives ${ ( ( 1 - visibility ) * 100 ).toFixed( 0 ) }% from surfels and ${ ( visibility * 100 ).toFixed( 0 ) }% from the sky, lit by ${ lit.length } of ${ lights.length } lights`;

			}

			function onPointerUp( event ) {

				// a click, not a drag of the camera

				if ( pointerDown.distanceTo( pointer.set( event.clientX, event.clientY ) ) > 4 || ! world?.surfelMesh?.visible ) return;

				pointer.set( event.clientX / window.innerWidth * 2 - 1, 1 - event.clientY / window.innerHeight * 2 );
				raycaster.setFromCamera( pointer, camera );

				const hit = raycaster.intersectObject( world.surfelMesh )[ 0 ];

				selection.textContent = '';
				selectSurfel( world, hit !== undefined ? hit.instanceId : - 1 );

			}

			// the disks are drawn smaller than the surfels, so that each one shows

			function updateSurfelMesh( world ) {

				const { count, position, radius } = world.surfels;
				const normal = decodeNormals( world.surfels.normal );
				const mesh = world.surfelMesh;
				const matrix = new THREE.Matrix4(), quaternion = new THREE.Quaternion();
				const p = new THREE.Vector3(), n = new THREE.Vector3(), scale = new THREE.Vector3(), z = new THREE.Vector3( 0, 0, 1 );

				for ( let i = 0; i < count; i ++ ) {

					// slightly above the surface

					n.fromArray( normal, i * 3 );
					p.fromArray( position, i * 3 ).addScaledVector( n, world.detailSize * 0.02 );

					mesh.setMatrixAt( i, matrix.compose( p, quaternion.setFromUnitVectors( z, n ), scale.setScalar( radius[ i ] * params.surfelScale ) ) );

				}

				mesh.instanceMatrix.needsUpdate = true;

			}

			// UV space raster pass: world position, geometric normal, albedo and emissive of each texel, from the
			// materials' own color and emissive, so textures are filtered to the size of the texels by the GPU

			function renderAtlas( meshes, size ) {

				// ponytail: half floats, WebGPU allows 32 bytes per texel over all attachments by default. Positions
				// round to about a thousandth of their distance to the origin, use two passes if that shows

				const target = new THREE.RenderTarget( size, size, { type: THREE.HalfFloatType, count: 4, depthBuffer: false, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter } );

				[ 'position', 'normal', 'albedo', 'emissive' ].forEach( ( name, i ) => target.textures[ i ].name = name );

				const jitter = uniform( new THREE.Vector2() );
				const coverage = uniform( 1 );
				const materials = new Map();

				function atlasMaterial( source ) {

					if ( materials.has( source ) ) return materials.get( source );

					const material = new THREE.NodeMaterial();
					material.side = THREE.DoubleSide;
					material.depthTest = false;
					material.depthWrite = false;
					material.blending = THREE.NoBlending;

					// the material nodes read these from the material that is rendered

					for ( const name of [ 'color', 'map', 'emissive', 'emissiveMap', 'emissiveIntensity' ] ) {

						if ( source[ name ] !== undefined ) material[ name ] = source[ name ];

					}

					const normal = source.side === THREE.BackSide ? normalWorldGeometry.negate() : normalWorldGeometry;
					const albedo = vec4( source.colorNode ?? materialColor ).rgb;
					const emissive = source.emissive !== undefined ? vec4( source.emissiveNode ?? materialEmissive ).rgb : vec3( 0 );

					material.vertexNode = vec4( uv( 1 ).flipY().mul( 2 ).sub( 1 ).add( jitter ), 0, 1 );

					// position.w is 1 for the texels of a surface, normal.w the side of
					// the material: 1 front, 2 double, 3 back, and albedo.a the coverage: 1 for texels whose center is
					// covered and less for the texels around them

					// a jittered pass draws a texel from a point beside its center: the position is extended to the
					// center, also past the edge of the chart, so both sides of a seam interpolate to the same light

					const center = positionWorld.add( dFdx( positionWorld ).mul( jitter.x ).add( dFdy( positionWorld ).mul( jitter.y ) ).mul( size / 2 ) );

					material.fragmentNode = mrt( {
						position: vec4( center, 1 ),
						normal: vec4( normal.normalize(), source.side === THREE.DoubleSide ? 2 : source.side === THREE.BackSide ? 3 : 1 ),
						albedo: vec4( source.vertexColors ? albedo.mul( vertexColor().rgb ) : albedo, coverage ),
						emissive: vec4( emissive, 1 )
					} );

					materials.set( source, material );

					return material;

				}

				const atlasScene = new THREE.Scene();

				for ( const mesh of meshes ) {

					// a debug view may have replaced the material of the mesh

					const source = mesh.userData.material ?? mesh.material;
					const proxy = new THREE.Mesh( mesh.geometry, Array.isArray( source ) ? source.map( atlasMaterial ) : atlasMaterial( source ) );

					proxy.matrix.copy( mesh.matrixWorld );
					proxy.matrixAutoUpdate = false;
					proxy.frustumCulled = false;
					atlasScene.add( proxy );

				}

				rendererState = THREE.RendererUtils.resetRendererState( renderer, rendererState );

				renderer.autoClear = false;
				renderer.setClearColor( 0x000000, 0 );
				renderer.setRenderTarget( target );
				renderer.clear();

				// jittered passes cover the texels that the charts only touch, the texel centers come last

				for ( let i = 16; i >= 0; i -- ) {

					jitter.value.set( halton( i, 2 ) - 0.5, halton( i, 3 ) - 0.5 ).multiplyScalar( i === 0 ? 0 : 4 / size );
					coverage.value = i === 0 ? 1 : 0.5;
					renderer.render( atlasScene, atlasCamera );

				}

				THREE.RendererUtils.restoreRendererState( renderer, rendererState );

				for ( const material of materials.values() ) material.dispose();

				return target;

			}

			function halton( index, base ) {

				let result = 0, f = 1;

				while ( index > 0 ) {

					f /= base;
					result += f * ( index % base );
					index = Math.floor( index / base );

				}

				return result;

			}

			// Debug views show an atlas unlit on the scene

			function setView() {

				const beauty = params.view.startsWith( 'Beauty' );
				const atlas = world.atlas;
				const surfelView = params.view.startsWith( 'Surfels' );
				const surfelMesh = world.surfelMesh;

				// the atlas or the surfels may still be baking

				if ( atlas === undefined || surfelMesh === undefined ) return;

				// surfels are colored per instance, over the scene in dark gray so that gaps show

				const lightingView = world.lighting?.materials[ params.view ];
				const lightMapView = params.view === 'Light Map';

				surfelMesh.visible = surfelView;
				if ( world.links ) world.links.visible = surfelView;

				if ( lightingView !== undefined ) {

					// lit by the compute pass, with white instance colors

					surfelMesh.material = lightingView;
					surfelMesh.instanceColor.array.fill( 1 );
					surfelMesh.instanceColor.needsUpdate = true;

				} else if ( surfelView ) {

					surfelMesh.material = surfelMaterial;

					const { count, albedo, emissive } = world.surfels;
					const colors = surfelMesh.instanceColor.array;
					const transfer = world.transfer;

					if ( params.view === 'Surfels: Normal' ) {

						colors.set( decodeNormals( world.surfels.normal ).map( ( v ) => v * 0.5 + 0.5 ) );

					} else if ( params.view === 'Surfels: Sky Visibility' ) {

						// the share of the cosine-weighted hemisphere that sees the sky, buried surfels in red

						for ( let i = 0; i < count; i ++ ) {

							const visibility = transfer !== undefined ? transfer.skyTransfer[ i * 9 ] / ( Math.PI * 0.282095 ) : 0;

							colors.set( transfer?.invalid[ i ] ? [ 1, 0, 0 ] : [ visibility, visibility, visibility ], i * 3 );

						}

					} else {

						colors.set( params.view === 'Surfels: Albedo' ? albedo : emissive );

					}

					surfelMesh.instanceColor.needsUpdate = true;

				}

				// one material per side of the materials that it replaces

				function viewMaterial( source ) {

					// the light map view shows the radiance of a white surface under the light map, once it is baked

					if ( lightMapView && world.lighting === undefined ) return source;

					const key = ( surfelView ? 'Surfels' : params.view ) + source.side;

					if ( atlas.views[ key ] === undefined ) {

						const [ position, normal, albedo, emissive ] = atlas.target.textures.map( ( map ) => texture( map, uv( 1 ) ).rgb );

						atlas.views[ key ] = new THREE.MeshBasicNodeMaterial( { side: source.side } );
						atlas.views[ key ].colorNode = surfelView ? vec3( 0.02 ) : lightMapView ? lightMapNode.rgb.div( Math.PI ) : {
							'Atlas: Position': position.sub( world.bounds.center ).div( world.bounds.radius * 2 ).add( 0.5 ),
							'Atlas: Normal': normal.mul( 0.5 ).add( 0.5 ),
							'Atlas: Albedo': albedo,
							'Atlas: Emissive': emissive
						}[ params.view ];

					}

					return atlas.views[ key ];

				}

				for ( const mesh of atlas.meshes ) {

					const material = mesh.userData.material ??= mesh.material;

					if ( beauty ) mesh.material = material;
					else mesh.material = Array.isArray( material ) ? material.map( viewMaterial ) : viewMaterial( material );

				}

				renderer.toneMapping = beauty || lightMapView || lightingView !== undefined ? THREE.NeutralToneMapping : THREE.NoToneMapping;

			}

			function createCornellBox() {

				// open at the front, so that the sun and the sky light it next to the emissive panel

				const root = new THREE.Group();

				const wallMaterial = new THREE.MeshStandardNodeMaterial( { color: 0xcccccc } );
				const redMaterial = new THREE.MeshStandardNodeMaterial( { color: 0xff0000 } );
				const greenMaterial = new THREE.MeshStandardNodeMaterial( { color: 0x00ff00 } );
				const objectMaterial = new THREE.MeshStandardNodeMaterial( { color: 0xeeeeee } );
				const sphereMaterial = new THREE.MeshStandardNodeMaterial( { color: 0x0044ff, roughness: 0.15 } );
				const lightMaterial = new THREE.MeshStandardNodeMaterial( { color: 0x000000, emissive: 0xffffff, emissiveIntensity: 100 } );

				function add( geometry, material, x, y, z, rx = 0, ry = 0 ) {

					const mesh = new THREE.Mesh( geometry, material );
					mesh.position.set( x, y, z );
					mesh.rotation.set( rx, ry, 0 );
					root.add( mesh );

				}

				add( new THREE.PlaneGeometry( 6, 6 ), wallMaterial, 0, 0, 0, - Math.PI / 2 ); // floor
				add( new THREE.PlaneGeometry( 6, 6 ), wallMaterial, 0, 5, 0, Math.PI / 2 ); // ceiling
				add( new THREE.PlaneGeometry( 6, 5 ), wallMaterial, 0, 2.5, - 3 ); // back wall
				add( new THREE.PlaneGeometry( 6, 5 ), redMaterial, - 3, 2.5, 0, 0, Math.PI / 2 ); // left wall
				add( new THREE.PlaneGeometry( 6, 5 ), greenMaterial, 3, 2.5, 0, 0, - Math.PI / 2 ); // right wall

				add( new THREE.BoxGeometry( 1.2, 2.5, 1.2 ), objectMaterial, - 0.8, 1.25, - 0.8, 0, Math.PI / 8 );
				add( new THREE.SphereGeometry( 0.65, 32, 32 ), sphereMaterial, 1, 0.65, 0.5 );
				add( new THREE.PlaneGeometry( 2, 2 ), lightMaterial, 0, 4.99, 0, Math.PI / 2 );

				return { root, sky: true, detailSize: 0.25, camera: new THREE.Vector3( 0, 2.5, 8.75 ), target: new THREE.Vector3( 0, 2.5, 0 ) };

			}

			function createTwoRooms() {

				// two closed rooms joined by a doorway, each with a point light, like webgpu_lightprobes_complex

				const root = new THREE.Group();

				const material = ( color, options ) => new THREE.MeshStandardNodeMaterial( { color, ...options } );

				const wallMaterial = material( 0xcccccc, { shadowSide: THREE.DoubleSide } );
				const whiteMaterial = material( 0xeeeeee );
				const tableMaterial = material( 0x886644 );

				function add( geometry, material, x, y, z ) {

					const mesh = new THREE.Mesh( geometry, material );
					mesh.position.set( x, y, z );
					root.add( mesh );
					return mesh;

				}

				// Two separate rooms of planes that face inwards, 0.3 apart: x = 0.15 to 8 on either side, y = 0 to 5,
				// z = -4 to 4. The walls between them have a doorway each, which a short tunnel of planes joins

				function wall( width, height, material, x, y, z, rx, ry ) {

					add( new THREE.PlaneGeometry( width, height ), material, x, y, z ).rotation.set( rx, ry, 0 );

				}

				const up = - Math.PI / 2, down = Math.PI / 2;

				for ( const [ side, color ] of [[ - 1, 0xdd2200 ], [ 1, 0x0044ff ]] ) {

					const x = side * 4.075, inwards = side * Math.PI / 2;

					wall( 7.85, 8, wallMaterial, x, 0, 0, up, 0 );
					wall( 7.85, 8, wallMaterial, x, 5, 0, down, 0 );
					wall( 7.85, 5, wallMaterial, x, 2.5, - 4, 0, 0 );
					wall( 7.85, 5, wallMaterial, x, 2.5, 4, 0, Math.PI );
					wall( 8, 5, material( color, { shadowSide: THREE.DoubleSide } ), side * 8, 2.5, 0, 0, - inwards );

					// the wall with the doorway: a panel on either side of it and a lintel

					wall( 2.75, 5, wallMaterial, side * 0.15, 2.5, - 2.625, 0, inwards );
					wall( 2.75, 5, wallMaterial, side * 0.15, 2.5, 2.625, 0, inwards );
					wall( 2.5, 1.2, wallMaterial, side * 0.15, 4.4, 0, 0, inwards );

				}

				// the tunnel of the doorway: floor, top and jambs

				wall( 0.3, 2.5, wallMaterial, 0, 0, 0, up, 0 );
				wall( 0.3, 2.5, wallMaterial, 0, 3.8, 0, down, 0 );
				wall( 0.3, 3.8, wallMaterial, 0, 1.9, - 1.25, 0, 0 );
				wall( 0.3, 3.8, wallMaterial, 0, 1.9, 1.25, 0, Math.PI );

				const column = new THREE.CylinderGeometry( 0.3, 0.3, 4, 16 );

				for ( const x of [ - 6, - 2, 2, 6 ] ) for ( const z of [ - 2.5, 2.5 ] ) add( column, whiteMaterial, x, 2, z );

				// left room: table with a golden sphere, stepped blocks near the red wall

				add( new THREE.BoxGeometry( 2.4, 0.12, 1.4 ), tableMaterial, - 4, 1, 0 );

				const leg = new THREE.BoxGeometry( 0.1, 1, 0.1 );

				for ( const x of [ - 5.05, - 2.95 ] ) for ( const z of [ - 0.55, 0.55 ] ) add( leg, tableMaterial, x, 0.5, z );

				add( new THREE.SphereGeometry( 0.35, 32, 32 ), material( 0xffd700, { metalness: 0.3, roughness: 0.4 } ), - 4, 1.41, 0 );

				add( new THREE.BoxGeometry( 1.5, 0.5, 1 ), whiteMaterial, - 7, 0.25, 0 );
				add( new THREE.BoxGeometry( 1, 1, 1 ), whiteMaterial, - 7, 0.5, 0 );
				add( new THREE.BoxGeometry( 0.5, 1.5, 1 ), whiteMaterial, - 7, 0.75, 0 );

				// right room: pedestal with a torus knot, cone sculpture

				add( new THREE.BoxGeometry( 0.8, 1.2, 0.8 ), whiteMaterial, 4, 0.6, 0 );
				add( new THREE.TorusKnotGeometry( 0.3, 0.1, 64, 16 ), material( 0xff44aa, { metalness: 0.2, roughness: 0.5 } ), 4, 1.65, 0 );
				add( new THREE.ConeGeometry( 0.4, 2.5, 5 ), whiteMaterial, 6.5, 1.25, - 1.5 );

				// a warm and a cool point light

				for ( const [ color, x ] of [[ 0xffaa44, - 4 ], [ 0x88bbff, 4 ]] ) {

					const light = new THREE.PointLight( color, 30 );
					light.position.set( x, 4.5, 0 );
					light.castShadow = true;
					light.shadow.mapSize.setScalar( 256 );
					light.shadow.radius = 6;
					light.shadow.bias = - 0.002;
					light.shadow.normalBias = 0.05;
					root.add( light );

				}

				return { root, sky: false, detailSize: 0.25, camera: new THREE.Vector3( - 7.5, 2.5, 0 ), target: new THREE.Vector3( 0, 2.5, 0 ) };

			}

			async function loadHallway() {

				const gltf = await new GLTFLoader().loadAsync( 'models/gltf/space_ship_hallway.glb' );

				// lit by its emissive panels alone, seen from one end to the other

				gltf.scene.position.sub( new THREE.Box3().setFromObject( gltf.scene ).getCenter( new THREE.Vector3() ) );
				gltf.scene.traverse( ( object ) => object.isMesh && ( object.material.emissiveIntensity = 5 ) );

				return { root: gltf.scene, sky: false, detailSize: 0.5, camera: new THREE.Vector3( 0, - 1, 12.5 ), target: new THREE.Vector3( 0, - 1, - 14 ) };

			}

			async function loadSponza() {

				const gltf = await new GLTFLoader().loadAsync( SPONZA_URL );
				const lights = [];

				gltf.scene.traverse( ( object ) => object.isLight && lights.push( object ) );

				for ( const light of lights ) light.removeFromParent();

				return { root: gltf.scene, sky: true, sun: [ 206, 72 ], exposure: 2, detailSize: 0.5, camera: new THREE.Vector3( - 10.25, 5, 0.4 ), target: new THREE.Vector3( 0, 4, 0 ) };

			}

			function updateSun() {

				// the azimuth turns from +x towards +z, the altitude rises from the horizon

				const azimuth = THREE.MathUtils.degToRad( params.azimuth ), altitude = THREE.MathUtils.degToRad( params.altitude );

				sunDirection.set( Math.cos( altitude ) * Math.cos( azimuth ), Math.sin( altitude ), Math.cos( altitude ) * Math.sin( azimuth ) );

				// a low sun is warmer and fades out at the horizon

				sun.color.lerpColors( horizonColor, sunColor, THREE.MathUtils.smoothstep( sunDirection.y, 0, 0.5 ) );
				sun.intensity = THREE.MathUtils.smoothstep( sunDirection.y, 0, 0.15 ) * 40;
				sun.position.copy( sunDirection ).multiplyScalar( world.bounds.radius * 2 ).add( world.bounds.center );

				sky.sunPosition.value.copy( sunDirection );

				// capture the environment again when the sun moved by more than half a degree

				if ( world.sky && sunDirection.angleTo( environmentSunDirection ) > 0.0087 ) {

					environmentSunDirection.copy( sunDirection );
					// the debug views hide the sky

					const visible = sky.visible;

					sky.visible = true;
					cubeCamera.update( renderer, scene );
					sky.visible = visible;

					updateEnvironmentSH();

				}

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				updateSun();

				// the sky is brighter than the lights of the closed scenes

				renderer.toneMappingExposure = params.exposure * ( world.sky ? 0.3 : 1 );

				// without GI, or until it is baked, the environment lights the scene

				giAmount.value = params.view !== 'Beauty (no GI)' && world.lighting !== undefined ? 1 : 0;

				const ready = ! loading && world.ready === true;

				progress.hidden = ready;
				if ( ! loading ) progress.value = world.progress;

				world.root.visible = ready;
				sky.visible = ready && world.sky && params.view.startsWith( 'Beauty' );

				if ( world.lighting !== undefined ) {

					updateLights();

					// the bounces settle faster while the scene is hidden, and after a change

					for ( let i = ready ? ( hurry -- > 0 ? 8 : 1 ) : 16; i > 0; i -- ) world.lighting.update();

				}

				if ( ! ready && ! loading && world.lighting !== undefined && world.lighting.settled() ) world.ready = true;

				renderer.render( scene, camera );

			}

		</script>
