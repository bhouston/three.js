<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - blue noise</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - blue noise">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_tsl_blue_noise.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_tsl_blue_noise.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
		<style>
			.label {
				position: absolute;
				bottom: 20px;
				width: 50%;
				text-align: center;
				color: #fff;
				font: 600 14px 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
				text-shadow: 0 0 4px #000, 0 0 4px #000;
				pointer-events: none;
			}
		</style>
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Blue Noise</span>
			</div>

			<small>
				White noise vs. <a href="https://github.com/electronicarts/fastnoise" target="_blank" rel="noopener">FAST</a> and experimental noise by <a href="https://ben3d.ca" target="_blank" rel="noopener">Ben Houston</a>.<br/>A 1-bit dithered sphere or a uniform noise field, accumulated over time.<br/>Frames accumulated: <span id="frames">0</span><br/><span id="noiseStatus" role="status" aria-live="polite"></span>
			</small>
		</div>

		<div class="label" style="left: 0;">White Noise</div>
		<div class="label" id="blueLabel" style="right: 0;">FAST Spatio-Temporal Blue Noise</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { Fn, float, hash, ivec2, mix, screenCoordinate, screenSize, screenUV, texture, uint, uniform, vec2, vec3, vec4 } from 'three/tsl';

			import { loadFASTNoise } from 'three/addons/tsl/utils/FASTNoise.js';
			import { gaussianBlur } from 'three/addons/tsl/display/GaussianBlurNode.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';

			const modes = { 'Sphere': 0, 'Uniform': 1 };
			const noises = new Map( [
				[ 'FAST Spatio-Temporal', { type: 0, url: 'textures/noises/fast/gauss1-ema01-spatio-temporal.png', description: 'FAST spatial and temporal blue noise.' } ],
				[ 'FAST Spatial', { type: 0, url: 'textures/noises/fast/gauss1-ema01-spatial.png', description: 'FAST spatial blue noise.' } ],
				[ 'Golden Ratio', { type: 1, url: 'textures/noises/fast/gauss1-ema01-spatial.png', description: 'Spatial blue noise with a golden ratio sequence over time.' } ],
				[ 'White', { type: 2, description: 'Independent white noise on both sides.' } ]
			] );
			const params = { mode: 'Sphere', noise: 'FAST Spatio-Temporal', pixelSize: 2, temporalBlur: true, spatialBlur: true, animate: true };

			let renderer, computeQuad, displayQuad, targets, history, current, display, blurredDisplay;
			let samples = 0;

			const framesElement = document.getElementById( 'frames' );

			const mode = uniform( modes[ params.mode ] );
			const noiseType = uniform( 0 );
			const index = uniform( 0, 'uint' );
			const blend = uniform( 1 );

			init().catch( ( error ) => {

				document.getElementById( 'noiseStatus' ).textContent = 'Could not initialize the noise example. Reload to try again.';
				console.error( error );

			} );

			async function init() {

				renderer = new THREE.WebGPURenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				// both optimized for a sigma = 1 gaussian in space and an alpha = 0.1 EMA in time. spatial is blue noise
				// in space only, spatio-temporal is also blue noise in time per pixel so it converges faster when accumulated
				const statusElement = document.getElementById( 'noiseStatus' );
				const atlasCache = new Map();
				const loadAtlas = ( url ) => {

					if ( ! atlasCache.has( url ) ) {

						const promise = loadFASTNoise( url ).catch( ( error ) => {

							atlasCache.delete( url ); // Allow a failed download to be retried.
							throw error;

						} );
						atlasCache.set( url, promise );

					}

					return atlasCache.get( url );

				};

				statusElement.textContent = 'Loading FAST Spatio-Temporal…';
				const atlasNode = texture( await loadAtlas( noises.get( params.noise ).url ) );
				statusElement.textContent = noises.get( params.noise ).description;

				targets = [ 0, 1 ].map( () => new THREE.RenderTarget( 1, 1, { type: THREE.FloatType, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: false } ) );
				history = texture( targets[ 1 ].texture );
				current = texture( targets[ 0 ].texture );

				// noise

				const left = screenUV.x.lessThan( 0.5 );
				const white = hash( uint( screenCoordinate.x ).add( uint( screenCoordinate.y ).mul( 4096 ) ).add( index.mul( 16777259 ) ) );
				// One mutable texture binding serves the original FAST and experimental atlases.
				const atlasSample = ( frame ) => {

					const cycle = uint( frame ).div( 32 );
					const pixel = ivec2( screenCoordinate ).add( ivec2( 37, 71 ).mul( cycle.mod( 128 ).toInt() ) ).mod( 128 );
					const coordinate = ivec2( pixel.x, pixel.y.add( uint( frame ).mod( 32 ).mul( 128 ).toInt() ) );
					return atlasNode.load( coordinate ).r.mul( 255 ).add( 0.5 ).div( 256 );

				};

				const atlasNoise = atlasSample( index );

				// a single spatial blue noise slice rotated by the golden ratio each frame, so every pixel gets a low discrepancy sequence in time
				const golden = atlasSample( uint( 0 ) ).add( index.mul( uint( 2654435769 ) ).shiftRight( 8 ).toFloat().div( 16777216 ) ).fract();

				const noise = left.select( white, noiseType.equal( 2 ).select( white, noiseType.equal( 1 ).select( golden, atlasNoise ) ) );

				// the same shaded sphere over a gradient in each half

				const image = Fn( () => {

					const p = vec2( screenUV.x.mul( 2 ).fract().sub( 0.5 ).mul( screenSize.x.div( screenSize.y ).mul( 0.5 ) ), screenUV.y.sub( 0.5 ) );
					const r = float( 0.3 );
					const z = r.mul( r ).sub( p.dot( p ) );
					const normal = vec3( p.x, p.y.negate(), z.max( 0 ).sqrt() ).div( r );
					const shading = normal.dot( vec3( - 0.5, 0.6, 0.6 ).normalize() ).max( 0 ).mul( 0.9 ).add( 0.03 );
					return z.greaterThan( 0 ).select( shading, screenUV.x.mul( 2 ).fract().mul( 0.5 ) );

				} )();

				// 1 sample per frame, accumulated with an arithmetic running average

				const sample = mode.equal( 0 ).select( noise.lessThan( image ).select( 1, 0 ), noise );
				const accumulated = mix( history.sample( screenUV ).r, sample, blend );

				computeQuad = new THREE.QuadMesh( new THREE.NodeMaterial() );
				computeQuad.material.fragmentNode = vec4( accumulated, 0, 0, 1 );

				// the FAST atlases are optimized for a sigma = 1 gaussian, which GaussianBlurNode uses for sigma = 0 ( kernel radius 3 )

				const divider = screenCoordinate.x.sub( screenSize.x.mul( 0.5 ) ).abs().lessThan( 1 );
				const output = ( channel ) => divider.select( vec4( 1, 0.3, 0.1, 1 ), vec4( vec3( channel ), 1 ) );

				display = output( current.sample( screenUV ).r );
				blurredDisplay = output( gaussianBlur( current, null, 0 ).r );

				displayQuad = new THREE.QuadMesh( new THREE.NodeMaterial() );
				displayQuad.material.fragmentNode = params.spatialBlur ? blurredDisplay : display;

				const gui = renderer.inspector.createParameters( 'Settings' );
				gui.add( params, 'mode', Object.keys( modes ) ).onChange( ( value ) => {

					mode.value = modes[ value ];
					samples = 0;
					index.value = 0;

				} );
				let activeNoise = params.noise;
				let selectionVersion = 0;
				const noiseControl = gui.add( params, 'noise', Array.from( noises.keys() ) ).onChange( async ( value ) => {

					const version = ++ selectionVersion;
					const entry = noises.get( value );
					statusElement.textContent = `Loading ${ value }…`;

					try {

						const atlas = entry.url ? await loadAtlas( entry.url ) : null;
						if ( version !== selectionVersion ) return;
						if ( atlas ) atlasNode.value = atlas;
						noiseType.value = entry.type;
						activeNoise = value;
						document.getElementById( 'blueLabel' ).textContent = value;
						statusElement.textContent = entry.description;
						samples = 0;
						index.value = 0;

					} catch ( error ) {

						if ( version !== selectionVersion ) return;
						params.noise = activeNoise;
						noiseControl.select.value = activeNoise;
						statusElement.textContent = `Could not load ${ value }. Still showing ${ activeNoise }; select it again to retry.`;
						console.error( error );

					}

				} );

				// Fetch the catalog once; atlas downloads happen only when selected.
				fetch( 'textures/noises/experimental/manifest.json' ).then( ( response ) => {

					if ( ! response.ok ) throw new Error( `Noise catalog: HTTP ${ response.status }` );
					return response.json();

				} ).then( ( manifest ) => {

					for ( const entry of manifest.entries ) {

						noises.set( entry.label, { ...entry, type: 0, url: `textures/noises/experimental/${ entry.file }` } );
						noiseControl.options.push( entry.label );
						noiseControl.select.add( new Option( entry.label, entry.label ) );

					}

				} ).catch( ( error ) => {

					statusElement.textContent = 'Experimental noise catalog unavailable. Original comparisons remain available.';
					console.error( error );

				} );
				gui.add( params, 'pixelSize', 1, 8, 1 ).name( 'pixel size' ).onChange( onWindowResize );
				gui.add( params, 'temporalBlur' ).name( 'temporal blur' ).onChange( () => samples = 0 );
				gui.add( params, 'spatialBlur' ).name( 'spatial blur' ).onChange( ( value ) => {

					displayQuad.material.fragmentNode = value ? blurredDisplay : display;
					displayQuad.material.needsUpdate = true;

				} );
				gui.add( params, 'animate' ).onChange( () => samples = 0 );

				onWindowResize();
				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				renderer.setSize( window.innerWidth, window.innerHeight );

				const size = renderer.getDrawingBufferSize( new THREE.Vector2() ).divideScalar( params.pixelSize ).ceil();
				for ( const target of targets ) target.setSize( size.x, size.y );
				samples = 0;

			}

			function animate() {

				if ( computeQuad === undefined ) return;

				// temporal blur is a running average of every sample since the last reset

				samples ++;
				blend.value = params.temporalBlur ? 1 / samples : 1;
				framesElement.textContent = params.temporalBlur ? samples : 1;

				renderer.setRenderTarget( targets[ 0 ] );
				computeQuad.render( renderer );
				renderer.setRenderTarget( null );
				displayQuad.render( renderer );

				targets.reverse();
				history.value = targets[ 1 ].texture;
				current.value = targets[ 0 ].texture;
				if ( params.animate ) index.value ++;

			}

		</script>

	</body>
</html>
