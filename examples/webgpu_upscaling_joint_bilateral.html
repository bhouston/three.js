<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - upscaler</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - upscaler">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_upscaling_joint_bilateral.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_upscaling_joint_bilateral.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Upscaler</span>
			</div>

			<small>
				Joint bilateral upscaler uses depth and normal channels to preserve details by <a href="https://ben3d.ca" target="_blank" rel="noopener">Ben Houston</a>.<br />
				<span id="resolution"></span>
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { mrt, normalView, output, pass, renderOutput, rtt, sample, screenUV, textureSize, uniform, vec2, vec4 } from 'three/tsl';
			import { jointBilateralUpsample } from 'three/addons/tsl/display/JointBilateralUpsample.js';

			import { UltraHDRLoader } from 'three/addons/loaders/UltraHDRLoader.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

			import { Inspector } from 'three/addons/inspector/Inspector.js';

			let camera, scene, renderer, renderPipeline, controls, model;

			const timer = new THREE.Timer();

			const params = {
				upscaleFactor: 3,
				upsampler: 'joint-bilateral',
				output: 'Beauty',
				material: 'Default',
				rotate: true
			};

			// only used by the error output
			const errorScale = uniform( 4 );

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.25, 20 );
				camera.position.set( - 1.8, 0.6, 2.7 );

				scene = new THREE.Scene();

				renderer = new THREE.WebGPURenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.toneMapping = THREE.NeutralToneMapping;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.minDistance = 1;
				controls.maxDistance = 10;

				const [ environment, gltf ] = await Promise.all( [
					new UltraHDRLoader().loadAsync( 'textures/equirectangular/royal_esplanade_2k.hdr.jpg' ),
					new GLTFLoader().loadAsync( 'models/gltf/DamagedHelmet/glTF/DamagedHelmet.gltf' )
				] );

				environment.mapping = THREE.EquirectangularReflectionMapping;
				scene.background = environment;
				scene.environment = environment;

				model = gltf.scene;
				scene.add( model );

				// full resolution depth and normal guides

				const guidePass = pass( scene, camera );
				guidePass.setMRT( mrt( { output: normalView } ) );

				const depth = guidePass.getTextureNode( 'depth' );
				const normal = sample( ( uv ) => guidePass.getTextureNode( 'output' ).sample( uv ).rgb.normalize() );

				// reduced resolution beauty in linear half float, with depth and normal on the same texel grid

				const scenePass = pass( scene, camera );
				scenePass.setMRT( mrt( { output, normal: normalView } ) );
				scenePass.setResolutionScale( 1 / params.upscaleFactor );

				const lowColor = scenePass.getTextureNode( 'output' );
				const lowDepth = scenePass.getTextureNode( 'depth' );
				const lowNormal = sample( ( uv ) => scenePass.getTextureNode( 'normal' ).sample( uv ).rgb.normalize() );
				const lowSize = vec2( textureSize( lowDepth ) );

				// each upsampler writes a full resolution linear half float target, which is then tone mapped

				const upsamplers = {
					'none': rtt( lowColor.sample( screenUV.mul( lowSize ).floor().add( 0.5 ).div( lowSize ) ) ),
					'bilinear': rtt( lowColor.sample( screenUV ) ),
					'joint-bilateral': rtt( jointBilateralUpsample( lowColor, lowDepth, lowNormal, depth, normal, camera ).sample( screenUV ) )
				};

				// full resolution beauty, only rendered as the reference of the error output

				const reference = pass( scene, camera ).getTextureNode();

				// tone mapping and color space conversion are applied here, since the error is measured on the displayed colors

				const display = ( color ) => renderOutput( color, THREE.NeutralToneMapping, THREE.SRGBColorSpace );

				renderPipeline = new THREE.RenderPipeline( renderer );
				renderPipeline.outputColorTransform = false;

				// GUI

				const gui = renderer.inspector.createParameters( 'Upscaler' );
				gui.add( params, 'output', [ 'Beauty', 'Error' ] ).name( 'Output' ).onChange( updateUpsampler );
				const errorScaleControl = gui.add( errorScale, 'value', 1, 16 ).name( 'Error scale' );
				gui.add( params, 'upscaleFactor', 1, 8, 0.25 ).name( 'Upscale factor' ).onChange( ( value ) => {

					scenePass.setResolutionScale( 1 / value );
					updateResolution();

				} );
				gui.add( params, 'upsampler', Object.keys( upsamplers ) ).name( 'Upsampler' ).onChange( updateUpsampler );
				gui.add( params, 'material', [ 'Default', 'Metallic' ] ).name( 'Material' ).onChange( updateMaterial );
				gui.add( params, 'rotate' ).name( 'Rotate' );

				// a fully metallic material that keeps the original roughness makes the reflections
				// dominate, similar to upscaling screen space reflections

				const materials = new Map();

				function updateMaterial() {

					model.traverse( ( object ) => {

						if ( object.isMesh !== true ) return;

						if ( materials.has( object ) === false ) {

							const { roughness, roughnessMap } = object.material;

							materials.set( object, {
								Default: object.material,
								Metallic: new THREE.MeshStandardMaterial( { metalness: 1, roughness, roughnessMap } )
							} );

						}

						object.material = materials.get( object )[ params.material ];

					} );

				}

				function updateUpsampler() {

					const upscaled = upsamplers[ params.upsampler ];

					// the error is the absolute difference to the full resolution render
					renderPipeline.outputNode = params.output === 'Error'
						? vec4( display( upscaled ).rgb.sub( display( reference ).rgb ).abs().mul( errorScale ), 1 )
						: display( upscaled );

					renderPipeline.needsUpdate = true;

					params.output === 'Error' ? errorScaleControl.show() : errorScaleControl.hide();

				}

				updateUpsampler();
				updateResolution();

				window.addEventListener( 'resize', onWindowResize );

				renderer.setAnimationLoop( render );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );
				updateResolution();

			}

			function updateResolution() {

				// matches the pass, which floors its scaled size
				const { width, height } = renderer.getDrawingBufferSize( new THREE.Vector2() );
				const lowWidth = Math.floor( width / params.upscaleFactor );
				const lowHeight = Math.floor( height / params.upscaleFactor );
				const describe = ( w, h ) => `${ w } x ${ h } (${ ( w * h ).toLocaleString() } pixels)`;

				document.getElementById( 'resolution' ).textContent = `Beauty render at ${ describe( lowWidth, lowHeight ) } upscaled to ${ describe( width, height ) }.`;

			}

			function render() {

				timer.update();

				if ( params.rotate ) model.rotation.y += timer.getDelta() * 0.2;

				controls.update();

				renderPipeline.render();

			}

		</script>

	</body>
</html>
