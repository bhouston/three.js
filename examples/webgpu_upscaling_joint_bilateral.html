<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - upscaler</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - upscaler">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_upscaling_joint_bilateral.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_upscaling_joint_bilateral.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Upscaler</span>
			</div>

			<small>
				Joint bilateral upscaler uses depth and normal channels to preserve details by <a href="https://ben3d.ca" target="_blank" rel="noopener">Ben Houston</a>.<br />
				Compare spatial and temporal upscalers, including experimental quality and cost variants.<br />
				<span id="method"></span><br />
				<span id="resolution"></span>
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { mrt, normalView, output, pass, renderOutput, rtt, sample, screenUV, textureSize, uniform, vec2, vec4, velocity } from 'three/tsl';
			import { researchJointBilateralUpsample } from 'three/addons/tsl/display/ResearchJointBilateralUpsample.js';
			import { jointBilateralUpsample } from 'three/addons/tsl/display/JointBilateralUpsample.js';
			import { fsr1 } from 'three/addons/tsl/display/FSR1Node.js';
			import { researchSharpen } from 'three/addons/tsl/display/ResearchSharpen.js';
			import { sharpen } from 'three/addons/tsl/display/SharpenNode.js';
			import { researchTAAU } from 'three/addons/tsl/display/ResearchTAAUNode.js';
			import { taau } from 'three/addons/tsl/display/TAAUNode.js';
			import { upscalerMipBias } from 'three/addons/tsl/utils/UpscalerMipBias.js';
			import { researchTRAA } from 'three/addons/tsl/display/ResearchTRAANode.js';
			import { traa } from 'three/addons/tsl/display/TRAANode.js';

			import { UltraHDRLoader } from 'three/addons/loaders/UltraHDRLoader.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

			import { Inspector } from 'three/addons/inspector/Inspector.js';

			let camera, referenceCamera, scene, renderer, renderPipeline, controls, model;

			const timer = new THREE.Timer();

			const params = {
				upscaleFactor: 3,
				upsampler: 'joint-bilateral',
				output: 'Beauty',
				material: 'Default',
				rotate: true
			};

			// only used by the error output
			const errorScale = uniform( 4 );

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.25, 20 );
				camera.position.set( - 1.8, 0.6, 2.7 );

				// TAAU and TRAA jitter the main camera, the reference of the error output must not be jittered
				referenceCamera = camera.clone();

				scene = new THREE.Scene();

				renderer = new THREE.WebGPURenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.toneMapping = THREE.NeutralToneMapping;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.minDistance = 1;
				controls.maxDistance = 10;

				const [ environment, gltf ] = await Promise.all( [
					new UltraHDRLoader().loadAsync( 'textures/equirectangular/royal_esplanade_2k.hdr.jpg' ),
					new GLTFLoader().loadAsync( 'models/gltf/DamagedHelmet/glTF/DamagedHelmet.gltf' )
				] );

				environment.mapping = THREE.EquirectangularReflectionMapping;
				scene.background = environment;
				scene.environment = environment;

				model = gltf.scene;
				scene.add( model );

				// tone mapping and color space conversion are applied here, since the error is measured on the displayed colors

				const display = ( color ) => renderOutput( color, THREE.NeutralToneMapping, THREE.SRGBColorSpace );

				// There is one pass per set of channels, so that each upsampler only pays for what it uses.
				// The beauty is rendered at a reduced resolution in linear half float.

				const lowPasses = [];
				const mipBias = uniform( - Math.log2( params.upscaleFactor ) );

				const scenePass = ( channels, reduced = true ) => {

					const node = pass( scene, camera );
					if ( channels !== undefined ) node.setMRT( mrt( channels ) );

					if ( reduced ) {

						node.setResolutionScale( 1 / params.upscaleFactor );
						lowPasses.push( node );

					}

					return node;

				};

				const lowColor = scenePass().getTextureNode();
				const lowSize = vec2( textureSize( lowColor ) );

				// joint bilateral: the low resolution depth and normal are compared against full resolution guides

				const normalOf = ( node ) => sample( ( uv ) => node.sample( uv ).rgb.normalize() );

				const jointBilateral = ( guidePass, options = null ) => {

					const depthOnly = options?.guidance === 'depth-only';
					const lowPass = scenePass( depthOnly ? undefined : { output, normal: normalView } );
					if ( options?.mipBias ) lowPass.contextNode = upscalerMipBias( mipBias );
					const upsample = options === null ? jointBilateralUpsample : researchJointBilateralUpsample;

					const reconstructed = upsample(
						lowPass.getTextureNode( 'output' ), lowPass.getTextureNode( 'depth' ), depthOnly ? null : normalOf( lowPass.getTextureNode( 'normal' ) ),
						guidePass.getTextureNode( 'depth' ), normalOf( guidePass.getTextureNode( 'output' ) ), camera, options || {}
					).sample( screenUV );
					return options?.fused ? reconstructed : rtt( reconstructed );

				};

				// joint bilateral with TRAA: the jitter of TRAA moves the guides and the low resolution samples, which are then accumulated

				const jitteredGuidePass = scenePass( { output: normalView, velocity }, false );

				const jointBilateralTRAA = traa( jointBilateral( jitteredGuidePass ), jitteredGuidePass.getTextureNode( 'depth' ), jitteredGuidePass.getTextureNode( 'velocity' ), camera );

				// FSR 1 expects tone mapped colors in a perceptual color space

				const lowDisplay = rtt( display( lowColor ), null, null, { resolutionScale: 1 / params.upscaleFactor } );

				// TAAU with the sharpening of the webgpu_upscaling_taau example

				const velocityPass = scenePass( { output, velocity } );

				const taauNode = taau( velocityPass.getTextureNode( 'output' ), velocityPass.getTextureNode( 'depth' ), velocityPass.getTextureNode( 'velocity' ), camera );

				// Experimental temporal resolves share the same low resolution input layout.
				const temporalNodes = [];
				const temporal = ( options = {}, inputPass = velocityPass ) => {

					const node = researchTAAU( inputPass.getTextureNode( 'output' ), inputPass.getTextureNode( 'depth' ), inputPass.getTextureNode( 'velocity' ), camera, options );
					if ( options.responsive ) {

						node.currentFrameWeight = 0.1;
						node.maxVelocityLength = 16;

					}

					temporalNodes.push( node );
					const sharpened = researchSharpen( node.getTextureNode(), 0.2 );
					return display( vec4( ( options.fused ? sharpened : rtt( sharpened ) ).rgb, 1 ) );

				};

				const mipPass = scenePass( { output, velocity } );
				mipPass.contextNode = upscalerMipBias( mipBias );
				const mipFinePass = scenePass( { output, velocity } );
				mipFinePass.contextNode = upscalerMipBias( mipBias.sub( 1 ) );

				const wideJitter = researchTRAA( jointBilateral( jitteredGuidePass ), jitteredGuidePass.getTextureNode( 'depth' ), jitteredGuidePass.getTextureNode( 'velocity' ), camera, () => params.upscaleFactor );

				const wideJitterMip = researchTRAA( jointBilateral( jitteredGuidePass, { mipBias: true } ), jitteredGuidePass.getTextureNode( 'depth' ), jitteredGuidePass.getTextureNode( 'velocity' ), camera, () => params.upscaleFactor );

				// each upsampler outputs the displayed colors at full resolution

				const upsamplers = {
					'none': display( rtt( lowColor.sample( screenUV.mul( lowSize ).floor().add( 0.5 ).div( lowSize ) ) ) ),
					'bilinear': display( rtt( lowColor.sample( screenUV ) ) ),
					'joint-bilateral': display( jointBilateral( scenePass( { output: normalView }, false ) ) ),
					'joint-bilateral-fused': display( jointBilateral( scenePass( { output: normalView }, false ), { fused: true } ) ),
					'joint-bilateral-mip-fused': display( jointBilateral( scenePass( { output: normalView }, false ), { fused: true, mipBias: true } ) ),
					'joint-bilateral-mip': display( jointBilateral( scenePass( { output: normalView }, false ), { mipBias: true } ) ),
					'joint-bilateral-mip-sharp': display( jointBilateral( scenePass( { output: normalView }, false ), { mipBias: true, reconstruction: 'sharp' } ) ),
					'joint-bilateral-depth': display( jointBilateral( scenePass( { output: normalView }, false ), { guidance: 'depth-only' } ) ),
					'joint-bilateral-rational': display( jointBilateral( scenePass( { output: normalView }, false ), { depthKernel: 'rational' } ) ),
					'joint-bilateral-wide': display( jointBilateral( scenePass( { output: normalView }, false ), { reconstruction: 'gaussian' } ) ),
					'joint-bilateral-sharp': display( jointBilateral( scenePass( { output: normalView }, false ), { reconstruction: 'sharp' } ) ),
					'joint-bilateral-traa': display( jointBilateralTRAA.getTextureNode() ),
					'fsr1': fsr1( lowDisplay ).getTextureNode(),
					'taau': display( sharpen( taauNode.getTextureNode(), 0.2 ) ),
					'joint-bilateral-wide-jitter': display( wideJitter.getTextureNode() ),
					'joint-bilateral-wide-jitter-mip': display( wideJitterMip.getTextureNode() ),
					'taau-pingpong': temporal(),
					'taau-mip': temporal( {}, mipPass ),
					'taau-mip-fine': temporal( {}, mipFinePass ),
					'taau-mip-catmull': temporal( { historyFilter: 'catmull-rom' }, mipPass ),
					'taau-mip-distance': temporal( { reconstructionSharpness: 4, sampleDistanceWeight: true }, mipPass ),
					'taau-mip-fast': temporal( { cross: true, reconstructionSharpness: 4, sampleDistanceWeight: true }, mipPass ),
					'taau-mip-responsive': temporal( { fused: true, responsive: true, reconstructionSharpness: 4, sampleDistanceWeight: true, registerPreviousDepth: true }, mipPass ),
					'taau-mip-fast-responsive': temporal( { fused: true, responsive: true, cross: true, reconstructionSharpness: 4, sampleDistanceWeight: true, registerPreviousDepth: true }, mipPass ),
					'taau-mip-fused': temporal( { fused: true, reconstructionSharpness: 4, sampleDistanceWeight: true, registerPreviousDepth: true }, mipPass ),
					'taau-mip-fast-fused': temporal( { fused: true, cross: true, reconstructionSharpness: 4, sampleDistanceWeight: true, registerPreviousDepth: true }, mipPass ),
					'taau-mip-registered': temporal( { reconstructionSharpness: 4, sampleDistanceWeight: true, registerPreviousDepth: true }, mipPass ),
					'taau-mip-detail': temporal( { reconstructionSharpness: 4, sampleDistanceWeight: true }, mipFinePass ),
					'taau-cross': temporal( { cross: true } ),
					'taau-catmull': temporal( { historyFilter: 'catmull-rom' } ),
					'taau-narrow': temporal( { reconstructionSharpness: 4 } ),
					'taau-distance-weight': temporal( { sampleDistanceWeight: true } ),
					'taau-distance': temporal( { reconstructionSharpness: 4, sampleDistanceWeight: true } )
				};

				const descriptions = {
					'joint-bilateral-fused': 'Joint bilateral with reconstruction and display in one pass.',
					'joint-bilateral-mip': 'Joint bilateral with textures sampled for the display resolution.',
					'joint-bilateral-mip-fused': 'Display-resolution texture sampling and fused reconstruction.',
					'joint-bilateral-mip-sharp': 'Display-resolution texture sampling and a narrower spatial filter.',
					'joint-bilateral-depth': 'Depth-only low-resolution guidance: fewer normal reads, lower edge quality.',
					'joint-bilateral-rational': 'Polynomial approximation of the depth weights.',
					'joint-bilateral-wide': 'Nine-tap spatial reconstruction: wider support.',
					'joint-bilateral-sharp': 'Narrower four-tap spatial reconstruction.',
					'joint-bilateral-wide-jitter': 'Temporal bilateral reconstruction with jitter across a low-resolution pixel.',
					'joint-bilateral-wide-jitter-mip': 'Wide-jitter temporal bilateral with display-resolution texture sampling.',
					'taau-pingpong': 'Temporal resolve with alternating history buffers and a persistent feature lock.',
					'taau-cross': 'Five-tap temporal reconstruction and depth dilation.',
					'taau-catmull': 'Sharper five-tap history filtering.',
					'taau-narrow': 'Narrower current-frame reconstruction filter.',
					'taau-distance-weight': 'Accumulation weighted by the distance to a jittered sample.',
					'taau-distance': 'Narrower reconstruction with sample-distance weighting.',
					'taau-mip': 'Temporal reconstruction with display-resolution texture sampling.',
					'taau-mip-fine': 'Temporal reconstruction with an additional mip level of texture detail.',
					'taau-mip-catmull': 'Display-resolution texture sampling with sharper history filtering.',
					'taau-mip-distance': 'Display-resolution texture sampling with narrower, distance-weighted reconstruction.',
					'taau-mip-fast': 'Five-tap version of the mip-corrected, distance-weighted reconstruction.',
					'taau-mip-detail': 'Distance-weighted reconstruction with an additional mip level of texture detail.',
					'taau-mip-registered': 'Mip-corrected reconstruction with previous-depth jitter registration.',
					'taau-mip-responsive': 'Faster history response for moving details, with less temporal smoothing.',
					'taau-mip-fast-responsive': 'Five-tap version with faster history response.',
					'taau-mip-fused': 'Mip-corrected, distance-weighted reconstruction with sharpening fused into display.',
					'taau-mip-fast-fused': 'Five-tap version with sharpening fused into display.'
				};

				// full resolution beauty, only rendered as the reference of the error output

				const reference = display( pass( scene, referenceCamera ).getTextureNode() );

				renderPipeline = new THREE.RenderPipeline( renderer );
				renderPipeline.outputColorTransform = false;

				// GUI

				const gui = renderer.inspector.createParameters( 'Upscaler' );
				gui.add( params, 'output', [ 'Beauty', 'Error' ] ).name( 'Output' ).onChange( updateUpsampler );
				const errorScaleControl = gui.add( errorScale, 'value', 1, 16 ).name( 'Error scale' );
				gui.add( params, 'upscaleFactor', 1, 8, 0.25 ).name( 'Upscale factor' ).onChange( ( value ) => {

					lowPasses.forEach( ( node ) => node.setResolutionScale( 1 / value ) );
					lowDisplay.setResolutionScale( 1 / value );
					mipBias.value = - Math.log2( value );
					updateUpsampler();
					updateResolution();

				} );
				gui.add( params, 'upsampler', Object.keys( upsamplers ) ).name( 'Upsampler' ).onChange( updateUpsampler );
				gui.add( params, 'material', [ 'Default', 'Metallic' ] ).name( 'Material' ).onChange( () => {

					updateMaterial();
					updateUpsampler();

				} );
				gui.add( params, 'rotate' ).name( 'Rotate' );

				// a fully metallic material that keeps the original roughness makes the reflections
				// dominate, similar to upscaling screen space reflections

				const materials = new Map();

				function updateMaterial() {

					model.traverse( ( object ) => {

						if ( object.isMesh !== true ) return;

						if ( materials.has( object ) === false ) {

							const { roughness, roughnessMap } = object.material;

							materials.set( object, {
								Default: object.material,
								Metallic: new THREE.MeshStandardMaterial( { metalness: 1, roughness, roughnessMap } )
							} );

						}

						object.material = materials.get( object )[ params.material ];

					} );

				}

				function updateUpsampler() {

					temporalNodes.forEach( node => node.reset() );
					wideJitter.reset();
					wideJitterMip.reset();

					const upscaled = upsamplers[ params.upsampler ];
					document.getElementById( 'method' ).textContent = descriptions[ params.upsampler ] || '';

					// the error is the absolute difference to the full resolution render
					renderPipeline.outputNode = params.output === 'Error'
						? vec4( upscaled.rgb.sub( reference.rgb ).abs().mul( errorScale ), 1 )
						: upscaled;

					renderPipeline.needsUpdate = true;

					params.output === 'Error' ? errorScaleControl.show() : errorScaleControl.hide();

				}

				updateUpsampler();
				updateResolution();

				window.addEventListener( 'resize', () => {

					onWindowResize();
					updateUpsampler();

				} );

				renderer.setAnimationLoop( render );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );
				updateResolution();

			}

			function updateResolution() {

				// matches the pass, which floors its scaled size
				const { width, height } = renderer.getDrawingBufferSize( new THREE.Vector2() );
				const lowWidth = Math.floor( width / params.upscaleFactor );
				const lowHeight = Math.floor( height / params.upscaleFactor );
				const describe = ( w, h ) => `${ w } x ${ h } (${ ( w * h ).toLocaleString() } pixels)`;

				document.getElementById( 'resolution' ).textContent = `Beauty render at ${ describe( lowWidth, lowHeight ) } upscaled to ${ describe( width, height ) }.`;

			}

			function render() {

				timer.update();

				if ( params.rotate ) model.rotation.y += timer.getDelta() * 0.2;

				controls.update();

				referenceCamera.copy( camera );

				renderPipeline.render();

			}

		</script>

	</body>
</html>
