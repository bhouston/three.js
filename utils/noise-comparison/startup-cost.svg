<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" font-family="Segoe UI,Arial,sans-serif" fill="#252525"><rect width="100%" height="100%" fill="#fcfcfb"/><text x="70" y="36" font-size="23" >Observed local selection-to-ready delay</text><text x="70" y="62" font-size="14" >One hardware WebGPU run; includes download/decode/upload and shader compilation. Not an Internet or cold-start ranking.</text><text x="70" y="145" font-size="17" >3LHW</text><rect x="250" y="125" width="109.403960232052" height="30" fill="#3676ce"/><text x="920" y="146" font-size="16" >19.3 ms</text><text x="70" y="215" font-size="17" >Animated IGN</text><rect x="250" y="195" width="207.54523146392583" height="30" fill="#eb7934"/><text x="920" y="216" font-size="16" >36.6 ms</text><text x="70" y="285" font-size="17" >White</text><rect x="250" y="265" width="200.6047133996716" height="30" fill="#16845b"/><text x="920" y="286" font-size="16" >35.4 ms</text><text x="70" y="355" font-size="17" >FAST Separate</text><rect x="250" y="335" width="650" height="30" fill="#b78000"/><text x="920" y="356" font-size="16" >114.7 ms</text><text x="70" y="425" font-size="17" >FAST Product</text><rect x="250" y="405" width="251.0389180189258" height="30" fill="#a344b4"/><text x="920" y="426" font-size="16" >44.3 ms</text><text x="70" y="495" font-size="17" >Golden Ratio</text><rect x="250" y="475" width="198.5790499104304" height="30" fill="#d54178"/><text x="920" y="496" font-size="16" >35.0 ms</text><text x="70" y="600" font-size="15" >Intrinsic runtime mask generation: 0 ms for White, 3LHW and Animated IGN; no mask or texture is constructed.</text><text x="70" y="632" font-size="15" >FAST uses preoptimized assets; its readiness also requires an asynchronous image load.</text><text x="70" y="664" font-size="14" >Default 3LHW was already compiled; Golden Ratio reused Product. The timing samples have different cache states.</text><text x="70" y="707" font-size="14" >Physical nvidia pascal; common initial page load 1199 ms.</text></svg>