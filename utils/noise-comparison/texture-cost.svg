<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" font-family="Segoe UI,Arial,sans-serif" fill="#252525"><rect width="100%" height="100%" fill="#fcfcfb"/><text x="70" y="36" font-size="23" >Texture download and intrinsic setup cost</text><text x="70" y="62" font-size="14" >Exact repository PNG bytes; excludes HTTP overhead. Shader compilation and network latency are not zero-cost.</text><text x="70" y="151" font-size="17" >White</text><rect x="250" y="130" width="0" height="30" fill="#3676ce"/><text x="920" y="151" font-size="16" >0 bytes</text><text x="70" y="221" font-size="17" >FAST Product</text><rect x="250" y="200" width="633.162064516129" height="30" fill="#eb7934"/><text x="920" y="221" font-size="16" >3,019,696 bytes</text><text x="70" y="291" font-size="17" >FAST Separate</text><rect x="250" y="270" width="634.4463387096774" height="30" fill="#16845b"/><text x="920" y="291" font-size="16" >3,025,821 bytes</text><text x="70" y="361" font-size="17" >Golden Ratio</text><rect x="250" y="340" width="633.162064516129" height="30" fill="#b78000"/><text x="920" y="361" font-size="16" >3,019,696 bytes</text><text x="70" y="431" font-size="17" >3LHW</text><rect x="250" y="410" width="0" height="30" fill="#a344b4"/><text x="920" y="431" font-size="16" >0 bytes</text><text x="70" y="501" font-size="17" >Animated IGN</text><rect x="250" y="480" width="0" height="30" fill="#d54178"/><text x="920" y="501" font-size="16" >0 bytes</text><text x="70" y="600" font-size="16" >White / 3LHW / Animated IGN: 0 texture bytes, no mask construction or texture upload.</text><text x="70" y="632" font-size="16" >FAST / Golden Ratio: offline texture optimization; runtime fetch, PNG decode and GPU upload.</text><text x="70" y="664" font-size="16" >All methods incur normal shader compilation. Procedural arithmetic executes per sample.</text><text x="70" y="707" font-size="14" >Measured local first-ready timings are reported separately; they depend on cache, storage, browser and GPU.</text></svg>